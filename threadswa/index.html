<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WhatsApp Teraju Ciptabina</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-50XR3XER7B"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-50XR3XER7B');
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.2;
      color: #222222;
    }

    p {
      margin: 0 0 25px;
      font-size: 16px;
      line-height: 1.5;
      color: #666666;
    }

    .whatsapp-button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .whatsapp-button:active {
      opacity: 0.85;
    }

    .web-button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: #eeeeee;
      color: #333333;
      text-decoration: none;
      font-size: 15px;
      border-radius: 10px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      line-height: 1.5;
      color: #999999;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      src="../images/logo.png"
      alt="Teraju Ciptabina Resources"
      class="logo"
    >

    <h1>WhatsApp Teraju Ciptabina</h1>

    <p>
      Klik butang di bawah untuk terus berhubung dengan kami melalui WhatsApp.
    </p>

    <!--
      THREADS WHATSAPP LINK

      Normal user-click link.
      No automatic JavaScript redirect.
    -->

    <a
      id="whatsappButton"
      class="whatsapp-button"
      href="https://wa.me/60145002652?text=Hi%20Teraju%2C%20saya%20datang%20dari%20Threads."
    >
      💬 Open WhatsApp
    </a>

    <!-- Desktop / browser fallback -->

    <a
      class="web-button"
      href="https://web.whatsapp.com/send?phone=60145002652&text=Hi%20Teraju%2C%20saya%20datang%20dari%20Threads."
    >
      Open WhatsApp Web
    </a>

    <div class="footer">
      Teraju Ciptabina Resources<br>
      Reka • Rancang • Bina
    </div>

  </div>


  <!-- GA4 WhatsApp click tracking -->

  <script>

    document
      .getElementById('whatsappButton')
      .addEventListener('click', function () {

        gtag('event', 'whatsapp_click', {
          source: 'threads',
          platform: 'threads',
          destination: 'whatsapp'
        });

      });

  </script>

</body>
</html>
