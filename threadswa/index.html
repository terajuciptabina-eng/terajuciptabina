<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teraju Ciptabina - WhatsApp</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-50XR3XER7B"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-50XR3XER7B');
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 10px;
      color: #222;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: #666;
      margin: 0 0 25px;
    }

    .whatsapp-button {
      display: block;
      width: 100%;
      padding: 15px 20px;
      box-sizing: border-box;
      background: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .web-button {
      display: block;
      width: 100%;
      padding: 13px 20px;
      box-sizing: border-box;
      background: #eeeeee;
      color: #333333;
      text-decoration: none;
      font-size: 15px;
      border-radius: 10px;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      src="../images/logo.png"
      alt="Teraju Ciptabina"
      class="logo"
      onerror="this.style.display='none';"
    >

    <h1>WhatsApp Teraju Ciptabina</h1>

    <p>
      Klik butang di bawah untuk terus berhubung dengan kami melalui WhatsApp.
    </p>

    <!-- Main WhatsApp button -->
    <a
      id="whatsappButton"
      class="whatsapp-button"
      href="https://wa.me/60145002652?text=Hi%20Teraju%2C%20saya%20datang%20dari%20Threads."
    >
      💬 Open WhatsApp
    </a>

    <!-- Browser fallback -->
    <a
      id="webButton"
      class="web-button"
      href="https://web.whatsapp.com/send?phone=60145002652&text=Hi%20Teraju%2C%20saya%20datang%20dari%20Threads."
    >
      Open WhatsApp Web
    </a>

    <div class="small">
      Teraju Ciptabina Resources<br>
      Reka • Rancang • Bina
    </div>

  </div>

  <script>

    /*
      ==========================================
      THREADS WHATSAPP TRACKING
      ==========================================
    */

    gtag('event', 'whatsapp_click', {
      source: 'threads',
      platform: 'threads',
      destination: 'whatsapp'
    });


    /*
      ==========================================
      DEVICE DETECTION
      ==========================================
    */

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    const isIOS =
      /iPad|iPhone|iPod/.test(userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const isAndroid =
      /Android/i.test(userAgent);


    /*
      ==========================================
      WHATSAPP BUTTON
      ==========================================
    */

    const whatsappButton =
      document.getElementById('whatsappButton');

    const webButton =
      document.getElementById('webButton');


    /*
      Track the actual WhatsApp button tap.
    */

    whatsappButton.addEventListener('click', function () {

      gtag('event', 'whatsapp_open', {
        source: 'threads',
        platform: isIOS ? 'ios' : (isAndroid ? 'android' : 'other'),
        destination: 'whatsapp'
      });

    });


    /*
      Desktop:
      WhatsApp Web is available as fallback.
    */

    if (!isIOS && !isAndroid) {
      whatsappButton.textContent = '💬 Open WhatsApp';
    }

  </script>

</body>
</html>
