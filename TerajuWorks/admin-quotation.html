<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Quotation | TERAJUWORKS</title>
<link rel="stylesheet" href="shared/teraju-workspace-theme.css">
<style>*,*::before,*::after{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0}
.wrap{width:100%;max-width:100%;min-height:100vh;padding:18px 24px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.13em;color:#059669;text-transform:uppercase}.title{font-size:25px;font-weight:850;color:#172033;margin:4px 0}.sub{font-size:12px;color:#64748b}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;box-shadow:0 7px 22px rgba(15,23,42,.055);margin-bottom:12px}.toolbar{display:flex;gap:8px;align-items:center}.toolbar input,.toolbar select{flex:1;min-height:38px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;font:inherit}.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;min-width:980px;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #eef0f2;font-size:11px;vertical-align:top;overflow-wrap:normal;word-break:normal}th{font-size:9px;text-transform:uppercase;color:#64748b;background:#f8fafc;white-space:normal}th:nth-child(1),td:nth-child(1){width:145px}th:nth-child(2),td:nth-child(2){width:105px}th:nth-child(3),td:nth-child(3){width:95px}th:nth-child(4),td:nth-child(4){width:180px;overflow-wrap:anywhere}th:nth-child(5),td:nth-child(5){width:180px;overflow-wrap:anywhere}th:nth-child(6),td:nth-child(6){width:125px}th:nth-child(7),td:nth-child(7){width:165px;white-space:nowrap}th:nth-child(8),td:nth-child(8){width:78px;white-space:nowrap}td.num{text-align:right;white-space:nowrap}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#d1fae5;color:#047857;font-size:9px;font-weight:800}.open{display:inline-flex;padding:6px 9px;border-radius:8px;background:#172033;color:#fff;text-decoration:none;font-size:10px;font-weight:800;white-space:nowrap}.empty{text-align:center;padding:35px;color:#64748b}@media(max-width:700px){.wrap{padding:14px 12px}.toolbar{display:grid;grid-template-columns:1fr}.table-wrap{border-radius:12px}.table-wrap::after{content:'Swipe horizontally to view all columns';display:block;padding:8px 2px 2px;text-align:right;font-size:9px;color:#94a3b8;letter-spacing:.02em}}
</style></head>
<body class="tw-theme admin-workspace"><main class="wrap">
<header class="admin-header"><div><img class="admin-page-logo" src="../images/terajuworks.svg" alt="TERAJUWORKS"><div class="admin-header-title">Cost Estimate Records</div><div class="admin-header-sub">Admin read-only view of stored BuildPlanner and RenovationPlanner estimates.</div></div><nav class="admin-nav"><a class="back-nav" href="admin.html" onclick="if(history.length>1){event.preventDefault();history.back()}">← Back</a><a href="admin.html">Home</a><a href="admin-database.html">Admin Database</a><a href="admin-calculation-rules.html">Calculation Rules</a><a href="admin-rate-management.html">Rate Management</a><a href="admin-rate-comparison.html">Rate Comparison</a></nav></header>
<section class="panel"><div class="toolbar"><input id="q" placeholder="Search account, customer, project or estimate ID"><select id="planner"><option value="all">All planners</option><option value="build">BuildPlanner</option><option value="renovation">RenovationPlanner</option></select></div><div id="status" class="sub" style="margin-top:8px">Loading…</div></section>
<section class="panel table-wrap"><table><thead><tr><th>Account</th><th>Planner</th><th>Estimate</th><th>Customer / Project</th><th>Location</th><th>Total</th><th>Updated</th><th></th></tr></thead><tbody id="tbody"></tbody></table></section>
</main>
<script src="shared/admin-loading.js"></script><script>
const API='https://terajuciptabina.vercel.app/api/admin',key=()=>sessionStorage.getItem('teraju.admin.key')||localStorage.getItem('teraju.admin.key')||'';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v){const n=Number(v);return Number.isFinite(n)?'RM '+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}):'-'}
let rows=[];
function render(){const q=$('q').value.trim().toLowerCase(),pl=$('planner').value;const x=rows.filter(r=>(pl==='all'||r.plannerType===pl)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));$('status').textContent=x.length+' estimate record(s)';$('tbody').innerHTML=x.length?x.map(r=>`<tr><td><strong>${esc(r.accountName||r.accountId||'-')}</strong><br><span class="sub">${esc(r.accountId||'')}</span></td><td><span class="badge">${esc(r.plannerType)}</span></td><td><strong>${esc(r.estimateNumber||r.quotationNumber||r.quotationId||'Estimate')}</strong></td><td>${esc(r.client?.name||r.customer||r.project?.customer||r.project?.name||'-')}</td><td>${esc(r.location||r.project?.location||'-')}</td><td class="num">${money(r.total??r.grandTotal)}</td><td>${esc(r.updatedAt||r.createdAt||'-')}</td><td><a class="open" href="admin-quotation-app.html?id=${encodeURIComponent(r.accountId)}&quotationId=${encodeURIComponent(r.quotationId||'')}&plannerType=${encodeURIComponent(r.plannerType||'')}">Open</a></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty">No estimate records found.</div></td></tr>'}
async function load(){$('status').textContent='';const stopLoading=window.__twAdminLoading.start(document.querySelector('.table-wrap'),'Loading estimates…');try{const k=key();if(!k)throw new Error('Admin session not found. Please open Admin Control Panel first.');const res=await fetch(API+'?records=1',{headers:{'X-Admin-Key':k},cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.message||'Unable to load admin data.');rows=[];for(const a of data.accounts||[]){for(const type of ['build','renovation'])for(const r of a.plannerRecords?.[type]||[])rows.push({...r,accountId:a.id,accountName:a.name||a.profile?.name||a.id,plannerType:type});}rows.sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));render()}catch(e){$('status').textContent=e.message;$('tbody').innerHTML='<tr><td colspan="8"><div class="empty">'+esc(e.message)+'</div></td></tr>'}finally{stopLoading()}}
$('q').addEventListener('input',render);$('planner').addEventListener('change',render);load();
</script><script src="shared/teraju-button-feedback.js?v=20260929-button-feedback-v1"></script>
</body></html>
