<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archicad Class Slots | Admin</title><link rel="stylesheet" href="shared/teraju-workspace-theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:Inter,system-ui,sans-serif}.wrap{padding:24px;max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.title{font-size:28px;font-weight:850}.muted{color:#64748b;font-size:12px;line-height:1.5}.back{padding:10px 13px;border:1px solid #d1d5db;background:#fff;border-radius:10px;color:#172033;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.05);padding:16px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{display:grid;gap:6px}.field label{font-size:10px;font-weight:850;text-transform:uppercase;color:#64748b}.field input,.field select,.field textarea{width:100%;min-height:42px;border:1px solid #d1d5db;border-radius:9px;padding:9px;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#0b766c}.tablebox{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f2;font-size:12px;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:#64748b;background:#fafafa;white-space:nowrap}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#e7f5ed;color:#17663c;font-size:10px;font-weight:800}.off{background:#fee2e2;color:#991b1b}.rowActions{display:flex;gap:6px}.rowActions button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}.danger{color:#b91c1c!important;border-color:#fecaca!important}.empty{text-align:center;padding:40px;color:#64748b}@media(max-width:800px){.wrap{padding:16px 12px}.top{display:block}.back{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body class="tw-theme admin-workspace"><main class="wrap"><div class="top"><div><div class="title">Archicad Class Management</div><div class="muted">Urus slot kelas dan participant registration dalam satu workspace.</div></div><a class="back" href="admin.html">← Admin Control</a></div><nav style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px"><a class="back" href="admin-class-registration.html">📋 Registrations</a><a class="back" href="admin-class-slots.html" style="background:#172033;color:#fff">📅 Class Slots</a></nav><section class="card"><form id="slotForm"><div class="grid"><div class="field"><label>Tarikh *</label><input id="date" type="date" required></div><div class="field"><label>Masa mula *</label><input id="startTime" type="time" required></div><div class="field"><label>Masa tamat *</label><input id="endTime" type="time" required></div><div class="field"><label>Kapasiti (pax) *</label><input id="capacity" type="number" min="1" value="10" required></div><div class="field"><label>Mode kelas *</label><select id="mode" required><option>Online</option><option>Pejabat Teraju Ciptabina Resources</option></select></div><div class="field"><label>Status</label><select id="active"><option value="true">Aktif — buka pendaftaran</option><option value="false">Tidak aktif — tutup</option></select></div><div class="field full"><label>Nota</label><input id="notes" placeholder="Contoh: Kelas online Zoom / lokasi pejabat"></div></div><div class="actions"><button type="button" class="btn" id="cancel" style="display:none">Cancel Edit</button><button class="btn alt" type="submit" id="save">+ Add Class Slot</button></div><div id="msg" class="muted"></div></form></section><section class="card tablebox"><div id="table" class="empty">Loading…</div></section></main><script>
const API='https://terajuciptabina.vercel.app/api/class-slots',KEY='teraju.admin.key',USER='teraju.admin.username',$=id=>document.getElementById(id),headers=()=>({'X-Admin-Username':sessionStorage.getItem(USER)||'','X-Admin-Password':sessionStorage.getItem(KEY)||'','Content-Type':'application/json'});let all=[],editing=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){if(!all.length){$('table').innerHTML='<div class="empty">Belum ada slot kelas. Tambah slot di atas.</div>';return}$('table').innerHTML='<table><thead><tr><th>Date</th><th>Time</th><th>Mode</th><th>Capacity</th><th>Status</th><th>Notes</th><th>Action</th></tr></thead><tbody>'+all.map(x=>'<tr><td><b>'+esc(x.date)+'</b></td><td>'+esc(x.startTime)+' – '+esc(x.endTime)+'</td><td>'+esc(x.mode)+'</td><td>'+esc(x.capacity)+'</td><td><span class="tag '+(x.active?'':'off')+'">'+(x.active?'Active':'Closed')+'</span></td><td>'+esc(x.notes)+'</td><td><div class="rowActions"><button onclick="editSlot(\''+x.id+'\')">Edit</button><button class="danger" onclick="deleteSlot(\''+x.id+'\')">Delete</button></div></td></tr>').join('')+'</tbody></table>'}
async function load(){try{const r=await fetch(API,{headers:headers(),cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load slots.');all=d.items||[];render()}catch(e){$('table').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
window.editSlot=id=>{editing=all.find(x=>x.id===id);if(!editing)return;['date','startTime','endTime','capacity','mode','notes'].forEach(k=>$(k).value=editing[k]??'');$('active').value=String(editing.active!==false);$('save').textContent='Save Slot Changes';$('cancel').style.display='inline-block'};
window.deleteSlot=async id=>{if(!confirm('Delete this class slot?'))return;const r=await fetch(API,{method:'DELETE',headers:headers(),body:JSON.stringify({id})}),d=await r.json();if(!r.ok)return alert(d.message||'Unable to delete.');editing=null;reset();load()};
function reset(){$('slotForm').reset();$('capacity').value=10;$('active').value='true';$('save').textContent='+ Add Class Slot';$('cancel').style.display='none';editing=null}
$('cancel').onclick=reset;
$('slotForm').onsubmit=async e=>{e.preventDefault();const body={date:$('date').value,startTime:$('startTime').value,endTime:$('endTime').value,capacity:$('capacity').value,mode:$('mode').value,active:$('active').value==='true',notes:$('notes').value};if(editing)body.id=editing.id;try{const r=await fetch(API,{method:editing?'PUT':'POST',headers:headers(),body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to save slot.');$('msg').textContent='Slot saved.';reset();load()}catch(e){$('msg').textContent=e.message}};
load();
</script></body></html>
