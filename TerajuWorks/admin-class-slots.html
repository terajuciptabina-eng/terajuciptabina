<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archicad Class Slots | Admin</title><link rel="stylesheet" href="shared/teraju-workspace-theme.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:Inter,system-ui,sans-serif}.wrap{padding:24px;max-width:1500px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.title{font-size:28px;font-weight:850}.muted{color:#64748b;font-size:12px}.back{padding:10px 13px;border:1px solid #d1d5db;background:#fff;border-radius:10px;color:#172033;text-decoration:none;font-weight:800}.nav{display:flex;gap:8px;margin-bottom:15px}.card,.tablebox{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:10px;font-weight:850;text-transform:uppercase;color:#64748b}.field input,.field select{min-height:42px;border:1px solid #d1d5db;border-radius:10px;padding:10px;font:inherit}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;font-weight:800;cursor:pointer}.btn.danger{background:#b91c1c}.actions{display:flex;gap:6px}.tablebox{margin-top:15px;overflow:auto}table{width:100%;min-width:1000px;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f2;font-size:12px}th{font-size:10px;text-transform:uppercase;color:#64748b;background:#fafafa}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#e7f5ed;color:#17663c;font-size:10px;font-weight:800}.off{background:#fee2e2;color:#991b1b}.message{min-height:20px;color:#0b766c;font-size:12px;margin-top:8px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}@media(max-width:600px){.wrap{padding:16px 12px}.top{display:block}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body class="tw-theme admin-workspace"><main class="wrap"><div class="top"><div><div class="title">Archicad Class Management</div><div class="muted">Urus slot kelas dan participant registration dalam satu workspace.</div></div><a class="back" href="admin.html">← Admin Control</a></div><nav class="nav"><a class="back" href="admin-class-slots.html" style="background:#172033;color:#fff">📅 Class Slots</a><a class="back" href="admin-class-registration.html">📋 Registrations</a></nav>
<section class="card"><h2>Add / Edit Class Slot</h2><form id="slotForm"><div class="grid"><div class="field"><label>Tarikh *</label><input id="date" type="date" required></div><div class="field"><label>Masa mula *</label><input id="startTime" type="time" required></div><div class="field"><label>Masa tamat *</label><input id="endTime" type="time" required></div><div class="field"><label>Kapasiti (seat) *</label><input id="capacity" type="number" min="1" value="10" required></div><div class="field"><label>Mode kelas *</label><select id="mode" required><option value="Online">Online</option><option value="Fizikal">Fizikal</option><option value="Online dan Fizikal">Online dan Fizikal</option></select></div><div class="field"><label>Status</label><select id="active"><option value="true">Aktif — buka pendaftaran</option><option value="false">Closed — tutup pendaftaran</option></select></div><div class="field full"><label>Nota</label><input id="notes" placeholder="Contoh: Zoom link / lokasi pejabat"></div></div><div class="actions" style="margin-top:14px"><button id="save" class="btn" type="submit">+ Add Class Slot</button><button id="cancel" class="btn" type="button" hidden>Cancel</button></div><div id="msg" class="message"></div></form></section><section id="table" class="tablebox"><div class="muted">Loading…</div></section></main>
<script>
(function(){
'use strict';
const API='https://terajuciptabina.vercel.app/api/class-slots',KEY='teraju.admin.key',USER='teraju.admin.username',$=id=>document.getElementById(id),headers=()=>({'X-Admin-Username':sessionStorage.getItem(USER)||'','X-Admin-Password':sessionStorage.getItem(KEY)||'','Content-Type':'application/json'});
let records=[],editing=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function render(){if(!records.length){$('table').innerHTML='<div class="muted">Belum ada slot kelas.</div>';return}let html='<table><thead><tr><th>Date</th><th>Time</th><th>Mode</th><th>Capacity</th><th>Booked</th><th>Remaining</th><th>Status</th><th>Notes</th><th>Action</th></tr></thead><tbody>';records.forEach(item=>{html+='<tr><td><b>'+esc(item.date)+'</b></td><td>'+esc(item.startTime)+' – '+esc(item.endTime)+'</td><td>'+esc(item.mode)+'</td><td>'+esc(item.capacity)+'</td><td>'+esc(item.booked)+'</td><td>'+esc(item.remaining)+'</td><td><span class="tag '+(item.active?'':'off')+'">'+(item.active?'Active':'Closed')+'</span></td><td>'+esc(item.notes)+'</td><td><div class="actions"><button type="button" data-action="edit" data-id="'+esc(item.id)+'">Edit</button><button type="button" class="btn danger" data-action="delete" data-id="'+esc(item.id)+'">Delete</button></div></td></tr>'});$('table').innerHTML=html+'</tbody></table>'}
async function load(){try{const response=await fetch(API,{headers:headers(),cache:'no-store'}),data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to load class slots.');records=Array.isArray(data.items)?data.items:[];render()}catch(error){$('table').innerHTML='<div class="muted">'+esc(error.message)+'</div>'}}
function reset(){editing=null;$('slotForm').reset();$('capacity').value=10;$('active').value='true';$('save').textContent='+ Add Class Slot';$('cancel').hidden=true}
function editSlot(id){editing=records.find(item=>item.id===id);if(!editing)return;$('date').value=editing.date||'';$('startTime').value=editing.startTime||'';$('endTime').value=editing.endTime||'';$('capacity').value=editing.capacity||10;$('mode').value=editing.mode||'Online';$('active').value=String(editing.active!==false);$('notes').value=editing.notes||'';$('save').textContent='Save Slot Changes';$('cancel').hidden=false}
async function deleteSlot(id){if(!confirm('Delete this class slot?'))return;try{const response=await fetch(API,{method:'DELETE',headers:headers(),body:JSON.stringify({id})}),data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to delete slot.');await load()}catch(error){alert(error.message)}}
$('table').addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const id=button.dataset.id;if(button.dataset.action==='edit')editSlot(id);else if(button.dataset.action==='delete')deleteSlot(id)});
$('cancel').addEventListener('click',reset);
$('slotForm').addEventListener('submit',async event=>{event.preventDefault();const body={date:$('date').value,startTime:$('startTime').value,endTime:$('endTime').value,capacity:$('capacity').value,mode:$('mode').value,active:$('active').value==='true',notes:$('notes').value};if(editing)body.id=editing.id;try{const response=await fetch(API,{method:editing?'PUT':'POST',headers:headers(),body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to save class slot.');$('msg').textContent='Slot saved.';reset();await load()}catch(error){$('msg').textContent=error.message}});
load();
})();
</script></body></html>
