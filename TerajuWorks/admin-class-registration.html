<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archicad Class Registration | Admin</title><link rel="stylesheet" href="shared/teraju-workspace-theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:Inter,system-ui,sans-serif}.wrap{padding:24px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.title{font-size:28px;font-weight:850}.muted{color:#64748b;font-size:12px;line-height:1.5}.back{padding:10px 13px;border:1px solid #d1d5db;background:#fff;border-radius:10px;color:#172033;text-decoration:none;font-weight:800}.toolbar,.tablebox,.modal{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.toolbar{padding:14px;display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{min-height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 11px;font:inherit}.toolbar input{flex:1;min-width:220px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#172033;color:#fff;font-weight:800;cursor:pointer}.tablebox{overflow:auto}table{width:100%;min-width:1100px;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f2;font-size:12px;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:#64748b;background:#fafafa;white-space:nowrap}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f7;font-size:10px;font-weight:800}.pending{background:#fff4d6;color:#805b00}.confirmed{background:#e7f5ed;color:#17663c}.paid{background:#e7f5ed;color:#17663c}.cancelled{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px}.actions button{border:1px solid #d1d5db;background:#fff;color:#172033;border-radius:8px;padding:7px 9px;font-weight:800;cursor:pointer}.actions .danger{color:#b91c1c;border-color:#fecaca}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}.modal.open{display:flex}.modalCard{width:min(760px,100%);max-height:calc(100vh - 24px);overflow:auto;background:#fff;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:10px;font-weight:850;text-transform:uppercase;color:#64748b}.field input,.field select,.field textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px;font:inherit}.field textarea{min-height:90px}.modalHead{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}.close{border:0;background:#f3f4f6;border-radius:9px;padding:8px 11px;cursor:pointer;font-size:18px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;padding:40px;color:#64748b}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 13px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#64748b}@media(max-width:650px){.wrap{padding:16px 12px}.top{display:block}.back{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body class="tw-theme admin-workspace"><main class="wrap"><div class="top"><div><div class="title">Archicad Class Registration</div><div class="muted">Participant registration, booking status, payment status and participant records.</div></div><a class="back" href="admin.html">← Admin Control</a></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="pending">0</b><span>Pending</span></div><div class="stat"><b id="confirmed">0</b><span>Confirmed</span></div><div class="stat"><b id="paid">0</b><span>Paid</span></div></div><div class="toolbar"><input id="q" placeholder="Search name, phone, email, reference…"><select id="status"><option value="">All booking status</option><option>Pending</option><option>Confirmed</option><option>Paid</option><option>Cancelled</option></select><select id="type"><option value="">All categories</option><option>Kontraktor</option><option>Pelajar</option></select><select id="mode"><option value="">All class modes</option><option value="Online">Online</option><option value="Pejabat Teraju Ciptabina Resources">Pejabat Teraju Ciptabina Resources</option></select><button class="btn" id="refresh">Refresh</button></div><div id="table" class="tablebox"><div class="empty">Loading…</div></div></main><div id="modal" class="modal"><div class="modalCard"><div class="modalHead"><div><div class="muted">REGISTRATION</div><h2 id="modalTitle">Edit Participant</h2></div><button class="close" id="close">×</button></div><form id="edit"><div class="grid"><div class="field"><label>Reference</label><input id="id" disabled></div><div class="field"><label>Status</label><select id="statusEdit"><option>Pending</option><option>Confirmed</option><option>Paid</option><option>Cancelled</option></select></div><div class="field full"><label>Mode kelas</label><select id="modeEdit"><option>Online</option><option>Pejabat Teraju Ciptabina Resources</option></select></div><div class="field full"><label>Nama penuh</label><input id="name" required></div><div class="field"><label>Telefon</label><input id="phone" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Kategori</label><select id="type"><option>Kontraktor</option><option>Pelajar</option></select></div><div class="field"><label>Pax</label><input id="pax"></div><div class="field"><label>Syarikat / institusi</label><input id="company"></div><div class="field"><label>Jawatan / bidang</label><input id="occupation"></div><div class="field"><label>Tarikh kelas</label><input id="date" type="date"></div><div class="field"><label>Pengalaman Archicad</label><input id="experience"></div><div class="field"><label>Bawa laptop</label><input id="laptop"></div><div class="field"><label>Status bayaran</label><input id="payment"></div><div class="field full"><label>Sumber</label><input id="source"></div><div class="field full"><label>Nota</label><textarea id="notes"></textarea></div></div><div class="modalActions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn" type="submit">Save Changes</button></div><div id="error" class="muted"></div></form></div></div>
<script>
const API='https://terajuciptabina.vercel.app/api/class-registration',KEY='teraju.admin.key',USER='teraju.admin.username',headers=()=>({'X-Admin-Username':sessionStorage.getItem(USER)||'','X-Admin-Password':sessionStorage.getItem(KEY)||'','Content-Type':'application/json'}),$=id=>document.getElementById(id);let all=[],editing=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tag(s){const c=String(s||'').toLowerCase();return '<span class="tag '+c+'">'+esc(s)+'</span>'}
function render(){const q=$('q').value.toLowerCase().trim(),st=$('status').value,ty=$('type').value,mo=$('mode').value;const rows=all.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!st||x.status===st)&&(!ty||x.type===ty)&&(!mo||x.mode===mo));$('total').textContent=all.length;$('pending').textContent=all.filter(x=>x.status==='Pending').length;$('confirmed').textContent=all.filter(x=>x.status==='Confirmed').length;$('paid').textContent=all.filter(x=>x.status==='Paid').length;if(!rows.length){$('table').innerHTML='<div class="empty">No registration records found.</div>';return}$('table').innerHTML='<table><thead><tr><th>Reference</th><th>Participant</th><th>Category</th><th>Mode</th><th>Pax</th><th>Class Date</th><th>Phone</th><th>Payment</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.id)+'</b></td><td><b>'+esc(x.name)+'</b><br>'+esc(x.email)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.mode||'-')+'</td><td>'+esc(x.pax)+'</td><td>'+esc(x.date)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.payment)+'</td><td>'+tag(x.status)+'</td><td>'+esc((x.createdAt||'').slice(0,10))+'</td><td><div class="actions"><button onclick="openEdit(\''+esc(x.id)+'\')">Edit</button><button class="danger" onclick="del(\''+esc(x.id)+'\')">Delete</button></div></td></tr>').join('')+'</tbody></table>'}
async function load(){ $('table').innerHTML='<div class="empty">Loading…</div>';try{const r=await fetch(API,{headers:headers(),cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load registrations.');all=d.items||[];render()}catch(e){$('table').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
window.openEdit=id=>{editing=all.find(x=>x.id===id);if(!editing)return;['id','name','phone','email','type','pax','company','occupation','date','experience','laptop','payment','source','notes'].forEach(k=>{if($(k))$(k).value=editing[k]||''});$('statusEdit').value=editing.status||'Pending';$('modeEdit').value=editing.mode||'Online';$('modal').classList.add('open');$('error').textContent=''}
$('close').onclick=$('cancel').onclick=()=>{$('modal').classList.remove('open');editing=null}
$('edit').onsubmit=async e=>{e.preventDefault();if(!editing)return;const body={id:editing.id,status:$('statusEdit').value,mode:$('modeEdit').value,name:$('name').value,phone:$('phone').value,email:$('email').value,type:$('type').value,pax:$('pax').value,company:$('company').value,occupation:$('occupation').value,date:$('date').value,experience:$('experience').value,laptop:$('laptop').value,payment:$('payment').value,source:$('source').value,notes:$('notes').value};try{const r=await fetch(API,{method:'PUT',headers:headers(),body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to update.');$('modal').classList.remove('open');editing=null;await load()}catch(e){$('error').textContent=e.message}}
window.del=async id=>{const x=all.find(r=>r.id===id);if(!x||!confirm('Delete registration '+id+'? This will remove the record from the GitHub database.'))return;try{const r=await fetch(API,{method:'DELETE',headers:headers(),body:JSON.stringify({id})}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to delete.');await load()}catch(e){alert(e.message)}}
$('refresh').onclick=load;$('q').oninput=render;$('status').onchange=render;$('type').onchange=render;$('mode').onchange=render;load();
</script></body></html>
