<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Database | TERAJUWORKS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}
.title{font-size:26px;font-weight:850;margin:5px 0}
.muted{color:#6b7280;font-size:12px;line-height:1.5}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f8fafc;font-size:10px;font-weight:800;white-space:nowrap}.estimate-number{color:#111827!important;border-color:#7bc8bd;background:#edf9f6;font-size:11px;font-weight:850;letter-spacing:.01em;white-space:nowrap}
.wrap{padding:24px}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 8px 28px rgba(0,0,0,.04)}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) .7fr 1fr auto;gap:10px}
input,select,button{min-height:42px;border:1px solid #d1d5db;border-radius:11px;padding:0 12px;font:inherit}
button{cursor:pointer;font-weight:800;background:#111827;color:#fff;border-color:#111827}
.status{font-size:12px;margin-top:10px}
.table{overflow:auto;border:1px solid #eef0f2;border-radius:12px}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1100px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #eef0f2;font-size:13px;vertical-align:top}
th{font-size:10px;text-transform:uppercase;color:#6b7280;background:#fafafa}
th:nth-child(1),td:nth-child(1){width:120px}
th:nth-child(2),td:nth-child(2){width:300px}
th:nth-child(4),td:nth-child(4){width:165px}
th:nth-child(5),td:nth-child(5){width:125px}
.actions{white-space:nowrap}
.actions a{display:inline-block;font-size:12px;font-weight:800;color:#111827;text-decoration:none;white-space:nowrap;margin-right:8px}
.actions button{display:inline-flex;align-items:center;justify-content:center;width:30px;min-height:30px;padding:0;background:#fff;color:#b91c1c;border:0;font-size:18px;vertical-align:middle}
.hidden{display:none!important}
.profile-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(15,23,42,.52);backdrop-filter:blur(8px);overflow:auto}
.profile-modal.open{display:flex}
.profile-card{width:min(760px,calc(100vw - 24px));max-height:calc(100svh - 24px);overflow:auto;box-sizing:border-box;background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.25);padding:22px}
.profile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.profile-head h2{margin:4px 0 0;font-size:22px}
.profile-close{width:38px;min-height:38px;padding:0;background:#f8fafc;color:#374151;border-color:#e5e7eb}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.profile-field{display:grid;gap:6px}
.profile-field.full{grid-column:1/-1}
.profile-field label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6b7280}
.profile-field input,.profile-field textarea{width:100%;min-height:42px;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
.profile-field textarea{min-height:82px;resize:vertical}
.profile-logo{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc}
.profile-logo img{width:150px;height:58px;object-fit:contain;background:#fff;border:1px solid #e5e7eb;border-radius:8px}
.profile-meta{font-size:11px;color:#6b7280;line-height:1.6}
.profile-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.profile-actions button{min-width:110px}
.profile-save{background:#111827;color:#fff}
.profile-status{display:flex;align-items:center;gap:9px;min-height:22px;font-size:12px;margin-top:10px;color:#64748b}.profile-status.is-loading::before{content:'';width:14px;height:14px;flex:0 0 14px;border:2px solid #cfe2dd;border-top-color:#08766d;border-radius:50%;animation:profileSpin .7s linear infinite}@keyframes profileSpin{to{transform:rotate(360deg)}}
@media(max-width:760px){.profile-card{width:calc(100vw - 20px);max-height:calc(100svh - 20px);padding:18px;border-radius:16px}.profile-head{margin-bottom:14px}.profile-head h2{font-size:20px}}@media(max-width:650px){.profile-grid{grid-template-columns:1fr}.profile-field.full{grid-column:auto}.profile-actions{display:grid;grid-template-columns:1fr 1fr}.profile-actions button{width:100%}}
@media(max-width:760px){.tag{margin-top:10px}.wrap{padding:16px 12px}.controls{grid-template-columns:1fr}.title{font-size:22px}}
</style>
<link rel="stylesheet" href="shared/teraju-workspace-theme.css">
</head>
<body class="tw-theme admin-workspace">
<header class="admin-header">
  <div class="admin-header-main">
    <div>
      <img class="admin-page-logo" src="../images/terajuworks-brand.svg" alt="TERAJUWORKS">
      <div class="admin-page-motto">PLAN. COST. BUILD.</div>
      <div class="admin-header-title">Admin Database</div>
      <div class="admin-header-sub">Accounts, cost estimate records and profile records.</div>
    </div>
    <div class="admin-header-status">AUTHENTICATED ADMIN</div>
  </div>
  <nav class="admin-nav">
    <a class="back-nav" href="admin.html" onclick="if(history.length>1){event.preventDefault();history.back()}">← Back</a>
    <a href="admin.html">Home</a>
    <a href="admin-calculation-rules.html">Calculation Rules</a>
    <a href="admin-rate-management.html">Rate Management</a>
    <a href="admin-rate-comparison.html">Rate Comparison</a>
    <a href="admin-quotation.html">Admin Quotation</a>
  </nav>
</header>
<main class="wrap">
  <section class="panel">
    <div class="controls">
      <input id="q" placeholder="Search ID, name, email or phone">
      <select id="role"><option value="">All accounts</option><option value="homeowner">Homeowner</option><option value="contractor">Contractor</option></select>
      <div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="load" type="button">Load database</button><button id="exportExcel" type="button" style="background:#fff;color:#172033;border-color:#cbd5e1">Export Excel</button></div>
    </div>
    <div id="status" class="status"></div>
  </section>
  <section id="result" class="panel hidden"></section>
</main><div id="profileModal" class="profile-modal">
<div class="profile-card">
  <div class="profile-head"><div><div class="eyebrow">ACCOUNT PROFILE</div><h2 id="profileTitle">View Profile</h2><div id="profileMeta" class="profile-meta"></div></div><button id="profileClose" class="profile-close" type="button">×</button></div>
  <form id="profileForm">
    <div id="profileGrid" class="profile-grid"></div>
    <div id="profileStatus" class="profile-status"></div>
    <div class="profile-actions"><button id="profileCancel" type="button" style="background:#f8fafc;color:#374151;border-color:#e5e7eb">Close</button><button id="profileSave" class="profile-save" type="submit">Save Changes</button></div>
  </form>
</div></div>
<script src="shared/admin-loading.js"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script>
const API='https://terajuciptabina.vercel.app/api/admin';
const KEY='teraju.admin.key',USER='teraju.admin.username';
const q=document.getElementById('q'),role=document.getElementById('role'),status=document.getElementById('status'),result=document.getElementById('result');let currentAccounts=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function adminSession(){
  const username=sessionStorage.getItem(USER)||'';
  const password=sessionStorage.getItem(KEY)||'';
  if(!username||!password){location.href='admin.html';throw new Error('Admin session not found. Returning to Admin Control.');}
  return {username,password};
}
function adminHeaders(){const s=adminSession();return {'X-Admin-Username':s.username,'X-Admin-Password':s.password};}
function exportExcel(){
  if(!currentAccounts.length){status.textContent='No records available to export.';return;}
  if(typeof XLSX==='undefined'){status.textContent='Excel export library is unavailable. Please refresh and try again.';return;}
  const rows=currentAccounts.map(x=>{
    const nums=Array.isArray(x.estimateNumbers)?x.estimateNumbers.filter(Boolean):[];
    return {
      'Account ID':x.id||'',
      'Role':x.role||'',
      'Name':x.name||'',
      'Email':x.email||'',
      'Phone':x.phone||'',
      'Estimate Number':nums.join(', '),
      'Sign Up':x.createdAt||''
    };
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:22},{wch:14},{wch:28},{wch:34},{wch:20},{wch:32},{wch:24}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Records');
  XLSX.writeFile(wb,'terajuworks-admin-records.xlsx');
  status.textContent='Exported '+rows.length+' record(s) to Excel.';
}
async function load(){
  result.classList.remove('hidden');
  const stopLoading=window.__twAdminLoading.start(result,'Loading database…');
  status.textContent='';
  try{
    const p=new URLSearchParams({role:role.value,q:q.value,records:'1'});
    const r=await fetch(API+'?'+p,{headers:adminHeaders(),cache:'no-store'});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.message||'Unable to load database.');
    const a=(d.accounts||[]).sort((x,y)=>Date.parse(y.createdAt||'')-Date.parse(x.createdAt||''));currentAccounts=a;
    result.classList.remove('hidden');
    result.innerHTML='<div class="eyebrow">Records</div><h2>'+a.length+' account(s)</h2><div class="table"><table><thead><tr><th>Account</th><th>Profile</th><th>Estimate Number</th><th>Sign Up</th><th>Actions</th></tr></thead><tbody>'+a.map(x=>{const nums=Array.isArray(x.estimateNumbers)?x.estimateNumbers.filter(Boolean):[];return '<tr><td><b>'+esc(x.id||'-')+'</b><br><span class="muted">'+esc(x.role||'-')+'</span></td><td>'+esc(x.name||'-')+'<br>'+esc(x.email||'-')+'<br>'+esc(x.phone||'-')+'</td><td>'+(nums.length?nums.map(n=>'<span class="tag estimate-number">'+esc(n)+'</span>').join(' '):'—')+'</td><td>'+esc(x.createdAt||'-')+'</td><td class="actions"><a href="#" data-view-id="'+esc(x.id||'')+'" data-view-role="'+esc(x.role||'')+'">View / Edit</a> <button data-id="'+esc(x.id||'')+'" data-role="'+esc(x.role||'')+'" title="Delete account">×</button></td></tr>'}).join('')+'</tbody></table></div>';
    result.querySelectorAll('.actions button').forEach(b=>b.onclick=()=>del(b));
    result.querySelectorAll('[data-view-id]').forEach(a=>a.onclick=e=>{e.preventDefault();openProfile(a.dataset.viewId,a.dataset.viewRole)});
    status.textContent='Database loaded.';
  }catch(e){status.textContent=e.message||'Unable to load database.';}finally{stopLoading();}
}
async function del(b){
  const s=adminSession();
  if(!confirm('Permanently delete '+b.dataset.role+' '+b.dataset.id+'?'))return;
  const r=await fetch(API,{method:'DELETE',headers:{'X-Admin-Username':s.username,'X-Admin-Password':s.password,'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,role:b.dataset.role})});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){status.textContent=d.message||'Delete failed.';return;}
  status.textContent='Deleted '+b.dataset.id;
  load();
}

const profileModal=document.getElementById('profileModal'),profileForm=document.getElementById('profileForm'),profileGrid=document.getElementById('profileGrid'),profileTitle=document.getElementById('profileTitle'),profileMeta=document.getElementById('profileMeta'),profileStatus=document.getElementById('profileStatus');let activeProfile={id:'',role:''};
async function compressAdminLogo(file){
  const bitmap=await createImageBitmap(file);
  const maxW=1200,maxH=500,scale=Math.min(1,maxW/bitmap.width,maxH/bitmap.height);
  const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(bitmap.width*scale)); canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext('2d'); ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/webp',.82);
}
function profileField(label,key,value,full=false,type='text'){return '<div class="profile-field'+(full?' full':'')+'"><label>'+esc(label)+'</label><input name="'+esc(key)+'" type="'+type+'" value="'+esc(value||'')+'"></div>'}
function renderProfile(account){
  const p=account.profile||{}, isContractor=account.role==='contractor';
  profileTitle.textContent=(isContractor?'Contractor':'Homeowner')+' Profile';
  profileMeta.textContent=account.id+' · '+account.role+' · Updated '+(account.updatedAt||'-');
  let html=profileField('Account ID','__accountId',account.id)+profileField('Role','__role',account.role)+profileField('Name','name',p.name)+profileField('Email','email',p.email,'', 'email')+profileField('Phone','phone',p.phone);
  if(isContractor){
    html+=profileField('Registration No.','registrationNo',p.registrationNo)+profileField('Website','website',p.website,'', 'url')+profileField('Company Address','address',p.address,true);
    html+='<div class="profile-field full"><label>Company Logo</label><div class="profile-logo">'+(p.logoDataUrl?'<img src="'+esc(p.logoDataUrl)+'" alt="Company logo">':'<div style="width:150px;height:58px;display:flex;align-items:center;justify-content:center;border:1px dashed #cbd5e1;border-radius:8px;color:#94a3b8;font-size:11px">No logo uploaded</div>')+'<div style="flex:1"><input id="adminLogoInput" type="file" accept="image/png,image/jpeg,image/webp"><div class="profile-meta">PNG, JPG or WEBP. Uploading a new logo replaces the current logo.</div></div></div></div>';
  }else{
    html+=profileField('Property Address','propertyAddress',p.propertyAddress,true)+profileField('Property Type','propertyType',p.propertyType)+profileField('Project Notes','projectNotes',p.projectNotes,true);
  }
  profileGrid.innerHTML=html;
}
async function openProfile(id,accountRole){
  profileStatus.textContent='Loading profile…';profileStatus.classList.add('is-loading');profileStatus.style.color='#64748b';profileModal.classList.add('open');
  try{
    const r=await fetch(API+'?id='+encodeURIComponent(id)+'&role='+encodeURIComponent(accountRole),{headers:adminHeaders(),cache:'no-store'});let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.message||'Unable to load profile.');
    activeProfile={id,role:accountRole};renderProfile(d.account);profileStatus.textContent='Profile loaded.';profileStatus.classList.remove('is-loading');
  }catch(e){profileStatus.classList.remove('is-loading');profileStatus.textContent=e.message||'Unable to load profile.';profileStatus.style.color='#b91c1c'}
}
function closeProfile(){profileModal.classList.remove('open');profileForm.reset();profileStatus.classList.remove('is-loading');profileStatus.textContent='';activeProfile={id:'',role:''}}
profileForm.onsubmit=async e=>{
  e.preventDefault();if(!activeProfile.id)return;
  const data=Object.fromEntries(new FormData(profileForm).entries()); delete data.__accountId; delete data.__role;
  const logoInput=document.getElementById('adminLogoInput');
  if(logoInput?.files?.[0]){
    const file=logoInput.files[0];
    if(file.size>5*1024*1024) { profileStatus.textContent='Logo must be 5MB or smaller.'; profileStatus.style.color='#b91c1c'; return; }
    data.logoDataUrl=await compressAdminLogo(file);
  }
  profileStatus.textContent='Saving…';profileStatus.style.color='#6b7280';
  try{
    const r=await fetch(API,{method:'PUT',headers:{...adminHeaders(),'Content-Type':'application/json'},body:JSON.stringify({id:activeProfile.id,role:activeProfile.role,profile:data})});
    let d={};try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.message||'Unable to save profile.');
    profileStatus.textContent='Profile updated.';profileStatus.style.color='#166534';load();
  }catch(e){profileStatus.textContent=e.message||'Unable to save profile.';profileStatus.style.color='#b91c1c'}
};
document.getElementById('profileClose').onclick=closeProfile;document.getElementById('profileCancel').onclick=closeProfile;
profileModal.onclick=e=>{if(e.target===profileModal)closeProfile()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfile()});

document.getElementById('load').onclick=load;document.getElementById('exportExcel').onclick=exportExcel;
q.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
role.addEventListener('change',load);
load();
</script>
<script src="shared/teraju-button-feedback.js?v=20260929-button-feedback-v1"></script>
</body>
</html>
