<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TERAJUWORKS — Development Log</title><link rel="stylesheet" href="shared/teraju-workspace-theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:Inter,system-ui,sans-serif}.shell{min-height:100vh;padding:28px 18px 42px;background:linear-gradient(135deg,#e7f2ef 0%,#f3f7f6 55%,#e2eeeb 100%)}.wrap{width:min(1100px,100%);margin:auto}.brand{width:min(300px,72vw);margin:0 0 22px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.title{font-size:30px;font-weight:850;letter-spacing:-.025em}.muted{color:#64748b;font-size:13px;line-height:1.5}.back{border:1px solid #d1d5db;background:#fff;border-radius:11px;padding:11px 14px;font-weight:800;color:#172033;text-decoration:none}.toolbar,.form,.log{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.toolbar{padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid #d1d5db;border-radius:10px;padding:10px 11px;font:inherit;background:#fff}.toolbar input{flex:1;min-width:180px}.toolbar button,.primary{border:0;border-radius:10px;background:#172033;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.list{display:grid;gap:12px}.log{padding:18px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:#64748b}.badge{padding:5px 8px;border-radius:999px;background:#eef2f7;font-weight:800;color:#334155}.done{background:#e7f5ed;color:#17663c}.progress{background:#fff4d6;color:#805b00}.planned{background:#e9eefc;color:#405a9a}.log h2{font-size:18px;margin:10px 0 7px}.summary{font-size:14px;line-height:1.55}.details{margin-top:10px;color:#475569;font-size:12px;line-height:1.55;white-space:pre-wrap}.commit{margin-top:10px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#64748b}.empty{padding:35px;text-align:center;color:#64748b}.form{padding:18px;margin-bottom:16px}.form h2{margin:0 0 12px;font-size:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:12px}.danger{border:1px solid #fecaca;background:#fff;color:#b91c1c;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}.small{font-size:11px}@media(max-width:650px){.shell{padding:22px 12px 34px}.top{display:block}.back{display:inline-block;margin-top:12px}.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><div class="shell"><div class="wrap"><img class="brand" src="../images/terajuworks.svg" alt="TERAJUWORKS"><div class="top"><div><div class="title">Development Log</div><div class="muted">Rekod perkembangan semasa TerajuWorks — feature, fix, architecture dan milestone.</div></div><a class="back" href="admin.html">← Admin Control</a></div><div class="toolbar"><input id="search" placeholder="Search development update…"><select id="status"><option value="">All status</option><option>Completed</option><option>In Progress</option><option>Planned</option><option>Blocked</option></select><select id="module"><option value="">All modules</option></select><button id="refresh">Refresh</button><button id="toggleAdd">+ Add Update</button></div><div id="formBox" class="form" hidden><h2>Add / Update Development</h2><div class="fields"><input id="id" placeholder="ID (optional)"><input id="date" type="date"><input id="title" placeholder="Title *"><input id="moduleInput" placeholder="Module, e.g. BuildPlanner"><select id="statusInput"><option>In Progress</option><option>Completed</option><option>Planned</option><option>Blocked</option></select><input id="commit" class="full" placeholder="Commit SHA (optional)"><textarea id="summary" class="full" placeholder="What changed / current progress *"></textarea><textarea id="details" class="full" placeholder="Technical notes, next step, testing notes…"></textarea></div><div class="form-actions"><button id="save" class="primary">Save Update</button><button id="cancel">Cancel</button></div><div id="formError" class="small"></div></div><div id="list" class="list"><div class="empty">Loading development log…</div></div></div></div><script>const API='https://terajuciptabina.vercel.app/api/development-log',KEY='teraju.admin.key',USER='teraju.admin.username';const $=id=>document.getElementById(id),headers=()=>({'X-Admin-Username':sessionStorage.getItem(USER)||'','X-Admin-Password':sessionStorage.getItem(KEY)||'','Content-Type':'application/json'});let all=[];function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cls(s){const x=String(s||'').toLowerCase();return x==='completed'?'done':x==='in progress'?'progress':x==='planned'?'planned':''}function render(){const q=$('search').value.trim().toLowerCase(),st=$('status').value,mo=$('module').value;const items=all.filter(x=>(!st||x.status===st)&&(!mo||x.module===mo)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('list').innerHTML=items.length?items.map(x=>'<article class="log"><div class="meta"><span>'+esc(x.date)+'</span><span class="badge">'+esc(x.module)+'</span><span class="badge '+cls(x.status)+'">'+esc(x.status)+'</span><span>'+esc(x.id)+'</span></div><h2>'+esc(x.title)+'</h2><div class="summary">'+esc(x.summary)+'</div>'+(x.details?'<div class="details">'+esc(x.details)+'</div>':'')+(x.commit?'<div class="commit">Commit: '+esc(x.commit)+'</div>':'')+'<div class="form-actions"><button class="danger" onclick="delLog(\''+esc(x.id)+'\')">Delete</button></div></article>').join(''):'<div class="empty">No development updates found.</div>'}async function load(){$('list').innerHTML='<div class="empty">Loading development log…</div>';try{const r=await fetch(API,{headers:headers(),cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load log.');all=d.items||[];const mods=[...new Set(all.map(x=>x.module).filter(Boolean))].sort();$('module').innerHTML='<option value="">All modules</option>'+mods.map(x=>'<option>'+esc(x)+'</option>').join('');render()}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('toggleAdd').onclick=()=>{$('formBox').hidden=!$('formBox').hidden;$('date').value=new Date().toISOString().slice(0,10)};$('cancel').onclick=()=>{$('formBox').hidden=true};$('refresh').onclick=load;$('search').oninput=render;$('status').onchange=render;$('module').onchange=render;$('save').onclick=async()=>{const body={id:$('id').value.trim(),date:$('date').value,title:$('title').value.trim(),module:$('moduleInput').value.trim()||'General',status:$('statusInput').value,commit:$('commit').value.trim(),summary:$('summary').value.trim(),details:$('details').value.trim()};$('formError').textContent='';try{const r=await fetch(API,{method:'POST',headers:headers(),body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to save.');$('formBox').hidden=true;['id','title','moduleInput','commit','summary','details'].forEach(x=>$(x).value='');await load()}catch(e){$('formError').textContent=e.message}};async function delLog(id){if(!confirm('Delete this development update?'))return;try{const r=await fetch(API,{method:'DELETE',headers:headers(),body:JSON.stringify({id})}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to delete.');await load()}catch(e){alert(e.message)}}load();</script></body></html>
