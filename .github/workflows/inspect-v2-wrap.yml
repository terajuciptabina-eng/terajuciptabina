name: Inspect V2 editable renderer
on:
  push:
    paths:
      - '.v2-wrap-inspect-trigger'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect V2 editable renderer
        run: |
          python - <<'PY' > .v2-inspect-output.txt
          from pathlib import Path
          root=Path('quotation')
          for p in root.rglob('*'):
              if p.is_file() and p.suffix in {'.html','.js','.css'}:
                  try:s=p.read_text()
                  except:continue
                  for needle in ['data-budget-new-anchor','data-manual-anchor']:
                      i=s.find(needle)
                      if i>=0:
                          print(f'\n=== {needle} in {p} index {i} ===')
                          print(s[max(0,i-6000):i+12000])
          PY
      - name: Commit inspection output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .v2-inspect-output.txt
          git commit -m 'Temporary V2 renderer inspection output'
          git push
