name: One-time V2 live debug
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Arm one-time V2 live debug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit deployed page
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url='https://terajuciptabina-eng.github.io/terajuciptabina/quotation/buildplanner-v2.html?audience=contractor&contractorId=CTR-20260908-4TME';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[]; const logs=[];
          page.on('console',m=>{if(['error','warning'].includes(m.type())) logs.push(`${m.type()}: ${m.text()}`)});
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
          page.on('requestfailed',r=>errors.push(`requestfailed: ${r.url()} :: ${r.failure()?.errorText||'unknown'}`));
          await page.goto(url,{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(5000);
          console.log('URL',page.url());
          console.log('TITLE',await page.title());
          console.log('BUDGET_TEXT',await page.locator('body').innerText().then(t=>t.includes('Loading Global Calculation Rules')?'LOADING':t.match(/Construction Budget[\\s\\S]{0,1000}/)?.[0]||'NO_BUDGET_MATCH'));
          console.log('GET_ALL_ITEMS',await page.evaluate(()=>typeof window.getAllItems));
          console.log('MASTER_ACTIVE',await page.evaluate(()=>window.__TERAJU_MASTER_ENGINE_ACTIVE));
          console.log('R2',await page.evaluate(()=>window.TERAJU_R2));
          console.log('RENDER',await page.evaluate(()=>typeof window.renderConstructionBudget));
          console.log('UPDATE',await page.evaluate(()=>typeof window.updateEstimate));
          console.log('LOGS',JSON.stringify(logs,null,2));
          console.log('ERRORS',JSON.stringify(errors,null,2));
          await browser.close();
          EOF
          node /tmp/audit.mjs | tee /tmp/v2-live-debug.txt
      - name: Upload debug report
        uses: actions/upload-artifact@v4
        with:
          name: v2-live-debug
          path: /tmp/v2-live-debug.txt
      - name: Remove audit workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-v2-live-debug.yml
          git commit -m 'Remove one-time V2 live debug workflow'
          git push
