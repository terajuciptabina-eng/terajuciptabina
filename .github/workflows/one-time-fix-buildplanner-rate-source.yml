name: One-time Build Planner rate source fix
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-buildplanner-rate-source.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix master rate key normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/quotation-quantity-fix.js')
          s = p.read_text(encoding='utf-8')
          old = "function rate(p){let v=0,base=NOR(p).replace(/\\s+/g,'_'),k=Object.keys(RATES).find(x=>NOR(x).startsWith('rule_'+base));if(k)v=N(RATES[k]);try{const o=JSON.parse(localStorage.getItem(OV)||'{}'),h=Object.keys(o).find(x=>NOR(x)===NOR(p));if(h)v=N(o[h])}catch{}return R2(v)}"
          new = "function rate(p){let v=0,base=String(p||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),k=Object.keys(RATES).find(x=>NOR(x).startsWith('rule_'+base));if(k)v=N(RATES[k]);try{const o=JSON.parse(localStorage.getItem(OV)||'{}'),h=Object.keys(o).find(x=>NOR(x)===NOR(p));if(h)v=N(o[h])}catch{}return R2(v)}"
          if old not in s:
              raise SystemExit('Expected rate() source not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Master rate key normalization fixed')
          PY
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: fix master rate key normalization'
          git push
