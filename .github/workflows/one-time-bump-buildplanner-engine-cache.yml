name: One-time Build Planner engine cache refresh
on:
  push:
    branches: [main]
jobs:
  refresh:
    if: github.event.head_commit.message == 'Add one-time Build Planner engine cache refresh workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump engine cache key only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old='quotation-quantity-fix.js?v=20260923'
          new='quotation-quantity-fix.js?v=20260924'
          if old not in s: raise SystemExit('engine cache key target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m 'Refresh Build Planner master engine cache key'
          git push
          git rm .github/workflows/one-time-bump-buildplanner-engine-cache.yml
          git commit -m 'Remove one-time Build Planner cache workflow'
          git push
