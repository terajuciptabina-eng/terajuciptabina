name: One-time V2 edit controls inspect
on:
  push:
    paths:
      - '.v2-edit-controls-inspect-trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Build Planner V2 renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('quotation/buildplanner-v2.html').read_text()
          terms=['function budgetRow','Edit','Delete','New Item','manualItems','data-manual-anchor','contractor-editable','renderConstructionBudget','cr-budget-table','onclick']
          out=[]
          out.append('FILE_LEN='+str(len(s)))
          for term in terms:
              hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
              out.append(f'=== {term} COUNT={len(hits)} ===')
              for pos in hits[:30]:
                  out.append(s[max(0,pos-1000):min(len(s),pos+1800)])
                  out.append('---')
          Path('v2-edit-controls-inspect.txt').write_text('\n'.join(out))
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2-edit-controls-inspect.txt
          git commit -m 'Inspect V2 edit controls renderer [one-time]' || exit 0
          git push
