name: temp-calculation-rules-hierarchy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Apply Calculation Rules hierarchy')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hierarchy display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/calculation-rules.html')
          s=p.read_text()
          s=s.replace('.header-row{max-width:none;', '.header-row{max-width:none;')
          s=s.replace('.section-head h2{font-size:16px;margin:0}', '.section-head h2{font-size:16px;margin:0}.hierarchy{display:flex;flex-direction:column;gap:3px;min-width:0}.hierarchy .group-heading{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800}.hierarchy .main-heading{font-size:14px;font-weight:800}.hierarchy .sub-heading{font-size:13px;font-weight:700}.hierarchy .subsub-heading{font-size:13px;font-weight:600;color:var(--text)}')
          old='<tr><td class="path" data-label="Area">${esc(parts[0])}</td><td class="path" data-label="Section">${esc(parts.slice(1,-1).join(\' / \'))}</td><td class="path" data-label="Item">${esc(parts[parts.length-1])}</td><td class="desc" data-label="Description">${esc(r.description)}</td>'
          new='<tr><td class="path" data-label="Area"><div class="hierarchy"><div class="group-heading">GROUP MAIN HEADING</div><div class="main-heading">${esc(r.group)}</div></div></td><td class="path" data-label="Section"><div class="hierarchy"><div class="group-heading">MAIN HEADING</div><div class="main-heading">${esc(parts[0])}</div></div></td><td class="path" data-label="Item"><div class="hierarchy"><div class="sub-heading">SUB HEADING</div><div class="subsub-heading">${esc(parts.slice(1,-1).join(\' / \'))}</div><div class="sub-heading">SUB-SUB HEADING</div><div class="subsub-heading">${esc(parts[parts.length-1])}</div></div></td><td class="desc" data-label="Description">${esc(r.description)}</td>'
          if old not in s:
              raise SystemExit('target row renderer not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/calculation-rules.html
          git commit -m "Apply Calculation Rules hierarchy"
          git push
