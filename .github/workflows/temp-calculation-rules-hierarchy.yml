name: temp-calculation-rules-hierarchy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Clean Calculation Rules script')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean Calculation Rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/calculation-rules.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script>\n<script>\n','<script>\n')
          s=s.replace('→','').replace('←','')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/calculation-rules.html
          git commit -m "Clean Calculation Rules script"
          git push
