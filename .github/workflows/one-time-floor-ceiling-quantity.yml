name: One-time floor tile and ceiling quantity fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix floor tile and ceiling quantity basis
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="function qty(p,s,items,a,current){const r=rule(p);if(!r)return null;const f=String(r[5]||'');"
          new="function qty(p,s,items,a,current){const r=rule(p);if(!r)return null;const f=String(r[5]||'');if(/^ARCHITECTURES \/ MAIN BUILDING \/ (FLOOR TILES|CEILING) \/ INTERNAL$/i.test(p))return Math.max(1,s.A/100);if(/^ARCHITECTURES \/ MAIN BUILDING \/ (FLOOR TILES|CEILING) \/ EXTERNAL$/i.test(p))return Math.max(1,a.area/100);"
          if old not in s:
              raise SystemExit('Target qty function not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: use 100 sqft basis for floor tiles and ceiling'
          git rm .github/workflows/one-time-floor-ceiling-quantity.yml
          git commit -m 'Remove one-time floor ceiling quantity workflow'
          git push
