name: One-time Build Planner engine version update
on:
  push:
    paths:
      - '.github/workflows/one-time-buildplanner-engine-version.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update engine query version in source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/buildplanner-v2.html')
          s = p.read_text(encoding='utf-8')
          old = "tag.src='quotation-quantity-fix.js?v=20260921'"
          new = "tag.src='quotation-quantity-fix.js?v=20260922'"
          if old not in s:
              raise SystemExit('Expected current engine source version not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Build Planner engine query updated to 20260922')
          PY
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m 'TERAJU Build Planner: update engine source version'
          git push
