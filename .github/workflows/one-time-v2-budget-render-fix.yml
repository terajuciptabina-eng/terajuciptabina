name: one-time-v2-budget-render-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix V2 budget render readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="window.getAllItems=getMasterItems;if(!/buildplanner-v2\\.html$/i.test(location.pathname))window.renderConstructionBudget=renderBudget;window.getCurrentQuotationData=qData;window.generateQuotation=quotation;window.updateEstimate=function(){"
          new="window.getAllItems=getMasterItems;window.__TERAJU_MASTER_RULE_GATE_READY=true;if(typeof window.renderConstructionBudget==='function')window.renderConstructionBudget();if(!/buildplanner-v2\\.html$/i.test(location.pathname))window.renderConstructionBudget=renderBudget;window.getCurrentQuotationData=qData;window.generateQuotation=quotation;window.updateEstimate=function(){"
          if old not in s:
              raise SystemExit('Expected master bootstrap sequence was not found; refusing unrelated edit.')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/one-time-v2-budget-render-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/quotation-quantity-fix.js .github/workflows/one-time-v2-budget-render-fix.yml
          git commit -m "Fix Build Planner V2 budget render readiness"
          git push
