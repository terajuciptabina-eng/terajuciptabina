name: Apply Build Planner item actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Build Planner item actions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append item actions
        run: |
          cat >> quotation/quotation-quantity-fix.js <<'PATCH_EOF'

          /* TERAJU V2 ITEM ACTIONS 20260917 */
          (function(){
          'use strict';
          if(!/buildplanner-v2\.html$/i.test(location.pathname))return;
          if(window.__TERAJU_V2_ITEM_ACTIONS)return;
          window.__TERAJU_V2_ITEM_ACTIONS=true;
          const esc=v=>typeof window.escapeHtml==='function'?window.escapeHtml(v):String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
          const money2=v=>typeof window.money==='function'?window.money(v,2):Number(v||0).toFixed(2);
          const normQty=v=>Math.max(0,Math.ceil(Number(v)||0));
          const normRate=v=>Math.max(0,Math.round((Number(v)||0)*100)/100);
          function saveState(){if(typeof saveContractorState==='function')saveContractorState()}
          function refresh(){if(typeof updateEstimate==='function')updateEstimate()}
          function targetId(v){return String(v||'').replace(/[^a-zA-Z0-9_-]+/g,'-')}
          window.deleteBudgetItem=function(id){const item=(typeof getAllItems==='function'?getAllItems():[]).find(x=>x.id===id);if(!item)return;if(!confirm(`Delete this item?\n\n${item.description||'Item'}`))return;if(item.id.startsWith('manual-')&&typeof manualItems!=='undefined'){for(const [k,list] of manualItems.entries()){const next=(list||[]).filter(x=>x.id!==id);if(next.length!==list.length)manualItems.set(k,next)}}else if(typeof excludedItems!=='undefined')excludedItems.add(id);refresh();saveState()};
          window.addNewBudgetItem=function(targetKey,groupTitle,category,roomId){if(!document.body.classList.contains('contractor-mode'))return;const aid=`budget-new-${targetId(targetKey)}`,old=document.getElementById(aid);if(old){old.remove();return}const anchor=document.querySelector(`[data-budget-new-anchor="${CSS.escape(targetKey)}"]`);if(!anchor)return;const box=document.createElement('div');box.id=aid;box.className='no-print mt-3 rounded-xl border bg-gray-50 p-4';box.innerHTML=`<div class="flex items-center justify-between gap-3 mb-3"><strong class="text-sm">Add New Item</strong><button type="button" class="text-xs text-gray-500" onclick="document.getElementById('${aid}')?.remove()">Cancel</button></div><div class="grid md:grid-cols-[2fr_1fr_1fr_1fr_auto] gap-3 items-end"><label class="block"><span class="block text-xs font-medium text-gray-500 mb-1">Description</span><input id="${aid}-desc" type="text" class="w-full border rounded-lg px-3 py-2 bg-white" placeholder="Item description"></label><label class="block"><span class="block text-xs font-medium text-gray-500 mb-1">Unit</span><input id="${aid}-unit" type="text" value="ls" class="w-full border rounded-lg px-3 py-2 bg-white" placeholder="no / sqft / m / ls"></label><label class="block"><span class="block text-xs font-medium text-gray-500 mb-1">Quantity</span><input id="${aid}-qty" type="number" min="0" step="1" value="1" class="w-full border rounded-lg px-3 py-2 bg-white"></label><label class="block"><span class="block text-xs font-medium text-gray-500 mb-1">Rate (RM)</span><input id="${aid}-rate" type="number" min="0" step="0.01" value="0.00" class="w-full border rounded-lg px-3 py-2 bg-white"></label><button type="button" class="bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold" onclick="saveNewBudgetItem('${targetKey}','${esc(groupTitle)}','${category}','${esc(roomId||'project')}','${aid}')">Add Item</button></div>`;anchor.appendChild(box)};
          window.saveNewBudgetItem=function(targetKey,groupTitle,category,roomId,aid){if(typeof manualItems==='undefined')return;const desc=String(document.getElementById(`${aid}-desc`)?.value||'').trim(),unit=String(document.getElementById(`${aid}-unit`)?.value||'ls').trim()||'ls',qty=normQty(document.getElementById(`${aid}-qty`)?.value),rate=normRate(document.getElementById(`${aid}-rate`)?.value);if(!desc){alert('Please enter the item description.');return}const id=`manual-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,item={id,description:desc,unit,qty,rate,category,groupKey:targetKey.startsWith('structures:')?targetKey.slice(11):null,groupTitle,roomId:roomId||'project'};if(!manualItems.has(targetKey))manualItems.set(targetKey,[]);manualItems.get(targetKey).push(item);refresh();saveState()};
          function editExisting(item){const desc=document.getElementById(`budget-desc-${targetId(item.id)}`),qty=document.getElementById(`budget-qty-${targetId(item.id)}`),rate=document.getElementById(`budget-rate-${targetId(item.id)}`);if(desc&&typeof customDescriptions!=='undefined')customDescriptions.set(item.id,desc.value);if(qty&&typeof customQuantities!=='undefined')customQuantities.set(item.id,normQty(qty.value));if(rate&&typeof customRates!=='undefined')customRates.set(item.id,normRate(rate.value));refresh();saveState()}
          function row(item,no){const iid=targetId(item.id),contractor=document.body.classList.contains('contractor-mode'),desc=contractor?`<input id="budget-desc-${iid}" value="${esc(item.description)}" class="w-full min-w-0 border rounded-lg px-2 py-2 bg-white text-sm" onchange="TERAJU_V2_EDIT_ITEM('${esc(item.id)}')">`:`<span>${esc(item.description)}</span>`,qty=contractor?`<input id="budget-qty-${iid}" type="number" min="0" step="1" value="${normQty(item.qty)}" class="w-24 max-w-full border rounded-lg px-2 py-2 text-right bg-white text-sm" onchange="TERAJU_V2_EDIT_ITEM('${esc(item.id)}')">`:`<span>${normQty(item.qty)}</span>`,rate=contractor?`<input id="budget-rate-${iid}" type="number" min="0" step="0.01" value="${normRate(item.rate).toFixed(2)}" class="w-28 max-w-full border rounded-lg px-2 py-2 text-right bg-white text-sm" onchange="TERAJU_V2_EDIT_ITEM('${esc(item.id)}')">`:`<span>${money2(item.rate)}</span>`,del=`<button type="button" class="no-print border border-red-300 text-red-600 rounded-lg px-2 py-1 text-xs font-semibold" onclick="deleteBudgetItem('${esc(item.id)}')">Delete</button>`;return `<tr class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no}</td><td class="py-2 px-2 cr-description">${desc}</td><td class="py-2 px-2 cr-unit">${esc(item.unit)}</td><td class="py-2 px-2 text-right">${qty}</td><td class="py-2 px-2 text-right">${rate}</td><td class="py-2 px-2 text-right font-semibold">${money2(item.amount)}</td><td class="py-2 px-2 text-right">${del}</td></tr>`}
          window.TERAJU_V2_EDIT_ITEM=function(id){const item=(typeof getAllItems==='function'?getAllItems():[]).find(x=>x.id===id);if(item)editExisting(item)};
          window.renderConstructionBudget=function(){const c=document.getElementById('constructionBudgetContent');if(!c)return;const gate=window.__TERAJU_MASTER_RULE_GATE_READY;if(!gate){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Loading Global Calculation Rules…</div>';return}const all=(typeof getAllItems==='function'?getAllItems():[]),active=all.filter(i=>!(typeof excludedItems!=='undefined'&&excludedItems.has(i.id)));if(!active.length){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Add rooms / areas to calculate the preliminary construction budget.</div>';return}const contractor=document.body.classList.contains('contractor-mode'),groups=[['preliminaries','PRELIMINARIES'],['structures','STRUCTURAL WORKS'],['architecture','ARCHITECTURAL WORKS'],['electrical','ELECTRICAL WORKS'],['external-work','EXTERNAL WORKS']];let no=1,h='<div class="overflow-x-auto"><table class="w-full border-collapse text-sm cr-budget-table"><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Item</th><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th><th class="py-3 px-2"></th></tr></thead><tbody>';const addButton=(key,title,cat,roomId='project')=>contractor?`<div data-budget-new-anchor="${esc(key)}" class="no-print"><button type="button" class="mt-2 text-sm font-semibold text-gray-700 hover:text-black" onclick="addNewBudgetItem('${esc(key)}','${esc(title)}','${cat}','${esc(roomId)}')">＋ New Item</button></div>`:'';groups.forEach(([cat,title])=>{const items=active.filter(i=>i.category===cat);if(!items.length)return;h+=`<tr class="cr-group-row"><td colspan="7">${esc(title)}<span class="cr-group-count">${items.length} item${items.length===1?'':'s'}</span></td></tr>`;if(cat==='structures'||cat==='architecture'){const gs=[];items.forEach(i=>{const key=cat==='structures'?(i.groupTitle||'Other Structural Works'):(i.roomId||'project'),label=cat==='structures'?(i.groupTitle||'Other Structural Works'):(i.room||'Project');let g=gs.find(x=>x.key===key);if(!g){g={key,label,items:[]};gs.push(g)}g.items.push(i)});gs.forEach(g=>{const key=cat==='structures'?`structures:${g.label}`:`room:${g.key}`;h+=`<tr class="cr-hierarchy-row cr-level-2"><td colspan="7">${esc(g.label)}</td></tr>`;g.items.forEach(i=>{h+=row(i,no++)});h+=`<tr class="no-print"><td colspan="7" class="py-1 px-2">${addButton(key,g.label,cat,g.key)}</td></tr>`})}else{items.forEach(i=>{h+=row(i,no++)});h+=`<tr class="no-print"><td colspan="7" class="py-1 px-2">${addButton(cat,title,cat)}</td></tr>`}});const total=active.reduce((sum,i)=>sum+Number(i.amount||0),0);h+=`</tbody><tfoot><tr class="border-t-2"><td colspan="5" class="py-4 px-2 text-right font-bold">TOTAL PRELIMINARY ESTIMATE</td><td class="py-4 px-2 text-right font-bold text-lg">RM ${money2(total)}</td><td></td></tr></tfoot></table></div>`;c.innerHTML=h};
          })();
          PATCH_EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/quotation-quantity-fix.js
          git commit -m "Apply Build Planner item actions"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/teraju-item-actions.yml
          git commit -m "Remove temporary item actions workflow"
          git push
