name: One-time Build Planner hierarchy fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix two-segment master paths as level-3 hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="sub:p[0]||null,subsub:p.length>2?p[1]:null"
          new="sub:p[0]||null,subsub:p.length>1?p[1]:null"
          if old not in s:
              raise SystemExit('Target hierarchy expression not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: render two-segment master paths as level 3'
          git rm .github/workflows/one-time-buildplanner-hierarchy-fix.yml
          git commit -m 'Remove one-time hierarchy workflow'
          git push
