name: Add V2 group subtotal summary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add group subtotal summary
        shell: python
        run: |
          from pathlib import Path

          path = Path('quotation/quotation-quantity-fix.js')
          s = path.read_text(encoding='utf-8')

          old = "const total=active.reduce((sum,i)=>sum+Number(i.amount||0),0);h+=`</tbody><tfoot><tr class=\"border-t-2\"><td colspan=\"5\" class=\"py-4 px-2 text-right font-bold\">TOTAL PRELIMINARY ESTIMATE</td><td class=\"py-4 px-2 text-right font-bold text-lg\">RM ${money2(total)}</td></tr></tfoot></table></div>`;"
          new = "const groupSummary=groups.map(([cat,title])=>{const items=active.filter(i=>i.category===cat);if(!items.length)return '';const subtotal=window.TERAJU_R2(items.reduce((sum,i)=>sum+N(i.amount),0));return `<tr class=\"border-b cr-group-summary-row\"><td colspan=\"5\" class=\"py-2 px-2 text-right\">${esc(title)}</td><td class=\"py-2 px-2 text-right font-semibold\">RM ${money2(subtotal)}</td></tr>`}).join('');const total=active.reduce((sum,i)=>sum+Number(i.amount||0),0);h+=`</tbody><tfoot><tr class=\"border-t-2 cr-group-summary-header\"><td colspan=\"6\" class=\"py-3 px-2 font-bold\">SUMMARY — SUBTOTAL BY GROUP</td></tr>${groupSummary}<tr class=\"border-t-2\"><td colspan=\"5\" class=\"py-4 px-2 text-right font-bold\">TOTAL PRELIMINARY ESTIMATE</td><td class=\"py-4 px-2 text-right font-bold text-lg\">RM ${money2(total)}</td></tr></tfoot></table></div>`;"

          if old not in s:
              raise SystemExit('Target renderer footer block not found; refusing to patch.')
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')

      - name: Validate source
        run: node --check quotation/quotation-quantity-fix.js

      - name: Commit source change and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git rm .github/workflows/add-v2-group-summary.yml
          if git diff --cached --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git commit -m 'Add Build Planner V2 group subtotal summary'
          git push origin main
