name: One-time Build Planner V2 state rate source
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-buildplanner-state-rate.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align V2 engine with selected state rate source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/quotation-quantity-fix.js')
          s = p.read_text(encoding='utf-8')
          old = "async function load(){const[a,b]=await Promise.all([fetch('admin-calculation-rules.html?source=master&v=20260915',{cache:'no-store'}),fetch('../data/rates/default.json?source=master&v=20260915',{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error('Global Master source unavailable');RULES=new Map(parseRules(await a.text()).filter(x=>Array.isArray(x)&&x[1]).map(x=>[String(x[1]).trim(),x]));RATES=(await b.json()).rates||{}}"
          new = "async function load(){const state=String(window.TERAJU_SELECTED_STATE||localStorage.getItem('teraju.planner.state.v1')||'').trim().toLowerCase();const rateUrl=state?`../data/rates/states/${encodeURIComponent(state)}.json?source=master&v=20260921`:'../data/rates/default.json?source=master&v=20260921';const[a,b]=await Promise.all([fetch('admin-calculation-rules.html?source=master&v=20260915',{cache:'no-store'}),fetch(rateUrl,{cache:'no-store'})]);if(!a.ok||!b.ok)throw Error('Global Master source unavailable');RULES=new Map(parseRules(await a.text()).filter(x=>Array.isArray(x)&&x[1]).map(x=>[String(x[1]).trim(),x]));RATES=(await b.json()).rates||{}}"
          if old not in s:
              raise SystemExit('Expected Build Planner V2 load source not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit source fix
        run: |
          rm -f .github/workflows/one-time-fix-buildplanner-state-rate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js .github/workflows/one-time-fix-buildplanner-state-rate.yml
          git commit -m 'TERAJU Build Planner: use selected state rate set'
          git push
