name: One-time Build Planner hierarchy correction
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-buildplanner-hierarchy.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace renderer at source
        shell: python
        run: |
          from pathlib import Path
          p = Path('quotation/quotation-quantity-fix.js')
          s = p.read_text()
          start = s.find('function renderBudget(){')
          end = s.find('function qData(){', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Cannot locate renderBudget/qData source boundaries')
          new = '''function renderBudget(){const c=document.getElementById('constructionBudgetContent');if(!c)return;const active=getMasterItems().filter(i=>typeof excludedItems==='undefined'||!excludedItems.has(i.id));if(!active.length){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Add rooms / areas to calculate the preliminary construction budget.</div>';return}const cats=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK'];const headerName=g=>({'PRELIMINARIES':'PRELIMINARIES','STRUCTURES':'STRUCTURAL WORKS','ARCHITECTURES':'ARCHITECTURAL WORKS','ELECTRICAL':'ELECTRICAL WORKS','DOORS & WINDOWS':'DOORS & WINDOWS','EXTERNAL WORK':'EXTERNAL WORKS'}[String(g||'').toUpperCase()]||String(g||''));const parts=p=>String(p||'').split('/').map(x=>String(x).trim()).filter(Boolean);const hierarchy=i=>{const g=String(i.group||'').toUpperCase(),p=parts(i.masterPath);if(g==='ARCHITECTURES'&&i.roomId&&i.roomId!=='project'&&/^BATHROOM$/i.test(p[0]||''))return{header:'ARCHITECTURAL WORKS',sub:'BATHROOM',subsub:i.room||null};if(g==='EXTERNAL WORK')return{header:'EXTERNAL WORKS',sub:'EXTERNAL WORK',subsub:p[0]||null};return{header:headerName(g),sub:p[0]||null,subsub:p.length>2?p.slice(1).join(' / '):p.length===2?p[1]:null}};const tree=[];cats.forEach(g=>{const items=active.filter(i=>String(i.group||'').toUpperCase()===g);if(!items.length)return;const bySub=new Map;items.forEach(i=>{const z=hierarchy(i),sk=z.sub||'';if(!bySub.has(sk))bySub.set(sk,{header:z.header,sub:z.sub,levels:new Map,noLevel3:[]});const node=bySub.get(sk);if(z.subsub){if(!node.levels.has(z.subsub))node.levels.set(z.subsub,[]);node.levels.get(z.subsub).push(i)}else node.noLevel3.push(i)});tree.push(...bySub.values())});let no=1,h='<table class="w-full border-collapse text-sm cr-budget-table"><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Item</th><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>';let lastHeader='';tree.forEach(g=>{if(g.header!==lastHeader){h+=`<tr class="cr-group-row"><td colspan="6">${esc(g.header)}</td></tr>`;lastHeader=g.header}if(g.sub)h+=`<tr class="cr-hierarchy-row cr-level-2"><td colspan="6">${esc(g.sub)}</td></tr>`;g.levels.forEach((list,label)=>{h+=`<tr class="cr-hierarchy-row cr-level-3"><td colspan="6">${esc(label)}</td></tr>`;list.forEach(i=>{h+=`<tr class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no++}</td><td class="py-2 px-2 cr-description">${esc(i.description)}</td><td class="py-2 px-2 cr-unit">${esc(i.unit)}</td><td class="py-2 px-2 text-right">${Math.ceil(N(i.qty))}</td><td class="py-2 px-2 text-right">${money(i.rate,2)}</td><td class="py-2 px-2 text-right font-semibold">${money(i.amount,2)}</td></tr>`})});g.noLevel3.forEach(i=>{h+=`<tr class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no++}</td><td class="py-2 px-2 cr-description">${esc(i.description)}</td><td class="py-2 px-2 cr-unit">${esc(i.unit)}</td><td class="py-2 px-2 text-right">${Math.ceil(N(i.qty))}</td><td class="py-2 px-2 text-right">${money(i.rate,2)}</td><td class="py-2 px-2 text-right font-semibold">${money(i.amount,2)}</td></tr>`})});const total=active.reduce((sum,i)=>sum+N(i.amount),0);h+=`</tbody><tfoot><tr class="border-t-2"><td colspan="5" class="py-4 px-2 text-right font-bold">TOTAL PRELIMINARY ESTIMATE</td><td class="py-4 px-2 text-right font-bold text-lg">RM ${money(total,2)}</td></tr></tfoot></table>`;c.innerHTML=h}
'''
          p.write_text(s[:start] + new + s[end:])
      - name: Commit source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: correct three-level budget hierarchy'
          git push