name: Temp Add Calculation Rule Categories
on:
  push:
    paths:
      - '.github/workflows/temp-rebuild-cr-clean.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/calculation-rules.html')
          s=p.read_text()
          old='<option value="all">All groups</option><option value="STRUCTURES">STRUCTURES</option><option value="ARCHITECTURES">ARCHITECTURES</option>'
          new='<option value="all">All groups</option><option value="PRELIMINARIES">PRELIMINARIES</option><option value="STRUCTURES">STRUCTURES</option><option value="ARCHITECTURES">ARCHITECTURES</option><option value="ELECTRICAL">ELECTRICAL</option><option value="DOORS & WINDOWS">DOORS &amp; WINDOWS</option><option value="EXTERNAL WORK">EXTERNAL WORK</option><option value="OTHERS">OTHERS</option>'
          s=s.replace(old,new,1)
          marker='];\nfunction explain'
          pos=s.find(marker,s.find('const rules=['))
          if pos<0: raise SystemExit('rules marker missing')
          additions="""
{group:'ELECTRICAL',path:'MAIN BUILDING / ELECTRICAL / POWER POINT',description:'Supply and install power points to main building.',method:'FIXED PROJECT',ref:'Excel row 114',coeff:'10 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 114: quantity 10.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'ELECTRICAL',path:'MAIN BUILDING / ELECTRICAL / SWITCH',description:'Supply and install switches to main building.',method:'FIXED PROJECT',ref:'Excel row 115',coeff:'10 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 115: quantity 10.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'ELECTRICAL',path:'MAIN BUILDING / ELECTRICAL / LIGHTING',description:'Supply and install lighting points to main building.',method:'FIXED PROJECT',ref:'Excel row 116',coeff:'16 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 116: quantity 16.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'ELECTRICAL',path:'MAIN BUILDING / ELECTRICAL / FAN',description:'Supply and install fan points to main building.',method:'FIXED PROJECT',ref:'Excel row 117',coeff:'4 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 117: quantity 4.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'ELECTRICAL',path:'MAIN BUILDING / ELECTRICAL / AIRCOND POINT',description:'Provide air-conditioning points to main building.',method:'FIXED PROJECT',ref:'Excel row 118',coeff:'3 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 118: quantity 3.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'ELECTRICAL',path:'PORCH / ELECTRICAL / LIGHTING',description:'Supply and install porch lighting points.',method:'PROJECT DEPENDENCY',ref:'Electrical layout',coeff:'Not fixed in supplied Excel',formula:'Defined by electrical layout',output:'No.',basis:'No separate porch lighting quantity exists in the supplied Excel.',note:'No invented quantity is applied.'},
{group:'ELECTRICAL',path:'PORCH / ELECTRICAL / FAN',description:'Provide porch fan points.',method:'PROJECT DEPENDENCY',ref:'Electrical layout',coeff:'Not fixed in supplied Excel',formula:'Defined by electrical layout',output:'No.',basis:'No separate porch fan quantity exists in the supplied Excel.',note:'No invented quantity is applied.'},
{group:'ELECTRICAL',path:'PORCH / ELECTRICAL / POWER POINT',description:'Supply and install porch power points.',method:'PROJECT DEPENDENCY',ref:'Electrical layout',coeff:'Not fixed in supplied Excel',formula:'Defined by electrical layout',output:'No.',basis:'No separate porch power point quantity exists in the supplied Excel.',note:'No invented quantity is applied.'},
{group:'ELECTRICAL',path:'ELECTRICAL / GENERAL / EARTHING',description:'Provide complete electrical earthing system.',method:'FIXED PROJECT',ref:'Excel row 119',coeff:'1 set',formula:'Fixed project quantity',output:'Set',basis:'Excel row 119: quantity 1 set.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'ELECTRICAL',path:'ELECTRICAL / GENERAL / DB BOX',description:'Supply and install distribution board box.',method:'FIXED PROJECT',ref:'Excel row 112',coeff:'1 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 112: quantity 1.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'ELECTRICAL',path:'ELECTRICAL / GENERAL / WIRING',description:'Supply and install electrical wiring.',method:'FIXED PROJECT',ref:'Excel row 113',coeff:'400 m',formula:'Fixed project quantity',output:'m',basis:'Excel row 113: quantity 400 m.',note:'Reference quantity only; rate is not part of Calculation Rules.'},
{group:'DOORS & WINDOWS',path:'MAIN BUILDING / DOORS / TYPE 1',description:'Supply and install Door Type 1.',method:'FIXED PROJECT',ref:'Excel row 74',coeff:'2 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 74: quantity 2.',note:'Source-backed type count; dimensions and specification remain project-specific.'},
{group:'DOORS & WINDOWS',path:'MAIN BUILDING / DOORS / TYPE 2',description:'Supply and install Door Type 2.',method:'FIXED PROJECT',ref:'Excel row 75',coeff:'2 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 75: quantity 2.',note:'Source-backed type count; dimensions and specification remain project-specific.'},
{group:'DOORS & WINDOWS',path:'MAIN BUILDING / DOORS / TYPE 3',description:'Supply and install Door Type 3.',method:'FIXED PROJECT',ref:'Excel row 76',coeff:'2 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 76: quantity 2.',note:'Source-backed type count; dimensions and specification remain project-specific.'},
{group:'DOORS & WINDOWS',path:'MAIN BUILDING / WINDOWS / TYPE 1',description:'Supply and install Window Type 1.',method:'FIXED PROJECT',ref:'Excel row 79',coeff:'2 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 79: quantity 2.',note:'Source-backed type count; dimensions and specification remain project-specific.'},
{group:'DOORS & WINDOWS',path:'MAIN BUILDING / WINDOWS / TYPE 2',description:'Supply and install Window Type 2.',method:'FIXED PROJECT',ref:'Excel row 80',coeff:'2 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 80: quantity 2.',note:'Source-backed type count; dimensions and specification remain project-specific.'},
{group:'DOORS & WINDOWS',path:'MAIN BUILDING / WINDOWS / TYPE 3',description:'Supply and install Window Type 3.',method:'FIXED PROJECT',ref:'Excel row 81',coeff:'2 no.',formula:'Fixed project quantity',output:'No.',basis:'Excel row 81: quantity 2.',note:'Source-backed type count; dimensions and specification remain project-specific.'},
"""
          if "path:'MAIN BUILDING / DOORS / TYPE 1'" not in s:
              s=s[:pos]+additions+s[pos:]
          s=s.replace('const groups=[];',"const groups=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK','OTHERS'].map(name=>({name,mains:[]}));",1)
          s=s.replace('←','').replace('→','')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/calculation-rules.html
          git commit -m 'Add complete Calculation Rules categories'
          git rm .github/workflows/temp-rebuild-cr-clean.yml
          git commit -m 'Remove temporary Calculation Rules workflow'
          git push
