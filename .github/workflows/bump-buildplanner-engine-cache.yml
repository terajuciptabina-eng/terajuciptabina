name: One-time Build Planner engine cache bump
on:
  push:
    paths:
      - '.buildplanner-engine-cache-trigger'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump engine cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old='quotation-quantity-fix.js?v=20260924'
          new='quotation-quantity-fix.js?v=20260925'
          if old not in s:
              raise SystemExit('cache key 20260924 not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m 'Bump Build Planner engine cache key [wiring-quantity-fix]'
          git push