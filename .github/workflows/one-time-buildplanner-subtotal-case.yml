name: One-time Build Planner subtotal case fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix subtotal label casing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old='SUBTOTAL ${esc(label)}'
          new='SUBTOTAL ${esc(label).toUpperCase()}'
          if old not in s:
              raise SystemExit('Target subtotal label not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: normalize subtotal label case'
          git rm .github/workflows/one-time-buildplanner-subtotal-case.yml
          git commit -m 'Remove one-time subtotal case workflow'
          git push
