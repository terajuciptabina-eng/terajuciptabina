name: TERAJU Build Planner Cache Refresh
on:
  push:
    branches: [main]
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh engine cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old='quotation-quantity-fix.js?v=20260918'
          new='quotation-quantity-fix.js?v=20260921'
          if old not in s:
              raise SystemExit('Expected cache key not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m "TERAJU: refresh Build Planner engine cache key"
          git push