name: Add Build Planner Payment Script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-buildplanner:
    if: "!contains(github.event.head_commit.message, '[buildplanner-payment]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject versioned Build Planner payment script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('quotation/buildplanner.html')
          text = path.read_text(encoding='utf-8')

          # Remove any previous payment-script tag, including old cache-busting versions.
          text = re.sub(r'<script\s+src=["\']buildplanner-payment\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', text)

          tag = '<script src="buildplanner-payment.js?v=20260907"></script>'
          marker = '</body>'
          if marker not in text:
              raise SystemExit('Could not find </body> in buildplanner.html')

          text = text.replace(marker, tag + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Refresh Build Planner quotation flow [buildplanner-payment]"
          git push origin main