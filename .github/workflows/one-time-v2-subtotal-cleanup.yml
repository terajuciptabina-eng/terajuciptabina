name: One-time V2 subtotal cleanup
on:
  push:
    paths:
      - '.v2-subtotal-cleanup-trigger'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          s=s.replace('</td><td></td></tr>`:', '</td></tr>`:')
          s=s.replace('</td><td></td></tr>`}</tbody>', '</td></tr>`}</tbody>')
          p.write_text(s)
          Path('.github/workflows/one-time-v2-subtotal-cleanup.yml').unlink()
          Path('.v2-subtotal-cleanup-trigger').unlink()
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean V2 subtotal column structure'
          git push
