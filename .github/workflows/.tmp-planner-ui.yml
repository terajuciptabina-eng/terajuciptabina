name: Temporary Planner UI Refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[planner-ui-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply UI-only styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          styles = {
              'quotation/buildplanner.html': r'''
          /* TERAJU PLANNER UI REFRESH — UI ONLY */
          @media screen {
            :root{--tp-ink:#111827;--tp-muted:#64748b;--tp-line:rgba(15,23,42,.10);--tp-card:rgba(255,255,255,.94);--tp-shadow:0 18px 55px rgba(15,23,42,.10)}
            body{background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);color:var(--tp-ink)}
            header{background:rgba(255,255,255,.82)!important;border-bottom:1px solid rgba(15,23,42,.08)!important;box-shadow:0 8px 30px rgba(15,23,42,.06)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;top:0;z-index:50}
            main{max-width:1180px!important;margin:0 auto!important;padding-top:28px!important;padding-bottom:60px!important}
            main>section{border:1px solid var(--tp-line)!important;box-shadow:var(--tp-shadow)!important;background:var(--tp-card)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
            main>section:first-child{position:relative;overflow:hidden;min-height:250px;padding:42px!important;border:0!important;background:linear-gradient(100deg,rgba(15,23,42,.90),rgba(15,23,42,.58)),url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2200&q=88') center/cover!important;color:#fff!important;display:flex;align-items:flex-end}
            main>section:first-child:after{content:'';position:absolute;inset:auto -10% -45% auto;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.10);filter:blur(2px);pointer-events:none}
            main>section:first-child>*{position:relative;z-index:1}
            main>section:first-child h2{font-size:clamp(30px,5vw,52px)!important;line-height:1.02!important;letter-spacing:-.035em!important;text-shadow:0 8px 30px rgba(0,0,0,.25)}
            main>section:first-child p{max-width:700px;color:rgba(255,255,255,.82)!important;font-size:15px!important}
            main>section:not(:first-child){border-radius:24px!important}
            #projectInfo input,#projectInfo select,#projectInfo textarea,.room-card input,.room-card select,.optional-scope input,#estimateContent input,#estimateContent select,#estimateContent textarea{border-color:#dbe2ea!important;border-radius:12px!important;background:rgba(255,255,255,.96)!important;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
            #projectInfo input:focus,#projectInfo select:focus,#projectInfo textarea:focus,.room-card input:focus,.room-card select:focus,.optional-scope input:focus,#estimateContent input:focus,#estimateContent select:focus,#estimateContent textarea:focus{border-color:#475569!important;box-shadow:0 0 0 4px rgba(71,85,105,.10)!important;outline:none}
            .room-card{border:1px solid rgba(15,23,42,.09)!important;border-radius:20px!important;background:linear-gradient(145deg,#fff,rgba(248,250,252,.92))!important;box-shadow:0 10px 30px rgba(15,23,42,.07)!important;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease!important}
            .room-card:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(15,23,42,.10)!important;border-color:rgba(15,23,42,.16)!important}
            .optional-scope{border:1px solid rgba(15,23,42,.08)!important;border-radius:16px!important;background:#fff!important;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
            .optional-scope:hover{transform:translateY(-1px);border-color:rgba(15,23,42,.16)!important;box-shadow:0 10px 25px rgba(15,23,42,.07)}
            .contractor-quotation-choice,.quotation-type-card{border-radius:18px!important;border-color:#dbe2ea!important;box-shadow:0 6px 20px rgba(15,23,42,.04)!important}
            .contractor-quotation-choice:hover,.quotation-type-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.08)!important}
            .contractor-quotation-choice.is-selected,.quotation-type-card.is-selected{border-color:#111827!important;box-shadow:0 0 0 2px rgba(17,24,39,.08),0 12px 28px rgba(15,23,42,.08)!important}
            .quotation-generate-btn,.contractor-generate-btn{border-radius:14px!important;box-shadow:0 10px 24px rgba(15,23,42,.18);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
            .quotation-generate-btn:hover,.contractor-generate-btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(15,23,42,.22)}
            #estimateContent{border-radius:22px!important}
            #grandTotal{letter-spacing:-.03em!important}
            #quotationDocument{border-radius:24px!important;box-shadow:0 20px 60px rgba(15,23,42,.12)!important}
            #quotationPrintActions{gap:10px!important}
            @media(max-width:767px){
              main{padding:14px!important;padding-top:18px!important}
              main>section{border-radius:20px!important}
              main>section:first-child{min-height:270px;padding:28px 20px!important;border-radius:20px!important;background-position:center!important}
              main>section:first-child h2{font-size:32px!important}
              .room-card{border-radius:18px!important}
            }
            @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
          }
          ''',
              'quotation/renovationplanner.html': r'''
          /* TERAJU PLANNER UI REFRESH — UI ONLY */
          @media screen {
            :root{--tp-ink:#111827;--tp-muted:#64748b;--tp-line:rgba(15,23,42,.10);--tp-card:rgba(255,255,255,.94);--tp-shadow:0 18px 55px rgba(15,23,42,.10)}
            body{background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);color:var(--tp-ink)}
            header{background:rgba(255,255,255,.82)!important;border-bottom:1px solid rgba(15,23,42,.08)!important;box-shadow:0 8px 30px rgba(15,23,42,.06)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;top:0;z-index:50}
            main{max-width:1180px!important;margin:0 auto!important;padding-top:28px!important;padding-bottom:60px!important}
            main>section{border:1px solid var(--tp-line)!important;box-shadow:var(--tp-shadow)!important;background:var(--tp-card)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
            main>section:first-child{position:relative;overflow:hidden;min-height:250px;padding:42px!important;border:0!important;background:linear-gradient(100deg,rgba(15,23,42,.90),rgba(15,23,42,.55)),url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=88') center/cover!important;color:#fff!important;display:flex;align-items:flex-end}
            main>section:first-child:after{content:'';position:absolute;inset:auto -10% -45% auto;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.10);filter:blur(2px);pointer-events:none}
            main>section:first-child>*{position:relative;z-index:1}
            main>section:first-child h2{font-size:clamp(30px,5vw,52px)!important;line-height:1.02!important;letter-spacing:-.035em!important;text-shadow:0 8px 30px rgba(0,0,0,.25)}
            main>section:first-child p{max-width:700px;color:rgba(255,255,255,.82)!important;font-size:15px!important}
            main>section:not(:first-child){border-radius:24px!important}
            #projectInfo input,#projectInfo select,#projectInfo textarea,.room-card input,.room-card select,.optional-scope input,#estimateContent input,#estimateContent select,#estimateContent textarea{border-color:#dbe2ea!important;border-radius:12px!important;background:rgba(255,255,255,.96)!important;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
            #projectInfo input:focus,#projectInfo select:focus,#projectInfo textarea:focus,.room-card input:focus,.room-card select:focus,.optional-scope input:focus,#estimateContent input:focus,#estimateContent select:focus,#estimateContent textarea:focus{border-color:#475569!important;box-shadow:0 0 0 4px rgba(71,85,105,.10)!important;outline:none}
            .room-card{border:1px solid rgba(15,23,42,.09)!important;border-radius:20px!important;background:linear-gradient(145deg,#fff,rgba(248,250,252,.92))!important;box-shadow:0 10px 30px rgba(15,23,42,.07)!important;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease!important}
            .room-card:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(15,23,42,.10)!important;border-color:rgba(15,23,42,.16)!important}
            .optional-scope{border:1px solid rgba(15,23,42,.08)!important;border-radius:16px!important;background:#fff!important;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
            .optional-scope:hover{transform:translateY(-1px);border-color:rgba(15,23,42,.16)!important;box-shadow:0 10px 25px rgba(15,23,42,.07)}
            .contractor-quotation-choice,.quotation-type-card{border-radius:18px!important;border-color:#dbe2ea!important;box-shadow:0 6px 20px rgba(15,23,42,.04)!important}
            .contractor-quotation-choice:hover,.quotation-type-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.08)!important}
            .contractor-quotation-choice.is-selected,.quotation-type-card.is-selected{border-color:#111827!important;box-shadow:0 0 0 2px rgba(17,24,39,.08),0 12px 28px rgba(15,23,42,.08)!important}
            .quotation-generate-btn,.contractor-generate-btn{border-radius:14px!important;box-shadow:0 10px 24px rgba(15,23,42,.18);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
            .quotation-generate-btn:hover,.contractor-generate-btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(15,23,42,.22)}
            #estimateContent{border-radius:22px!important}
            #grandTotal{letter-spacing:-.03em!important}
            #quotationDocument{border-radius:24px!important;box-shadow:0 20px 60px rgba(15,23,42,.12)!important}
            #quotationPrintActions{gap:10px!important}
            @media(max-width:767px){
              main{padding:14px!important;padding-top:18px!important}
              main>section{border-radius:20px!important}
              main>section:first-child{min-height:270px;padding:28px 20px!important;border-radius:20px!important;background-position:center!important}
              main>section:first-child h2{font-size:32px!important}
              .room-card{border-radius:18px!important}
            }
            @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
          }
          '''
          for filename, css in styles.items():
              path=Path(filename)
              text=path.read_text(encoding='utf-8')
              marker='</style>'
              block='\n'+css+'\n          '
              if 'TERAJU PLANNER UI REFRESH' not in text:
                  idx=text.find(marker)
                  if idx < 0: raise SystemExit(f'No style marker in {filename}')
                  text=text[:idx]+block+text[idx:]
                  path.write_text(text,encoding='utf-8')
          PY
      - name: Commit full planner files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/buildplanner.html quotation/renovationplanner.html
          git commit -m "Refresh planner UI only [planner-ui-refresh]"
          git push origin main
