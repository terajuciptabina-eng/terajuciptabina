name: temporary-calculation-rules-update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, 'Clean Calculation Rules temporary workflow')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean and finalize Calculation Rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('quotation/calculation-rules.html')
          s=p.read_text()
          s=s.replace('max-width:1400px','max-width:none')
          s=s.replace('.note{min-width:360px;line-height:1.5}.note{min-width:360px;line-height:1.5}', '.note{min-width:360px;line-height:1.5}')
          # Keep only the first explain() definition if an earlier run inserted it twice.
          marker='function explain(r){'
          first=s.find(marker)
          if first>=0:
              second=s.find(marker, first+len(marker))
              if second>=0:
                  end=s.find("const esc=", second)
                  if end>=0:
                      s=s[:second]+s[end:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/calculation-rules.html
          git commit -m "Clean Calculation Rules temporary workflow" || true
          git rm .github/workflows/temp-calculation-rules-update.yml
          git commit -m "Remove temporary Calculation Rules workflow"
          git push
