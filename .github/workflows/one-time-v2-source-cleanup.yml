name: One-time V2 source cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Arm one-time V2 source cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy V2 master bootstrap with direct engine script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text(encoding='utf-8')
          marker="const RULE_URL='admin-calculation-rules.html?source=master&v=20260915';"
          pos=s.find(marker)
          print('rule marker position:',pos)
          if pos < 0:
              raise SystemExit('legacy RULE_URL marker not found')
          start=s.rfind('<script',0,pos)
          end=s.find('</script>',pos)
          print('script start:',start,'script end:',end)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('legacy bootstrap script boundaries not found')
          block=s[start:end+9]
          if 'quotation-quantity-fix.js' not in block or 'fetch(RULE_URL' not in block:
              raise SystemExit('target block is not the legacy V2 bootstrap')
          replacement='''<script id="tc-v2-master-bootstrap">\n(function(){\n  if(!/buildplanner-v2\\.html$/i.test(location.pathname))return;\n  const tag=document.createElement('script');\n  tag.src='quotation-quantity-fix.js?v=20260930';\n  tag.onload=()=>{\n    const waitForMaster=()=>{\n      if(typeof window.getAllItems==='function' && window.__TERAJU_MASTER_ENGINE_ACTIVE===true){\n        window.__TERAJU_MASTER_RULE_GATE_READY=true;\n        try{if(typeof window.updateEstimate==='function')window.updateEstimate()}catch(e){console.error('[TERAJU V2 MASTER BOOTSTRAP]',e)}\n        return;\n      }\n      setTimeout(waitForMaster,50);\n    };\n    waitForMaster();\n  };\n  tag.onerror=()=>console.error('[TERAJU V2] Unable to load master calculation engine');\n  document.body.appendChild(tag);\n})();\n</script>'''
          s=s[:start]+replacement+s[end+9:]
          p.write_text(s,encoding='utf-8')
          print('legacy bootstrap replaced')
          PY
      - name: Validate source
        run: |
          grep -q 'tc-v2-master-bootstrap' quotation/buildplanner-v2.html
          grep -q "quotation-quantity-fix.js?v=20260930" quotation/buildplanner-v2.html
          ! grep -q 'const RULE_URL=' quotation/buildplanner-v2.html
          ! grep -q 'const BINDINGS=' quotation/buildplanner-v2.html
      - name: Commit source fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m 'Remove legacy Build Planner V2 master bootstrap'
          git push
          git rm .github/workflows/one-time-v2-source-cleanup.yml
          git commit -m 'Remove one-time V2 source cleanup workflow'
          git push
