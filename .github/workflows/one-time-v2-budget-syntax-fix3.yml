name: one-time-v2-budget-syntax-fix3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair V2 helper scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          bad="const N=v=>Number.isFinite(Number(v))?Number(v):0;\n(function(){\n'use strict';"
          good="const N=v=>Number.isFinite(Number(v))?Number(v):0;"
          if bad not in s:
            raise SystemExit('Nested V2 IIFE pattern not found; refusing edit')
          s=s.replace(bad,good,1)
          p.write_text(s)
          print('Removed erroneous nested V2 IIFE')
          PY
          git diff --check
          node --check quotation/quotation-quantity-fix.js
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/quotation-quantity-fix.js
          git commit -m "Fix V2 budget helper scope"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-v2-budget-syntax-fix3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-v2-budget-syntax-fix3.yml
          git diff --cached --quiet || git commit -m "Remove one-time V2 syntax fix workflow"
          git push
