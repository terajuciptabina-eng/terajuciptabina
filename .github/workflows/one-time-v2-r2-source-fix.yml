name: One-time Build Planner V2 R2 source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix Build Planner V2 R2 scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix renderer helper scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          if 'window.TERAJU_R2=R2;' not in s:
              nor=s.find('NOR=s=>')
              if nor<0: raise SystemExit('NOR helper marker not found')
              end=s.find(';',nor)
              if end<0: raise SystemExit('NOR helper terminator not found')
              s=s[:end+1]+'window.TERAJU_R2=R2;'+s[end+1:]
          start=s.find('window.renderConstructionBudget')
          if start<0: raise SystemExit('V2 renderer marker not found')
          s=s[:start]+s[start:].replace('R2(','window.TERAJU_R2(')
          p.write_text(s,encoding='utf-8')
          print('Source fix applied')
          PY
      - name: Commit source fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'Fix Build Planner V2 renderer helper scope'
          git rm -f .github/workflows/one-time-v2-r2-source-fix.yml
          git commit -m 'Remove one-time V2 R2 source fix workflow'
          git push
