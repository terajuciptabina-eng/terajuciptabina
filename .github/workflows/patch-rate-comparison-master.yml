name: Patch Rate Comparison Master Metadata
on:
  push:
    branches: [main]
    paths:
      - 'quotation/admin-rate-comparison.html'
      - 'data/rates/default.json'
      - '.github/workflows/patch-rate-comparison-master.yml'
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[rate-comparison-master]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin comparison source
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('quotation/admin-rate-comparison.html')
          s=p.read_text(encoding='utf-8')
          marker="const API='https://terajuciptabina.vercel.app/api/admin';const GH='https://api.github.com/repos/terajuciptabina-eng/terajuciptabina/contents/data/users';const RATE_INDEX='../data/rates/states/index.json';"
          if marker not in s: raise SystemExit('admin source marker not found')
          s=s.replace(marker, marker+"const MASTER_RATE='../data/rates/default.json';")
          old=re.search(r"async function loadStateRates\(\)\{.*?\nasync function loadApi\(\)",s,re.S)
          if not old: raise SystemExit('loadStateRates block not found')
          new='''async function loadStateRates(){const [indexResponse,masterResponse]=await Promise.all([fetch(RATE_INDEX,{cache:'no-store'}),fetch(MASTER_RATE,{cache:'no-store'})]);if(!indexResponse.ok)throw new Error('Unable to load state rate index.');if(!masterResponse.ok)throw new Error('Unable to load master rate metadata.');const index=await indexResponse.json();const master=await masterResponse.json();const metadata=master.rateItems||{};const entries=Object.entries(index.states||{});const stateData=await Promise.all(entries.map(async([id,meta])=>{const r=await fetch('../data/rates/states/'+meta.source,{cache:'no-store'});if(!r.ok)throw new Error('Unable to load rate set for '+meta.name+'.');return {id,name:meta.name,data:await r.json()}}));const keys=new Set();for(const st of stateData)for(const [key,val] of Object.entries(st.data.rates||{})){if(val!==''&&val!=null)keys.add(key)}const search=$('q').value.trim().toLowerCase();const rows=[...keys].sort((a,b)=>(metadata[a]?.description||labelKey(a)).localeCompare(metadata[b]?.description||labelKey(b),'en',{sensitivity:'base'})).filter(key=>!search||(metadata[key]?.description||labelKey(key)).toLowerCase().includes(search));$('stateThead').innerHTML='<tr><th class="description">Description</th><th class="unit">Unit</th>'+stateData.map(st=>`<th class="statehead">${esc(st.name)}</th>`).join('')+'</tr>';$('stateTbody').innerHTML=rows.map(key=>{const cells=stateData.map(st=>{const v=st.data.rates?.[key];return `<td class="rate ${v==null?'missing':'same'}">${v==null?'—':money(v)}</td>`}).join('');const item=metadata[key]||{};return `<tr><td class="description">${esc(item.description||labelKey(key))}</td><td class="unit">${esc(item.unit||'—')}</td>${cells}</tr>`}).join('')||'<tr><td colspan="20" class="muted" style="padding:28px;text-align:center">No state rate records found.</td></tr>';$('stateResult').classList.remove('hidden')}
async function loadApi()'''
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/admin-rate-comparison.html
          git rm .github/workflows/patch-rate-comparison-master.yml
          git commit -m 'Use shared master metadata in rate comparison [rate-comparison-master]'
          git push
