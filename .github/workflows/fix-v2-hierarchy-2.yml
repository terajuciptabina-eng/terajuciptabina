name: Fix V2 hierarchy 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[v2-hierarchy-2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hierarchy levels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          pattern=r'let levels=path\.length>1\?path\.slice\([^;]+\):\[\];'
          m=re.search(pattern,s)
          if not m:
              raise SystemExit('Hierarchy levels expression not found')
          s=s[:m.start()]+'let levels=path.length>1?path.slice(0,-1):[];'+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: node --check quotation/quotation-quantity-fix.js
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-v2-hierarchy.yml .github/workflows/fix-v2-hierarchy-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js .github/workflows/fix-v2-hierarchy.yml .github/workflows/fix-v2-hierarchy-2.yml
          git commit -m 'Fix Build Planner V2 hierarchy levels [v2-hierarchy-2]'
          git push
