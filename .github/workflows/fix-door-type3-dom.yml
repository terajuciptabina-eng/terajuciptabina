name: One-time Door Type 3 DOM quantity fix
on:
  push:
    paths:
      - '.door-type3-dom-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Door Type 3 DOM fallback and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="if(/DOORS \/ Type 3/i.test(p)||/TYPE 3\\s*BATHROOM/i.test(p))return s.main.filter(r=>String(r.roomType||'').trim().toLowerCase()==='bathroom').length;"
          new="if(/DOORS \/ Type 3/i.test(p)||/TYPE 3\\s*BATHROOM/i.test(p)){const n=s.main.filter(r=>{const t=String(r.roomType||'').trim().toLowerCase(),l=String(r.label||'').trim().toLowerCase();return t==='bathroom'||t.includes('bathroom')||l==='bathroom'||l.includes('bathroom')}).length;if(n>0)return n;const dom=[...document.querySelectorAll('#roomsContainer .room-card')];return dom.filter(r=>{const v=String(r.querySelector('.room-type')?.value||'').trim().toLowerCase(),l=String(r.querySelector('.room-type')?.selectedOptions?.[0]?.textContent||'').trim().toLowerCase(),name=String(r.querySelector('.room-name')?.value||'').trim().toLowerCase();return v==='bathroom'||v.includes('bathroom')||l==='bathroom'||l.includes('bathroom')||name==='bathroom'||name.includes('bathroom')}).length;}"
          if old not in s: raise SystemExit('Type 3 branch target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          bp=Path('quotation/buildplanner-v2.html'); b=bp.read_text()
          for oldv in ['20260927','20260926','20260925','20260924']:
              if f'quotation-quantity-fix.js?v={oldv}' in b:
                  b=b.replace(f'quotation-quantity-fix.js?v={oldv}','quotation-quantity-fix.js?v=20260928',1); break
          else: raise SystemExit('engine cache key not found')
          bp.write_text(b)
          PY
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js quotation/buildplanner-v2.html
          git commit -m 'Fix Door Type 3 DOM quantity fallback [door-type3-dom-fix]'
          git push