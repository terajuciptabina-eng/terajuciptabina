name: One-time Build Planner integer quantity fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce integer rounded-up quantity before amount
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          replacements={
            'const nq=INT(i.unit)?Math.ceil(q):R2(q);':'const nq=Math.ceil(q);',
            'qty:INT(x.unit)?Math.ceil(N(x.qty)):R2(x.qty),':'qty:Math.ceil(N(x.qty)),',
            'i.qty=INT(i.unit)?Math.ceil(customQuantities.get(i.id)):R2(customQuantities.get(i.id));':'i.qty=Math.ceil(N(customQuantities.get(i.id)));'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Target not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: round quantity up before rate calculation'
          git rm .github/workflows/one-time-buildplanner-integer-quantity.yml
          git commit -m 'Remove one-time integer quantity workflow'
          git push
