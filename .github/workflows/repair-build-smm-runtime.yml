name: Repair Build SMM Runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[repair-build-smm-runtime]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Patch Build Planner runtime hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('quotation/quotation-quantity-fix.js')
          text = path.read_text(encoding='utf-8')

          replacement = r'''  function init(){
    window.TERAJU_AUDIENCE=contractor?'contractor':'homeowner';
    document.body.classList.toggle('contractor-mode',contractor);
    document.body.classList.toggle('homeowner-mode',!contractor);
    if(!contractor){
      if(plannerType==='build'){
        if(typeof window.getAllItems!=='function'){setTimeout(init,100);return;}
        if(!window.getAllItems.__terajuBuildSmmWrapped){
          const original=window.getAllItems;
          const wrapped=function(){
            const items=original();
            return (Array.isArray(items)?items:[]).map(item=>{
              if(typeof customDescriptions!=='undefined'&&customDescriptions.has(item.id))return item;
              const description=buildFullDescription(item);
              if(description)item.description=description;
              return item;
            });
          };
          wrapped.__terajuBuildSmmWrapped=true;
          window.getAllItems=wrapped;
          if(typeof window.updateEstimate==='function')setTimeout(()=>{try{window.updateEstimate();}catch(_){}},0);
        }
      }
      return;
    }
    const ok=plannerType==='build'?installBuild():installRenovation();
    if(!ok){setTimeout(init,100);return;}
  }
'''

          pattern = r'  function init\(\)\{.*?\n  \}\n\n  init\(\);'
          updated, count = re.subn(pattern, replacement + '\n  init();', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate quotation-quantity-fix.js init function')
          if updated == text:
              raise SystemExit('Build SMM runtime hook was not changed')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q "__terajuBuildSmmWrapped" quotation/quotation-quantity-fix.js
          grep -q "window.updateEstimate" quotation/quotation-quantity-fix.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/quotation-quantity-fix.js
          git commit -m "Fix Build SMM description runtime hook [repair-build-smm-runtime]"
          git push origin main
