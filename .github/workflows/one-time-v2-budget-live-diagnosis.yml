name: one-time-v2-budget-live-diagnosis
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose live V2 budget execution
        run: |
          mkdir -p /tmp/v2diag
          cd /tmp/v2diag
          npm init -y >/dev/null 2>&1
          npm install playwright --silent
          npx playwright install chromium --with-deps >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          const crypto=require('crypto');
          (async()=>{
            const u='https://terajuciptabina-eng.github.io/terajuciptabina/quotation/buildplanner-v2.html?audience=contractor&contractorId=CTR-20260909-KMHM&quotationId=QT-BLD-MTVQWWEZ-GXIU';
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const events=[];
            p.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
            p.on('pageerror',e=>console.log('PAGEERROR',JSON.stringify({message:e.message,stack:e.stack})));
            p.on('requestfailed',r=>console.log('REQUESTFAILED',r.url(),r.failure()?.errorText||''));
            p.on('response',async r=>{
              const url=r.url();
              if(url.includes('quotation-quantity-fix')||url.includes('admin-calculation-rules')||url.includes('default.json')||url.includes('/states/')){
                let extra={};
                try{const t=await r.text();extra={bytes:t.length,sha256:crypto.createHash('sha256').update(t).digest('hex'),hasEngineFix:t.includes('__TERAJU_MASTER_RULE_GATE_READY=true')&&t.includes("typeof window.renderConstructionBudget==='function'")};}
                catch(e){extra={bodyReadError:e.message};}
                console.log('RESPONSE',JSON.stringify({status:r.status(),url,...extra}));
              }
            });
            await p.addInitScript(()=>{
              new MutationObserver(ms=>{
                for(const m of ms){
                  if(m.type==='childList'||m.type==='characterData'||m.type==='attributes'){
                    const c=document.getElementById('constructionBudgetContent');
                    if(c) console.log('V2MUTATION',JSON.stringify({t:performance.now(),text:(c.innerText||'').slice(0,240),html:(c.innerHTML||'').slice(0,240)}));
                  }
                }
              }).observe(document,{subtree:true,childList:true,characterData:true,attributes:true});
            });
            await p.goto(u,{waitUntil:'domcontentloaded',timeout:30000});
            for(let i=0;i<24;i++){
              const s=await p.evaluate(()=>({t:performance.now(),active:window.__TERAJU_MASTER_ENGINE_ACTIVE,gate:window.__TERAJU_MASTER_RULE_GATE_READY,getAll:typeof window.getAllItems,render:typeof window.renderConstructionBudget,update:typeof window.updateEstimate,text:document.getElementById('constructionBudgetContent')?.innerText||'',renderHead:typeof window.renderConstructionBudget==='function'?window.renderConstructionBudget.toString().slice(0,1000):'',updateHead:typeof window.updateEstimate==='function'?window.updateEstimate.toString().slice(0,1000):''}));
              const key=JSON.stringify({active:s.active,gate:s.gate,getAll:s.getAll,render:s.render,update:s.update,text:s.text,renderHead:s.renderHead});
              if(!events.length||events[events.length-1].key!==key){events.push({key,state:s});console.log('STATE',JSON.stringify(s));}
              await p.waitForTimeout(500);
            }
            const final=await p.evaluate(()=>({url:location.href,readyState:document.readyState,scripts:[...document.scripts].map(s=>s.src).filter(Boolean),active:window.__TERAJU_MASTER_ENGINE_ACTIVE,gate:window.__TERAJU_MASTER_RULE_GATE_READY,getAll:typeof window.getAllItems,render:typeof window.renderConstructionBudget,update:typeof window.updateEstimate,text:document.getElementById('constructionBudgetContent')?.innerText||'',html:(document.getElementById('constructionBudgetContent')?.innerHTML||'').slice(0,1200),renderHead:typeof window.renderConstructionBudget==='function'?window.renderConstructionBudget.toString().slice(0,1600):'',updateHead:typeof window.updateEstimate==='function'?window.updateEstimate.toString().slice(0,1600):''}));
            console.log('FINAL',JSON.stringify(final));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-v2-budget-live-diagnosis.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-v2-budget-live-diagnosis.yml
          git diff --cached --quiet || git commit -m "Remove one-time V2 budget live diagnosis"
          git push
