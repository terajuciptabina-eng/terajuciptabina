name: One-time Build Planner porch flat roof m2 fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix porch flat roof area conversion at source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="function base(name,s,a){const k=NOR(name);if(k==='a')return s.A;if(k==='b')return s.B;if(k.includes('porch area'))return s.B;if(k.includes('porch flat roof area'))return M2(s.B);"
          new="function base(name,s,a){const k=NOR(name);if(k==='a')return s.A;if(k==='b')return s.B;if(k.includes('porch flat roof area')||k.includes('porch flat roof'))return M2(s.B);if(k.includes('porch area'))return s.B;"
          if old not in s:
              raise SystemExit('Target base() expression not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: convert porch flat roof area to m2'
          git rm .github/workflows/one-time-buildplanner-porch-flat-roof-m2.yml
          git commit -m 'Remove one-time porch flat roof workflow'
          git push
