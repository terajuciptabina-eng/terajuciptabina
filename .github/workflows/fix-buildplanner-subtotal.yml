name: Fix Build Planner subtotal layout

on:
  push:
    paths:
      - 'quotation/buildplanner.html'
      - '.github/workflows/fix-buildplanner-subtotal.yml'

permissions:
  contents: write

jobs:
  fix-subtotal:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix Build Planner subtotal layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix subtotal row colspan only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/buildplanner.html')
          s = p.read_text(encoding='utf-8')
          old = '<td colspan="4"></td><td class="py-2 px-2 text-right font-semibold">'
          new = '<td colspan="5" class="py-2 px-2 text-right font-semibold">'
          count = s.count(old)
          if count != 4:
              raise SystemExit(f'Expected 4 estimate subtotal rows, found {count}; aborting without changes.')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner.html
          git commit -m 'Fix Build Planner subtotal layout'
          git push
