name: Temporary Fix Calculation Rules Display
on:
  push:
    paths:
      - '.github/workflows/temp-fix-cr-display.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/calculation-rules.html')
          s=p.read_text()
          s=s.replace('<script>\n<script>\nconst rules=', '<script>\nconst rules=', 1)
          old='<option value="all">All groups</option><option value="STRUCTURES">STRUCTURES</option><option value="ARCHITECTURES">ARCHITECTURES</option>'
          new='<option value="all">All groups</option><option value="PRELIMINARIES">PRELIMINARIES</option><option value="STRUCTURES">STRUCTURES</option><option value="ARCHITECTURES">ARCHITECTURES</option><option value="ELECTRICAL">ELECTRICAL</option><option value="DOORS &amp; WINDOWS">DOORS &amp; WINDOWS</option><option value="EXTERNAL WORK">EXTERNAL WORK</option><option value="OTHERS">OTHERS</option>'
          s=s.replace(old,new,1)
          start=s.find('const search=document.getElementById(\'search\');')
          end=s.rfind('</script>')
          if start<0 or end<0: raise SystemExit('renderer boundaries missing')
          renderer=r'''const search=document.getElementById('search');
          const group=document.getElementById('group');
          const sections=document.getElementById('sections');
          const summary=document.getElementById('summary');
          const empty=document.getElementById('empty');
          const groupOrder=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK','OTHERS'];
          function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
          function parts(v){return String(v||'').split('/').map(x=>x.trim()).filter(Boolean);}
          function render(){
            const q=(search.value||'').trim().toLowerCase(), selected=group.value;
            const filtered=rules.filter(r=>{const t=[r.group,r.path,r.description,r.method,r.ref,r.coeff,r.formula,r.output,r.basis,r.note].join(' ').toLowerCase();return(!q||t.includes(q))&&(selected==='all'||r.group===selected);});
            summary.textContent=`Showing ${filtered.length} of ${rules.length} calculation rules`;
            sections.innerHTML='';
            for(const groupName of groupOrder){
              if(selected!=='all' && selected!==groupName) continue;
              const rows=filtered.filter(r=>r.group===groupName);
              const sec=document.createElement('section'); sec.className='section';
              sec.innerHTML=`<div class="section-head"><h2>${esc(groupName)}</h2><span class="count">${rows.length} rules</span></div>`;
              if(!rows.length){sec.innerHTML+=`<div class="empty">No source-backed calculation rules are defined for this category yet.</div>`; sections.appendChild(sec); continue;}
              const tree={};
              for(const r of rows){const ps=parts(r.path);let n=tree;for(let i=0;i<ps.length-1;i++)n=(n[ps[i]] ||= {});(n.__items ||= []).push({...r,item:ps[ps.length-1]||r.path});}
              function nodeHtml(n,depth){let h=''; for(const k of Object.keys(n).filter(x=>x!=='__items')){h+=`<div class="hierarchy-block ${depth===0?'main-block':''}"><div class="${depth===0?'main-heading':'sub-heading'}">${esc(k)}</div>${nodeHtml(n[k],depth+1)}</div>`;} if(n.__items){h+='<div class="table-wrap"><table class="rule-table"><thead><tr><th>Item</th><th>Description</th><th>Method</th><th>Source / Reference</th><th>Conversion / Coefficient</th><th>Formula</th><th>Output</th><th>Explanation / Derivation</th></tr></thead><tbody>';h+=n.__items.map(r=>`<tr><td class="path" data-label="Item">${esc(r.item)}</td><td class="desc" data-label="Description">${esc(r.description)}</td><td class="method" data-label="Method">${esc(r.method)}</td><td class="ref" data-label="Source / Reference">${esc(r.ref)}</td><td data-label="Conversion / Coefficient">${esc(r.coeff)}</td><td class="formula" data-label="Formula">${esc(r.formula)}</td><td data-label="Output">${esc(r.output)}</td><td class="note" data-label="Explanation / Derivation"><b>Source:</b> ${esc(r.ref)}<br><b>Derivation:</b> ${esc(r.basis)}<br><b>Rule:</b> ${esc(r.formula)}</td></tr>`).join('');h+='</tbody></table></div>';} return h;}
              sec.innerHTML+=`<div class="hierarchy-block">${nodeHtml(tree,0)}</div>`;
              sections.appendChild(sec);
            }
            empty.classList.toggle('hidden',filtered.length!==0);
          }
          search.addEventListener('input',render); group.addEventListener('change',render); render();'''
          s=s[:start]+renderer+'\n'+s[end:]
          s=s.replace('←','').replace('→','')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/calculation-rules.html
          git commit -m 'Fix Calculation Rules renderer and category display'
          git rm .github/workflows/temp-fix-cr-display.yml
          git commit -m 'Remove temporary Calculation Rules display workflow'
          git push
