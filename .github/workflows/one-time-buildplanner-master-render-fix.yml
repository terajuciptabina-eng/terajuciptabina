name: One-time Build Planner master render fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route Build Planner refresh through master engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          old="async function main(){if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));await load();window.getAllItems=getMasterItems;window.renderConstructionBudget=renderBudget;window.getCurrentQuotationData=qData;window.generateQuotation=quotation;if(typeof window.updateEstimate==='function')window.updateEstimate()}"
          new="async function main(){if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));await load();window.getAllItems=getMasterItems;window.renderConstructionBudget=renderBudget;window.getCurrentQuotationData=qData;window.generateQuotation=quotation;window.updateEstimate=function(){if(typeof syncBuiltUpAreaFromRooms==='function')syncBuiltUpAreaFromRooms();renderBudget();if(typeof saveContractorState==='function')saveContractorState()};window.updateEstimate()}"
          if old not in s:
              raise SystemExit('Expected master main bootstrap not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: route estimate rendering through master engine'
          git rm .github/workflows/one-time-buildplanner-master-render-fix.yml
          git commit -m 'Remove one-time master render workflow'
          git push
