name: Fix Build Planner V2 R2 scope
on:
  push:
    paths:
      - 'quotation/quotation-quantity-fix.js'
      - '.github/workflows/fix-v2-r2-scope.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix V2 renderer scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old='const groupTotal=R2(items.reduce((sum,i)=>sum+N(i.amount),0));'
          new='const groupTotal=window.TERAJU_R2(items.reduce((sum,i)=>sum+N(i.amount),0));'
          if old not in s:
              raise SystemExit('Expected V2 groupTotal R2 call not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check quotation/quotation-quantity-fix.js
          grep -n 'const groupTotal=' quotation/quotation-quantity-fix.js
      - name: Commit source fix and remove workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-v2-r2-scope.yml .github/workflows/diagnose-v2-loading.yml
          git add quotation/quotation-quantity-fix.js
          git commit -m 'Fix Build Planner V2 renderer R2 scope'
          git push