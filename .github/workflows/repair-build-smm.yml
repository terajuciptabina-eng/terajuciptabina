name: Repair Build SMM source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[repair-build-smm]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Build helper and patch SMM sync
        shell: bash
        run: |
          git fetch --no-tags origin 93410917b87fcbbc8403ae8ea8ed9552b8836f6f
          git checkout 93410917b87fcbbc8403ae8ea8ed9552b8836f6f -- quotation/quotation-quantity-fix.js
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          old="""      addDatabaseRecord(key, fallback, false);\n      const e = effectiveRecord(key, fallback);\n      item.description=e.description;\n      if (fullDescription && db[key] && !db[key].custom && (!db[key].description || db[key].description === originalDescription)) item.description=fullDescription;\n"""
          new="""      const existing = db[key];\n      if (existing && !existing.custom && fullDescription) existing.description = fullDescription;\n      addDatabaseRecord(key, fallback, false);\n      const e = effectiveRecord(key, fallback);\n      item.description=e.description;\n      if (fullDescription && db[key] && !db[key].custom) { item.description=fullDescription; db[key].description=fullDescription; }\n"""
          if old not in s: raise SystemExit('Build database block not found')
          s=s.replace(old,new,1)
          old="""  function init(){\n    window.TERAJU_AUDIENCE=contractor?'contractor':'homeowner';document.body.classList.toggle('contractor-mode',contractor);document.body.classList.toggle('homeowner-mode',!contractor);\n    if(!contractor)return;\n    const ok=plannerType==='build'?installBuild():installRenovation();\n    if(!ok)setTimeout(init,100);\n  }\n"""
          new="""  function init(){\n    window.TERAJU_AUDIENCE=contractor?'contractor':'homeowner';document.body.classList.toggle('contractor-mode',contractor);document.body.classList.toggle('homeowner-mode',!contractor);\n    if(!contractor){\n      if(plannerType==='build'){\n        if(typeof window.getAllItems!=='function'){setTimeout(init,100);return;}\n        if(!window.getAllItems.__terajuBuildSmmWrapped){\n          const original=window.getAllItems;\n          const wrapped=function(){const items=original();return (Array.isArray(items)?items:[]).map(item=>{if(typeof customDescriptions!=='undefined'&&customDescriptions.has(item.id))return item;const description=buildFullDescription(item);if(description)item.description=description;return item;});};\n          wrapped.__terajuBuildSmmWrapped=true;window.getAllItems=wrapped;\n        }\n      }\n      return;\n    }\n    const ok=plannerType==='build'?installBuild():installRenovation();\n    if(!ok)setTimeout(init,100);\n  }\n"""
          if old not in s: raise SystemExit('init block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/quotation-quantity-fix.js
          git commit -m "Restore Build SMM descriptions and database sync [repair-build-smm]"
          git push origin main
