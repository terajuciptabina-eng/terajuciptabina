name: one-time-v2-stack-diagnosis
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix null contractor display target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old="document.getElementById('contractorIdDisplay').textContent=CONTRACTOR_ID||'Not signed in';"
          new="const contractorIdDisplay=document.getElementById('contractorIdDisplay');if(contractorIdDisplay)contractorIdDisplay.textContent=CONTRACTOR_ID||'Not signed in';"
          if old not in s:
              raise SystemExit('Expected contractor display assignment was not found; refusing unrelated edit.')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/one-time-v2-stack-diagnosis.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/buildplanner-v2.html .github/workflows/one-time-v2-stack-diagnosis.yml
          git commit -m "Fix Build Planner V2 contractor display guard"
          git push
