name: One-time V2 budget layout fix
on: push
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix V2 budget layout and subtotals'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply V2 source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="t.style.height='auto';t.style.height=t.scrollHeight+'px'"
          if old not in s: raise SystemExit('V2 textarea autogrow code not found')
          s=s.replace(old,"t.style.height='0px';t.style.height=t.scrollHeight+'px'",1)
          token='h+=`<tr class="cr-hierarchy-row cr-level-${idx+2}"><td colspan="7">${esc(level)}</td></tr>`'
          if token not in s: raise SystemExit('V2 hierarchy row token not found')
          replacement="h+=(idx===g.levels.length-1?`<tr class=\"cr-hierarchy-row cr-level-${idx+2}\"><td colspan=\"5\">${esc(level)}</td><td class=\"text-right\">SUBTOTAL RM ${money2(R2(g.items.reduce((sum,i)=>sum+N(i.amount),0)))}</td><td></td></tr>`:`<tr class=\"cr-hierarchy-row cr-level-${idx+2}\"><td colspan=\"7\">${esc(level)}</td></tr>`)"
          s=s.replace(token,replacement,1)
          p.write_text(s)
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old_css='.cr-budget-table .cr-description textarea{width:100%!important;min-width:0!important;min-height:52px!important;height:auto!important;resize:none!important;overflow:hidden!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;word-break:normal!important;line-height:1.4!important;vertical-align:top!important}'
          new_css='.cr-budget-table .cr-description textarea{width:100%!important;min-width:0!important;min-height:52px!important;resize:none!important;overflow:hidden!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;word-break:normal!important;line-height:1.4!important;vertical-align:top!important}'
          if old_css not in s: raise SystemExit('V2 textarea CSS not found')
          s=s.replace(old_css,new_css,1)
          css='.cr-budget-table .cr-hierarchy-row td.text-right{font-weight:800;text-transform:none;letter-spacing:0;color:#374151;white-space:nowrap}.cr-budget-table .cr-hierarchy-row td:first-child{padding-left:25px}'
          if css not in s: s=s.replace('/* V2 description wrap */','/* V2 description wrap */\n'+css,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js quotation/buildplanner-v2.html
          git commit -m 'Fix V2 budget layout and subtotals'
          git push
