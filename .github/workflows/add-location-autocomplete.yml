name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add planner helper scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          location_files=['quotation/renovationplanner.html','quotation/buildplanner.html']
          quantity_files=['quotation/renovationplanner.html']
          location_tag='<script src="location-autocomplete.js"></script>'
          quantity_tag='<script src="quotation-quantity-fix.js?v=20260907"></script>'
          for name in location_files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if location_tag not in s:
                  s=s.replace('</body>', location_tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          for name in quantity_files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if quantity_tag not in s:
                  s=s.replace('</body>', quantity_tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Remove repeated RM prefix from quotation values
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'quotation/buildplanner.html': (
                  'function money(v,d=2){return new Intl.NumberFormat(\'en-MY\',{style:\'currency\',currency:\'MYR\',minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.round((Number(v)||0)*100)/100)}',
                  'function money(v,d=2){return new Intl.NumberFormat(\'en-MY\',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Math.round((Number(v)||0)*100)/100)}'
              ),
              'quotation/renovationplanner.html': (
                  'function money(value, decimals = 0) {\n  return new Intl.NumberFormat("en-MY", {\n    style: "currency", currency: "MYR",\n    minimumFractionDigits: decimals, maximumFractionDigits: decimals\n  }).format(Number(value) || 0);\n}',
                  'function money(value, decimals = 0) {\n  return new Intl.NumberFormat("en-MY", {\n    minimumFractionDigits: decimals, maximumFractionDigits: decimals\n  }).format(Number(value) || 0);\n}'
              )
          }
          for name,(old,new) in replacements.items():
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected money formatter not found in {name}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Remove repeated RM from quotation values [location-autocomplete]'
          git push
