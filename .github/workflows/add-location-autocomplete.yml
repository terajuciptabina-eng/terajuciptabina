name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile quotation preview scale
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['quotation/renovationplanner.html','quotation/buildplanner.html']
          marker='/* Mobile quotation — same table structure as desktop, scaled to screen */'
          replacement='''/* Mobile quotation — same table structure as desktop, preview-style scale */
          @media (max-width: 767px) {
            #estimateContent,
            #estimateContent > .overflow-x-auto {
              width:100% !important;
              max-width:100% !important;
              overflow:hidden !important;
            }
            #estimateContent table {
              width:760px !important;
              min-width:760px !important;
              max-width:none !important;
              table-layout:fixed !important;
              border-collapse:collapse !important;
              zoom:0.46;
            }
            #estimateContent table thead { display:table-header-group !important; }
            #estimateContent table tbody,
            #estimateContent table tfoot { display:table-row-group !important; }
            #estimateContent table tr { display:table-row !important; }
            #estimateContent table th,
            #estimateContent table td { display:table-cell !important; }
          }
          '''
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if marker not in s:
                  raise SystemExit(f'marker not found: {name}')
              start=s.index(marker)
              end=s.index('</style>',start)
              s=s[:start]+replacement+s[end:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Scale mobile quotation like preview'
          git push
