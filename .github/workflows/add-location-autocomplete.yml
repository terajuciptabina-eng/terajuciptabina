name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical mobile subtotal fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['quotation/buildplanner.html','quotation/renovationplanner.html']
          pattern=re.compile(r'''  #estimateContent table tr:has\(td:first-child \+ td:last-child\) td:first-child \{.*?  \}\n  #estimateContent table tr:has\(td:first-child \+ td:last-child\) td:last-child \{.*?  \}''', re.S)
          new='''  #estimateContent table tr.border-b:has(td[colspan="4"]) td:nth-child(5) {
    text-align:right !important;
    white-space:nowrap !important;
    overflow-wrap:normal !important;
    word-break:normal !important;
    font-size:8px !important;
    padding-left:1px !important;
    padding-right:1px !important;
  }
  #estimateContent table tr.border-b:has(td[colspan="4"]) td:nth-child(6) {
    text-align:right !important;
    white-space:nowrap !important;
    overflow-wrap:normal !important;
    word-break:normal !important;
    font-size:8px !important;
    padding-left:1px !important;
    padding-right:1px !important;
  }'''
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s2,n=pattern.subn(new,s,count=1)
              if n!=1:
                  raise SystemExit(f'Expected existing mobile subtotal selector not found exactly once in {name}: {n}')
              p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Fix mobile subtotal alignment [subtotal-fix]'
          git push
