name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply temporary planner layout cleanup
        run: python .github/tmp_refine_mobile_quotation.py
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Refine mobile quotation cards [location-autocomplete]'
          git push
