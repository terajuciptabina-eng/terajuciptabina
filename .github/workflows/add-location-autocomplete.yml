name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean and unify planner mobile quotation layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          clean_mobile = '''/* Mobile quotation cards — single clean implementation */
          @media (max-width: 767px) {
            #estimateContent,
            #estimateContent > .overflow-x-auto,
            #estimateContent > div,
            #estimateContent table,
            #estimateContent table tbody {
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              overflow:visible !important;
            }
            #estimateContent table {
              display:block !important;
              table-layout:auto !important;
              border-collapse:separate !important;
              border-spacing:0 12px !important;
            }
            #estimateContent table thead { display:none !important; }
            #estimateContent table tbody { display:block !important; }

            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) {
              display:grid !important;
              grid-template-columns:repeat(3,minmax(0,1fr)) !important;
              gap:0 10px !important;
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              margin:0 0 12px !important;
              padding:14px !important;
              border:1px solid #e5e7eb !important;
              border-radius:16px !important;
              background:#fff !important;
              box-shadow:0 4px 16px rgba(15,23,42,.05) !important;
              overflow:hidden !important;
            }

            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td {
              display:block !important;
              width:auto !important;
              min-width:0 !important;
              max-width:none !important;
              box-sizing:border-box !important;
              padding:6px 2px !important;
              overflow:visible !important;
              min-height:0 !important;
            }

            /* Description */
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(1) {
              grid-column:1 / -1 !important;
              width:100% !important;
              padding:0 0 12px !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(1) textarea,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(1) .homeowner-locked {
              display:block !important;
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              box-sizing:border-box !important;
              white-space:pre-wrap !important;
              overflow-wrap:anywhere !important;
              word-break:break-word !important;
              line-height:1.5 !important;
              margin:0 !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(1) textarea {
              min-height:88px !important;
              height:auto !important;
              resize:vertical !important;
            }

            /* Unit is desktop-only */
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(2) {
              display:none !important;
            }

            /* Quantity / Rate / Amount — always one aligned 3-column row */
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(3) {
              grid-column:1 !important;
              width:100% !important;
              text-align:left !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(4) {
              grid-column:2 !important;
              width:100% !important;
              text-align:left !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(5) {
              grid-column:3 !important;
              width:100% !important;
              text-align:left !important;
              font-weight:700 !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(3)::before { content:'Quantity'; }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(4)::before { content:'Rate (RM)'; }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(5)::before { content:'Amount (RM)'; }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(3)::before,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(4)::before,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(5)::before {
              display:block;
              margin:0 0 5px;
              font-size:11px;
              line-height:1.2;
              font-weight:700;
              text-transform:uppercase;
              letter-spacing:.06em;
              color:#9ca3af;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(3) input,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(4) input,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(3) .homeowner-locked,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(4) .homeowner-locked,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(5) {
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              min-height:52px !important;
              box-sizing:border-box !important;
              border:1px solid #e5e7eb !important;
              border-radius:12px !important;
              padding:12px 10px !important;
              background:#fff !important;
              display:flex !important;
              align-items:center !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(3) input,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(4) input {
              text-align:right !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(3) .homeowner-locked,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(4) .homeowner-locked,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(5) {
              justify-content:flex-end !important;
              color:#1f2937 !important;
              background:#f8fafc !important;
            }

            /* Delete */
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(6) {
              grid-column:1 / -1 !important;
              width:100% !important;
              margin-top:10px !important;
              padding:12px 0 0 !important;
              border-top:1px solid #f1f5f9 !important;
              text-align:left !important;
            }
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:nth-child(6) button {
              width:auto !important;
              min-width:120px !important;
            }

            #estimateContent table tbody tr.quotation-section-row,
            #estimateContent table tbody tr.quotation-subsection-row,
            #estimateContent table tbody tr.bg-gray-100 {
              display:block !important;
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              padding:12px !important;
              margin:0 0 8px !important;
            }
            #estimateContent table tbody tr.quotation-section-row td,
            #estimateContent table tbody tr.quotation-subsection-row td,
            #estimateContent table tbody tr.bg-gray-100 td {
              display:block !important;
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
            }
            #estimateContent table tfoot tr { display:block !important; width:100% !important; min-width:0 !important; }
            #estimateContent table tfoot td { display:inline-block !important; width:auto !important; min-width:0 !important; padding:6px 4px !important; }

            /* Homeowner: description stays display-only; contractor keeps edit control. */
            body:not(.contractor-mode) #estimateContent table tbody td:nth-child(1) textarea { display:none !important; }
            body.contractor-mode #estimateContent table tbody td:nth-child(1) .homeowner-locked { display:none !important; }
          }'''

          def replace_mobile_block(s):
              marker='/* Mobile quotation cards — single clean implementation */'
              i=s.find(marker)
              if i < 0:
                  raise RuntimeError('Mobile quotation marker not found')
              media=s.find('@media', i)
              if media < 0:
                  raise RuntimeError('Mobile quotation @media not found')
              brace=s.find('{', media)
              depth=0
              end=None
              for pos in range(brace, len(s)):
                  ch=s[pos]
                  if ch=='{': depth += 1
                  elif ch=='}':
                      depth -= 1
                      if depth==0:
                          end=pos+1
                          break
              if end is None:
                  raise RuntimeError('Could not find end of mobile quotation block')
              return s[:i] + clean_mobile + s[end:]

          for name in ['quotation/buildplanner.html','quotation/renovationplanner.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              # Remove the older duplicate mobile override style completely.
              s,n=re.subn(r'\s*<style id="mobile-quotation-and-room-fix">.*?</style>\s*', '\n', s, count=1, flags=re.S)
              if n!=1:
                  raise RuntimeError(f'{name}: duplicate mobile style not found')
              s=replace_mobile_block(s)
              # Renovation had an older estimateContent mobile min-width block in its main mobile rules.
              s=s.replace('      #estimateContent { width: calc(100% + 8px); margin-left: -4px; margin-right: -4px; padding-bottom: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }\n      #estimateContent > div, #estimateContent table { min-width: 760px; }\n      #estimateContent table th, #estimateContent table td { padding: 10px 8px !important; }\n      #estimateContent textarea { min-width: 260px !important; max-width: 320px; }\n', '')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html quotation/renovationplanner.html
          git commit -m 'Unify mobile quotation card layout [location-autocomplete]'
          git push
