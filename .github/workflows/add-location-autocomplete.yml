name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[area-ux-final]') && !contains(github.event.head_commit.message, '[area-ux-restore]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply planner area UX to latest files
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['quotation/buildplanner.html','quotation/renovationplanner.html']

          def rename_once(s,name,new):
              marker=f'function {name}('
              pos=s.find(marker)
              if pos<0: raise RuntimeError(f'{marker} not found')
              return s[:pos]+f'function {new}('+s[pos+len(marker):]

          for filename in files:
              p=Path(filename)
              s=p.read_text(encoding='utf-8')

              # Existing addRoom remains the implementation; wrapper only changes
              # the UX for calls made without explicit room data.
              if 'function addRoomBase(' not in s:
                  s=rename_once(s,'addRoom','addRoomBase')
                  anchor=s.find('function getRoomGroups(')
                  if anchor<0: anchor=s.find('function getAllItems(')
                  if anchor<0: raise RuntimeError(f'addRoom insertion anchor not found in {filename}')
                  wrapper="""
          function addRoom(...args){
            const blankAreaCall=args.length===0;
            addRoomBase(...args);
            if(blankAreaCall){
              const card=document.querySelector('#roomsContainer .room-card:last-child');
              const nameInput=card?.querySelector('.room-name');
              const areaInput=card?.querySelector('.room-area');
              if(nameInput)nameInput.value='';
              if(areaInput){areaInput.value='';areaInput.placeholder='e.g. 200';}
              updateEstimate();
              if(typeof saveContractorState==='function')saveContractorState();
            }
          }
          """
                  s=s[:anchor]+wrapper+s[anchor:]

              # Build Planner uses getRoomGroups() as the room source for calculations.
              if filename.endswith('buildplanner.html') and 'function getRoomGroupsBase(' not in s:
                  s=rename_once(s,'getRoomGroups','getRoomGroupsBase')
                  anchor=s.find('function getScaleFactor(')
                  if anchor<0: anchor=s.find('function getAllItems(')
                  if anchor<0: raise RuntimeError(f'getRoomGroups insertion anchor not found in {filename}')
                  wrapper="""
          function getRoomGroups(){
            return getRoomGroupsBase().filter(room=>Number(room.area)>0);
          }
          """
                  s=s[:anchor]+wrapper+s[anchor:]

              # Renovation Planner builds quotation items directly from room cards.
              # Skip zero-area cards before generating any item/quotation data.
              if filename.endswith('renovationplanner.html'):
                  old='area = parseFloat(room.querySelector(".room-area")?.value) || 0; typeIndexes[roomType]'
                  new='area = parseFloat(room.querySelector(".room-area")?.value) || 0; if(area<=0)return; typeIndexes[roomType]'
                  if old in s and 'if(area<=0)return; typeIndexes[roomType]' not in s:
                      s=s.replace(old,new,1)
                  elif 'if(area<=0)return; typeIndexes[roomType]' not in s:
                      raise RuntimeError('Renovation getAllItems area guard pattern not found')

              # Append the initial-card helper before the FINAL script closing tag,
              # never the Tailwind script tag in <head>.
              if 'function ensureInitialAreaCard(' not in s:
                  helper="""
          function ensureInitialAreaCard(){
            const container=document.getElementById('roomsContainer');
            if(!container)return;
            const hasValidArea=[...container.querySelectorAll('.room-card')].some(card=>Number(card.querySelector('.room-area')?.value||0)>0);
            if(!hasValidArea)addRoom();
          }
          ensureInitialAreaCard();
          updateEstimate();
          """
                  head,tail=s.rsplit('</script>',1)
                  s=head+helper+'\n</script>'+tail

              p.write_text(s,encoding='utf-8')
              print('Patched',filename)
          PY
      - name: Commit planner area UX
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html quotation/renovationplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Standardize planner area UX [area-ux-final]'
          git push
