name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-v2:
    if: "!contains(github.event.head_commit.message, '[v2-room-types]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build Planner V2 room types and defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          text=p.read_text(encoding='utf-8')
          old_types="const ROOM_TYPES={living:'Living / Family',dining:'Dining',bedroom:'Bedroom',kitchen:'Kitchen',store:'Store / Utility',bathroom:'Bathroom',porch:'Car Porch / Entrance',other:'Other'};"
          new_types="const ROOM_TYPES={living:'Living',dining:'Dining',bedroom:'Bedroom',masterBedroom:'Master Bedroom',family:'Family',kitchen:'Kitchen',store:'Store',utility:'Utility',bathroom:'Bathroom',porch:'Porch',other:'Other'};"
          old_defaults="const ROOM_DEFAULTS={living:{doors:1,windows:2},dining:{doors:0,windows:1},bedroom:{doors:1,windows:1},kitchen:{doors:1,windows:1},store:{doors:1,windows:0},bathroom:{doors:1,windows:0},porch:{doors:0,windows:0},other:{doors:0,windows:1}};"
          new_defaults="const ROOM_DEFAULTS={living:{doors:1,windows:1},dining:{doors:0,windows:1},bedroom:{doors:1,windows:1},masterBedroom:{doors:1,windows:1},family:{doors:0,windows:0},kitchen:{doors:1,windows:1},store:{doors:1,windows:0},utility:{doors:1,windows:0},bathroom:{doors:1,windows:0},porch:{doors:0,windows:0},other:{doors:0,windows:0}};"
          if old_types not in text:
              raise SystemExit('Expected V2 ROOM_TYPES mapping not found.')
          if old_defaults not in text:
              raise SystemExit('Expected V2 ROOM_DEFAULTS mapping not found.')
          text=text.replace(old_types,new_types,1)
          text=text.replace(old_defaults,new_defaults,1)
          p.write_text(text,encoding='utf-8')
          PY
          git checkout HEAD~1 -- .github/workflows/add-location-autocomplete.yml
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner-v2.html .github/workflows/add-location-autocomplete.yml
          git commit -m 'Update Build Planner V2 room types and defaults [v2-room-types] [location-autocomplete]'
          git push
