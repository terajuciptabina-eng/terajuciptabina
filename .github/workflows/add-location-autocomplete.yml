name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add planner helper scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files=['quotation/renovationplanner.html','quotation/buildplanner.html']
          location_tag='<script src="location-autocomplete.js"></script>'
          quantity_tag='<script src="quotation-quantity-fix.js?v=20260907"></script>'
          mobile_fix='''<style id="mobile-quotation-and-room-fix">
          @media (max-width: 767px) {
            #estimateContent .detailed-quotation-table,
            #estimateContent table {
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              table-layout:fixed !important;
            }
            #estimateContent .detailed-quotation-table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100),
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) {
              width:100% !important;
              min-width:0 !important;
              grid-template-columns:repeat(3,minmax(0,1fr)) !important;
            }
            #estimateContent .detailed-quotation-table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:first-child,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:first-child {
              grid-column:1 / -1 !important;
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              overflow:hidden !important;
              white-space:normal !important;
              overflow-wrap:anywhere !important;
              word-break:break-word !important;
            }
            #estimateContent .detailed-quotation-table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:first-child textarea,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:first-child textarea {
              display:block !important;
              width:100% !important;
              min-width:0 !important;
              max-width:none !important;
              box-sizing:border-box !important;
              white-space:pre-wrap !important;
              overflow-wrap:anywhere !important;
              word-break:break-word !important;
              overflow-x:hidden !important;
              line-height:1.45 !important;
            }
            #estimateContent .detailed-quotation-table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:first-child .homeowner-locked,
            #estimateContent table tbody tr:not(.quotation-section-row):not(.quotation-subsection-row):not(.bg-gray-100) td:first-child .homeowner-locked {
              display:block !important;
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              white-space:normal !important;
              overflow-wrap:anywhere !important;
              word-break:break-word !important;
              line-height:1.5 !important;
            }
          }
          </style>'''

          def reorder_room_fields(s):
              marker='function addRoomBase'
              start=s.find(marker)
              if start < 0:
                  return s
              end=s.find('container.appendChild(div)', start)
              if end < 0:
                  return s
              section=s[start:end]
              pattern=re.compile(r'(<div>\s*<label[^>]*>Room / Area Name</label>.*?</div>)\s*(<div>\s*<label[^>]*>Room Type</label>.*?</div>)', re.S)
              section2,n=pattern.subn(lambda m:m.group(2)+'\n'+m.group(1),section,count=1)
              return s[:start]+section2+s[end:] if n else s

          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=reorder_room_fields(s)
              if 'id="mobile-quotation-and-room-fix"' not in s:
                  s=s.replace('</head>',mobile_fix+'\n</head>',1)
              if location_tag not in s:
                  s=s.replace('</body>',location_tag+'\n</body>',1)
              if name.endswith('renovationplanner.html') and quantity_tag not in s:
                  s=s.replace('</body>',quantity_tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Fix mobile quotation wrapping and room field order [location-autocomplete]'
          git push
