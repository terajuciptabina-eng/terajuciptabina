name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile quotation subtotal rows
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='''/* Mobile quotation — same table structure as desktop, responsive shrink */'''
          addition='''\n@media (max-width: 767px) {\n  #estimateContent table tr:has(td[colspan]) td {\n    white-space: nowrap !important;\n    overflow-wrap: normal !important;\n    word-break: normal !important;\n  }\n  #estimateContent table tr:has(td[colspan]) td:first-child {\n    text-align: right !important;\n  }\n  #estimateContent table tr:has(td[colspan]) td:last-child {\n    text-align: right !important;\n    white-space: nowrap !important;\n  }\n}\n'''
          for name in ['quotation/buildplanner.html','quotation/renovationplanner.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if addition.strip() not in s:
                  pos=s.find(marker)
                  if pos<0:
                      raise SystemExit(f'Mobile quotation marker not found in {name}')
                  end=s.find('</style>',pos)
                  if end<0:
                      raise SystemExit(f'Style end not found in {name}')
                  s=s[:end]+addition+s[end:]
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Fix mobile quotation subtotal layout'
          git push
