name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add planner helper scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          location_files=['quotation/renovationplanner.html','quotation/buildplanner.html']
          quantity_files=['quotation/renovationplanner.html']
          location_tag='<script src="location-autocomplete.js"></script>'
          quantity_tag='<script src="quotation-quantity-fix.js?v=20260907"></script>'
          for name in location_files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if location_tag not in s:
                  s=s.replace('</body>', location_tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          for name in quantity_files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if quantity_tag not in s:
                  s=s.replace('</body>', quantity_tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Patch existing mobile quotation CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['quotation/buildplanner.html','quotation/renovationplanner.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              marker='/* Mobile quotation — same table structure as desktop, responsive shrink */'
              if marker not in s:
                  raise SystemExit(f'Mobile CSS marker not found in {name}; refusing to change file.')
              start=s.index(marker)
              end=s.index('</style>', start)
              block=s[start:end]
              block=block.replace('font-size:10px !important;', 'font-size:9px !important;', 1)
              block=block.replace('padding:6px 3px !important;', 'padding:5px 2px !important;', 1)
              block=block.replace('padding:5px 3px !important;', 'padding:4px 2px !important;', 1)
              block=block.replace('font-size:10px !important;\n              box-sizing:border-box', 'font-size:9px !important;\n              box-sizing:border-box', 1)
              block=block.replace('font-size:9px !important;\n              line-height:1.1', 'font-size:8px !important;\n              line-height:1.1', 1)
              s=s[:start]+block+s[end:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Tighten mobile quotation font [location-autocomplete]'
          git push
