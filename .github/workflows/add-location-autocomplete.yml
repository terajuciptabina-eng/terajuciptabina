name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch planner mobile quotation
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['quotation/renovationplanner.html','quotation/buildplanner.html']
          marker='/* Mobile quotation — same table structure as desktop'
          replacement='''/* Mobile quotation — same table structure as desktop, preview-style shrink */
          @media (max-width: 767px) {
            #estimateContent,
            #estimateContent > .overflow-x-auto {
              width:100% !important;
              max-width:100% !important;
              overflow-x:hidden !important;
              overflow-y:visible !important;
            }
            #estimateContent > .overflow-x-auto {
              zoom:0.78 !important;
              width:128.205128% !important;
              max-width:none !important;
              overflow:visible !important;
            }
            #estimateContent table {
              width:100% !important;
              min-width:0 !important;
              max-width:none !important;
              table-layout:fixed !important;
              border-collapse:collapse !important;
            }
            #estimateContent table thead { display:table-header-group !important; }
            #estimateContent table tbody,
            #estimateContent table tfoot { display:table-row-group !important; }
            #estimateContent table tr { display:table-row !important; }
            #estimateContent table th,
            #estimateContent table td {
              display:table-cell !important;
              vertical-align:top !important;
            }
            #estimateContent table td[colspan],
            #estimateContent table th[colspan] {
              text-align:left !important;
              white-space:normal !important;
              overflow-wrap:anywhere !important;
              word-break:break-word !important;
            }
          }
          '''
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              start=s.rfind(marker)
              if start < 0:
                  raise SystemExit(f'Marker not found: {name}')
              end=s.find('</style>', start)
              if end < 0:
                  raise SystemExit(f'Style end not found: {name}')
              s=s[:start]+replacement+'\n'+s[end:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Fix mobile quotation subtotal alignment [mobile-quotation]'
          git push
