name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile subtotal wrapping
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['quotation/renovationplanner.html','quotation/buildplanner.html']
          old='''@media (max-width: 767px) {\n  #estimateContent table tr:has(td[colspan]) td {\n    white-space: nowrap !important;\n    overflow-wrap: normal !important;\n    word-break: normal !important;\n  }\n  #estimateContent table tr:has(td[colspan]) td:first-child {\n    text-align: right !important;\n  }\n  #estimateContent table tr:has(td[colspan]) td:last-child {\n    text-align: right !important;\n    white-space: nowrap !important;\n  }\n}\n'''
          new='''@media (max-width: 767px) {\n  #estimateContent table tr:has(td[colspan]) td:nth-child(5) {\n    font-size: 9px !important;\n    line-height: 1.25 !important;\n    white-space: normal !important;\n    overflow-wrap: anywhere !important;\n    word-break: normal !important;\n  }\n  #estimateContent table tr:has(td[colspan]) td:nth-child(6) {\n    font-size: 9px !important;\n    line-height: 1.25 !important;\n    white-space: nowrap !important;\n  }\n}\n'''
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected subtotal CSS block not found in {name}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Fix mobile subtotal wrapping [location-autocomplete]'
          git push
