name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile quotation shrink
        run: |
          python - <<'PY'
          from pathlib import Path

          mobile_css = '''/* Mobile quotation — same table structure as desktop, scaled to screen */
          @media (max-width: 767px) {
            #estimateContent,
            #estimateContent > .overflow-x-auto {
              width:100% !important;
              max-width:100% !important;
              overflow-x:hidden !important;
              overflow-y:visible !important;
            }
            #estimateContent table {
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              table-layout:fixed !important;
              border-collapse:collapse !important;
            }
            #estimateContent table thead { display:table-header-group !important; }
            #estimateContent table tbody,
            #estimateContent table tfoot { display:table-row-group !important; }
            #estimateContent table tr { display:table-row !important; }
            #estimateContent table th,
            #estimateContent table td {
              display:table-cell !important;
              padding:6px 4px !important;
              font-size:11px !important;
              line-height:1.35 !important;
              vertical-align:top !important;
              overflow-wrap:anywhere !important;
              word-break:break-word !important;
            }
            #estimateContent table input,
            #estimateContent table select {
              min-width:0 !important;
              width:100% !important;
              max-width:100% !important;
              min-height:38px !important;
              padding:5px 4px !important;
              font-size:11px !important;
            }
            #estimateContent table textarea {
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              min-height:72px !important;
              padding:6px !important;
              font-size:11px !important;
              line-height:1.4 !important;
              overflow-wrap:anywhere !important;
              word-break:break-word !important;
            }
            #estimateContent table th:nth-child(2),
            #estimateContent table td:nth-child(2) {
              font-size:10px !important;
            }
            #estimateContent table th:nth-child(3),
            #estimateContent table td:nth-child(3),
            #estimateContent table th:nth-child(4),
            #estimateContent table td:nth-child(4),
            #estimateContent table th:nth-child(5),
            #estimateContent table td:nth-child(5),
            #estimateContent table th:nth-child(6),
            #estimateContent table td:nth-child(6) {
              font-size:10px !important;
            }
          }
          '''

          for name in ['quotation/renovationplanner.html','quotation/buildplanner.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              marker='/* Mobile quotation — same table structure as desktop */'
              if marker not in s:
                  raise SystemExit(f'Mobile quotation block not found in {name}')
              start=s.index(marker)
              end=s.index('</style>', start)
              s=s[:start]+mobile_css+'\n\n'+s[end:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Shrink mobile quotation to screen [mobile-quotation]'
          git push
