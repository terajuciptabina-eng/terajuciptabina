name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect quotation layout
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['quotation/buildplanner.html','quotation/renovationplanner.html']:
              s=Path(name).read_text(encoding='utf-8')
              print('\n===== '+name+' =====')
              marker='/* Mobile quotation cards — single clean implementation */'
              i=s.find(marker)
              print('mobile marker index:', i)
              if i>=0:
                  print(s[i:i+9000])
              for key in ['detailed-quotation-table','function renderEstimate','function buildDetailed','function generateDetailed']:
                  j=s.find(key)
                  print('\nKEY',key,'index',j)
                  if j>=0: print(s[max(0,j-1800):j+5000])
          PY
      - name: Commit inspection workflow only
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/add-location-autocomplete.yml
          git commit -m 'Inspect quotation mobile layout [location-autocomplete]'
          git push
