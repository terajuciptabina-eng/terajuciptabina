name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[homeowner-delete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homeowner item delete permission
        run: |
          python - <<'PY'
          from pathlib import Path

          files=['quotation/buildplanner.html','quotation/renovationplanner.html']
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')

              # The Delete control itself must be visible to homeowners.
              s=s.replace('<td class="py-3 px-2 contractor-only"><button type="button" onclick="excludeItem', '<td class="py-3 px-2"><button type="button" onclick="excludeItem')
              s=s.replace('class="contractor-only text-red-600 text-xs border', 'class="text-red-600 text-xs border')

              # Editing remains contractor-only; only the existing delete/exclude action
              # is permitted for homeowners.
              s=s.replace('function excludeItem(id){if(!IS_CONTRACTOR)return;', 'function excludeItem(id){if(!IS_CONTRACTOR&&!isHomeowner())return;')
              s=s.replace('function excludeItem(itemId) {\n  if (!IS_CONTRACTOR) return;', 'function excludeItem(itemId) {\n  if (!IS_CONTRACTOR && !isHomeowner()) return;')

              p.write_text(s,encoding='utf-8')
              print('Patched',name)
          PY
      - name: Commit homeowner delete permission
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html quotation/renovationplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Allow homeowners to delete quotation items [homeowner-delete]'
          git push

# Temporary trigger/refinement for the existing planner files only.
