name: Add location autocomplete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-location-fields:
    if: "!contains(github.event.head_commit.message, '[location-autocomplete]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add planner helper scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['quotation/renovationplanner.html','quotation/buildplanner.html']
          tags=[
              '<script src="location-autocomplete.js"></script>',
              '<script src="quotation-quantity-fix.js?v=20260907"></script>'
          ]
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              changed=False
              for tag in tags:
                  base=tag.split('?')[0]
                  if base not in s:
                      s=s.replace('</body>', tag+'\n</body>',1)
                      changed=True
              if changed:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit planner updates
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo 'No planner changes needed.'
            exit 0
          fi
          git commit -m 'Add quotation quantity rounding [location-autocomplete]'
          git push
