name: Temporary Planner UI Run
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[planner-ui-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch planner UI
        run: |
          python - <<'PY'
          from pathlib import Path
          css='''/* TERAJU PLANNER UI REFRESH */\n@media screen{\n:root{--tp-ink:#111827;--tp-line:rgba(15,23,42,.10);--tp-shadow:0 18px 55px rgba(15,23,42,.10)}\nbody{background:linear-gradient(180deg,#f8fafc,#eef2f7);color:var(--tp-ink)}\nheader{background:rgba(255,255,255,.84)!important;border-bottom:1px solid var(--tp-line)!important;box-shadow:0 8px 30px rgba(15,23,42,.06)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;top:0;z-index:50}\nmain{max-width:1180px!important;margin:auto!important;padding-top:28px!important;padding-bottom:60px!important}\nmain>section{border:1px solid var(--tp-line)!important;border-radius:24px!important;box-shadow:var(--tp-shadow)!important;background:rgba(255,255,255,.94)!important;backdrop-filter:blur(14px)}\nmain>section:first-child{position:relative;overflow:hidden;min-height:250px;padding:42px!important;border:0!important;background-position:center!important;background-size:cover!important;color:#fff!important;display:flex;align-items:flex-end}\nmain>section:first-child>*{position:relative;z-index:1}\nmain>section:first-child h2{font-size:clamp(30px,5vw,52px)!important;line-height:1.02!important;letter-spacing:-.035em!important;text-shadow:0 8px 30px rgba(0,0,0,.25)}\nmain>section:first-child p{color:rgba(255,255,255,.84)!important;max-width:700px}\n.room-card{border:1px solid var(--tp-line)!important;border-radius:20px!important;background:linear-gradient(145deg,#fff,#f8fafc)!important;box-shadow:0 10px 30px rgba(15,23,42,.07)!important;transition:transform .2s ease,box-shadow .2s ease!important}\n.room-card:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(15,23,42,.11)!important}\n.optional-scope,.contractor-quotation-choice,.quotation-type-card{border-radius:16px!important;transition:transform .2s ease,box-shadow .2s ease!important}\n.optional-scope:hover,.contractor-quotation-choice:hover,.quotation-type-card:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(15,23,42,.08)!important}\n.quotation-generate-btn,.contractor-generate-btn{border-radius:14px!important;box-shadow:0 10px 24px rgba(15,23,42,.16)}\n#quotationDocument{border-radius:24px!important;box-shadow:0 20px 60px rgba(15,23,42,.12)!important}\n@media(max-width:767px){main{padding:18px 14px 42px!important}main>section{border-radius:20px!important}main>section:first-child{min-height:270px;padding:28px 20px!important;border-radius:20px!important}.room-card{border-radius:18px!important}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}\n}'''
          images={'quotation/buildplanner.html':"https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2200&q=88",'quotation/renovationplanner.html':"https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=88"}
          for f,img in images.items():
              p=Path(f); t=p.read_text(encoding='utf-8')
              if 'TERAJU PLANNER UI REFRESH' in t: continue
              block=css.replace('background-position:center!important;','background-image:linear-gradient(100deg,rgba(15,23,42,.90),rgba(15,23,42,.56)),url(\''+img+'\')!important;background-position:center!important;')
              i=t.find('</style>')
              if i<0: raise SystemExit('missing style tag: '+f)
              p.write_text(t[:i]+block+'\n'+t[i:],encoding='utf-8')
          PY
      - name: Commit full planner files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/buildplanner.html quotation/renovationplanner.html
          git commit -m "Refresh planner UI only [planner-ui-refresh]"
          git push origin main
