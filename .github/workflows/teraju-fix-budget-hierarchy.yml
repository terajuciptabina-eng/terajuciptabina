name: TERAJU Budget Hierarchy Source Fix
on:
  push:
    paths:
      - .github/workflows/teraju-fix-budget-hierarchy.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="function item(id,p,title,key,roomId='project',room='Project'){const r=rule(p);return{id,roomId,room,category:category(p),description:r?.[2]||p,unit:r?.[6]||'',qty:0,rate:rate(p),amount:0,groupTitle:title,groupKey:key,masterPath:p}}"
          new="function item(id,p,title,key,roomId='project',room='Project'){const r=rule(p);return{id,roomId,room,category:category(p),description:r?.[2]||p,unit:r?.[6]||'',qty:0,rate:rate(p),amount:0,groupTitle:title,groupKey:key,group:r?.[0]||'',masterPath:p}}"
          if old not in s:
              raise SystemExit('item target not found')
          s=s.replace(old,new,1)
          start=s.index('function renderBudget(){')
          end=s.index('\n function qData()',start)
          fn='''function renderBudget(){const c=document.getElementById('constructionBudgetContent');if(!c)return;const active=getMasterItems().filter(i=>typeof excludedItems==='undefined'||!excludedItems.has(i.id));if(!active.length){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Add rooms / areas to calculate the preliminary construction budget.</div>';return}const cats=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK'];const headerName=g=>({'PRELIMINARIES':'PRELIMINARIES','STRUCTURES':'STRUCTURAL WORKS','ARCHITECTURES':'ARCHITECTURAL WORKS','ELECTRICAL':'ELECTRICAL WORKS','DOORS & WINDOWS':'DOORS & WINDOWS','EXTERNAL WORK':'EXTERNAL WORKS'}[String(g||'').toUpperCase()]||String(g||'WORKS'));const parts=p=>String(p||'').split('/').map(x=>String(x).trim()).filter(Boolean);const hierarchy=i=>{const g=String(i.group||'').toUpperCase(),p=parts(i.masterPath);if(g==='ARCHITECTURES'&&i.roomId&&i.roomId!=='project'&&/^BATHROOM$/i.test(p[0]||''))return{header:'ARCHITECTURAL WORKS',sub:'BATHROOM',subsub:i.room||null};return{header:headerName(g),sub:p[0]||null,subsub:p.length>2?p[1]:null}};const rows=new Map,order=[];cats.forEach(g=>active.filter(i=>String(i.group||'').toUpperCase()===g).forEach(i=>{const z=hierarchy(i),k=z.header+'|'+(z.sub||'')+'|'+(z.subsub||'');if(!rows.has(k)){rows.set(k,{...z,items:[]});order.push(k)}rows.get(k).items.push(i)}));let no=1,h='<table class="w-full border-collapse text-sm cr-budget-table"><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Item</th><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>';let lastHeader='';order.forEach(k=>{const g=rows.get(k);if(g.header!==lastHeader){h+=`<tr class="cr-group-row"><td colspan="6">${esc(g.header)}</td></tr>`;lastHeader=g.header}if(g.sub)h+=`<tr class="cr-hierarchy-row cr-level-2"><td colspan="6">${esc(g.sub)}</td></tr>`;if(g.subsub)h+=`<tr class="cr-hierarchy-row cr-level-3"><td colspan="6">${esc(g.subsub)}</td></tr>`;g.items.forEach(i=>{h+=`<tr class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no++}</td><td class="py-2 px-2 cr-description">${esc(i.description)}</td><td class="py-2 px-2 cr-unit">${esc(i.unit)}</td><td class="py-2 px-2 text-right">${Math.ceil(N(i.qty))}</td><td class="py-2 px-2 text-right">${money(i.rate,2)}</td><td class="py-2 px-2 text-right font-semibold">${money(i.amount,2)}</td></tr>`})});const total=active.reduce((s,i)=>s+N(i.amount),0);h+=`</tbody><tfoot><tr class="border-t-2"><td colspan="5" class="py-4 px-2 text-right font-bold">TOTAL PRELIMINARY ESTIMATE</td><td class="py-4 px-2 text-right font-bold text-lg">RM ${money(total,2)}</td></tr></tfoot></table>`;c.innerHTML=h}'''
          s=s[:start]+fn+s[end:]
          s=s.replace('/* TERAJU ENGINE 20260920 */','/* TERAJU ENGINE 20260921 */',1)
          s=s.replace('[TERAJU MASTER 20260920]','[TERAJU MASTER 20260921]',1)
          p.write_text(s)
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          rm -f .github/workflows/teraju-fix-budget-hierarchy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js .github/workflows/teraju-fix-budget-hierarchy.yml
          git diff --cached --quiet && exit 0
          git commit -m 'TERAJU Build Planner: use Global UI hierarchy source'
          git push