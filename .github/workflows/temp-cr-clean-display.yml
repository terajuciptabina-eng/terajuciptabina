name: temp-cr-clean-display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: "!contains(github.event.head_commit.message, 'Clean Calculation Rules display')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean display hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/calculation-rules.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('const search=document.getElementById(\'search\');')
          end=s.index('</script>', start)
          old=s[start:end]
          new='''const search=document.getElementById('search');
          const group=document.getElementById('group');
          const sections=document.getElementById('sections');
          const summary=document.getElementById('summary');
          const empty=document.getElementById('empty');
          function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
          function parts(path){return path.split('/').map(x=>x.trim()).filter(Boolean);}
          function render(){
            const q=(search.value||'').trim().toLowerCase(), g=group.value;
            const filtered=rules.filter(r=>{const t=[r.group,r.path,r.description,r.method,r.ref,r.coeff,r.formula,r.output,r.basis,r.note].join(' ').toLowerCase();return(!q||t.includes(q))&&(g==='all'||r.group===g)});
            summary.textContent=`${filtered.length} calculation rules`;
            empty.classList.toggle('hidden',filtered.length>0);
            const groups=[];
            for(const r of filtered){
              const a=parts(r.path); const main=a[0]||''; const sub=a[1]||''; const item=a.slice(2).join(' / ');
              let G=groups.find(x=>x.name===r.group); if(!G){G={name:r.group,mains:[]};groups.push(G)}
              let M=G.mains.find(x=>x.name===main); if(!M){M={name:main,subs:[]};G.mains.push(M)}
              let S=M.subs.find(x=>x.name===sub); if(!S){S={name:sub,items:[]};M.subs.push(S)}
              S.items.push({...r,item});
            }
            sections.innerHTML=groups.map(G=>`<section class="section">
              <div class="section-head"><div class="group-heading">${esc(G.name)}</div><div class="count">${G.mains.reduce((n,m)=>n+m.subs.reduce((a,x)=>a+x.items.length,0),0)} rules</div></div>
              ${G.mains.map(M=>`<div class="hierarchy-block main-block"><div class="main-heading">${esc(M.name)}</div>
                ${M.subs.map(S=>`<div class="hierarchy-block sub-block"><div class="sub-heading">${esc(S.name)}</div>
                  <div class="table-wrap"><table class="rule-table"><thead><tr><th>Sub-sub Heading</th><th>Description</th><th>Method</th><th>Source / Reference</th><th>Conversion / Coefficient</th><th>Formula</th><th>Output</th><th>Explanation / Derivation</th></tr></thead><tbody>
                    ${S.items.map(r=>`<tr><td data-label="Sub-sub Heading" class="path">${esc(r.item)}</td><td data-label="Description" class="desc">${esc(r.description)}</td><td data-label="Method" class="method">${esc(r.method)}</td><td data-label="Source / Reference" class="ref">${esc(r.ref)}</td><td data-label="Conversion / Coefficient">${esc(r.coeff)}</td><td data-label="Formula" class="formula">${esc(r.formula)}</td><td data-label="Output">${esc(r.output)}</td><td data-label="Explanation / Derivation" class="note"><b>Source:</b> ${esc(r.ref)}<br><b>Derivation:</b> ${esc(r.basis)}<br><b>Rule:</b> ${esc(r.formula)}</td></tr>`).join('')}
                  </tbody></table></div>
                </div>`).join('')}
              </div>`).join('')}
            </section>`).join('');
          }
          search.addEventListener('input',render); group.addEventListener('change',render); render();
          '''
          s=s[:start]+new+s[end:]
          s=s.replace(".hierarchy{display:flex;flex-direction:column;gap:3px;min-width:0}.hierarchy .group-heading{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800}.hierarchy .main-heading{font-size:14px;font-weight:800}.hierarchy .sub-heading{font-size:13px;font-weight:700}.hierarchy .subsub-heading{font-size:13px;font-weight:600;color:var(--text)}", ".hierarchy-block{padding:16px 18px}.main-block{padding-top:18px}.sub-block{padding:14px 0 0 24px}.hierarchy .group-heading,.group-heading{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800}.main-heading{font-size:14px;font-weight:800}.sub-heading{font-size:13px;font-weight:700}")
          s=s.replace('GROUP MAIN HEADING','GROUP HEADING').replace('MAIN HEADING','MAIN HEADING').replace('SUB-SUB HEADING','Sub-sub Heading')
          s=s.replace('→','').replace('←','')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/temp-cr-clean-display.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/calculation-rules.html .github/workflows/temp-cr-clean-display.yml
          git commit -m "Clean Calculation Rules display"
          git push
