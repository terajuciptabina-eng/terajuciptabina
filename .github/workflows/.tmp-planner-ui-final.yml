name: Temporary Planner UI Final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[planner-ui-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct hero image syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs=[
          ("url(url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2200&q=88'))!important","url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2200&q=88')!important"),
          ("url(url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=88'))!important","url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=88')!important")]
          for f in ['quotation/buildplanner.html','quotation/renovationplanner.html']:
            p=Path(f); t=p.read_text(encoding='utf-8')
            for a,b in pairs: t=t.replace(a,b)
            p.write_text(t,encoding='utf-8')
          PY
      - name: Commit planner files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/buildplanner.html quotation/renovationplanner.html
          git diff --cached --quiet && exit 0
          git commit -m "Correct planner hero CSS [planner-ui-final]"
          git push origin main
