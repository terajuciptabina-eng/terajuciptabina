name: Temp Fix Calculation Rules Script
on:
  push:
    paths:
      - '.github/workflows/temp-fix-cr-script.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate script tag and clean duplicate note CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/calculation-rules.html')
          s = p.read_text()
          s = s.replace('<script>\n<script>\nconst rules=', '<script>\nconst rules=', 1)
          s = s.replace('.note{min-width:360px;line-height:1.5}.note{min-width:360px;line-height:1.5}', '.note{min-width:360px;line-height:1.5}', 1)
          s = s.replace('\n.github/workflows/temp-fix-cr-script.yml\n', '\n', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/calculation-rules.html .github/workflows/temp-fix-cr-script.yml
          git commit -m 'Fix Calculation Rules rendering' || exit 0
          git rm .github/workflows/temp-fix-cr-script.yml
          git commit -m 'Remove temporary Calculation Rules workflow'
          git push
