name: One-time description wrap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply description wrapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          marker='/* V2 description wrap */'
          if marker not in s:
              needle='.cr-description{font-weight:600;line-height:1.45}'
              add='/* V2 description wrap */\n.cr-budget-table .cr-description{white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;line-height:1.45!important;vertical-align:top!important}\n.cr-budget-table td:nth-child(2){white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;vertical-align:top!important}'
              if needle not in s:
                  raise SystemExit('Target CSS marker not found')
              s=s.replace(needle, needle+'\n'+add, 1)
              p.write_text(s)
          else:
              print('Description wrap already present')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/buildplanner-v2.html
          git diff --cached --quiet || git commit -m "Wrap Build Planner description text"
          git push
