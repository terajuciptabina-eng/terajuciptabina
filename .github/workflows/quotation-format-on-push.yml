name: Apply quotation formatting
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore Build Planner and format quotations
        shell: bash
        run: |
          set -e
          git show 22526dea35d5807a3f74e5ceb6c5e635027404c5:quotation/buildplanner.html > quotation/buildplanner.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner.html'); s=p.read_text()
          s=s.replace('Rooms / Areas','Areas').replace('+ Add Room','+ Add Area').replace('Add each room or area.','Add each area.').replace('Select the room type and enter the floor area in sqft.','Select the area type and enter the floor area in sqft.').replace('Your room selections are used','Your area selections are used')
          css='''\n.simple-quotation-table,.detailed-quotation-table{width:100%!important;table-layout:fixed!important;border-collapse:collapse!important}.simple-quotation-table col:nth-child(1){width:6%!important}.simple-quotation-table col:nth-child(2){width:18%!important}.simple-quotation-table col:nth-child(3){width:56%!important}.simple-quotation-table col:nth-child(4){width:20%!important}.detailed-quotation-table col:nth-child(1){width:48%!important}.detailed-quotation-table col:nth-child(2){width:10%!important}.detailed-quotation-table col:nth-child(3){width:10%!important}.detailed-quotation-table col:nth-child(4){width:16%!important}.detailed-quotation-table col:nth-child(5){width:16%!important}.quotation-section-row td{background:#f3f4f6;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-top:1px solid #d1d5db}.quotation-subsection-row td{background:#fafafa;font-weight:700;color:#374151}\n'''
          s=s.replace('</style>',css+'</style>',1)
          js=r'''<script>(function(){function M(v){return new Intl.NumberFormat('en-MY',{style:'currency',currency:'MYR',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)}function E(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}function Q(v,u){let n=Number(v)||0;return ['no','set','ls','unit'].includes(String(u||'').toLowerCase())?Math.round(n):(Number.isInteger(n)?n:Math.round(n*100)/100)}window.generateQuotation=function(){const r=getRoomGroups(),d=getCurrentQuotationData();if(!r.some(x=>x.area>0)){alert('Please add at least one area with a valid area before generating the quotation.');return}quotationNumber=generateQuotationNumber();const c=document.getElementById('customerName')?.value||'Not specified',l=document.getElementById('projectLocation')?.value||'Not specified',ba=parseFloat(document.getElementById('builtUpArea')?.value)||0,ra=r.reduce((s,x)=>s+(x.area||0),0),st=document.getElementById('numStoreys')?.value||'1',dt=new Intl.DateTimeFormat('en-MY',{day:'2-digit',month:'long',year:'numeric'}).format(new Date()),C=document.getElementById('quotationContent'),G=[['Preliminaries',d.prelim],['Structural Works',d.structures],['Architectural Works',d.rooms.flatMap(x=>d.archByRoom[x.roomId]||[])],['Electrical Works',d.electrical]].filter(x=>x[1].length);let h='<div class="flex justify-between items-start gap-6 border-b pb-5 mb-6"><div><div class="flex items-center gap-4 mb-4"><img src="../images/logo.png" class="h-14 w-auto"><div><h1 class="text-xl font-bold">TERAJU CIPTABINA RESOURCES</h1><p class="text-xs text-gray-500">No 10A, Jalan PP 2/1, Taman Putra Prima, 47100 Puchong, Selangor</p></div></div><h2 class="text-2xl font-bold uppercase">Quotation</h2></div><div class="text-right text-sm"><p>Quotation No.<br><strong>'+E(quotationNumber)+'</strong></p><p class="mt-2">Date<br><strong>'+dt+'</strong></p></div></div><div class="grid md:grid-cols-3 gap-6 mb-7 text-sm"><div><p class="text-xs uppercase text-gray-500">Customer</p><p class="font-semibold">'+E(c)+'</p></div><div><p class="text-xs uppercase text-gray-500">Project Location</p><p class="font-semibold">'+E(l)+'</p></div><div><p class="text-xs uppercase text-gray-500">Built-up Area</p><p class="font-semibold">'+Q(ba)+' sqft · '+st+' storey<br>'+Q(ra)+' sqft areas</p></div></div>';const type=getSelectedQuotationType();if(type==='simple'){h+='<div class="overflow-x-auto"><table class="simple-quotation-table"><colgroup><col style="width:6%"><col style="width:18%"><col style="width:56%"><col style="width:20%"></colgroup><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">No.</th><th class="py-3 px-2">Work Section</th><th class="py-3 px-2">Description of Works</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>';let n=1;G.forEach(g=>{let t=g[1].reduce((a,i)=>a+i.amount,0);h+='<tr class="quotation-section-row"><td class="py-3 px-2">'+n+++'</td><td class="py-3 px-2">'+E(g[0])+'</td><td class="py-3 px-2">'+g[1].map(i=>E(i.description)).join('<br>')+'</td><td class="py-3 px-2 text-right font-semibold">'+M(t)+'</td></tr>'});h+='</tbody><tfoot><tr class="border-t-2"><td colspan="3" class="py-4 px-2 text-right font-bold">TOTAL</td><td class="py-4 px-2 text-right font-bold text-lg">'+M(d.total)+'</td></tr></tfoot></table></div>'}else{h+='<div class="overflow-x-auto"><table class="detailed-quotation-table"><colgroup><col style="width:48%"><col style="width:10%"><col style="width:10%"><col style="width:16%"><col style="width:16%"></colgroup><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>';G.forEach(g=>{h+='<tr class="quotation-section-row"><td colspan="5" class="py-3 px-2">'+E(g[0])+'</td></tr>';if(g[0]==='Architectural Works'){r.forEach(x=>{let a=d.archByRoom[x.roomId]||[];if(!a.length)return;h+='<tr class="quotation-subsection-row"><td colspan="5" class="py-2 px-2">'+E(x.label)+' <span class="font-normal">('+Q(x.area)+' sqft)</span></td></tr>';a.forEach(i=>h+='<tr class="border-b align-top"><td class="py-3 px-2">'+E(i.description)+'</td><td class="py-3 px-2">'+E(i.unit)+'</td><td class="py-3 px-2 text-right">'+Q(i.qty,i.unit)+'</td><td class="py-3 px-2 text-right">'+M(i.rate)+'</td><td class="py-3 px-2 text-right font-medium">'+M(i.amount)+'</td></tr>')})}else g[1].forEach(i=>h+='<tr class="border-b align-top"><td class="py-3 px-2">'+E(i.description)+'</td><td class="py-3 px-2">'+E(i.unit)+'</td><td class="py-3 px-2 text-right">'+Q(i.qty,i.unit)+'</td><td class="py-3 px-2 text-right">'+M(i.rate)+'</td><td class="py-3 px-2 text-right font-medium">'+M(i.amount)+'</td></tr>')});h+='</tbody><tfoot><tr class="border-t-2"><td colspan="4" class="py-4 px-2 text-right font-bold">TOTAL</td><td class="py-4 px-2 text-right font-bold text-lg">'+M(d.total)+'</td></tr></tfoot></table></div>'}h+='<div class="mt-8 pt-5 border-t text-sm"><p class="font-semibold mb-2">Terms / Notes</p><ul class="list-disc pl-5 space-y-1 text-gray-600"><li>This quotation is based on the stated built-up area, area schedule and rates applied herein.</li><li>Final scope, specifications, site conditions and pricing remain subject to site inspection and written confirmation.</li><li>Any additional works or authority requirements not listed above shall be quoted separately.</li></ul></div><div class="mt-12 text-sm"><p>Yours sincerely,</p><p class="font-bold mt-8">TERAJU CIPTABINA RESOURCES</p></div>';C.innerHTML=h;document.getElementById('quotationDocument').classList.remove('hidden');document.getElementById('quotationPrintActions').classList.remove('hidden');document.getElementById('quotationDocument').scrollIntoView({behavior:'smooth',block:'start'})}})()</script>'''
          s=s.replace('</body>',js+'</body>')
          p.write_text(s)
          PY
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html
          git commit -m 'Restore and standardize Build Planner quotation format' || true
          git push
          rm -f .github/workflows/quotation-format-on-push.yml .github/workflows/fix-quotation-format.yml
          git add -A .github/workflows/quotation-format-on-push.yml .github/workflows/fix-quotation-format.yml
          git commit -m 'Remove temporary quotation format workflows' || true
          git push
