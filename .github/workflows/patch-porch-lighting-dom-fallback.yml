name: One-time Porch Lighting DOM fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[porch-lighting-fallback]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch engine scope fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          old="function scope(){const rs=rooms(),porch=rs.filter(r=>String(r.roomType||'').trim().toLowerCase()==='porch'),main=rs.filter(r=>String(r.roomType||'').trim().toLowerCase()!=='porch'),A=main.reduce((s,r)=>s+N(r.area),0)||N(document.getElementById('builtUpArea')?.value),B=porch.reduce((s,r)=>s+N(r.area),0);return{rs,main,porch,A,B}}"
          new="function scope(){const rs=rooms(),domRooms=[...document.querySelectorAll('#roomsContainer .room-card')].map(r=>({roomId:r.id,roomType:r.querySelector('.room-type')?.value||'',area:parseFloat(r.querySelector('.room-area')?.value)||0,label:r.querySelector('.room-type')?.selectedOptions?.[0]?.textContent||''})),all=rs.length?rs:domRooms,porch=all.filter(r=>String(r.roomType||'').trim().toLowerCase()==='porch'),main=all.filter(r=>String(r.roomType||'').trim().toLowerCase()!=='porch'),A=main.reduce((s,r)=>s+N(r.area),0)||N(document.getElementById('builtUpArea')?.value),B=porch.reduce((s,r)=>s+N(r.area),0);return{rs:all,main,porch,A,B}}"
          if old not in s: raise SystemExit('Expected original scope function not found')
          if new in s: print('DOM fallback already applied.')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Refresh cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text(encoding='utf-8')
          for old,new in [('quotation-quantity-fix.js?v=20260923','quotation-quantity-fix.js?v=20260925'),('quotation-quantity-fix.js?v=20260924','quotation-quantity-fix.js?v=20260925')]:
              if old in s:
                  s=s.replace(old,new,1)
                  break
          else:
              raise SystemExit('Expected Build Planner engine cache key not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-porch-lighting-dom-fallback.yml quotation/porch-lighting-patch-trigger.txt
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js quotation/buildplanner-v2.html .github/workflows/patch-porch-lighting-dom-fallback.yml quotation/porch-lighting-patch-trigger.txt
          git commit -m 'Fix Porch Lighting quantity fallback [porch-lighting-fallback]'
          git push
