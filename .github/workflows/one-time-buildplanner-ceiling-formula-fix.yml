name: One-time Build Planner ceiling formula fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CEILING formula support to master evaluator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          old1="e=e.replace(/m²|m³|kg|sqft|per\\s+project/gi,'').replace(/×/g,'*').replace(/÷/g,'/');"
          new1="e=e.replace(/m²|m³|kg|sqft|per\\s+project/gi,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/\\bCEILING\\s*\\(/gi,'ceil(');"
          old2="if(!/^[0-9+\\-*/().\\s]+$/.test(e))return null;try{return N(Function('\\\"use strict\\\";return('+e+')')())}catch{return null}"
          new2="if(!/^[0-9+\\-*/().\\s]+$/.test(e.replace(/\\bceil\\s*\\(/gi,'').replace(/\\)/g,'')))return null;try{return N(Function('ceil','\\\"use strict\\\";return('+e+')')(Math.ceil))}catch{return null}"
          if old1 not in s:
              raise SystemExit('Evaluator normalization target not found')
          if old2 not in s:
              raise SystemExit('Evaluator validation target not found')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: support CEILING in calculation formulas'
          git rm .github/workflows/one-time-buildplanner-ceiling-formula-fix.yml
          git commit -m 'Remove one-time ceiling formula workflow'
          git push
