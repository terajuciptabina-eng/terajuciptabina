name: Repair Build Planner Area UI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[buildplanner-area-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd6b40623be24c191c428ef7b45976dfc2296241
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore known-good Build Planner and rename Rooms to Areas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/buildplanner.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Rooms / Areas', 'Areas')
          s = s.replace('Add each room or area.', 'Add each area.')
          s = s.replace('Select the room type and enter the floor area in sqft.', 'Select the area type and enter the floor area in sqft.')
          s = s.replace('+ Add Room', '+ Add Area')
          s = s.replace('buildplanner-payment.js</script>', 'buildplanner-payment.js</script>')
          # Ensure the current helper scripts are loaded with cache-busting.
          import re
          s = re.sub(r'<script src="buildplanner-payment\.js(?:\?[^\"]*)?"></script>', '<script src="buildplanner-payment.js?v=20260907"></script>', s)
          if 'location-autocomplete.js' not in s:
              s = s.replace('</body>', '<script src="location-autocomplete.js"></script>\n</body>', 1)
          if 'quotation-quantity-fix.js' not in s:
              s = s.replace('</body>', '<script src="quotation-quantity-fix.js?v=20260907"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired Build Planner
        shell: bash
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html
          git commit -m 'Repair Build Planner and rename areas [buildplanner-area-repair]' || exit 0
          git push origin HEAD:main
