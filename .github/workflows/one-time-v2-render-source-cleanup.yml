name: one-time-v2-render-source-cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Arm one-time V2 renderer source cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate renderer ownership
        shell: python
        run: |
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          old_ready="const ready=typeof getAllItems==='function';"
          new_ready="const ready=window.__TERAJU_MASTER_ENGINE_ACTIVE===true&&typeof window.getAllItems==='function';"
          if old_ready not in s:
              raise SystemExit('V2 readiness marker not found')
          s=s.replace(old_ready,new_ready,1)
          old_all="const all=(typeof getAllItems==='function'?getAllItems():[]),active=all.filter(i=>!(typeof excludedItems!=='undefined'&&excludedItems.has(i.id)));"
          new_all="const all=window.getAllItems(),active=all.filter(i=>!(typeof excludedItems!=='undefined'&&excludedItems.has(i.id)));"
          if old_all not in s:
              raise SystemExit('V2 master item access marker not found')
          s=s.replace(old_all,new_all,1)
          old_save="const item=(typeof getAllItems==='function'?getAllItems():[]).find(x=>x.id===id);"
          new_save="const item=(typeof window.getAllItems==='function'?window.getAllItems():[]).find(x=>x.id===id);"
          if old_save not in s:
              raise SystemExit('V2 save item marker not found')
          s=s.replace(old_save,new_save,1)
          start=s.find('function renderConstructionBudget(){')
          end=s.find('function budgetRow(',start)
          if start<0 or end<0:
              raise SystemExit('Legacy renderer boundaries not found')
          delegate="function renderConstructionBudget(){if(typeof window.renderConstructionBudget==='function'&&window.renderConstructionBudget!==renderConstructionBudget)return window.renderConstructionBudget();}"
          s=s[:start]+delegate+s[end:]
          p.write_text(s,encoding='utf-8')
          print('cleaned',p)
      - name: Validate source
        shell: python
        run: |
          from pathlib import Path
          s=Path('quotation/quotation-quantity-fix.js').read_text(encoding='utf-8')
          assert "const ready=window.__TERAJU_MASTER_ENGINE_ACTIVE===true&&typeof window.getAllItems==='function';" in s
          assert "const all=window.getAllItems(),active=" in s
          assert "function renderConstructionBudget(){if(typeof window.renderConstructionBudget==='function'" in s
          print('source validation passed')
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/quotation-quantity-fix.js
          git commit -m "Use master renderer ownership in Build Planner V2"
          git push
      - name: Remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-v2-render-source-cleanup.yml
          git add .github/workflows/one-time-v2-render-source-cleanup.yml
          git commit -m "Remove one-time V2 renderer cleanup workflow"
          git push
