name: one-time-v2-render-source-cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Arm one-time V2 renderer source cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transform source
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='quotation/quotation-quantity-fix.js';
          let s=fs.readFileSync(p,'utf8');
          const a="const ready=typeof getAllItems==='function';";
          const b="const ready=window.__TERAJU_MASTER_ENGINE_ACTIVE===true&&typeof window.getAllItems==='function';";
          const c="const all=(typeof getAllItems==='function'?getAllItems():[]),active=";
          const d="const all=window.getAllItems(),active=";
          const e="const item=(typeof getAllItems==='function'?getAllItems():[]).find(x=>x.id===id);";
          const f="const item=(typeof window.getAllItems==='function'?window.getAllItems():[]).find(x=>x.id===id);";
          if(!s.includes(a)) throw new Error('V2 readiness source pattern not found');
          s=s.replace(a,b).replace(c,d).replace(e,f);
          fs.writeFileSync(p,s);
          NODE
          git diff --check
          grep -q "const ready=window.__TERAJU_MASTER_ENGINE_ACTIVE===true&&typeof window.getAllItems==='function';" quotation/quotation-quantity-fix.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/quotation-quantity-fix.js
          git commit -m "Use master engine readiness in Build Planner V2"
          git push
      - name: Remove workflow
        run: |
          rm -f .github/workflows/one-time-v2-render-source-cleanup.yml
          git add .github/workflows/one-time-v2-render-source-cleanup.yml
          git commit -m "Remove one-time V2 renderer cleanup workflow"
          git push

