name: one-time-v2-render-source-cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Arm one-time V2 renderer source cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate renderer ownership
        shell: python
        run: |
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const ready=typeof getAllItems==='function';","const ready=window.__TERAJU_MASTER_ENGINE_ACTIVE===true&&typeof window.getAllItems==='function';",1)
          s=s.replace("const all=(typeof getAllItems==='function'?getAllItems():[]),active=all.filter(i=>!(typeof excludedItems!=='undefined'&&excludedItems.has(i.id)));","const all=window.getAllItems(),active=all.filter(i=>!(typeof excludedItems!=='undefined'&&excludedItems.has(i.id)));",1)
          s=s.replace("const item=(typeof getAllItems==='function'?getAllItems():[]).find(x=>x.id===id);","const item=(typeof window.getAllItems==='function'?window.getAllItems():[]).find(x=>x.id===id);",1)
          start=s.find('function renderConstructionBudget(){')
          end=s.find('function budgetRow(',start)
          if start>=0 and end>start and 'window.renderConstructionBudget!==renderConstructionBudget' not in s[start:end]:
              s=s[:start]+"function renderConstructionBudget(){if(typeof window.renderConstructionBudget==='function'&&window.renderConstructionBudget!==renderConstructionBudget)return window.renderConstructionBudget();}"+s[end:]
          p.write_text(s,encoding='utf-8')
          assert "const ready=window.__TERAJU_MASTER_ENGINE_ACTIVE===true&&typeof window.getAllItems==='function';" in s
          assert "const all=window.getAllItems(),active=" in s
          assert "function renderConstructionBudget(){if(typeof window.renderConstructionBudget==='function'" in s
          print('source cleanup validation passed')
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/quotation-quantity-fix.js
          git commit -m "Use master renderer ownership in Build Planner V2"
          git push
      - name: Remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-v2-render-source-cleanup.yml
          git add .github/workflows/one-time-v2-render-source-cleanup.yml
          git commit -m "Remove one-time V2 renderer cleanup workflow"
          git push
