name: one-time-v2-cache-bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Refresh Build Planner V2 master asset URL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='terajuciptabina-eng',repo='terajuciptabina',path='quotation/buildplanner-v2.html',branch='main';
            const f=await github.rest.repos.getContent({owner,repo,path,ref:branch});
            const s=Buffer.from(f.data.content,'base64').toString('utf8');
            const old='quotation-quantity-fix.js?v=20260918-r1';
            const neu='quotation-quantity-fix.js?v=20260918-r2';
            if(!s.includes(old))throw new Error('Expected V2 master asset URL not found; refusing edit');
            const content=Buffer.from(s.replace(old,neu)).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Refresh Build Planner V2 master asset URL',content,sha:f.data.sha,branch});
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='terajuciptabina-eng',repo='terajuciptabina',path='.github/workflows/one-time-v2-cache-bust.yml',branch='main';
            const f=await github.rest.repos.getContent({owner,repo,path,ref:branch});
            await github.rest.repos.deleteFile({owner,repo,path,message:'Remove one-time Build Planner V2 cache refresh',sha:f.data.sha,branch});