name: one-time-v2-cache-bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version V2 master engine asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old='quotation-quantity-fix.js?v=20261001'
          new='quotation-quantity-fix.js?v=20260918-r1'
          if s.count(old)!=1:
            raise SystemExit(f'Expected exactly one V2 engine asset URL, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('Updated Build Planner V2 master engine cache key')
          PY
          git diff --check
      - name: Commit cache-bust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/buildplanner-v2.html
          git commit -m "Refresh Build Planner V2 engine asset"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-v2-cache-bust.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-v2-cache-bust.yml
          git diff --cached --quiet || git commit -m "Remove one-time V2 cache bust workflow"
          git push
