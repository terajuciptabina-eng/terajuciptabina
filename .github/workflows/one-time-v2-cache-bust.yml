name: One-time V2 cache bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Arm one-time V2 cache bust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump V2 master engine URL version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old="tag.src='quotation-quantity-fix.js?v=20260930';"
          new="tag.src='quotation-quantity-fix.js?v=20261001';"
          if old not in s:
              raise SystemExit('Expected V2 master engine URL not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m 'Refresh Build Planner V2 master engine cache'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/one-time-v2-cache-bust.yml
          git commit -m 'Remove one-time V2 cache bust workflow'
          git push
