name: One-time Build Planner porch dependency fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix porch structural dependency resolution at source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="const labels=[...RULES.keys()].map(x=>x.split('/').slice(-2).map(NOR).join(' ')).sort((x,y)=>y.length-x.length);"
          new="const labels=[...RULES.keys()].flatMap(x=>{const a=x.split('/').map(NOR);return [a.slice(-3).join(' '),a.slice(-2).join(' ')].filter(Boolean)}).sort((x,y)=>y.length-x.length);"
          if old not in s:
              raise SystemExit('Target dependency label source not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: resolve porch structural dependencies'
          git rm .github/workflows/one-time-buildplanner-porch-rebar-dependency.yml
          git commit -m 'Remove one-time porch dependency workflow'
          git push
