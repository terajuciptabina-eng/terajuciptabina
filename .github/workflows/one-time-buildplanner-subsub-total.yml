name: One-time Build Planner sub-sub totals

on:
  push:
    paths:
      - '.github/workflows/one-time-buildplanner-subsub-total.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Build Planner render source
        shell: python
        run: |
          from pathlib import Path
          p = Path('quotation/quotation-quantity-fix.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('function renderBudget(){')
          i = start + len('function renderBudget(){')
          depth = 1
          quote = None
          esc = False
          while i < len(s) and depth:
              c = s[i]
              if quote:
                  if esc:
                      esc = False
                  elif c == '\\\\':
                      esc = True
                  elif c == quote:
                      quote = None
              else:
                  if c in ('"', "'", '`'):
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
              i += 1
          if depth:
              raise SystemExit('renderBudget function boundary not found')

          new_fn = r'''function renderBudget(){
          const c=document.getElementById('constructionBudgetContent');
          if(!c)return;
          const active=getMasterItems().filter(i=>typeof excludedItems==='undefined'||!excludedItems.has(i.id));
          if(!active.length){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Add rooms / areas to calculate the preliminary construction budget.</div>';return}
          const cats=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK'];
          const headerName=g=>({'PRELIMINARIES':'PRELIMINARIES','STRUCTURES':'STRUCTURAL WORKS','ARCHITECTURES':'ARCHITECTURAL WORKS','ELECTRICAL':'ELECTRICAL WORKS','DOORS & WINDOWS':'DOORS & WINDOWS','EXTERNAL WORK':'EXTERNAL WORKS'}[String(g||'').toUpperCase()]||String(g||''));
          const parts=p=>String(p||'').split('/').map(x=>String(x).trim()).filter(Boolean);
          const hierarchy=i=>{const g=String(i.group||'').toUpperCase(),p=parts(i.masterPath);if(g==='ARCHITECTURES'&&i.roomId&&i.roomId!=='project'&&/^BATHROOM$/i.test(p[0]||''))return{header:'ARCHITECTURAL WORKS',sub:'BATHROOM',subsub:i.room||null};if(g==='EXTERNAL WORK')return{header:'EXTERNAL WORKS',sub:'EXTERNAL WORK',subsub:p[0]||null};return{header:headerName(g),sub:p[0]||null,subsub:p.length>2?p[1]:null};};
          const tree=[];
          cats.forEach(g=>{const items=active.filter(i=>String(i.group||'').toUpperCase()===g);if(!items.length)return;const bySub=new Map;items.forEach(i=>{const z=hierarchy(i),sk=z.sub||'';if(!bySub.has(sk))bySub.set(sk,{header:z.header,sub:z.sub,levels:new Map,noLevel3:[]});const node=bySub.get(sk);if(z.subsub){if(!node.levels.has(z.subsub))node.levels.set(z.subsub,[]);node.levels.get(z.subsub).push(i)}else node.noLevel3.push(i)});tree.push(...bySub.values())});
          let no=1,h='<table class="w-full border-collapse text-sm cr-budget-table"><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Item</th><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>';
          tree.forEach(node=>{
              h+=`<tr class="cr-budget-header"><td colspan="6" class="py-3 px-2 font-bold">${esc(node.header)}</td></tr>`;
              if(node.sub)h+=`<tr class="cr-budget-subheader"><td colspan="6" class="py-2 px-2 font-semibold">${esc(node.sub)}</td></tr>`;
              node.levels.forEach((list,label)=>{
                  const total=R2(list.reduce((sum,i)=>sum+N(i.amount),0));
                  h+=`<tr class="cr-budget-subsubheader"><td colspan="6" class="py-2 px-2 font-semibold">${esc(label)}</td></tr>`;
                  list.forEach(i=>{h+=`<tr class="border-b"><td class="py-2 px-2">${no++}</td><td class="py-2 px-2">${esc(i.description)}</td><td class="py-2 px-2">${esc(i.unit)}</td><td class="py-2 px-2 text-right">${money(i.qty)}</td><td class="py-2 px-2 text-right">${money(i.rate)}</td><td class="py-2 px-2 text-right">${money(i.amount)}</td></tr>`});
                  h+=`<tr class="cr-budget-subsub-total"><td colspan="5" class="py-2 px-2 text-right font-semibold">TOTAL ${esc(label)}</td><td class="py-2 px-2 text-right font-bold">RM ${money(total)}</td></tr>`;
              });
              node.noLevel3.forEach(i=>{h+=`<tr class="border-b"><td class="py-2 px-2">${no++}</td><td class="py-2 px-2">${esc(i.description)}</td><td class="py-2 px-2">${esc(i.unit)}</td><td class="py-2 px-2 text-right">${money(i.qty)}</td><td class="py-2 px-2 text-right">${money(i.rate)}</td><td class="py-2 px-2 text-right">${money(i.amount)}</td></tr>`});
          });
          h+='</tbody></table>';
          c.innerHTML=h;
          const total=active.reduce((s,i)=>s+N(i.amount),0);
          const totalEl=document.getElementById('constructionBudgetTotal');
          if(totalEl)totalEl.textContent=`RM ${money(total)}`;
          if(typeof updateEstimate==='function')updateEstimate();
      }'''
          new_fn = ' '.join(new_fn.splitlines())
          s = s[:start] + new_fn + s[i:]
          s = s.replace('/* TERAJU ENGINE 20260921 */','/* TERAJU ENGINE 20260922 */',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate source
        run: |
          node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/quotation-quantity-fix.js
          git commit -m "TERAJU Build Planner: add sub-sub header total amounts"
          git rm .github/workflows/one-time-buildplanner-subsub-total.yml
          git commit -m "Remove one-time Build Planner total workflow"
          git push

# retrigger after workflow creation
