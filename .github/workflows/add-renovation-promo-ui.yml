name: Add Renovation Promo UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-renovation:
    if: "!contains(github.event.head_commit.message, '[renovation-promo-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Standardize quotation promo UI, card sizing, and homeowner defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          homeowner_default_script = '''<script id="tc-homeowner-customer-default">
          (() => {
            const params = new URLSearchParams(location.search);
            const role = (params.get('audience') || document.body.dataset.role || 'homeowner').toLowerCase();
            if (role !== 'homeowner' || params.get('quotationId')) return;
            const storageKey = 'teraju.homeowner.github.v1';
            function applyHomeownerName() {
              const input = document.getElementById('customerName');
              if (!input || input.value.trim()) return;
              try {
                const account = JSON.parse(localStorage.getItem(storageKey) || 'null');
                const name = String(account?.profile?.name || '').trim();
                if (!name) return;
                input.value = name;
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
              } catch {}
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyHomeownerName, { once: true });
            else applyHomeownerName();
          })();
          </script>'''

          for filename in ('quotation/renovationplanner.html', 'quotation/buildplanner.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('        <em>~~RM49~~ FREE during promotion</em>\n', '')
              text = text.replace('        <em>Included with Detailed Quotation</em>\n', '')
              text = text.replace('~~RM49~~ FREE during promotion', '')
              text = text.replace('min-height:112px}', '}')
              if 'id="tc-homeowner-customer-default"' not in text:
                  marker = '</body>'
                  if marker not in text:
                      raise SystemExit(f'Could not find </body> in {filename}')
                  text = text.replace(marker, homeowner_default_script + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')

          path = Path('quotation/renovationplanner.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="detailed-quotation-promo-ui.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in renovationplanner.html')
              text = text.replace(marker, tag + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Apply homeowner quotation defaults [renovation-promo-ui]"
          git push origin main
