name: Add Renovation Promo UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-renovation:
    if: "!contains(github.event.head_commit.message, '[renovation-promo-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Standardize quotation promo UI, card sizing, homeowner defaults, and GA4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          homeowner_default_script = '''<script id="tc-homeowner-customer-default">
          (() => {
            const params = new URLSearchParams(location.search);
            const role = (params.get('audience') || document.body.dataset.role || 'homeowner').toLowerCase();
            if (role !== 'homeowner' || params.get('quotationId')) return;
            const storageKey = 'teraju.homeowner.github.v1';
            function applyHomeownerName() {
              const input = document.getElementById('customerName');
              if (!input || input.value.trim()) return;
              try {
                const account = JSON.parse(localStorage.getItem(storageKey) || 'null');
                const name = String(account?.profile?.name || '').trim();
                if (!name) return;
                input.value = name;
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('change', { bubbles: true }));
              } catch {}
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyHomeownerName, { once: true });
            else applyHomeownerName();
          })();
          </script>'''

          ga4_script = '''<script id="tc-teraju-ga4">
          (() => {
            const MEASUREMENT_ID = 'G-50XR3XER7B';
            const path = location.pathname.toLowerCase();
            const params = new URLSearchParams(location.search);
            const role = (params.get('audience') || document.body.dataset.role || '').toLowerCase();
            const plannerType = path.includes('renovationplanner') ? 'renovation' : path.includes('buildplanner') ? 'build' : '';
            window.dataLayer = window.dataLayer || [];
            window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };
            window.gtag('js', new Date());
            window.gtag('config', MEASUREMENT_ID, { send_page_view: true });
            const send = (name, extra = {}) => {
              try { window.gtag('event', name, Object.fromEntries(Object.entries(extra).filter(([,v]) => v !== undefined && v !== ''))); } catch {}
            };
            window.TERAJU_GA_EVENT = send;
            const base = { role: role || undefined, planner_type: plannerType || undefined, page_path: location.pathname };
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(MEASUREMENT_ID);
            document.head.appendChild(script);
            if (path.endsWith('/homeowner.html') || path.endsWith('/contractor.html')) send('app_open', base);
            if (plannerType) send('planner_start', base);

            if (path.endsWith('/quotations.html')) {
              document.addEventListener('click', event => {
                const link = event.target.closest?.('a[data-ga-quotation-opened]');
                if (!link) return;
                send('quotation_opened', {
                  role: link.dataset.gaRole || role || undefined,
                  planner_type: link.dataset.gaPlannerType || undefined,
                  quotation_id: link.dataset.gaQuotationId || undefined,
                  quotation_number: link.dataset.gaQuotationNumber || undefined,
                  quotation_type: link.dataset.gaQuotationType || undefined,
                  page_path: location.pathname
                });
              }, true);
            }
          })();
          </script>'''

          for filename in ('quotation/renovationplanner.html', 'quotation/buildplanner.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('        <em>~~RM49~~ FREE during promotion</em>\n', '')
              text = text.replace('        <em>Included with Detailed Quotation</em>\n', '')
              text = text.replace('~~RM49~~ FREE during promotion', '')
              text = text.replace('min-height:112px}', '}')
              if 'id="tc-homeowner-customer-default"' not in text:
                  marker = '</body>'
                  if marker not in text: raise SystemExit(f'Could not find </body> in {filename}')
                  text = text.replace(marker, homeowner_default_script + '\n' + marker, 1)
              text = re.sub(r'<script id="tc-teraju-ga4">.*?</script>', ga4_script, text, count=1, flags=re.S)
              if 'id="tc-teraju-ga4"' not in text:
                  marker = '</body>'
                  if marker not in text: raise SystemExit(f'Could not find </body> in {filename}')
                  text = text.replace(marker, ga4_script + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')

          path = Path('quotation/renovationplanner.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="detailed-quotation-promo-ui.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text: raise SystemExit('Could not find </body> in renovationplanner.html')
              text = text.replace(marker, tag + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('quotation/homeowner.html')
          text = path.read_text(encoding='utf-8')
          card_css = '.project-card{display:flex;flex-direction:column}.project-card .mt-7 h2{min-height:76px}.project-card .mt-7 p{min-height:84px}.project-card .mt-auto>div>div:first-child{color:#334155!important;text-shadow:0 1px 2px rgba(255,255,255,.8)}'
          if card_css not in text:
              marker = '</style>'
              if marker not in text: raise SystemExit('Could not find </style> in homeowner.html')
              text = text.replace(marker, card_css + '\n' + marker, 1)
          text = text.replace('<script src="quotation-auth.js"></script>', '<script src="auth-github.js"></script>')
          broken_phone = '<label class="block" id="accountPhoneField"><span class="mb-2 block text-sm font-semibold">Phone <span class="font-normal text-slate-400">(optional)</span></label>'
          fixed_phone = '<label class="block" id="accountPhoneField"><span class="mb-2 block text-sm font-semibold">Phone <span class="font-normal text-slate-400">(optional)</span></span><input id="accountPhoneInput" type="tel" autocomplete="tel" class="w-full rounded-2xl border border-slate-300 bg-white/90 px-4 py-3 outline-none transition focus:border-[#b58a3a] focus:ring-2 focus:ring-[#b58a3a]/15" placeholder="01X-XXXXXXX"/></label>'
          text = text.replace(broken_phone, fixed_phone)
          text = re.sub(r'<script id="tc-teraju-ga4">.*?</script>', ga4_script, text, count=1, flags=re.S)
          if 'id="tc-teraju-ga4"' not in text:
              marker = '</body>'
              if marker not in text: raise SystemExit('Could not find </body> in homeowner.html')
              text = text.replace(marker, ga4_script + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('quotation/contractor.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'<script id="tc-teraju-ga4">.*?</script>', ga4_script, text, count=1, flags=re.S)
          if 'id="tc-teraju-ga4"' not in text:
              marker = '</body>'
              if marker not in text: raise SystemExit('Could not find </body> in contractor.html')
              text = text.replace(marker, ga4_script + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('quotation/quotations.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'<script id="tc-teraju-ga4">.*?</script>', ga4_script, text, count=1, flags=re.S)
          if 'id="tc-teraju-ga4"' not in text:
              marker = '</body>'
              if marker not in text: raise SystemExit('Could not find </body> in quotations.html')
              text = text.replace(marker, ga4_script + '\n' + marker, 1)
          open_marker = '<a href="${edit}" class="history-action rounded-xl px-4 py-3 text-sm font-semibold">Open / Edit</a>'
          open_replacement = '<a href="${edit}" data-ga-quotation-opened="1" data-ga-role="${esc(role)}" data-ga-planner-type="${esc(type)}" data-ga-quotation-id="${esc(q.quotationId)}" data-ga-quotation-number="${esc(q.quotationNumber||q.quotationId)}" data-ga-quotation-type="${esc(q.quotationType||\'simple\')}" class="history-action rounded-xl px-4 py-3 text-sm font-semibold">Open / Edit</a>'
          if open_marker in text and open_replacement not in text:
              text = text.replace(open_marker, open_replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('api/quotations.js')
          text = path.read_text(encoding='utf-8')
          edit_guard = "    if (index >= 0 && !sameProjectIdentity(list[index], normalized)) index = -1;\n"
          if edit_guard in text:
              text = text.replace(edit_guard, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/renovationplanner.html quotation/buildplanner.html quotation/homeowner.html quotation/contractor.html quotation/quotations.html api/quotations.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Refresh TERAJU WORKS quotation edit behavior [renovation-promo-ui]"
          git push origin main

# GA4 lifecycle sync trigger
# quotation edit overwrite patch trigger
