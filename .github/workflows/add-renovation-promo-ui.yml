name: Add Renovation Promo UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-renovation:
    if: "!contains(github.event.head_commit.message, '[renovation-promo-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Standardize quotation promo UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ('quotation/renovationplanner.html', 'quotation/buildplanner.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('        <em>~~RM49~~ FREE during promotion</em>\n', '')
              text = text.replace('        <em>Included with Detailed Quotation</em>\n', '')
              text = text.replace('~~RM49~~ FREE during promotion', '')
              path.write_text(text, encoding='utf-8')

          path = Path('quotation/renovationplanner.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="detailed-quotation-promo-ui.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in renovationplanner.html')
              text = text.replace(marker, tag + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/renovationplanner.html quotation/buildplanner.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Standardize Detailed Quotation promo label [renovation-promo-ui]"
          git push origin main
