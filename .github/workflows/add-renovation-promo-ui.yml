name: Add Renovation Promo UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-renovation:
    if: "!contains(github.event.head_commit.message, '[renovation-promo-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject promo UI script and fix mobile subtotal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['quotation/buildplanner.html','quotation/renovationplanner.html']:
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              marker='/* Mobile quotation'
              if marker not in text:
                  raise SystemExit(f'Mobile quotation block not found in {name}')
              start=text.index(marker)
              end=text.index('</style>', start)
              old=text[start:end]
              subtotal='''  #estimateContent table tr:has(td[colspan]) td:first-child {\n    text-align:left !important;\n    white-space:nowrap !important;\n    overflow-wrap:normal !important;\n    word-break:normal !important;\n  }\n  #estimateContent table tr:has(td[colspan]) td:last-child {\n    text-align:right !important;\n    white-space:nowrap !important;\n    overflow-wrap:normal !important;\n    word-break:normal !important;\n  }\n'''
              if 'tr:has(td[colspan]) td:first-child' in old:
                  import re
                  old=re.sub(r'  #estimateContent table tr:has\(td\[colspan\]\) td:first-child \{.*?\n  \}\n  #estimateContent table tr:has\(td\[colspan\]\) td:last-child \{.*?\n  \}\n', subtotal, old, flags=re.S)
              else:
                  old=old.rstrip()+"\n"+subtotal
              text=text[:start]+old+text[end:]
              if name.endswith('renovationplanner.html'):
                  tag='<script src="detailed-quotation-promo-ui.js"></script>'
                  if tag not in text:
                      text=text.replace('</body>',tag+'\n</body>',1)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/buildplanner.html quotation/renovationplanner.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add Renovation Planner promo UI [renovation-promo-ui]"
          git push origin main
