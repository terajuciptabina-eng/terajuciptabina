name: Temporary Build Planner cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update engine URL and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text(encoding='utf-8')
          old='quotation-quantity-fix.js?v=20260915'
          new='quotation-quantity-fix.js?v=20260916'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one occurrence, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/temporary-buildplanner-cache-bust.yml
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner-v2.html .github/workflows/temporary-buildplanner-cache-bust.yml
          git diff --cached --check
          git commit -m 'Build Planner: cache-bust master engine URL'
          git push
