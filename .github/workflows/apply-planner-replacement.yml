name: Apply planner replacement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared full-source patches
        run: |
          python - <<'PY'
          import re,base64,gzip,subprocess
          from pathlib import Path
          y=Path('.github/workflows/replace-planners.yml').read_text()
          for envname,path in [('BUILD_PATCH','quotation/buildplanner.html'),('RENOVATION_PATCH','quotation/renovationplanner.html')]:
              m=re.search(r'^\s*'+envname+r':\s*(\S+)\s*$',y,re.M)
              if not m: raise SystemExit('Missing '+envname)
              d=gzip.decompress(base64.b64decode(m.group(1))).decode()
              d=d.replace('--- \n+++ \n','--- a/'+path+'\n+++ b/'+path+'\n',1)
              p=Path('/tmp/'+Path(path).name+'.diff');p.write_text(d)
              subprocess.run(['git','apply','--whitespace=nowarn',str(p)],check=True)
          PY
      - name: Remove temporary files and commit exact replacements
        run: |
          rm -f .github/workflows/replace-planners.yml .github/workflows/apply-planner-replacement.yml .planner-replacement-trigger .planner-apply-trigger
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html quotation/renovationplanner.html .github/workflows .planner-replacement-trigger .planner-apply-trigger
          git commit -m 'Replace planner sources [planner-replacement]'
          git push
