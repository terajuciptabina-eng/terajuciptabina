name: one-time-v2-budget-layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V2 budget layout fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('quotation/quotation-quantity-fix.js')
          s = p.read_text(encoding='utf-8')

          start = s.find('function row(item,no){')
          end = s.find('window.TERAJU_V2_EDIT_ITEM=', start)
          if start < 0 or end < 0:
              raise SystemExit('V2 row function boundary not found')

          new_row = r'''function row(item,no){const iid=targetId(item.id),contractor=document.body.classList.contains('contractor-mode'),locked=/(?:^|\/)\s*PORCH\s*\/\s*(?:LIGHTING|FAN|POWER POINT)(?:\s*\/|$)/i.test(String(item.masterPath||''))||/DOORS \/ Type 3/i.test(String(item.masterPath||''))||/TYPE 3\s*BATHROOM/i.test(String(item.masterPath||''))||/WINDOWS \/ Type [123]/i.test(String(item.masterPath||''));const desc=contractor?`<textarea id="budget-desc-${iid}" rows="1" class="w-full min-w-0 border rounded-md px-2 py-1 text-sm whitespace-normal break-words resize-none overflow-hidden" style="min-height:44px" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onchange="TERAJU_V2_SAVE_ITEM(${JSON.stringify(item.id)})">${esc(item.description)}</textarea>`:`<div class="whitespace-normal break-words leading-5">${esc(item.description)}</div>`;const qty=contractor&&!locked?`<input id="budget-qty-${iid}" type="number" min="0" step="1" value="${normQty(item.qty)}" class="w-full border rounded-md px-2 py-1 text-sm text-right" onchange="TERAJU_V2_SAVE_ITEM(${JSON.stringify(item.id)})">`:`<div class="text-right">${normQty(item.qty)}</div>`;const rate=`<input id="budget-rate-${iid}" type="number" min="0" step="0.01" value="${normRate(item.rate).toFixed(2)}" class="w-full border rounded-md px-2 py-1 text-sm text-right" onchange="TERAJU_V2_SAVE_ITEM(${JSON.stringify(item.id)})">`;const del=`<button type="button" class="border border-red-200 text-red-700 rounded-md px-2 py-1 text-xs font-semibold mt-1" onclick="deleteBudgetItem(${JSON.stringify(item.id)})">Delete</button>`;return `<tr data-budget-item-id="${iid}" class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no}</td><td class="py-2 px-2 cr-description whitespace-normal break-words">${desc}${locked&&contractor?'<div class="text-[11px] text-gray-500 mt-1">Quantity controlled by Global Calculation Rules.</div>':''}${del}</td><td class="py-2 px-2 cr-unit">${esc(item.unit)}</td><td class="py-2 px-2">${qty}</td><td class="py-2 px-2">${rate}</td><td class="py-2 px-2 text-right font-semibold">${money2(item.amount)}</td></tr>`}
'''
          s = s[:start] + new_row + s[end:]

          old = r'''g.levels.forEach((level,idx)=>{h+=(idx===g.levels.length-1?`<tr class="cr-hierarchy-row cr-level-${idx+2}"><td colspan="5">${esc(level)}</td><td class="text-right">SUBTOTAL RM ${money2(window.TERAJU_R2(g.items.reduce((sum,i)=>sum+N(i.amount),0)))}</td></tr>`:`<tr class="cr-hierarchy-row cr-level-${idx+2}"><td colspan="6">${esc(level)}</td></tr>`)});g.items.forEach(i=>{h+=row(i,no++)})'''
          new = r'''g.levels.forEach((level,idx)=>{const last=idx===g.levels.length-1,showSubtotal=last&&g.items.length>1;h+=showSubtotal?`<tr class="cr-hierarchy-row cr-level-${idx+2}"><td colspan="5">${esc(level)}</td><td class="text-right">SUBTOTAL RM ${money2(window.TERAJU_R2(g.items.reduce((sum,i)=>sum+N(i.amount),0)))}</td></tr>`:`<tr class="cr-hierarchy-row cr-level-${idx+2}"><td colspan="6">${esc(level)}</td></tr>`});g.items.forEach(i=>{h+=row(i,no++)})'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected hierarchy block exactly once, found {s.count(old)}')
          s = s.replace(old, new, 1)

          # Add subtotal to every top-level group header, while retaining the
          # no-subtotal rule for single-item sub-sub groups.
          old_header = r'''h+=`<tr class="cr-group-row"><td colspan="6">${esc(title)}<span class="cr-group-count">${items.length} item${items.length===1?'':'s'}</span></td></tr>`'''
          new_header = r'''const groupTotal=R2(items.reduce((sum,i)=>sum+N(i.amount),0));h+=`<tr class="cr-group-row"><td colspan="5">${esc(title)}<span class="cr-group-count">${items.length} item${items.length===1?'':'s'}</span></td><td class="text-right font-semibold">SUBTOTAL RM ${money2(groupTotal)}</td></tr>`'''
          if s.count(old_header) != 1:
              raise SystemExit(f'Expected group header block exactly once, found {s.count(old_header)}')
          s = s.replace(old_header, new_header, 1)

          p.write_text(s, encoding='utf-8')
          print('Applied V2 description wrapping, single-item subtotal rule, and group subtotals')
          PY

      - name: Validate JavaScript
        run: node --check quotation/quotation-quantity-fix.js

      - name: Commit source fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-v2-description-wrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js .github/workflows/one-time-v2-description-wrap.yml
          git diff --cached --quiet && { echo 'No changes detected'; exit 1; }
          git commit -m 'Improve V2 budget description and group subtotals'
          git push origin HEAD:main
