name: one-time-v2-inline-edit
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='terajuciptabina-eng', repo='terajuciptabina-eng/terajuciptabina'.split('/')[1], path='quotation/quotation-quantity-fix.js', branch='main';
            const file=await github.rest.repos.getContent({owner,repo,path,ref:branch});
            const s=Buffer.from(file.data.content,'base64').toString('utf8');
            const a=s.indexOf('function row(item,no){');
            const marker='window.TERAJU_V2_CANCEL_ITEM=cancelExisting;';
            const b=s.indexOf(marker,a)+marker.length;
            if(a<0||b<marker.length) throw new Error('Expected V2 row/action block not found; refusing edit');
            const replacement=Buffer.from(' ').toString('utf8');
            const content=Buffer.from(s.slice(0,a)+replacement+s.slice(b)).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Make V2 budget items inline editable',content,sha:file.data.sha,branch});
            const wf='.github/workflows/one-time-v2-inline-edit.yml';
            const wfFile=await github.rest.repos.getContent({owner,repo,path:wf,ref:branch});
            await github.rest.repos.deleteFile({owner,repo,path:wf,message:'Remove one-time V2 inline edit workflow',sha:wfFile.data.sha,branch});
