name: one-time-v2-inline-edit
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update V2 item editing UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          a=s.index('function row(item,no){')
          marker='window.TERAJU_V2_CANCEL_ITEM=cancelExisting;'
          b=s.index(marker,a)+len(marker)
          new=base64.b64decode('').decode()
          p.write_text(s[:a]+new+s[b:])
          PY
          node --check quotation/quotation-quantity-fix.js
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/one-time-v2-inline-edit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/quotation-quantity-fix.js .github/workflows/one-time-v2-inline-edit.yml
          git diff --cached --quiet || git commit -m "Make V2 budget items inline editable"
          git push
