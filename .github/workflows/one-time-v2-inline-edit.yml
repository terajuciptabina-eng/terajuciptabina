name: one-time-v2-inline-edit
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Make V2 budget items inline editable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='terajuciptabina-eng',repo='terajuciptabina',path='quotation/quotation-quantity-fix.js',branch='main';
            const file=await github.rest.repos.getContent({owner,repo,path,ref:branch});
            const s=Buffer.from(file.data.content,'base64').toString('utf8');
            if(s.includes('onchange="TERAJU_V2_SAVE_ITEM')){core.info('V2 inline editor already present');return;}
            const a=s.indexOf('function row(item,no){');
            const marker='window.TERAJU_V2_EDIT_ITEM=';
            const b=s.indexOf(marker,a);
            if(a<0||b<0)throw new Error('Expected V2 row block not found; refusing edit');
            const replacement=Buffer.from(' '.replace('VEVSQUpV','VEVSQUpV')).toString('utf8');
            const content=Buffer.from(s.slice(0,a)+replacement+s.slice(b)).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Make V2 budget items inline editable',content,sha:file.data.sha,branch});
