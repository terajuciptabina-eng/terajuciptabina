name: Automatic Development Log

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  development-log:
    # Log every normal development commit automatically.
    # Skip only commits created by this workflow itself.
    if: >-
      github.event.head_commit != null &&
      !startsWith(github.event.head_commit.message, 'docs: auto-log development ')
    runs-on: ubuntu-latest
    steps:
      - name: Append development update automatically
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const message = context.payload.head_commit.message || '';
            const title = (message.split(/\r?\n/)[0] || 'Development update').trim();

            // Avoid logging the workflow's own JSON update commit.
            if (title.startsWith('docs: auto-log development ')) {
              core.info('Skipping automatic development-log commit.');
              return;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });

            const files = (commit.data.files || []).map(f => f.filename).filter(Boolean);

            function moduleFor(files) {
              const p = files.join('\n').toLowerCase();
              if (/development-log|\.github\/workflows/.test(p)) return 'Development Control';
              if (/renovationplanner|renovation-planner/.test(p)) return 'RenovationPlanner';
              if (/buildplanner|build-planner/.test(p)) return 'BuildPlanner';
              if (/cost|estimate|quotation|budget|preview/.test(p)) return 'Cost Estimate';
              if (/project-control|work-program|s-curve|progress/.test(p)) return 'Project Control';
              if (/admin|rate-management|rate-comparison/.test(p)) return 'Admin / Rate Management';
              if (/investor/.test(p)) return 'Investor';
              if (/readme|docs/.test(p)) return 'Documentation';
              return 'General';
            }

            function statusFor(title) {
              return /\b(wip|work in progress|draft|todo|planned)\b/i.test(title)
                ? 'In Progress'
                : 'Completed';
            }

            const path = 'data/development-log.json';
            const branch = context.ref.replace('refs/heads/', '');

            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });

            const raw = Buffer.from(file.content, 'base64').toString('utf8');
            const items = JSON.parse(raw);

            const date = context.payload.head_commit.timestamp
              ? context.payload.head_commit.timestamp.slice(0, 10)
              : new Date().toISOString().slice(0, 10);

            const id = `DEV-${date.replaceAll('-', '')}-${context.sha.slice(0, 7)}`;

            if (items.some(item => item.id === id || item.commit === context.sha)) {
              core.info('Development log already contains this commit.');
              return;
            }

            const module = moduleFor(files);
            const status = statusFor(title);
            const summary = title;
            const details = files.length
              ? `Automatic entry from commit ${context.sha.slice(0, 7)}. Changed files: ${files.join(', ')}.`
              : `Automatic entry from commit ${context.sha.slice(0, 7)}.`;

            items.push({
              id,
              date,
              title,
              module,
              status,
              summary,
              details,
              commit: context.sha,
              updatedAt: new Date().toISOString()
            });

            items.sort((a, b) => {
              const dateCompare = String(b.date || '').localeCompare(String(a.date || ''));
              if (dateCompare !== 0) return dateCompare;
              return String(b.id || '').localeCompare(String(a.id || ''));
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `docs: auto-log development ${title}`,
              content: Buffer.from(JSON.stringify(items, null, 2) + '\n').toString('base64'),
              sha: file.sha,
              branch
            });

            core.info(`Development log created automatically: ${id}`);
