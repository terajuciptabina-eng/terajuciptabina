name: One-time V2 column cleanup
on:
  push:
    paths:
      - '.v2-column-cleanup-trigger'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize V2 budget table back to six columns
        shell: python
        run: |
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          marker='window.renderConstructionBudget=function(){'
          if marker not in s: raise SystemExit('V2 renderer not found')
          start=s.index(marker)
          block=s[start:]
          block=block.replace('<th class="py-3 px-2"></th></tr>','</tr>')
          block=block.replace('colspan="7"','colspan="6"')
          block=block.replace('<td></td></tr>`}</tbody><tfoot><tr class="border-t-2"><td colspan="5"','</tr>`}</tbody><tfoot><tr class="border-t-2"><td colspan="5"')
          block=block.replace('<td></td></tr></tfoot></table></div>','</tr></tfoot></table></div>')
          s=s[:start]+block
          p.write_text(s)
          Path('.github/workflows/one-time-v2-column-cleanup.yml').unlink()
          Path('.v2-column-cleanup-trigger').unlink()
      - name: Commit clean six-column V2 renderer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep V2 contractor budget six-column layout'
          git push
