name: Repair Build Planner source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[repair-buildplanner]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good source and apply current new-item rule
        run: |
          git fetch --no-tags --depth=1 origin a04a48e003a37f7038c5e4fbcbfa6b8e3bec48b4
          git checkout a04a48e003a37f7038c5e4fbcbfa6b8e3bec48b4 -- quotation/buildplanner.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('quotation/buildplanner.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<label><span class="block text-xs font-medium text-gray-500 mb-1">Unit</span><input id="manual-unit-\$\{targetKey\}"[^>]*></label>', '', s, count=1)
          if n!=1: raise SystemExit('new-item Unit field not found')
          pat=r'function prepareManualItem\(targetKey\)\{.*?\}\nfunction saveManualItem\(targetKey\)'
          repl="""function prepareManualItem(targetKey){const select=document.getElementById(`manual-select-${targetKey}`),rate=document.getElementById(`manual-rate-${targetKey}`),box=document.getElementById(`manual-new-${targetKey}`),qtyField=document.getElementById(`manual-qty-${targetKey}`),item=standardLibrary().find(x=>x.id===select?.value),isNew=select?.value==='__new__';qtyField?.closest('label')?.classList.toggle('hidden',isNew);if(isNew){box?.classList.remove('hidden');if(rate)rate.value='0.00';return}box?.classList.add('hidden');if(item&&rate)rate.value=normalizeRate(item.rate).toFixed(2)}
function saveManualItem(targetKey)"""
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('prepare function not found')
          unit_pat=r"unit=String\(document\.getElementById\(`manual-unit-\$\{targetKey\}`\)\)\?\.value\|\|'ls'\)\.trim\(\)\|\|'ls';"
          s,n=re.subn(unit_pat,"unit='ls';\n  qty=1;",s,count=1)
          if n!=1: raise SystemExit('new-item Unit save logic not found')
          if 'manual-unit-' in s: raise SystemExit('manual-unit reference remains')
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('quotation/buildplanner.html').read_text(encoding='utf-8')
          assert s.count('<script') == s.count('</script>'), 'script tag mismatch'
          assert 'anchor.appendChild(wrap);' in s
          assert 'manual-unit-' not in s
          assert 'qty=1;' in s
          print('Build Planner source verification passed')
          PY
          git diff --check
      - name: Commit repaired source and clean temporary files
        run: |
          rm -f .github/workflows/repair-buildplanner.yml .repair-trigger
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html .github/workflows/repair-buildplanner.yml .repair-trigger
          git commit -m 'Repair Build Planner source [repair-buildplanner]'
          git push
