name: Fix Renovation Homeowner Estimate Font

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-renovation-homeowner-font.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch homeowner estimate typography only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/renovationplanner.html')
          s = p.read_text(encoding='utf-8')
          marker = '  #estimateContent table thead { display:table-header-group !important; }'
          rule = '''  .homeowner-mode #estimateContent table th,\n  .homeowner-mode #estimateContent table td,\n  .homeowner-mode #estimateContent table .homeowner-locked { font-size:8px !important; }\n'''
          if rule.strip() not in s:
              if marker not in s:
                  raise SystemExit('Target marker not found; no changes made.')
              s = s.replace(marker, rule + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/renovationplanner.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix renovation homeowner estimate font size'
          git push origin main
