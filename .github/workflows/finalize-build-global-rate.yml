name: Finalize Build global state rate master

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[finalize-build-global-rate]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Build master descriptions canonical and state-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner.html')
          s=p.read_text(encoding='utf-8')
          labels={
          "label:'Building plan / permit & engineer’s drawings'":"label:'Submission of building plan / permit application and Engineer’s drawings to the Local Authority, including preparation of required documents, submission, coordination and necessary authority liaison, complete.'",
          "label:'Preliminaries, mobilisation & project management'":"label:'Preliminaries, site mobilisation, temporary facilities, site protection, insurance, project coordination, supervision and general project management, complete.'",
          "label:'Footing – Concrete G15'":"label:'Concrete Grade 15 to pad footings including placing, compacting, levelling and curing complete.'",
          "label:'Ground slab – Concrete G25'":"label:'Concrete Grade 25 to ground slab including preparation, placing, compacting, levelling, finishing and curing complete.'",
          "label:'Beam – Concrete G25'":"label:'Concrete Grade 25 to ground and roof beams including placing, compacting, levelling and curing complete.'",
          "label:'Column – Concrete G25'":"label:'Concrete Grade 25 to reinforced concrete columns including placing, compacting, alignment and curing complete.'",
          "label:'Internal ceiling'":"label:'Plaster / skim ceiling c/w paint including surface preparation, joint treatment, application and finishing complete.'",
          "label:'Internal floor tiles'":"label:'Internal floor tiles including surface preparation, adhesive / mortar bedding, cutting, laying, grouting and finishing complete.'",
          "label:'Internal painting'":"label:'Internal wall and ceiling painting including surface preparation, sealer / undercoat, finishing coats, cleaning and touch-up complete.'",
          "label:'Door'":"label:'Door set including door leaf, frame, ironmongery, installation, alignment and finishing complete.'",
          "label:'Window'":"label:'Window set including frame, glazing, ironmongery, sealant, installation and finishing complete.'",
          "label:'Bathroom floor tiles'":"label:'Bathroom floor tiles c/w waterproofing including surface preparation, waterproofing membrane, laying, grouting and finishing complete.'",
          "label:'Bathroom wall tiles'":"label:'Bathroom wall tiles including surface preparation, laying, grouting, trimming and finishing complete.'",
          "label:'Bathroom piping'":"label:'Bathroom sanitary and water supply piping including fittings, connections, testing and commissioning complete.'",
          "label:'WC'":"label:'Water closet (WC) including pan, cistern, fittings, connection, testing and commissioning complete.'",
          "label:'Basin'":"label:'Wash hand basin including basin, tap / fittings, waste connection, installation, testing and commissioning complete.'",
          "label:'DB box'":"label:'Distribution board (DB) box including enclosure, circuit protection devices, busbar, labelling and installation complete.'",
          "label:'Wiring'":"label:'Electrical wiring including cables, conduits / trunking, terminations, supports, testing and commissioning complete.'",
          "label:'Power point'":"label:'13A switched power point including wiring, accessories, mounting, termination, testing and commissioning complete.'",
          "label:'Switch'":"label:'Lighting switch including wiring, accessories, mounting, termination, testing and commissioning complete.'",
          "label:'Lighting'":"label:'Light fitting including fitting, wiring connection, mounting, testing and commissioning complete.'",
          "label:'Ceiling fan'":"label:'Ceiling fan including fan unit, regulator / control, wiring connection, mounting, testing and commissioning complete.'",
          "label:'Aircond point / provision'":"label:'Air-conditioning point / provision including power wiring, isolator, containment, termination, testing and commissioning complete.'",
          "label:'Earthing'":"label:'Electrical earthing system including earth electrode, conductor, connections, testing and commissioning complete.'"
          }
          for a,b in labels.items(): s=s.replace(a,b)
          desc={
          "desc:'Concrete G15'":"desc:'Concrete Grade 15 to pad footings including placing, compacting, levelling and curing complete.'",
          "desc:'Formwork'":"desc:'Formwork to pad footings including erection, support, alignment, striking and making good complete.'",
          "desc:'Rebar'":"desc:'Reinforcement steel bars including cutting, bending, fixing and tying complete.'",
          "desc:'Concrete G25'":"desc:'Concrete Grade 25 to reinforced concrete structural members including placing, compacting, levelling and curing complete.'",
          "desc:'Rebar BRC A7 double layer'":"desc:'Welded steel fabric reinforcement BRC A7, double layer, including laps, spacers and fixing complete.'",
          "desc:'Flat roof – Concrete G25'":"desc:'Concrete Grade 25 to flat roof slab including placing, compacting, levelling, finishing and curing complete.'",
          "desc:'Flat roof – Formwork'":"desc:'Formwork to flat roof slab including erection, support, alignment, striking and making good complete.'",
          "desc:'Flat roof – Rebar BRC A7 double layer'":"desc:'Welded steel fabric reinforcement BRC A7, double layer, to flat roof slab including laps, spacers and fixing complete.'",
          "desc:'C-channel for roof structures'":"desc:'Galvanised steel C-channel roof framing including cutting, fabrication, fixing, connections, alignment and protective treatment complete.'",
          "desc:'Metal roofing sheet'":"desc:'Metal roofing sheets including supply, cutting, fixing, laps, flashing, sealant, fasteners and complete installation.'",
          "desc:'Apron – Concrete G15'":"desc:'Concrete Grade 15 to external apron including preparation, placing, compacting, levelling, finishing and curing complete.'",
          "desc:'Apron – Formwork'":"desc:'Formwork to external apron including erection, support, alignment, striking and making good complete.'",
          "desc:'Apron – Rebar BRC A7'":"desc:'Welded steel fabric reinforcement BRC A7 to external apron including laps, spacers and fixing complete.'",
          "desc:'Drainage – small U-shape scupper drain'":"desc:'Small U-shape scupper drain including excavation, base preparation, construction, finishing and making good complete.'",
          "desc:'Septic tank'":"desc:'Septic tank including excavation, bedding, tank, inlet / outlet connections, backfilling and all necessary accessories complete.'",
          "desc:'Water tank'":"desc:'Water storage tank including tank base / support, inlet and outlet connections, fittings and all necessary accessories complete.'",
          "desc:'Design roof structure – Concrete G25'":"desc:'Concrete Grade 25 to designed roof structural member including placing, compacting, levelling and curing complete.'",
          "desc:'Design roof structure – Formwork'":"desc:'Formwork to designed roof structural member including erection, support, alignment, striking and making good complete.'",
          "desc:'Design roof structure – Rebar'":"desc:'Reinforcement steel bars to designed roof structural member including cutting, bending, fixing and tying complete.'"
          }
          for a,b in desc.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('quotation/contractor-master-bridge.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("window.editScheduleRate=()=>false;\n    window.resetRatesToDefault=()=>false;\n","")
          old="""        document.querySelectorAll('#rateScheduleContent input').forEach(input=>{const span=document.createElement('span');span.className='inline-block min-w-[7rem] px-2 py-1.5 text-right text-gray-700';span.textContent=Number(input.value||0).toFixed(2);span.setAttribute('aria-label','Global master rate — read only');input.replaceWith(span)});
        document.querySelectorAll('#rateScheduleContent [onclick*="resetRatesToDefault"]').forEach(el=>el.remove());
"""
          s=s.replace(old,'')
          old_payload="const payload={contractorId,plannerType,customItemId:item.customItemId||item.id,sourceGlobalId:item.sourceGlobalId||null,description:String(item.description||'').trim(),unit:String(item.unit||'unit').trim(),rate:Number(item.rate)||0,category:String(item.category||'custom'),groupKey:item.groupKey||null,groupTitle:String(item.groupTitle||'Custom Items')}"
          new_payload="const stateId=String(window.TERAJU_SELECTED_STATE||window.TERAJU_RATE_CONTEXT?.state||qs.get('state')||'').trim().toLowerCase(); const payload={contractorId,plannerType,state:stateId||null,rateSetId:window.TERAJU_RATE_CONTEXT?.rateSetId||stateId||null,customItemId:item.customItemId||item.id,sourceGlobalId:item.sourceGlobalId||null,description:String(item.description||'').trim(),unit:String(item.unit||'unit').trim(),rate:Number(item.rate)||0,category:String(item.category||'custom'),groupKey:item.groupKey||null,groupTitle:String(item.groupTitle||'Custom Items')}"
          s=s.replace(old_payload,new_payload)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final changes and remove workflow
        run: |
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html quotation/contractor-master-bridge.js
          git commit -m 'Finalize state-specific global Build Rate Schedule [finalize-build-global-rate]'
          git push
          git rm .github/workflows/finalize-build-global-rate.yml
          git commit -m 'Remove one-shot Build rate master workflow [finalize-build-global-rate]'
          git push
