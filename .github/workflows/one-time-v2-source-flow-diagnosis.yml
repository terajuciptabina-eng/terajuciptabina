name: one-time-v2-source-flow-diagnosis
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect V2 initialization flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['quotation/buildplanner-v2.html','quotation/quotation-quantity-fix.js']:
            s=Path(fn).read_text()
            print('\n===',fn,'len=',len(s),'===')
            needles=['getRoomGroups','localStorage','DOMContentLoaded','window.addEventListener','quotation-quantity-fix.js','renderConstructionBudget','updateEstimate','saveContractorState','roomsContainer','room-area','builtUpArea','loadState','restore']
            for needle in needles:
              print('\n--',needle,'--')
              pos=0; n=0
              while True:
                p=s.find(needle,pos)
                if p<0 or n>=12: break
                a=max(0,p-350); b=min(len(s),p+700)
                print('POS',p,repr(s[a:b]))
                pos=p+len(needle); n+=1
          PY
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-v2-source-flow-diagnosis.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-v2-source-flow-diagnosis.yml
          git diff --cached --quiet || git commit -m "Remove one-time V2 source flow diagnosis"
          git push
