name: Replace planner source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    if: "!contains(github.event.head_commit.message, '[planner-replacement]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace full planner sources
        env:
          BUILD_PATCH: 
          RENOVATION_PATCH: 
          RENOVATION_PATCH: 
        run: |
          python - <<'PY'
          import base64,gzip,subprocess
          from pathlib import Path
          patches=[('quotation/buildplanner.html',__import__('os').environ['BUILD_PATCH']),('quotation/renovationplanner.html',__import__('os').environ['RENOVATION_PATCH'])]
          for path,b64 in patches:
              p=Path('/tmp/'+Path(path).name+'.diff')
              d=gzip.decompress(base64.b64decode(b64)).decode()
              d=d.replace('--- buildplanner.html','--- a/quotation/buildplanner.html').replace('+++ buildplanner.html','+++ b/quotation/buildplanner.html')
              d=d.replace('--- renovationplanner.html','--- a/quotation/renovationplanner.html').replace('+++ renovationplanner.html','+++ b/quotation/renovationplanner.html')
              p.write_text(d)
              subprocess.run(['git','apply','--whitespace=nowarn',str(p)],check=True)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/replace-planners.yml
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner.html quotation/renovationplanner.html .github/workflows/replace-planners.yml
          git commit -m 'Replace planner sources [planner-replacement]'
          git push
