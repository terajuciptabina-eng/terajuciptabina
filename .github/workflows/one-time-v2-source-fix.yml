name: One-time V2 renderer source fix
on:
  push:
    paths:
      - '.v2-source-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix V2 renderer readiness gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="const gate=window.__TERAJU_MASTER_RULE_GATE_READY;if(!gate){c.innerHTML='<div class=\"border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500\">Loading Global Calculation Rules…</div>';return}const all="
          new="const ready=typeof getAllItems==='function';if(!ready){c.innerHTML='<div class=\"border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500\">Loading Global Calculation Rules…</div>';return}const all="
          if old not in s:
              raise SystemExit('Expected V2 readiness gate not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify source
        run: |
          grep -q "const ready=typeof getAllItems==='function'" quotation/quotation-quantity-fix.js
          ! grep -q "__TERAJU_MASTER_RULE_GATE_READY" quotation/quotation-quantity-fix.js
      - name: Commit source fix and remove one-time workflow
        run: |
          rm -f .v2-source-fix-trigger .github/workflows/one-time-v2-source-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js .v2-source-fix-trigger .github/workflows/one-time-v2-source-fix.yml
          git commit -m 'Fix V2 renderer readiness at source'
          git push