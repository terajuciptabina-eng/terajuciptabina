name: One-time V2 source fix
on: push
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply V2 renderer source fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix V2 renderer source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          new_row='''function row(item,no){const iid=targetId(item.id),contractor=document.body.classList.contains('contractor-mode'),desc=contractor?`<textarea id="budget-desc-${iid}" rows="2" class="w-full min-w-0 border rounded-lg px-2 py-2 bg-white text-sm resize-y leading-snug" onchange="TERAJU_V2_EDIT_ITEM('${esc(item.id)}')">${esc(item.description)}</textarea>`:`<span>${esc(item.description)}</span>`,qty=contractor?`<input id="budget-qty-${iid}" type="number" min="0" step="1" value="${normQty(item.qty)}" class="w-24 max-w-full border rounded-lg px-2 py-2 text-right bg-white text-sm" onchange="TERAJU_V2_EDIT_ITEM('${esc(item.id)}')">`:`<span>${normQty(item.qty)}</span>`,rate=contractor?`<input id="budget-rate-${iid}" type="number" min="0" step="0.01" value="${normRate(item.rate).toFixed(2)}" class="w-28 max-w-full border rounded-lg px-2 py-2 text-right bg-white text-sm" onchange="TERAJU_V2_EDIT_ITEM('${esc(item.id)}')">`:`<span>${money2(item.rate)}</span>`,del=`<button type="button" class="no-print border border-red-300 text-red-600 rounded-lg px-2 py-1 text-xs font-semibold" onclick="deleteBudgetItem('${esc(item.id)}')">Delete</button>`;return `<tr class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no}</td><td class="py-2 px-2 cr-description">${desc}</td><td class="py-2 px-2 cr-unit">${esc(item.unit)}</td><td class="py-2 px-2 text-right">${qty}</td><td class="py-2 px-2 text-right">${rate}</td><td class="py-2 px-2 text-right font-semibold">${money2(item.amount)}</td><td class="py-2 px-2 text-right">${del}</td></tr>`}\n'''
          s,n=re.subn(r'function row\(item,no\)\{.*?\}\nwindow\.TERAJU_V2_EDIT_ITEM=',new_row+'window.TERAJU_V2_EDIT_ITEM=',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'row renderer replacement failed: {n}')
          new_render='''window.renderConstructionBudget=function(){const c=document.getElementById('constructionBudgetContent');if(!c)return;const gate=window.__TERAJU_MASTER_RULE_GATE_READY;if(!gate){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Loading Global Calculation Rules…</div>';return}const all=(typeof getAllItems==='function'?getAllItems():[]),active=all.filter(i=>!(typeof excludedItems!=='undefined'&&excludedItems.has(i.id)));if(!active.length){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Add rooms / areas to calculate the preliminary construction budget.</div>';return}const contractor=document.body.classList.contains('contractor-mode'),groups=[['preliminaries','PRELIMINARIES'],['structures','STRUCTURAL WORKS'],['architecture','ARCHITECTURAL WORKS'],['electrical','ELECTRICAL WORKS'],['doors-windows','DOORS & WINDOWS'],['external-work','EXTERNAL WORK']];let no=1,h='<div class="overflow-x-auto"><table class="w-full border-collapse text-sm cr-budget-table"><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Item</th><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th><th class="py-3 px-2"></th></tr></thead><tbody>';const addButton=(key,title,cat,roomId='project')=>contractor?`<div data-budget-new-anchor="${esc(key)}" class="no-print"><button type="button" class="mt-2 text-sm font-semibold text-gray-700 hover:text-black" onclick="addNewBudgetItem('${esc(key)}','${esc(title)}','${cat}','${esc(roomId)}')">＋ New Item</button></div>`:'';groups.forEach(([cat,title])=>{const items=active.filter(i=>i.category===cat);if(!items.length)return;h+=`<tr class="cr-group-row"><td colspan="7">${esc(title)}<span class="cr-group-count">${items.length} item${items.length===1?'':'s'}</span></td></tr>`;const gs=[];items.forEach(i=>{const path=String(i.masterPath||'').split('/').map(x=>x.trim()).filter(Boolean);let levels=path.length>1?path.slice(1,-1):[];if(!levels.length){levels=cat==='structures'?[i.groupTitle||'Other Structural Works']:cat==='architecture'?[i.room||'Architectural Works']:[]};const key=levels.join(' / ')||cat;let g=gs.find(x=>x.key===key);if(!g){g={key,levels,items:[]};gs.push(g)}g.items.push(i)});gs.forEach(g=>{g.levels.forEach((level,idx)=>{h+=`<tr class="cr-hierarchy-row cr-level-${idx+2}"><td colspan="7">${esc(level)}</td></tr>`});g.items.forEach(i=>{h+=row(i,no++)});const anchorKey=cat==='structures'?`structures:${g.levels[g.levels.length-1]||g.key}`:cat==='architecture'?`room:${g.key}`:`${cat}:${g.key}`;h+=`<tr class="no-print"><td colspan="7" class="py-1 px-2">${addButton(anchorKey,g.levels[g.levels.length-1]||title,cat,g.key)}</td></tr>`})});const total=active.reduce((sum,i)=>sum+Number(i.amount||0),0);h+=`</tbody><tfoot><tr class="border-t-2"><td colspan="5" class="py-4 px-2 text-right font-bold">TOTAL PRELIMINARY ESTIMATE</td><td class="py-4 px-2 text-right font-bold text-lg">RM ${money2(total)}</td><td></td></tr></tfoot></table></div>`;c.innerHTML=h};\n'''
          s,n=re.subn(r'window\.renderConstructionBudget=function\(\)\{.*?\n\}\)\(\);\s*$',new_render+'})();\n',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'render replacement failed: {n}')
          p.write_text(s)
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          extra='.cr-budget-table .cr-description textarea{width:100%!important;min-width:0!important;min-height:52px!important;resize:vertical!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;word-break:normal!important;line-height:1.4!important;vertical-align:top!important}'
          if extra not in s:s=s.replace('/* V2 description wrap */','/* V2 description wrap */\n'+extra,1)
          p.write_text(s)
          PY
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js quotation/buildplanner-v2.html
          git commit -m 'Apply V2 renderer source fix'
          git push
