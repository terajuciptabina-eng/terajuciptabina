name: One-time V2 source fix
on:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix master load/render sequencing at source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          replacement="async function main(){if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));let attempts=0;while(attempts<3){try{await load();break}catch(e){attempts++;console.error('[TERAJU MASTER LOAD]',e);if(attempts>=3)throw e;await new Promise(r=>setTimeout(r,700))}}window.getAllItems=getMasterItems;if(!/buildplanner-v2\\.html$/i.test(location.pathname))window.renderConstructionBudget=renderBudget;window.getCurrentQuotationData=qData;window.generateQuotation=quotation;window.updateEstimate=function(){try{if(typeof syncBuiltUpAreaFromRooms==='function')syncBuiltUpAreaFromRooms()}catch(e){console.error('[TERAJU SYNC BUILT-UP]',e)}try{if(/buildplanner-v2\\.html$/i.test(location.pathname)&&typeof window.renderConstructionBudget==='function')window.renderConstructionBudget();else renderBudget()}catch(e){console.error('[TERAJU RENDER]',e)}try{if(typeof saveContractorState==='function')saveContractorState()}catch(e){console.error('[TERAJU SAVE STATE]',e)}};window.updateEstimate()}"
          ns,n=re.subn(r"async function main\(\)\{.*?\}\nmain\(\)\.catch",replacement+"\nmain().catch",s,count=1)
          if n!=1: raise SystemExit(f'main replacement count={n}')
          p.write_text(ns)
          print('SOURCE_FIX_OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-v2-source-fix.yml
          git add quotation/quotation-quantity-fix.js
          git commit -m 'Fix Build Planner V2 master load and render sequencing'
          git push
