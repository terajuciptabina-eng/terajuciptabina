name: One-time Build Planner subtotal condition
on:
  push:
    paths:
      - '.github/workflows/one-time-buildplanner-subtotal-condition.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update subtotal rendering at source
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          s2=s.replace('TOTAL ${esc(label)}','SUBTOTAL ${esc(label)}',1)
          if s2==s:
              raise SystemExit('Expected the sub-sub total label in source')
          s=s2
          pattern=r'h\+=`<tr class="cr-hierarchy-total cr-level-3-total">.*?</tr>`'
          m=re.search(pattern,s)
          if not m:
              raise SystemExit('Expected the sub-sub total row in source')
          row=m.group(0)
          if 'SUBTOTAL ${esc(label)}' not in row:
              raise SystemExit('Expected SUBTOTAL label in the sub-sub total row')
          s=s[:m.start()]+'if(list.length>1)'+row+s[m.end():]
          p.write_text(s,encoding='utf-8')
      - name: Validate source
        run: node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: use subtotal for multi-item sub-sub headers'
          git rm .github/workflows/one-time-buildplanner-subtotal-condition.yml
          git commit -m 'Remove one-time Build Planner subtotal workflow'
          git push