name: One-time Build Planner subtotal condition
on:
  push:
    paths:
      - '.github/workflows/one-time-buildplanner-subtotal-condition.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update subtotal rendering at source
        shell: python
        run: |
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          old_label='TOTAL ${esc(label)}'
          new_label='SUBTOTAL ${esc(label)}'
          if s.count(old_label)!=1:
              raise SystemExit(f'Expected one TOTAL label, found {s.count(old_label)}')
          s=s.replace(old_label,new_label,1)
          old='h+=`<tr class="cr-hierarchy-total cr-level-3-total"><td colspan="5" class="py-2 px-2 text-right font-semibold">SUBTOTAL ${esc(label)}</td><td class="py-2 px-2 text-right font-bold">RM ${money(subSubTotal,2)}</td></tr>`'
          new='if(list.length>1)h+=`<tr class="cr-hierarchy-total cr-level-3-total"><td colspan="5" class="py-2 px-2 text-right font-semibold">SUBTOTAL ${esc(label)}</td><td class="py-2 px-2 text-right font-bold">RM ${money(subSubTotal,2)}</td></tr>`'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one subtotal row, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate source
        run: node --check quotation/quotation-quantity-fix.js
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: use subtotal for multi-item sub-sub headers'
          git rm .github/workflows/one-time-buildplanner-subtotal-condition.yml
          git commit -m 'Remove one-time Build Planner subtotal workflow'
          git push