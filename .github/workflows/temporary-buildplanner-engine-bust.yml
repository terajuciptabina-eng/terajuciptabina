name: Temporary Build Planner Engine Bust
on:
  push:
    paths:
      - 'quotation/quotation-quantity-fix.js'
permissions:
  contents: write
jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump engine query and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old='quotation-quantity-fix.js?v=20260917'
          new='quotation-quantity-fix.js?v=20260918'
          if old not in s:
              raise SystemExit('expected engine query not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/temporary-buildplanner-engine-bust.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html .github/workflows/temporary-buildplanner-engine-bust.yml
          git commit -m 'TERAJU V2: refresh Build Planner engine cache'
          git push
