name: one-time-v2-ui-cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Build Planner V2 inline item UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='terajuciptabina-eng',repo='terajuciptabina',path='quotation/quotation-quantity-fix.js',branch='main';
            const file=await github.rest.repos.getContent({owner,repo,path,ref:branch});
            let s=Buffer.from(file.data.content,'base64').toString('utf8');
            const start=s.indexOf('function cancelExisting(){refresh()}');
            const end=s.indexOf('window.renderConstructionBudget=function(){',start);
            if(start<0||end<0)throw new Error('Expected V2 action renderer boundary not found; refusing edit');
            const replacement=`function cancelExisting(){refresh()}\nfunction row(item,no){const iid=targetId(item.id),contractor=document.body.classList.contains('contractor-mode'),locked=/(?:^|\\/)\\s*PORCH\\s*\\/\\s*(?:LIGHTING|FAN|POWER POINT)(?:\\s*\\/|$)/i.test(String(item.masterPath||''))||/DOORS \\/ Type 3/i.test(String(item.masterPath||''))||/TYPE 3\\s*BATHROOM/i.test(String(item.masterPath||''))||/WINDOWS \\/ Type [123]/i.test(String(item.masterPath||''));const desc=contractor?\`<input id="budget-desc-\${iid}" type="text" value="\${esc(item.description)}" class="w-full min-w-0 border rounded-md px-2 py-1 text-sm" onchange="TERAJU_V2_SAVE_ITEM(\${JSON.stringify(item.id)})">\`:\`<div>\${esc(item.description)}</div>\`;const qty=contractor&&!locked?\`<input id="budget-qty-\${iid}" type="number" min="0" step="1" value="\${normQty(item.qty)}" class="w-full border rounded-md px-2 py-1 text-sm text-right" onchange="TERAJU_V2_SAVE_ITEM(\${JSON.stringify(item.id)})">\`:\`<div class="text-right">\${normQty(item.qty)}</div>\`;const rate=\`<input id="budget-rate-\${iid}" type="number" min="0" step="0.01" value="\${normRate(item.rate).toFixed(2)}" class="w-full border rounded-md px-2 py-1 text-sm text-right" onchange="TERAJU_V2_SAVE_ITEM(\${JSON.stringify(item.id)})">\`;const del=\`<button type="button" class="border border-red-200 text-red-700 rounded-md px-2 py-1 text-xs font-semibold mt-1" onclick="deleteBudgetItem(\${JSON.stringify(item.id)})">Delete</button>\`;return \`<tr data-budget-item-id="\${iid}" class="border-b align-top"><td class="py-2 px-2 text-gray-500">\${no}</td><td class="py-2 px-2 cr-description">\${desc}\${locked&&contractor?'<div class="text-[11px] text-gray-500 mt-1">Quantity controlled by Global Calculation Rules.</div>':''}\${del}</td><td class="py-2 px-2 cr-unit">\${esc(item.unit)}</td><td class="py-2 px-2">\${qty}</td><td class="py-2 px-2">\${rate}</td><td class="py-2 px-2 text-right font-semibold">\${money2(item.amount)}</td></tr>\`}\nwindow.TERAJU_V2_EDIT_ITEM=function(id){return};window.TERAJU_V2_SAVE_ITEM=function(id){const item=(typeof getAllItems==='function'?getAllItems():[]).find(x=>x.id===id);if(item)saveExisting(item)};window.TERAJU_V2_CANCEL_ITEM=cancelExisting;\n`;
            s=s.slice(0,start)+replacement+s.slice(end);
            if(s.includes('ZnVuY3Rpb24gcm93('))throw new Error('Corrupt base64 renderer marker remains; refusing commit');
            if(!s.includes('function row(item,no){'))throw new Error('Clean row renderer missing; refusing commit');
            const content=Buffer.from(s).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Fix Build Planner V2 inline item UI',content,sha:file.data.sha,branch});
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='terajuciptabina-eng',repo='terajuciptabina',path='.github/workflows/one-time-v2-ui-cleanup.yml',branch='main';
            const f=await github.rest.repos.getContent({owner,repo,path,ref:branch});
            await github.rest.repos.deleteFile({owner,repo,path,message:'Remove one-time Build Planner V2 UI cleanup',sha:f.data.sha,branch});