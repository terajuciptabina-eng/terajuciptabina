name: Standardize Planner Estimate Alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standardize-planner-estimate-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Standardize estimate table text alignment only
        run: |
          python - <<'PY'
          from pathlib import Path

          css = '''

/* STANDARD PLANNER ESTIMATE ALIGNMENT — typography unchanged */
#estimateContent table th:nth-child(1),
#estimateContent table td:nth-child(1) { text-align: left !important; }
#estimateContent table th:nth-child(2),
#estimateContent table td:nth-child(2) { text-align: center !important; }
#estimateContent table th:nth-child(3),
#estimateContent table td:nth-child(3) { text-align: center !important; }
#estimateContent table th:nth-child(4),
#estimateContent table td:nth-child(4) { text-align: right !important; }
#estimateContent table th:nth-child(5),
#estimateContent table td:nth-child(5) { text-align: right !important; }
#estimateContent table th:nth-child(6),
#estimateContent table td:nth-child(6) { text-align: center !important; }
#estimateContent table .quotation-section-row td,
#estimateContent table .quotation-subsection-row td { text-align: left !important; }
#estimateContent table tr.border-b:has(td[colspan="5"]) td:first-child { text-align: right !important; }
#estimateContent table tr.border-b:has(td[colspan="4"]) td:first-child { text-align: right !important; }
#estimateContent table tr.border-b:has(td[colspan="4"]) td:nth-child(5) { text-align: right !important; }
#estimateContent table tr.border-b:has(td[colspan="4"]) td:nth-child(6) { text-align: center !important; }
#estimateContent table tfoot td[colspan] { text-align: right !important; }
'''

          for filename in ['quotation/buildplanner.html', 'quotation/renovationplanner.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              marker = '\n</style>'
              if 'STANDARD PLANNER ESTIMATE ALIGNMENT' not in s:
                  if marker not in s:
                      raise SystemExit(f'Style marker not found: {filename}')
                  s = s.replace(marker, css + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner.html quotation/renovationplanner.html
          git diff --cached --quiet && exit 0
          git commit -m 'Standardize planner estimate text alignment'
          git push origin main
