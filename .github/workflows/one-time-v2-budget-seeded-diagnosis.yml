name: one-time-v2-budget-seeded-diagnosis
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose seeded contractor budget
        run: |
          mkdir -p /tmp/v2diag && cd /tmp/v2diag
          npm init -y >/dev/null 2>&1
          npm install playwright --silent
          npx playwright install chromium --with-deps >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const u='https://terajuciptabina-eng.github.io/terajuciptabina/quotation/buildplanner-v2.html?audience=contractor&contractorId=CTR-20260909-KMHM&quotationId=QT-BLD-MTVQWWEZ-GXIU';
            const state={customerName:'',projectLocation:'',builtUpArea:'200',rooms:[{id:'room-1',name:'Living',type:'living',area:'200'}],rates:{},customRates:[],customQuantities:[],customDescriptions:[],customRoomLabels:[],excludedItems:[],manualItems:[],standardRateItems:[],quotationType:'simple'};
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            p.on('console',m=>{if(m.type()==='error'||m.text().includes('TERAJU'))console.log('CONSOLE',m.type(),m.text())});
            p.on('pageerror',e=>console.log('PAGEERROR',e.message));
            await p.addInitScript(({state})=>{
              localStorage.setItem('teraju.contractor.local.v1.activeContractorId','CTR-20260909-KMHM');
              localStorage.setItem('teraju.contractor.local.v1.CTR-20260909-KMHM.build',JSON.stringify(state));
              const log=()=>{const c=document.getElementById('constructionBudgetContent');const rooms=[...document.querySelectorAll('#roomsContainer .room-card')].map(r=>({id:r.id,type:r.querySelector('.room-type')?.value,area:r.querySelector('.room-area')?.value}));console.log('SEEDSTATE',JSON.stringify({t:performance.now(),active:window.__TERAJU_MASTER_ENGINE_ACTIVE,gate:window.__TERAJU_MASTER_RULE_GATE_READY,getAll:typeof window.getAllItems,render:typeof window.renderConstructionBudget,rooms,text:c?.innerText||''}));};
              window.__seedDiag=log;
              new MutationObserver(()=>{const c=document.getElementById('constructionBudgetContent');if(c?.innerText)log()}).observe(document,{subtree:true,childList:true,characterData:true});
            },{state});
            await p.goto(u,{waitUntil:'domcontentloaded',timeout:30000});
            for(let i=0;i<20;i++){await p.evaluate(()=>window.__seedDiag?.());await p.waitForTimeout(500)}
            console.log('FINAL',JSON.stringify(await p.evaluate(()=>({active:window.__TERAJU_MASTER_ENGINE_ACTIVE,gate:window.__TERAJU_MASTER_RULE_GATE_READY,rooms:[...document.querySelectorAll('#roomsContainer .room-card')].map(r=>({id:r.id,type:r.querySelector('.room-type')?.value,area:r.querySelector('.room-area')?.value,name:r.querySelector('.room-name')?.value})),text:document.getElementById('constructionBudgetContent')?.innerText||'',html:(document.getElementById('constructionBudgetContent')?.innerHTML||'').slice(0,500)}))));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-v2-budget-seeded-diagnosis.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-v2-budget-seeded-diagnosis.yml
          git diff --cached --quiet || git commit -m "Remove one-time V2 seeded diagnosis"
          git push
