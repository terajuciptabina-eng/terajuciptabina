name: Fix Detailed Quotation Flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[quotation-flow-patched]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch quotation flow
        shell: python
        run: |
          from pathlib import Path
          import re

          PATCH = r'''\n\n/* =========================================================\n   TERAJU DETAILED QUOTATION FLOW\n   Simple quotation = FREE\n   Detailed quotation = RM49 unlock\n   The detailed quotation is prepared BEFORE payment and the\n   exact same HTML is unlocked AFTER verified payment.\n   ========================================================= */\n(function(){\n  const DETAIL_STATE_KEY = "terajuPendingDetailedQuotation";\n  const DETAIL_PAID_KEY = "terajuDetailedQuotationPaid";\n\n  function saveDetailedState(html){\n    try {\n      sessionStorage.setItem(DETAIL_STATE_KEY, JSON.stringify({\n        quotationNumber: typeof quotationNumber !== "undefined" ? quotationNumber : "",\n        html: html || "",\n        savedAt: Date.now()\n      }));\n    } catch(e) {}\n  }\n\n  function getDetailedState(){\n    try {\n      return JSON.parse(sessionStorage.getItem(DETAIL_STATE_KEY) || "null");\n    } catch(e) { return null; }\n  }\n\n  function isPaid(){\n    try {\n      const paid = JSON.parse(sessionStorage.getItem(DETAIL_PAID_KEY) || "null");\n      return !!(paid && paid.paid === true);\n    } catch(e) { return false; }\n  }\n\n  function showQuotation(){\n    const doc = document.getElementById("quotationDocument");\n    if (doc) doc.classList.remove("hidden");\n    const actions = document.getElementById("quotationPrintActions");\n    if (actions) actions.classList.remove("hidden");\n    const content = document.getElementById("quotationContent");\n    if (content) content.scrollIntoView({behavior:"smooth", block:"start"});\n  }\n\n  function showLockedPreview(html){\n    const content = document.getElementById("quotationContent");\n    if (!content) return;\n    content.innerHTML = `\n      <div class="detail-preview">\n        <div class="detail-preview-locked">${html}</div>\n        <div class="detail-preview-fade"></div>\n      </div>\n      <div class="detail-lock-card mt-5 p-6 text-center">\n        <div class="text-2xl mb-2">🔒</div>\n        <h3 class="text-xl font-bold">Detailed Quotation Locked</h3>\n        <p class="text-sm text-gray-500 mt-2 max-w-xl mx-auto">\n          Your detailed quotation has already been prepared. Unlock it to view the complete description, unit, quantity, rate and amount.\n        </p>\n        <button type="button" onclick="unlockDetailedQuotation()" class="mt-5 bg-black text-white px-6 py-3 rounded-lg font-semibold">\n          Unlock Detailed Quotation — RM49\n        </button>\n      </div>`;\n    const actions = document.getElementById("quotationPrintActions");\n    if (actions) actions.classList.add("hidden");\n    const doc = document.getElementById("quotationDocument");\n    if (doc) doc.classList.remove("hidden");\n    if (doc) doc.scrollIntoView({behavior:"smooth", block:"start"});\n  }\n\n  function prepareDetailedPreview(){\n    if (typeof isHomeowner === "function" && !isHomeowner()) return;\n\n    const originalVerify = window.hasVerifiedDetailedQuotationPayment;\n    const originalType = window.getSelectedQuotationType;\n    const originalGenerate = window.generateQuotation;\n\n    try {\n      if (typeof window.hasVerifiedDetailedQuotationPayment === "function") {\n        window.hasVerifiedDetailedQuotationPayment = function(){ return true; };\n      }\n      if (typeof window.getSelectedQuotationType === "function") {\n        window.getSelectedQuotationType = function(){ return "detail"; };\n      }\n\n      const radio = document.querySelector('input[name="quotationType"][value="detail"]');\n      if (radio) radio.checked = true;\n\n      if (typeof originalGenerate !== "function") {\n        alert("Unable to prepare the detailed quotation. Please refresh and try again.");\n        return;\n      }\n\n      originalGenerate();\n\n      const content = document.getElementById("quotationContent");\n      if (!content || !content.innerHTML.trim()) {\n        alert("Unable to prepare the detailed quotation. Please check your project details first.");\n        return;\n      }\n\n      saveDetailedState(content.innerHTML);\n      showLockedPreview(content.innerHTML);\n    } finally {\n      if (originalVerify) window.hasVerifiedDetailedQuotationPayment = originalVerify;\n      if (originalType) window.getSelectedQuotationType = originalType;\n    }\n  }\n\n  window.previewDetailedQuotation = prepareDetailedPreview;\n  window.requestDetailedQuotation = prepareDetailedPreview;\n\n  const originalStartPayment = window.startDetailedQuotationPayment;\n  if (typeof originalStartPayment === "function") {\n    window.startDetailedQuotationPayment = async function(){\n      const content = document.getElementById("quotationContent");\n      if (content && content.innerHTML.trim()) {\n        saveDetailedState((getDetailedState() || {}).html || content.innerHTML);\n      }\n      return originalStartPayment.apply(this, arguments);\n    };\n  }\n\n  window.generateDetailedQuotationAfterPayment = function(){\n    if (!isPaid()) return;\n    const state = getDetailedState();\n    if (!state || !state.html) {\n      alert("Your prepared detailed quotation could not be restored. Please return to the planner and generate the preview again.");\n      return;\n    }\n\n    if (typeof quotationNumber !== "undefined" && state.quotationNumber) {\n      quotationNumber = state.quotationNumber;\n    }\n\n    const content = document.getElementById("quotationContent");\n    if (content) content.innerHTML = state.html;\n    showQuotation();\n\n    const badge = document.createElement("div");\n    badge.className = "detail-unlocked-badge no-print mb-5";\n    badge.textContent = "✓ Detailed Quotation Unlocked";\n    if (content) content.insertBefore(badge, content.firstChild);\n  };\n\n  document.addEventListener("DOMContentLoaded", function(){\n    setTimeout(function(){\n      if (isPaid()) window.generateDetailedQuotationAfterPayment();\n    }, 250);\n  });\n})();\n'''

          for name in ["quotation/renovationplanner.html", "quotation/buildplanner.html"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              if "TERAJU DETAILED QUOTATION FLOW" in text:
                  print(f"Already patched: {name}")
                  continue
              marker = "</script>"
              idx = text.rfind(marker)
              if idx < 0:
                  raise SystemExit(f"No closing script tag found: {name}")
              text = text[:idx] + PATCH + "\n" + text[idx:]
              p.write_text(text, encoding="utf-8")
              print(f"Patched: {name}")

      - name: Validate HTML script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ["quotation/renovationplanner.html", "quotation/buildplanner.html"]:
              s=Path(f).read_text(encoding="utf-8")
              assert "TERAJU DETAILED QUOTATION FLOW" in s, f
              assert 'window.previewDetailedQuotation = prepareDetailedPreview' in s, f
              assert 'window.generateDetailedQuotationAfterPayment' in s, f
              print("OK", f)
          PY

      - name: Commit patched planners
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/renovationplanner.html quotation/buildplanner.html
          git commit -m "Apply unified quotation unlock flow [quotation-flow-patched]" || exit 0
          git push

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-detailed-quotation-flow.yml
          git commit -m "Remove one-shot quotation flow patch workflow [quotation-flow-patched]" || exit 0
          git push
