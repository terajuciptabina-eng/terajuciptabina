name: Temporary Planner UI Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[planner-ui-bg-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix hero background CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
            "'https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2200&q=88'":"url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2200&q=88')",
            "'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=88'":"url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=88')"
          }
          for f in ['quotation/buildplanner.html','quotation/renovationplanner.html']:
            p=Path(f); t=p.read_text(encoding='utf-8')
            for a,b in replacements.items(): t=t.replace(a,b)
            p.write_text(t,encoding='utf-8')
          PY
      - name: Commit full planner files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/buildplanner.html quotation/renovationplanner.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix planner hero backgrounds [planner-ui-bg-fix]"
          git push origin main
