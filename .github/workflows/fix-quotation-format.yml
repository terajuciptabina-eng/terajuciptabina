name: Fix quotation format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Build Planner and apply standard quotation format
        shell: bash
        run: |
          set -e
          git show 22526dea35d5807a3f74e5ceb6c5e635027404c5:quotation/buildplanner.html > quotation/buildplanner.html
          python3 <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner.html')
          s=p.read_text()
          s=s.replace('Rooms / Areas','Areas').replace('+ Add Room','+ Add Area')
          s=s.replace('Add each room or area.','Add each area.')
          s=s.replace('Select the room type and enter the floor area in sqft.','Select the area type and enter the floor area in sqft.')
          s=s.replace('Your room selections are used','Your area selections are used')
          marker='</style>'
          css='''\n    .simple-quotation-table,.detailed-quotation-table{width:100%!important;table-layout:fixed!important;border-collapse:collapse!important}\n    .simple-quotation-table col:nth-child(1){width:6%!important}.simple-quotation-table col:nth-child(2){width:18%!important}.simple-quotation-table col:nth-child(3){width:56%!important}.simple-quotation-table col:nth-child(4){width:20%!important}\n    .detailed-quotation-table col:nth-child(1){width:48%!important}.detailed-quotation-table col:nth-child(2){width:10%!important}.detailed-quotation-table col:nth-child(3){width:10%!important}.detailed-quotation-table col:nth-child(4){width:16%!important}.detailed-quotation-table col:nth-child(5){width:16%!important}\n    .quotation-section-row td{background:#f3f4f6;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-top:1px solid #d1d5db}\n    .quotation-subsection-row td{background:#fafafa;font-weight:700;color:#374151}\n    @media print{.simple-quotation-table,.detailed-quotation-table{width:100%!important;table-layout:fixed!important}.simple-quotation-table col:nth-child(1){width:6%!important}.simple-quotation-table col:nth-child(2){width:18%!important}.simple-quotation-table col:nth-child(3){width:56%!important}.simple-quotation-table col:nth-child(4){width:20%!important}.detailed-quotation-table col:nth-child(1){width:48%!important}.detailed-quotation-table col:nth-child(2){width:10%!important}.detailed-quotation-table col:nth-child(3){width:10%!important}.detailed-quotation-table col:nth-child(4){width:16%!important}.detailed-quotation-table col:nth-child(5){width:16%!important}}\n'''
          s=s.replace(marker,css+marker,1)
          script=r'''\n<script>\n(function(){\n  function qMoney(v){return new Intl.NumberFormat('en-MY',{style:'currency',currency:'MYR',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)}\n  function qEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}\n  function qQty(v,u){const n=Number(v)||0;return ['no','set','ls','unit'].includes(String(u||'').toLowerCase())?Math.round(n):(Number.isInteger(n)?n:Math.round(n*100)/100)}\n  function standardGenerateQuotation(){\n    const rooms=getRoomGroups(), data=getCurrentQuotationData();\n    if(!rooms.some(r=>r.area>0)){alert('Please add at least one area with a valid area before generating the quotation.');return}\n    quotationNumber=generateQuotationNumber();\n    const customer=document.getElementById('customerName')?.value||'Not specified';\n    const location=document.getElementById('projectLocation')?.value||'Not specified';\n    const declared=parseFloat(document.getElementById('builtUpArea')?.value)||0;\n    const roomsArea=rooms.reduce((s,r)=>s+(r.area||0),0);\n    const storeys=document.getElementById('numStoreys')?.value||'1';\n    const today=new Intl.DateTimeFormat('en-MY',{day:'2-digit',month:'long',year:'numeric'}).format(new Date());\n    const content=document.getElementById('quotationContent');\n    const groups=[\n      {title:'Preliminaries',items:data.prelim},\n      {title:'Structural Works',items:data.structures},\n      {title:'Architectural Works',items:data.rooms.flatMap(r=>data.archByRoom[r.roomId]||[])},\n      {title:'Electrical Works',items:data.electrical}\n    ].filter(g=>g.items.length);\n    let h=`<div class="flex justify-between items-start gap-6 border-b pb-5 mb-6"><div><div class="flex items-center gap-4 mb-4"><img src="../images/logo.png" class="h-14 w-auto"><div><h1 class="text-xl font-bold">TERAJU CIPTABINA RESOURCES</h1><p class="text-xs text-gray-500">No 10A, Jalan PP 2/1, Taman Putra Prima, 47100 Puchong, Selangor</p></div></div><h2 class="text-2xl font-bold uppercase">Quotation</h2></div><div class="text-right text-sm"><p><span class="text-gray-500">Quotation No.</span><br><strong>${qEsc(quotationNumber)}</strong></p><p class="mt-2"><span class="text-gray-500">Date</span><br><strong>${today}</strong></p></div></div><div class="grid md:grid-cols-3 gap-6 mb-7 text-sm"><div><p class="text-xs uppercase text-gray-500">Customer</p><p class="font-semibold">${qEsc(customer)}</p></div><div><p class="text-xs uppercase text-gray-500">Project Location</p><p class="font-semibold">${qEsc(location)}</p></div><div><p class="text-xs uppercase text-gray-500">Built-up Area</p><p class="font-semibold">${qQty(declared)} sqft · ${storeys} storey<br>${qQty(roomsArea)} sqft areas</p></div></div>`;\n    const type=getSelectedQuotationType();\n    if(type==='simple'){\n      h+=`<div class="overflow-x-auto"><table class="w-full border-collapse text-sm simple-quotation-table"><colgroup><col style="width:6%"><col style="width:18%"><col style="width:56%"><col style="width:20%"></colgroup><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">No.</th><th class="py-3 px-2">Work Section</th><th class="py-3 px-2">Description of Works</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>`;\n      let n=1; groups.forEach(g=>{const total=g.items.reduce((a,i)=>a+i.amount,0);h+=`<tr class="quotation-section-row"><td class="py-3 px-2">${n++}</td><td class="py-3 px-2">${qEsc(g.title)}</td><td class="py-3 px-2">${g.items.map(i=>qEsc(i.description)).join('<br>')}</td><td class="py-3 px-2 text-right font-semibold">${qMoney(total)}</td></tr>`});\n      h+=`</tbody><tfoot><tr class="border-t-2"><td colspan="3" class="py-4 px-2 text-right font-bold">TOTAL</td><td class="py-4 px-2 text-right font-bold text-lg">${qMoney(data.total)}</td></tr></tfoot></table></div>`;\n    }else{\n      h+=`<div class="overflow-x-auto"><table class="w-full border-collapse text-sm detailed-quotation-table"><colgroup><col style="width:48%"><col style="width:10%"><col style="width:10%"><col style="width:16%"><col style="width:16%"></colgroup><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>`;\n      groups.forEach(g=>{h+=`<tr class="quotation-section-row"><td colspan="5" class="py-3 px-2">${qEsc(g.title)}</td></tr>`; if(g.title==='Architectural Works'){rooms.forEach(r=>{const arr=data.archByRoom[r.roomId]||[];if(!arr.length)return;h+=`<tr class="quotation-subsection-row"><td colspan="5" class="py-2 px-2">${qEsc(r.label)} <span class="font-normal">(${qQty(r.area)} sqft)</span></td></tr>`;arr.forEach(i=>h+=`<tr class="border-b align-top"><td class="py-3 px-2">${qEsc(i.description)}</td><td class="py-3 px-2">${qEsc(i.unit)}</td><td class="py-3 px-2 text-right">${qQty(i.qty,i.unit)}</td><td class="py-3 px-2 text-right">${qMoney(i.rate)}</td><td class="py-3 px-2 text-right font-medium">${qMoney(i.amount)}</td></tr>`)})}else g.items.forEach(i=>h+=`<tr class="border-b align-top"><td class="py-3 px-2">${qEsc(i.description)}</td><td class="py-3 px-2">${qEsc(i.unit)}</td><td class="py-3 px-2 text-right">${qQty(i.qty,i.unit)}</td><td class="py-3 px-2 text-right">${qMoney(i.rate)}</td><td class="py-3 px-2 text-right font-medium">${qMoney(i.amount)}</td></tr>`)});\n      h+=`</tbody><tfoot><tr class="border-t-2"><td colspan="4" class="py-4 px-2 text-right font-bold">TOTAL</td><td class="py-4 px-2 text-right font-bold text-lg">${qMoney(data.total)}</td></tr></tfoot></table></div>`;\n    }\n    h+=`<div class="mt-8 pt-5 border-t text-sm"><p class="font-semibold mb-2">Terms / Notes</p><ul class="list-disc pl-5 space-y-1 text-gray-600"><li>This quotation is based on the stated built-up area, area schedule and rates applied herein.</li><li>Final scope, specifications, site conditions and pricing remain subject to site inspection and written confirmation.</li><li>Any additional works or authority requirements not listed above shall be quoted separately.</li></ul></div><div class="mt-12 text-sm"><p>Yours sincerely,</p><p class="font-bold mt-8">TERAJU CIPTABINA RESOURCES</p></div>`;\n    content.innerHTML=h;document.getElementById('quotationDocument').classList.remove('hidden');document.getElementById('quotationPrintActions').classList.remove('hidden');document.getElementById('quotationDocument').scrollIntoView({behavior:'smooth',block:'start'});\n  }\n  window.generateQuotation=standardGenerateQuotation;\n})();\n</script>\n'''
          s=s.replace('</body>',script+'</body>')
          p.write_text(s)
          PY
          git config user.name "Teraju Ciptabina Bot"
          git config user.email "actions@users.noreply.github.com"
          git add quotation/buildplanner.html
          git commit -m "Restore Build Planner and standardize quotation format" || true
          git push
          rm -f .github/workflows/fix-quotation-format.yml
          git add .github/workflows/fix-quotation-format.yml
          git commit -m "Remove temporary quotation format workflow" || true
          git push
