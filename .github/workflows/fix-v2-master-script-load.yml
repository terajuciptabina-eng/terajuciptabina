name: fix-v2-master-script-load
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Build Planner V2 loads the Master Engine
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="quotation-quantity-fix.js?v=20260922"></script>'
          if 'quotation-quantity-fix.js' not in s:
              if '</body>' not in s:
                  raise SystemExit('Build Planner V2 body closing tag not found')
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate HTML contains Master Engine
        run: grep -q 'quotation-quantity-fix.js' quotation/buildplanner-v2.html
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-v2-master-script-load.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html .github/workflows/fix-v2-master-script-load.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Load Master Engine in Build Planner V2'
          git push
