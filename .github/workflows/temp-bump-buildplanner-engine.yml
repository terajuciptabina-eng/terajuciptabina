name: Temporary Build Planner engine cache bump
on:
  push:
    paths:
      - '.github/workflows/temp-bump-buildplanner-engine.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump engine query version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text()
          old="quotation-quantity-fix.js?v=20260918"
          new="quotation-quantity-fix.js?v=20260921"
          if old not in s:
              raise SystemExit('Expected engine query version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m 'TERAJU Build Planner: bump engine cache version'
          git push
