name: Fix item action refresh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch refresh handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="function refresh(){if(typeof updateEstimate==='function')updateEstimate()}"
          new="function refresh(){if(typeof updateEstimate==='function')updateEstimate();if(typeof window.renderConstructionBudget==='function')window.renderConstructionBudget()}"
          if old not in s:
              raise SystemExit('refresh handler not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'Fix Build Planner item action refresh' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-item-actions-refresh.yml
          git add .github/workflows/fix-item-actions-refresh.yml
          git commit -m 'Remove temporary item action refresh workflow' || exit 0
          git push
