name: TERAJU Build Planner V2 source fix
on:
  push:
    branches: [fix/buildplanner-v2-master-path]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact Build Planner source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/buildplanner-v2.html')
          s=p.read_text(encoding='utf-8')
          old="masterItems.forEach(r=>{if(items.some(i=>i.id===r.id))return;const rate=typeof RATES!=='undefined'?Number(RATES[r.rateKey]||0):0;items.push({id:r.id,roomId:'project',room:'Project',category:'structures',description:r.description,qty:0,unit:r.unit,rate,amount:0,groupKey:r.groupTitle.toLowerCase().replace(/\\s+/g,'-'),groupTitle:r.groupTitle})});"
          new="masterItems.forEach(r=>{if(items.some(i=>i.id===r.id))return;const rate=typeof RATES!=='undefined'?Number(RATES[r.rateKey]||0):0;items.push({id:r.id,roomId:'project',room:'Project',category:'structures',description:r.description,qty:0,unit:r.unit,rate,amount:0,masterPath:r.path,groupKey:r.groupTitle.toLowerCase().replace(/\\s+/g,'-'),groupTitle:r.groupTitle})});"
          if old not in s:
              raise SystemExit('Expected master item source not found; no change made.')
          if 'masterPath:r.path' not in s:
              s=s.replace(old,new,1)
          old_loader="tag.src='quotation-quantity-fix.js?v=20260907'"
          new_loader="tag.src='quotation-quantity-fix.js?v=20260915'"
          if old_loader not in s:
              raise SystemExit('Expected old engine loader not found; no change made.')
          s=s.replace(old_loader,new_loader,1)
          p.write_text(s,encoding='utf-8')
          print('Build Planner V2 source fixed: masterPath + engine cache version.')
          PY
      - name: Validate exact result
        run: |
          grep -F "masterPath:r.path" quotation/buildplanner-v2.html
          grep -F "quotation-quantity-fix.js?v=20260915" quotation/buildplanner-v2.html
          if grep -Fq "quotation-quantity-fix.js?v=20260907" quotation/buildplanner-v2.html; then exit 1; fi
      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/teraju-fix-buildplanner-v2.yml
          git config user.name 'Teraju Ciptabina Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add quotation/buildplanner-v2.html .github/workflows/teraju-fix-buildplanner-v2.yml
          git commit -m 'Fix Build Planner V2 master rule binding'
          git push