name: One Shot Build Rate Cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[one-shot-build-rate-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove duplicate Build contractor database path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('quotation/quotation-quantity-fix.js')
          text=p.read_text(encoding='utf-8')
          pattern=r'  function installBuild\(\) \{.*?\n  function installRenovation'
          replacement='''  function installBuild() {
    if (!contractor || typeof window.getAllItems !== 'function' || typeof RATE_SCHEDULE === 'undefined') return false;
    if (!window.getAllItems.__terajuBuildMasterWrapped) {
      const original=window.getAllItems;
      const wrapped=function(){
        const items=original();
        const result=Array.isArray(items)?items:[];
        result.forEach(item=>{const description=buildFullDescription(item);if(description)item.description=description;});
        return result;
      };
      wrapped.__terajuBuildMasterWrapped=true;
      window.getAllItems=wrapped;
    }
    document.getElementById('homeownerQuotationOptions')?.classList.add('hidden');
    document.getElementById('contractorQuotationOptions')?.classList.remove('hidden');
    document.getElementById('rateScheduleSection')?.classList.remove('hidden');
    return true;
  }
function installRenovation'''
          text,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('installBuild not found')
          p.write_text(text,encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-build-rate-cleanup.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotation/quotation-quantity-fix.js
          git commit -m "Use one Build Rate Schedule for all roles [one-shot-build-rate-cleanup]"
          git push origin main
