name: Fix V2 hierarchy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[v2-hierarchy]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Build Planner V2 hierarchy levels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text(encoding='utf-8')
          old="let levels=path.length>1?path.slice(1,-1):[];"
          new="let levels=path.length>1?path.slice(0,-1):[];"
          if old not in s:
              raise SystemExit('Expected hierarchy expression not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: node --check quotation/quotation-quantity-fix.js
      - name: Commit source change and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'Fix Build Planner V2 hierarchy levels [v2-hierarchy]'
          git push
