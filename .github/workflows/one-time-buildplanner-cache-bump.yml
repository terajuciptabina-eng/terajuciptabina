name: One-time Build Planner engine cache bump
on:
  push:
    paths:
      - '.github/workflows/one-time-buildplanner-cache-bump.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Build Planner engine query version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quotation/buildplanner-v2.html')
          s = p.read_text(encoding='utf-8')
          old = 'quotation-quantity-fix.js?v=20260918'
          new = 'quotation-quantity-fix.js?v=20260921'
          if old not in s:
              raise SystemExit('Expected Build Planner engine query version not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Updated engine query version')
          PY
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/buildplanner-v2.html
          git commit -m 'TERAJU Build Planner: align engine source version'
          git push
