name: one-time-v2-budget-root-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply root source fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quotation/quotation-quantity-fix.js')
          s=p.read_text()
          old="window.getAllItems=getMasterItems;window.__TERAJU_MASTER_RULE_GATE_READY=true;if(typeof window.renderConstructionBudget==='function')window.renderConstructionBudget();if(!/buildplanner-v2\\.html$/i.test(location.pathname))window.renderConstructionBudget=renderBudget;"
          new="window.getAllItems=getMasterItems;if(!/buildplanner-v2\\.html$/i.test(location.pathname))window.renderConstructionBudget=renderBudget;"
          if old not in s:
            raise SystemExit('Expected Master Engine sequence not found; refusing unrelated edit')
          s=s.replace(old,new,1)
          marker="/* TERAJU V2 ITEM ACTIONS 20260917 */"
          pos=s.find(marker)
          if pos<0:
            raise SystemExit('V2 item actions marker not found')
          tail=s[pos:]
          if 'const N=v=>Number.isFinite(Number(v))?Number(v):0;' not in tail:
            s=s[:pos+len(marker)]+"\n(function(){\n'use strict';\n"+"const N=v=>Number.isFinite(Number(v))?Number(v):0;"+s[pos+len(marker):]
          else:
            raise SystemExit('V2 numeric helper already present; refusing duplicate edit')
          p.write_text(s)
          print('Applied: removed redundant early master render and added V2-local N helper')
          PY
          git diff --check
          git diff -- quotation/quotation-quantity-fix.js
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotation/quotation-quantity-fix.js
          git commit -m "Fix Build Planner V2 budget numeric helper"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-v2-budget-root-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-v2-budget-root-fix.yml
          git diff --cached --quiet || git commit -m "Remove one-time V2 budget root fix workflow"
          git push
