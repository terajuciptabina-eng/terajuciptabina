name: One-time Build Planner hierarchy source edit
on:
  push:
    paths:
      - '.github/workflows/fix-buildplanner-hierarchy.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite hierarchy renderer at source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('quotation/quotation-quantity-fix.js')
          s = p.read_text()
          start = s.find('function renderBudget(){')
          if start < 0:
              raise SystemExit('renderBudget source not found')
          m = re.search(r'function renderBudget\(\)\{.*?\}(?=function )', s[start:], re.S)
          if not m:
              raise SystemExit('renderBudget function boundary not found')
          new = r'''function renderBudget(){const c=document.getElementById('constructionBudgetContent');if(!c)return;const active=getMasterItems().filter(i=>typeof excludedItems==='undefined'||!excludedItems.has(i.id));if(!active.length){c.innerHTML='<div class="border rounded-xl bg-gray-50 p-5 text-center text-sm text-gray-500">Add rooms / areas to calculate the preliminary construction budget.</div>';return}const cats=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK'];const headerName=g=>({'PRELIMINARIES':'PRELIMINARIES','STRUCTURES':'STRUCTURAL WORKS','ARCHITECTURES':'ARCHITECTURAL WORKS','ELECTRICAL':'ELECTRICAL WORKS','DOORS & WINDOWS':'DOORS & WINDOWS','EXTERNAL WORK':'EXTERNAL WORKS'}[String(g||'').toUpperCase()]||String(g||''));const parts=p=>String(p||'').split('/').map(x=>String(x).trim()).filter(Boolean);const hierarchy=i=>{const g=String(i.group||'').toUpperCase(),p=parts(i.masterPath);if(g==='ARCHITECTURES'&&i.roomId&&i.roomId!=='project'&&/^BATHROOM$/i.test(p[0]||''))return{header:'ARCHITECTURAL WORKS',sub:'BATHROOM',subsub:i.room||null};if(g==='EXTERNAL WORK')return{header:'EXTERNAL WORKS',sub:'EXTERNAL WORK',subsub:p[0]||null};return{header:headerName(g),sub:p[0]||null,subsub:p.length>2?p.slice(1).join(' / '):p.length===2?p[1]:null}};const tree=[];cats.forEach(g=>{const items=active.filter(i=>String(i.group||'').toUpperCase()===g);if(!items.length)return;const bySub=new Map;items.forEach(i=>{const z=hierarchy(i);if(!bySub.has(z.sub||''))bySub.set(z.sub||'',{header:z.header,sub:z.sub,levels:new Map,noLevel3:[]});const node=bySub.get(z.sub||'');if(z.subsub){if(!node.levels.has(z.subsub))node.levels.set(z.subsub,[]);node.levels.get(z.subsub).push(i)}else node.noLevel3.push(i)});tree.push(...bySub.values())});let no=1,h='<table class="w-full border-collapse text-sm cr-budget-table"><thead><tr class="border-b-2 text-left"><th class="py-3 px-2">Item</th><th class="py-3 px-2">Description</th><th class="py-3 px-2">Unit</th><th class="py-3 px-2 text-right">Quantity</th><th class="py-3 px-2 text-right">Rate (RM)</th><th class="py-3 px-2 text-right">Amount (RM)</th></tr></thead><tbody>';let lastHeader='';tree.forEach(g=>{if(g.header!==lastHeader){h+=`<tr class="cr-group-row"><td colspan="6">${esc(g.header)}</td></tr>`;lastHeader=g.header}if(g.sub)h+=`<tr class="cr-hierarchy-row cr-level-2"><td colspan="6">${esc(g.sub)}</td></tr>`;g.levels.forEach((list,label)=>{h+=`<tr class="cr-hierarchy-row cr-level-3"><td colspan="6">${esc(label)}</td></tr>`;list.forEach(i=>{h+=`<tr class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no++}</td><td class="py-2 px-2">${esc(i.description)}</td><td class="py-2 px-2">${esc(i.unit)}</td><td class="py-2 px-2 text-right">${esc(i.qty)}</td><td class="py-2 px-2 text-right">${money(i.rate)}</td><td class="py-2 px-2 text-right font-semibold">${money(i.amount)}</td></tr>`})});g.noLevel3.forEach(i=>{h+=`<tr class="border-b align-top"><td class="py-2 px-2 text-gray-500">${no++}</td><td class="py-2 px-2">${esc(i.description)}</td><td class="py-2 px-2">${esc(i.unit)}</td><td class="py-2 px-2 text-right">${esc(i.qty)}</td><td class="py-2 px-2 text-right">${money(i.rate)}</td><td class="py-2 px-2 text-right font-semibold">${money(i.amount)}</td></tr>`})});h+='</tbody></table>';c.innerHTML=h}
'''
          end = start + m.end()
          s2 = s[:start] + new + s[end:]
          if s2 == s:
              raise SystemExit('No source change produced')
          p.write_text(s2)
          PY
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotation/quotation-quantity-fix.js
          git commit -m 'TERAJU Build Planner: fix nested budget hierarchy'
          git push
