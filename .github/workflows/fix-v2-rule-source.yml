name: Fix Build Planner V2 Rule Source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update master engine to use Global Calculation Rules API
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('quotation/quotation-quantity-fix.js')
          s = p.read_text(encoding='utf-8')
          pattern = r"async function load\(\)\{.*?\}\nconst rule="
          replacement = '''async function load(){const rawState=String(window.TERAJU_SELECTED_STATE||localStorage.getItem('teraju.planner.state.v1')||'').trim().toLowerCase();const state=rawState.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');const ruleUrl='https://terajuciptabina.vercel.app/api/calculation-rules',defaultRateUrl='../data/rates/default.json?source=master&v=20260921',stateRateUrl=state?`../data/rates/states/${encodeURIComponent(state)}.json?source=master&v=20260921`:'';const a=await fetch(ruleUrl,{cache:'no-store'});if(!a.ok)throw Error('Global Calculation Rules Master unavailable');const data=await a.json();const rows=Array.isArray(data?.rules)?data.rules:[];RULES=new Map(rows.filter(x=>x&&x.path).map(x=>[String(x.path).trim(),[x.group||'',x.path||'',x.description||'',x.method||'',x.coefficient||'',x.formula||'',x.output||'',x.basis||'',x.note||'']]));if(!RULES.size)throw Error('Global Calculation Rules Master returned no rules');let rateResponse=null;if(stateRateUrl){try{const r=await fetch(stateRateUrl,{cache:'no-store'});if(r.ok)rateResponse=r}catch{}}if(!rateResponse){const r=await fetch(defaultRateUrl,{cache:'no-store'});if(!r.ok)throw Error('Global Master rates unavailable');rateResponse=r}RATES=(await rateResponse.json()).rates||{}}
const rule='''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Expected master load function was not found exactly once')
          p.write_text(s2, encoding='utf-8')
      - name: Commit source fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-v2-rule-source.yml
          git add quotation/quotation-quantity-fix.js .github/workflows/fix-v2-rule-source.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Use Global Calculation Rules API in Build Planner V2'
          git push
