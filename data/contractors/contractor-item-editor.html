<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contractor Item Database | Teraju Ciptabina</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7;color:#1f2937}main{max-width:1100px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:block;font-weight:700;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:7px;font:inherit}button{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer;margin:8px 6px 0 0}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#111827;color:#fff}.danger{background:#fee2e2}.secondary{background:#e5e7eb}.ok{color:#087f23;font-weight:700}.error{color:#b00020;font-weight:700}.table-wrap{overflow:auto;margin-top:15px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left;vertical-align:middle}th{background:#f3f4f6}.num{width:110px}.small{width:90px}.check{text-align:center}.muted{color:#6b7280}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar button{margin:0}pre{background:#111827;color:#f3f4f6;padding:14px;border-radius:8px;overflow:auto;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<main>
<h1>Contractor Item Database</h1>
<p class="muted">Standalone editor. Data is kept in memory until you export it. No GitHub token and no GitHub write operation.</p>

<section class="card">
<h2>Contractor</h2>
<div class="grid">
<div><label for="contractorId">Contractor ID</label><input id="contractorId" value="CTR-DEMO-001"></div>
<div><label for="contractorName">Contractor name</label><input id="contractorName" value="Demo Contractor"></div>
<div><label for="state">State</label><input id="state" value="Selangor"></div>
<div><label for="projectType">Project type</label><select id="projectType"><option value="build">Build</option><option value="renovation">Renovation</option></select></div>
</div>
<div class="toolbar" style="margin-top:12px"><button class="primary" id="loadBtn">Load GitHub record</button><button class="secondary" id="newBtn">New empty record</button></div>
<div id="status" style="margin-top:12px">Ready.</div>
</section>

<section class="card">
<div class="toolbar"><h2 style="margin:0">Items</h2><button class="primary" id="addBtn">+ Add item</button><button class="secondary" id="validateBtn">Validate</button><button class="secondary" id="exportBtn">Export JSON</button></div>
<div class="table-wrap">
<table>
<thead><tr><th>Item ID</th><th>Description</th><th>Unit</th><th>Rate</th><th>Quantity</th><th>Included</th><th>Active</th><th>Action</th></tr></thead>
<tbody id="itemsBody"></tbody>
</table>
</div>
<p id="empty" class="muted">No items yet. Add an item or load a GitHub record.</p>
</section>

<section class="card" id="previewCard" hidden><h2>Canonical JSON</h2><pre id="preview"></pre></section>
</main>

<script src="./registry.js"></script>
<script src="./github-loader.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let items=[];

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function profile(){return{contractorId:$('contractorId').value.trim(),contractorName:$('contractorName').value.trim(),state:$('state').value.trim()};}
function render(){
 $('itemsBody').innerHTML=items.map((item,i)=>`<tr>
 <td><input class="small" data-i="${i}" data-k="itemId" value="${esc(item.itemId)}"></td>
 <td><input data-i="${i}" data-k="description" value="${esc(item.description)}"></td>
 <td><input class="small" data-i="${i}" data-k="unit" value="${esc(item.unit)}"></td>
 <td><input class="num" type="number" min="0" step="0.01" data-i="${i}" data-k="rate" value="${Number(item.rate)||0}"></td>
 <td><input class="num" type="number" min="0" step="0.01" data-i="${i}" data-k="quantity" value="${Number(item.quantity)||0}"></td>
 <td class="check"><input type="checkbox" data-i="${i}" data-k="included" ${item.included!==false?'checked':''}></td>
 <td class="check"><input type="checkbox" data-i="${i}" data-k="active" ${item.active!==false?'checked':''}></td>
 <td><button class="danger" data-delete="${i}">Delete</button></td></tr>`).join('');
 $('empty').hidden=items.length>0;
}
function setStatus(text,cls=''){ $('status').className=cls; $('status').textContent=text; }
function canonical(){
 const p=profile();
 if(!p.contractorId||!p.contractorName||!p.state) throw new Error('Contractor ID, name and state are required.');
 if(!window.TerajuContractorDatabaseRegistry) throw new Error('Registry unavailable.');
 return window.TerajuContractorDatabaseRegistry.makeRecord(p,$('projectType').value,items);
}
function validate(){
 try{const record=canonical();
  if(!record.items.every(x=>x.itemId&&x.description&&x.unit&&Number.isFinite(x.rate)&&x.rate>=0&&Number.isFinite(x.quantity)&&x.quantity>=0)) throw new Error('Every item needs Item ID, description, unit, valid rate and valid quantity.');
  setStatus(`VALID — canonical ${record.projectType} record contains ${record.items.length} item(s).`,'ok');
  $('preview').textContent=JSON.stringify(record,null,2); $('previewCard').hidden=false; return record;
 }catch(e){setStatus('INVALID — '+e.message,'error');throw e;}
}
$('itemsBody').addEventListener('input',e=>{const i=e.target.dataset.i,k=e.target.dataset.k;if(i===undefined||!k)return;items[i][k]=e.target.type==='number'?Number(e.target.value):e.target.value;});
$('itemsBody').addEventListener('change',e=>{const i=e.target.dataset.i,k=e.target.dataset.k;if(i===undefined||!k)return;if(e.target.type==='checkbox')items[i][k]=e.target.checked;});
$('itemsBody').addEventListener('click',e=>{const i=e.target.dataset.delete;if(i===undefined)return;items.splice(Number(i),1);render();setStatus('Item deleted.');});
$('addBtn').onclick=()=>{items.push({itemId:'',description:'',unit:'unit',rate:0,quantity:0,included:true,active:true});render();setStatus('New item added.');};
$('newBtn').onclick=()=>{items=[];$('previewCard').hidden=true;render();setStatus('New empty record ready.');};
$('validateBtn').onclick=()=>{try{validate();}catch(_){}};
$('exportBtn').onclick=()=>{try{const record=validate();const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${record.contractorId}-${record.projectType}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);setStatus('Canonical JSON exported successfully.','ok');}catch(_){}};
$('loadBtn').onclick=async()=>{try{const id=$('contractorId').value.trim();if(!id)throw new Error('Contractor ID is required.');const record=await window.TerajuContractorGitHubLoader.loadRecord(id,$('projectType').value);$('contractorName').value=record.contractorName;$('state').value=record.state;items=record.items.map(x=>({itemId:x.itemId,description:x.description,unit:x.unit,rate:x.rate,quantity:x.quantity,included:x.included,active:x.active}));render();setStatus(`Loaded ${record.projectType} record from GitHub: ${items.length} item(s).`,'ok');$('previewCard').hidden=true;}catch(e){setStatus('Load failed — '+e.message,'error');}};
render();
</script>
</body>
</html>
