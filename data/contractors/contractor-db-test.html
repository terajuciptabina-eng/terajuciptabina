<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contractor DB Contract Test | Teraju Ciptabina</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f7f7;color:#1f2937}main{max-width:900px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-top:16px}.pass{color:#087f23}.fail{color:#b00020}li{margin:7px 0}pre{background:#111827;color:#f3f4f6;padding:14px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<main>
<h1>Contractor Database Contract Test</h1>
<p>This page tests the contractor registry, canonical record shape, and read-only GitHub loader without touching the planners.</p>
<section class="card"><h2 id="summary">Running tests…</h2><ul id="results"></ul></section>
<section class="card"><h2>Generated sample</h2><pre id="sample"></pre></section>
<script src="./registry.js"></script>
<script src="./github-loader.js"></script>
<script>
'use strict';
const results=[];
function test(name,fn){try{fn();results.push({name,ok:true});}catch(e){results.push({name,ok:false,error:e.message});}}
function assert(ok,msg){if(!ok)throw new Error(msg);}
function requiredRecordShape(record,type){
 assert(record && typeof record==='object' && !Array.isArray(record),'record must be an object');
 ['schemaVersion','contractorId','contractorName','state','projectType','updatedAt','items'].forEach(k=>assert(Object.prototype.hasOwnProperty.call(record,k),`missing record field: ${k}`));
 assert(record.schemaVersion===1,'schemaVersion must be 1');
 assert(record.projectType===type,`projectType must be ${type}`);
 assert(typeof record.updatedAt==='string' && !Number.isNaN(Date.parse(record.updatedAt)),'updatedAt must be date-time');
 assert(Array.isArray(record.items),'items must be an array');
 record.items.forEach((item,i)=>{
  ['id','contractorId','contractorName','state','projectType','itemId','description','unit','rate','quantity','included','active','updatedAt'].forEach(k=>assert(Object.prototype.hasOwnProperty.call(item,k),`item ${i+1} missing field: ${k}`));
  assert(typeof item.rate==='number' && item.rate>=0,`item ${i+1} rate invalid`);
  assert(typeof item.quantity==='number' && item.quantity>=0,`item ${i+1} quantity invalid`);
  assert(typeof item.included==='boolean',`item ${i+1} included invalid`);
  assert(typeof item.active==='boolean',`item ${i+1} active invalid`);
 });
}
const registry=window.TerajuContractorDatabaseRegistry;
test('Registry is available',()=>assert(!!registry,'TerajuContractorDatabaseRegistry not found'));
test('Registry exposes both project types',()=>assert(JSON.stringify(registry.PROJECT_TYPES)==='["build","renovation"]','project types mismatch'));
let sampleBuild=null;
test('Registry generates valid build record',()=>{sampleBuild=registry.makeRecord({contractorId:'CTR-TEST-001',contractorName:'Test Contractor',state:'Selangor'},'build',[{itemId:'TEST-001',description:'Concrete work',unit:'m2',rate:125.5,quantity:10,included:true,active:true}]);requiredRecordShape(sampleBuild,'build');assert(sampleBuild.items[0].id==='TEST-001','item id mapping failed');});
test('Registry generates valid renovation record',()=>{const r=registry.makeRecord({contractorId:'CTR-TEST-001',contractorName:'Test Contractor',state:'Selangor'},'renovation',[]);requiredRecordShape(r,'renovation');});
test('Loader builds correct GitHub paths',()=>{const a=window.TerajuContractorGitHubLoader.buildRecordUrl('CTR-TEST-001','build');const b=window.TerajuContractorGitHubLoader.buildRecordUrl('CTR-TEST-001','renovation');assert(a.includes('/data/contractors/records/CTR-TEST-001/build.json'),'build path mismatch');assert(b.includes('/data/contractors/records/CTR-TEST-001/renovation.json'),'renovation path mismatch');});
test('Loader validates generated record',()=>{window.TerajuContractorGitHubLoader.validateRecord(sampleBuild,'CTR-TEST-001','build');});
async function runRemote(){
 const loader=window.TerajuContractorGitHubLoader;
 try{const db=await loader.loadContractorDatabase('CTR-DEMO-001');
  test('GitHub demo build record loads',()=>{assert(!!db.build,'build record missing');requiredRecordShape(db.build,'build');});
  test('GitHub demo renovation record loads',()=>{assert(!!db.renovation,'renovation record missing');requiredRecordShape(db.renovation,'renovation');});
  test('GitHub demo records are empty',()=>{assert(db.build.items.length===0,'demo build should be empty');assert(db.renovation.items.length===0,'demo renovation should be empty');});
  test('GitHub demo load has no errors',()=>assert(Object.keys(db.errors).length===0,'loader reported project errors'));
 }catch(e){results.push({name:'GitHub demo load',ok:false,error:e.message});}
 render();
}
function render(){const passed=results.filter(x=>x.ok).length,failed=results.length-passed;$('summary').textContent=`${failed===0?'PASS':'FAIL'} — ${passed}/${results.length} tests passed`;$('summary').className=failed===0?'pass':'fail';$('results').innerHTML=results.map(x=>`<li class="${x.ok?'pass':'fail'}">${x.ok?'PASS':'FAIL'} — ${x.name}${x.error?' — '+x.error:''}</li>`).join('');$('sample').textContent=sampleBuild?JSON.stringify(sampleBuild,null,2):'No sample generated.';}
runRemote();
</script>
</main>
</body>
</html>
