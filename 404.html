<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Teraju Ciptabina Resources</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var match = path.match(/^(.*)\/quotation(?:\/(.*))?$/);
      if (match) {
        var base = match[1] || '';
        var suffix = match[2] || '';
        var target = base + '/TerajuWorks/' + suffix;
        window.location.replace(target + window.location.search + window.location.hash);
        return;
      }
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px;color:#0f172a">
  <h1>Page not found</h1>
  <p>The requested page could not be found.</p>
</body>
</html>
