<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Calculation Rules</title><style>body{margin:0;background:#f5f7fb;color:#18212f;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.panel{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:18px;margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#687386;text-transform:uppercase}.title{font-size:28px;font-weight:850;margin:5px 0}.muted{color:#687386;font-size:13px;line-height:1.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,.toolbar button{min-height:42px;padding:0 12px;border:1px solid #d7dce4;border-radius:10px;font:inherit}.toolbar input{flex:1;min-width:240px}.toolbar button{cursor:pointer;font-weight:800;background:#111827;color:#fff}.status{font-size:12px;margin-top:10px}.error{color:#991b1b}.section{background:#fff;border:1px solid #e5e9f0;border-radius:16px;margin-bottom:18px;overflow:hidden}.head{padding:15px 18px;background:#eef2f7;display:flex;justify-content:space-between}.wraptable{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1500px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #e5e9f0;text-align:left;vertical-align:top;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#687386}.path{font-weight:700}.desc{line-height:1.45}.note{color:#687386;line-height:1.45}.formula{font-family:ui-monospace,monospace;font-size:12px}.delete{width:28px;height:28px;padding:0;border:0;border-radius:8px;background:#fff;color:#b91c1c;font-size:18px;font-weight:900;cursor:pointer}.delete:disabled{opacity:.45}.login{max-width:430px;margin:70px auto}.login input,.login button{width:100%;min-height:44px;box-sizing:border-box;padding:0 13px;border:1px solid #d1d5db;border-radius:11px;font:inherit;margin-top:10px}.login button{background:#111827;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none}@media(max-width:700px){.top{display:block}.toolbar{flex-direction:column}.toolbar input{min-width:0}.table{min-width:0}.table thead{display:none}.table,.table tbody,.table tr,.table td{display:block;width:100%}.table td{border:0;padding:5px 0}.table td:before{content:attr(data-label);display:block;font-size:10px;text-transform:uppercase;color:#687386;font-weight:800;margin-bottom:2px}}</style></head><body><main class="wrap"><div id="login" class="panel login"><div class="eyebrow">TERAJU WORKS</div><div class="title">Admin Calculation Rules</div><div class="muted">The public Calculation Rules source remains read-only. This Admin view provides the permanent delete control.</div><form id="form"><input id="key" type="password" placeholder="Admin password / key" autocomplete="current-password" required><button id="btn">Log In</button></form><div id="loginStatus" class="status"></div></div><section id="app" class="hidden"><div class="top"><div><div class="eyebrow">GLOBAL MASTER SOURCE</div><div class="title">Calculation Rules — Admin</div><div class="muted">Permanent delete changes the public global master source used by all planner modules.</div></div><a href="admin.html">Admin Control</a></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search item, description, formula, unit..."><select id="group"><option value="all">All groups</option><option>PRELIMINARIES</option><option>STRUCTURES</option><option>ARCHITECTURES</option><option>ELECTRICAL</option><option>DOORS & WINDOWS</option><option>EXTERNAL WORK</option></select></div><div id="status" class="status"></div><div id="summary" class="muted"></div></div><div id="sections"></div></section></main><script>const API='https://terajuciptabina.vercel.app/api/calculation-rules',KEY='teraju.admin.key',order=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK'],$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rules=[],adminKey='';async function auth(k){const r=await fetch(API+'?admin=1',{headers:{'X-Admin-Key':k},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Admin authentication failed.');if(!Array.isArray(d.rules))throw new Error('Invalid Calculation Rules response.');adminKey=k;sessionStorage.setItem(KEY,k);$('login').classList.add('hidden');$('app').classList.remove('hidden');rules=d.rules;render()}function render(){const q=$('search').value.toLowerCase(),g=$('group').value,rows=rules.filter(r=>(g==='all'||r.group===g)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));$('summary').textContent=`Showing ${rows.length} of ${rules.length} global rules`;$('sections').innerHTML='';for(const gn of order){const rs=rows.filter(r=>r.group===gn);if(!rs.length)continue;const s=document.createElement('section');s.className='section';s.innerHTML=`<div class="head"><b>${esc(gn)}</b><span>${rs.length} rules</span></div><div class="wraptable"><table class="table"><thead><tr><th>×</th><th>Item / Hierarchy</th><th>Full Contractor Description</th><th>Method</th><th>Coefficient / Factor</th><th>Formula</th><th>Output</th><th>Basis / Reference</th></tr></thead><tbody>${rs.map(r=>`<tr><td data-label="Permanent Delete"><button class="delete" data-path="${esc(r.path)}">×</button></td><td class="path" data-label="Item / Hierarchy">${esc(r.path)}</td><td class="desc" data-label="Description">${esc(r.description)}</td><td data-label="Method">${esc(r.method)}</td><td data-label="Coefficient">${esc(r.coefficient)}</td><td class="formula" data-label="Formula">${esc(r.formula)}</td><td data-label="Output"><b>${esc(r.output)}</b></td><td class="note" data-label="Basis">${esc(r.basis)}<br>${esc(r.note)}</td></tr>`).join('')}</tbody></table></div>`;$('sections').appendChild(s)}document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>del(b))}async function del(b){const p=b.dataset.path;if(!confirm(`PERMANENT DELETE\n\n${p}\n\nThis removes the rule from the GLOBAL master source for all planner users/modules. Continue?`))return;b.disabled=true;$('status').textContent='Deleting permanently…';try{const r=await fetch(API,{method:'DELETE',headers:{'X-Admin-Key':adminKey,'Content-Type':'application/json'},body:JSON.stringify({path:p})}),d=await r.json();if(!r.ok)throw new Error(d.message||'Permanent delete failed.');rules=rules.filter(x=>x.path!==p);render();$('status').textContent='Permanently deleted: '+p}catch(e){b.disabled=false;$('status').textContent=e.message;$('status').className='status error'}}$('form').onsubmit=async e=>{e.preventDefault();const b=$('btn');b.disabled=true;b.textContent='Authenticating…';try{await auth($('key').value.trim())}catch(e){$('loginStatus').textContent=e.message;$('loginStatus').className='status error'}finally{b.disabled=false;b.textContent='Log In'}};$('search').oninput=render;$('group').onchange=render;(async()=>{const k=sessionStorage.getItem(KEY)||'';if(!k)return;try{await auth(k)}catch{sessionStorage.removeItem(KEY)}})();</script></body></html>
