let adminKey='',adminUser='',editingPath='';
function norm(r){return Array.isArray(r)?{group:r[0]||'',path:r[1]||'',description:r[2]||'',method:r[3]||'',coefficient:r[4]||'',formula:r[5]||'',output:r[6]||'',basis:r[7]||'',note:r[8]||''}:r||{}}
async function api(o={}){const r=await fetch(API,{...o,headers:{'X-Admin-Username':adminUser,'X-Admin-Password':adminKey,...(o.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed.');return d}
async function login(u,p){adminUser=u;adminKey=p;const d=await api();if(!Array.isArray(d.rules))throw Error('Invalid Calculation Rules response.');sessionStorage.setItem(KEY,p);sessionStorage.setItem(USER,u);$('login').classList.add('hidden');$('app').classList.remove('hidden');rules=d.rules.map(norm);render()}
function render(){const q=$('search').value.trim().toLowerCase(),g=$('group').value,rows=rules.filter(r=>(g==='all'||r[0]===g||r.group===g)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));$('summary').textContent=`Showing ${rows.length} of ${rules.length} global rules`;let h='';for(const gn of ORDER){const rs=rows.filter(r=>(r.group||r[0])===gn);if(!rs.length)continue;h+=`<tr class="group"><td colspan="9">${esc(gn)} · ${rs.length} rules</td></tr>`;let top='',sub='';for(const r0 of rs){const r=norm(r0),parts=String(r.path).split(' / '),a=parts[0]||'',b=parts.length>2?parts[1]:'',item=parts.length>2?parts.slice(2).join(' / '):(parts[1]||parts[0]);if(a!==top){h+=`<tr class="hier"><td colspan="9">${esc(a)}</td></tr>`;top=a;sub=''}if(b&&b!==sub){h+=`<tr class="subhier"><td colspan="9">${esc(b)}</td></tr>`;sub=b}h+=`<tr><td>${esc(item)}</td><td>${esc(r.description)}</td><td>${esc(r.method)}</td><td>${esc(r.coefficient)}</td><td>${esc(r.formula)}</td><td><b>${esc(r.output)}</b></td><td>${esc(r.basis)}</td><td>${esc(r.note)}</td><td class="actions"><button onclick="editRule(${JSON.stringify(r.path)})">Edit</button> <button class="delete" onclick="deleteRule(${JSON.stringify(r.path)})">Delete</button></td></tr>`}h+=`<tr class="add"><td colspan="9"><button onclick="addRule(${JSON.stringify(gn)})">+ Add New Rule to ${esc(gn)}</button></td></tr>`}$('tbody').innerHTML=h}
function fill(r){$('fGroup').value=r.group||ORDER[0];$('fPath').value=r.path||'';$('fDescription').value=r.description||'';$('fMethod').value=r.method||'';$('fCoefficient').value=r.coefficient||'';$('fFormula').value=r.formula||'';$('fOutput').value=r.output||'';$('fBasis').value=r.basis||'';$('fNote').value=r.note||''}
function addRule(g){editingPath='';$('modalTitle').textContent='Add Calculation Rule';$('modalText').textContent='Add to the single global master.';fill({group:g});$('modal').classList.remove('hidden')}
function editRule(path){const r=rules.map(norm).find(x=>x.path===path);if(!r)return;editingPath=path;$('modalTitle').textContent='Edit Calculation Rule';$('modalText').textContent='Edit the global standard used by all consumers.';fill(r);$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');editingPath=''}
async function save(e){e.preventDefault();const rule={group:$('fGroup').value,path:$('fPath').value.trim(),description:$('fDescription').value.trim(),method:$('fMethod').value.trim(),coefficient:$('fCoefficient').value.trim(),formula:$('fFormula').value.trim(),output:$('fOutput').value.trim(),basis:$('fBasis').value.trim(),note:$('fNote').value.trim()};try{const d=await api({method:editingPath?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(editingPath?{originalPath:editingPath,rule}:{rule})});closeModal();$('status').textContent=d.message||'Saved.';await load()}catch(e){$('formStatus').textContent=e.message;$('formStatus').className='status error'}}
async function deleteRule(path){if(!confirm(`PERMANENT DELETE\n\n${path}\n\nContinue?`))return;try{await api({method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});$('status').textContent='Deleted: '+path;await load()}catch(e){$('status').textContent=e.message;$('status').className='status error'}}
async function load(){const d=await api();rules=(d.rules||[]).map(norm);render()}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await login($('username').value.trim(),$('password').value)}catch(e){$('loginStatus').textContent=e.message;$('loginStatus').className='status error'}};$('ruleForm').onsubmit=save;$('cancelBtn').onclick=closeModal;$('search').oninput=render;$('group').onchange=render;(async()=>{const u=sessionStorage.getItem(USER)||'',p=sessionStorage.getItem(KEY)||'';if(u&&p){try{await login(u,p)}catch{sessionStorage.removeItem(KEY);sessionStorage.removeItem(USER)}}})();
</script></body></html>
