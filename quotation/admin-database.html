<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Database | TERAJU WORKS</title><style>body{margin:0;background:#f3f4f6;color:#111827;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 8px 28px rgba(0,0,0,.05)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#6b7280;text-transform:uppercase}.title{font-size:28px;font-weight:850;margin:5px 0}.muted{color:#6b7280;font-size:12px}.controls{display:grid;grid-template-columns:1.1fr .7fr 1fr auto;gap:10px}input,select,button{min-height:44px;border:1px solid #d1d5db;border-radius:11px;padding:0 13px;font:inherit}button{cursor:pointer;font-weight:800;background:#111827;color:#fff;border-color:#111827}.status{font-size:12px;margin-top:10px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eef0f2;font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:#6b7280}.actions button{width:30px;min-height:30px;padding:0;background:#fff;color:#b91c1c;border:0;font-size:18px}.actions a{font-size:12px;font-weight:800;color:#111827}.hidden{display:none}@media(max-width:760px){.top{display:block}.controls{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">TERAJU WORKS</div><div class="title">Admin Database</div><div class="muted">Admin inspection dashboard for accounts and quotation records.</div></div><a href="../admin.html">Admin Control</a></div><section class="panel"><div class="controls"><input id="q" placeholder="Search ID, name, email or phone"><select id="role"><option value="">All accounts</option><option value="homeowner">Homeowner</option><option value="contractor">Contractor</option></select><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="load">Load database</button></div><div id="status" class="status"></div></section><section id="result" class="panel hidden"></section></main><script>const API='https://terajuciptabina.vercel.app/api/admin',KEY='teraju.admin.key',q=document.getElementById('q'),role=document.getElementById('role'),key=document.getElementById('key'),status=document.getElementById('status'),result=document.getElementById('result'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const k=key.value.trim()||sessionStorage.getItem(KEY)||'';if(!k){location.href='../admin.html';return}sessionStorage.setItem(KEY,k);status.textContent='Loading…';try{const p=new URLSearchParams({role:role.value,q:q.value,records:'1'}),r=await fetch(API+'?'+p,{headers:{'X-Admin-Key':k},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load database.');const a=(d.accounts||[]).sort((x,y)=>Date.parse(y.createdAt||'')-Date.parse(x.createdAt||''));result.classList.remove('hidden');result.innerHTML='<div class="eyebrow">Records</div><h2>'+a.length+' account(s)</h2><div class="table"><table><thead><tr><th>Account</th><th>Profile</th><th>Quotations</th><th>Sign Up</th><th>Actions</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+esc(x.id||'-')+'</b><br><span class="muted">'+esc(x.role||'-')+'</span></td><td>'+esc(x.name||'-')+'<br>'+esc(x.email||'-')+'<br>'+esc(x.phone||'-')+'</td><td>'+((Number(x.buildCount)||0)+(Number(x.renovationCount)||0))+'</td><td>'+esc(x.createdAt||'-')+'</td><td class="actions"><a href="admin-quotation.html?id='+encodeURIComponent(x.id||'')+'">Open</a> <button data-id="'+esc(x.id||'')+'" data-role="'+esc(x.role||'')+'">×</button></td></tr>').join('')+'</tbody></table></div>';result.querySelectorAll('.actions button').forEach(b=>b.onclick=()=>del(b));status.textContent='Database loaded.'}catch(e){status.textContent=e.message}}async function del(b){const k=key.value.trim()||sessionStorage.getItem(KEY)||'';if(!confirm('Permanently delete '+b.dataset.role+' '+b.dataset.id+'?'))return;const r=await fetch(API,{method:'DELETE',headers:{'X-Admin-Key':k,'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,role:b.dataset.role})});const d=await r.json();if(!r.ok){status.textContent=d.message||'Delete failed.';return}status.textContent='Deleted '+b.dataset.id;load()}key.value=sessionStorage.getItem(KEY)||'';document.getElementById('load').onclick=load;load();</script></body></html>
