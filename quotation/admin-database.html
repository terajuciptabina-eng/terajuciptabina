<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Database | TERAJU WORKS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.header{background:#fff;border-bottom:1px solid #e5e7eb}
.header .top{padding:16px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}
.title{font-size:26px;font-weight:850;margin:5px 0}
.muted{color:#6b7280;font-size:12px;line-height:1.5}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f8fafc;font-size:10px;font-weight:800;white-space:nowrap}
.nav{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 14px}
.nav a{color:#374151;text-decoration:none;font-size:12px;font-weight:700;padding:8px 11px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}
.nav .back-nav{font-weight:800}
.wrap{padding:24px}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 8px 28px rgba(0,0,0,.04)}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) .7fr 1fr auto;gap:10px}
input,select,button{min-height:42px;border:1px solid #d1d5db;border-radius:11px;padding:0 12px;font:inherit}
button{cursor:pointer;font-weight:800;background:#111827;color:#fff;border-color:#111827}
.status{font-size:12px;margin-top:10px}
.table{overflow:auto;border:1px solid #eef0f2;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #eef0f2;font-size:13px;vertical-align:top}
th{font-size:10px;text-transform:uppercase;color:#6b7280;background:#fafafa}
.actions button{width:30px;min-height:30px;padding:0;background:#fff;color:#b91c1c;border:0;font-size:18px}
.actions a{font-size:12px;font-weight:800;color:#111827;text-decoration:none}
.hidden{display:none!important}
@media(max-width:760px){.header .top{display:block;padding:14px}.nav{padding:0 14px 14px}.tag{margin-top:10px}.wrap{padding:16px 12px}.controls{grid-template-columns:1fr}.title{font-size:22px}}
</style>
<link rel="stylesheet" href="shared/teraju-workspace-theme.css">
</head>
<body class="tw-theme">
<header class="header">
  <div class="top">
    <div>
      <div class="eyebrow">TERAJU WORKS · ADMIN</div>
      <div class="title">Admin Database</div>
      <div class="muted">Accounts, quotation records and profile records.</div>
    </div>
    <div class="tag">AUTHENTICATED ADMIN</div>
  </div>
  <nav class="nav">
    <a class="back-nav" href="admin.html" onclick="if(history.length>1){event.preventDefault();history.back()}">← Back</a>
    <a href="admin.html">Home</a>
    <a href="admin-calculation-rules.html">Calculation Rules</a>
    <a href="admin-rate-management.html">Rate Management</a>
    <a href="admin-rate-comparison.html">Rate Comparison</a>
    <a href="admin-quotation.html">Admin Quotation</a>
  </nav>
</header>
<main class="wrap">
  <section class="panel">
    <div class="controls">
      <input id="q" placeholder="Search ID, name, email or phone">
      <select id="role"><option value="">All accounts</option><option value="homeowner">Homeowner</option><option value="contractor">Contractor</option></select>
      <div></div>
      <button id="load" type="button">Load database</button>
    </div>
    <div id="status" class="status"></div>
  </section>
  <section id="result" class="panel hidden"></section>
</main>
<script>
const API='https://terajuciptabina.vercel.app/api/admin';
const KEY='teraju.admin.key',USER='teraju.admin.username';
const q=document.getElementById('q'),role=document.getElementById('role'),status=document.getElementById('status'),result=document.getElementById('result');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function adminSession(){
  const username=sessionStorage.getItem(USER)||'';
  const password=sessionStorage.getItem(KEY)||'';
  if(!username||!password){location.href='admin.html';throw new Error('Admin session not found. Returning to Admin Control.');}
  return {username,password};
}
function adminHeaders(){const s=adminSession();return {'X-Admin-Username':s.username,'X-Admin-Password':s.password};}
async function load(){
  status.textContent='Loading…';
  try{
    const p=new URLSearchParams({role:role.value,q:q.value,records:'1'});
    const r=await fetch(API+'?'+p,{headers:adminHeaders(),cache:'no-store'});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.message||'Unable to load database.');
    const a=(d.accounts||[]).sort((x,y)=>Date.parse(y.createdAt||'')-Date.parse(x.createdAt||''));
    result.classList.remove('hidden');
    result.innerHTML='<div class="eyebrow">Records</div><h2>'+a.length+' account(s)</h2><div class="table"><table><thead><tr><th>Account</th><th>Profile</th><th>Quotations</th><th>Sign Up</th><th>Actions</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+esc(x.id||'-')+'</b><br><span class="muted">'+esc(x.role||'-')+'</span></td><td>'+esc(x.name||'-')+'<br>'+esc(x.email||'-')+'<br>'+esc(x.phone||'-')+'</td><td>'+((Number(x.buildCount)||0)+(Number(x.renovationCount)||0))+'</td><td>'+esc(x.createdAt||'-')+'</td><td class="actions"><a href="admin-quotation.html?id='+encodeURIComponent(x.id||'')+'">Open</a> <button data-id="'+esc(x.id||'')+'" data-role="'+esc(x.role||'')+'" title="Delete account">×</button></td></tr>').join('')+'</tbody></table></div>';
    result.querySelectorAll('.actions button').forEach(b=>b.onclick=()=>del(b));
    status.textContent='Database loaded.';
  }catch(e){status.textContent=e.message||'Unable to load database.';}
}
async function del(b){
  const s=adminSession();
  if(!confirm('Permanently delete '+b.dataset.role+' '+b.dataset.id+'?'))return;
  const r=await fetch(API,{method:'DELETE',headers:{'X-Admin-Username':s.username,'X-Admin-Password':s.password,'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.id,role:b.dataset.role})});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){status.textContent=d.message||'Delete failed.';return;}
  status.textContent='Deleted '+b.dataset.id;
  load();
}

document.getElementById('load').onclick=load;
q.addEventListener('keydown',e=>{if(e.key==='Enter')load()});
role.addEventListener('change',load);
load();
</script>
</body>
</html>
