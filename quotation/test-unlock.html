<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Detailed Quotation Unlock Test | Teraju Ciptabina</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
.top{padding:18px 24px;background:#111;color:#fff;display:flex;gap:12px;align-items:center;justify-content:space-between}
button{padding:12px 18px;background:#fff;color:#111;border:0;border-radius:8px;font-weight:700;cursor:pointer}
#status{padding:16px 24px;background:#fff;border-bottom:1px solid #ddd;font-size:14px}
iframe{display:block;width:100%;height:calc(100vh - 122px);border:0;background:#fff}
small{opacity:.75}
</style>
</head>
<body>
<div class="top">
  <div><strong>Detailed Quotation Unlock Test</strong><br><small>Temporary frontend-only test</small></div>
  <button id="test">Simulate Paid → Produce Detailed Quotation</button>
</div>
<div id="status">Planner loading…</div>
<iframe id="planner" src="renovationplanner.html?audience=homeowner"></iframe>
<script>
const iframe=document.getElementById('planner');
const status=document.getElementById('status');

iframe.addEventListener('load',()=>{
  status.textContent='Renovation Planner loaded. Click the button above to simulate a successful payment and run the REAL detailed quotation generation function.';
});

document.getElementById('test').addEventListener('click',()=>{
  const w=iframe.contentWindow;
  try{
    w.sessionStorage.setItem('terajuDetailedQuotationPaid',JSON.stringify({
      paid:true,
      billCode:'TEST',
      orderId:'TEST',
      quotationNumber:'',
      verifiedAt:Date.now(),
      testMode:true
    }));

    /* Use the planner's actual functions — this is the important test. */
    if(typeof w.addRoom==='function') w.addRoom('living','100');
    if(typeof w.generateDetailedQuotationAfterPayment==='function'){
      w.generateDetailedQuotationAfterPayment();
      status.textContent='Test executed. The planner should now display the Detailed Quotation below.';
    }else{
      status.textContent='ERROR: generateDetailedQuotationAfterPayment() was not found in the planner.';
    }
  }catch(err){
    console.error(err);
    status.textContent='ERROR: '+err.message;
  }
});
</script>
</body>
</html>
