<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TERAJU WORKS — Build Planner Calculation Test</title><style>html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0f172a}#bar{position:fixed;z-index:10;top:10px;left:10px;right:10px;background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}#status{font-weight:700}#source{color:#64748b}button{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer}#app{width:100%;height:100%;border:0;display:block;padding-top:62px;box-sizing:border-box}</style></head><body><div id="bar"><span id="status">Loading calculation engine…</span><span id="source">Test copy only · original Build Planner untouched</span><button id="recalc" type="button">Recalculate</button><button id="smoke" type="button">Smoke Test</button></div><iframe id="app" src="buildplanner-test.html?audience=contractor&contractorId=TEST-CALC-001"></iframe><script>(()=>{'use strict';const frame=document.getElementById('app'),status=document.getElementById('status'),UNIT={SQFT_TO_M2:.09290304,FT_TO_M:.3048},LOCKED={structures:{footingConcrete:.0008333,footingFormwork:.02,groundBeamConcrete:.00592,groundBeamFormwork:.0789333,roofBeamConcrete:.00592,roofBeamFormwork:.0789333,columnConcrete:.001575,columnFormwork:.042,flatRoofThickness:.1,cChannel:1.30033,metalRoof:.159883,groundSlabThickness:.15,groundSlabBrc:2,flatRoofBrc:2,footingRebar:100,beamRebar:200,columnRebar:200,apronThickness:.05},arch:{brickInternal:.1185,brickExternal:.052333,bathHeightFt:10},electrical:{powerPoint:2,switch:2,lighting:.0266667,wiring:.666667}},DESC={prelim1:'Submission of building plan / permit application and Engineer’s drawings to Local Authority',prelim2:'Preliminaries, site mobilisation, temporary facilities, insurance and project management'},W=null,RULES=[];const n=v=>Number.isFinite(Number(v))?Number(v):0,ceil=v=>Math.max(0,Math.ceil(n(v))),sqf2m2=v=>n(v)*UNIT.SQFT_TO_M2;function item(id,roomId,room,category,description,qty,unit,rate,groupKey,groupTitle){const q=ceil(qty);return{id,roomId,room,category,description,qty:q,unit,rate:n(rate),amount:q*n(rate),groupKey,groupTitle}}function parseRules(){return fetch('calculation-rules.html',{cache:'no-store'}).then(r=>r.text()).then(html=>{const m=html.match(/const rules=([\s\S]*?);\nconst esc=/);if(!m)throw Error('rules array not found');RULES=Function('return '+m[1])();return RULES})}function rooms(){return W.getRoomGroups()}function mainArea(rs){return rs.filter(r=>r.roomType!=='porch').reduce((s,r)=>s+n(r.area),0)}function porchArea(rs){return rs.filter(r=>r.roomType==='porch').reduce((s,r)=>s+n(r.area),0)}function bathrooms(rs){return rs.filter(r=>r.roomType==='bathroom')}function roofChoice(){const el=W?.document?.getElementById('testRoofType');return el?.value||'Roof Tiles'}function installRoofControl(){if(W.document.getElementById('testRoofType'))return;const spec=[...W.document.querySelectorAll('main>section')].find(s=>s.textContent.includes('Building Specification'));if(!spec)return;const box=W.document.createElement('div');box.className='mt-5 border rounded-xl bg-gray-50 p-4';box.innerHTML='<label class="block text-sm font-medium mb-2">Test Roof Type — applies to Main Building & Porch</label><select id="testRoofType" class="w-full border rounded-lg px-4 py-3 bg-white"><option>Roof Tiles</option><option>Flat Roof</option><option>Metal Roofing Sheet</option></select><p class="text-xs text-gray-500 mt-2">Only the selected roof item is included. Unselected alternatives are omitted.</p>';spec.querySelector('#builtUpArea')?.closest('.grid')?.appendChild(box);box.querySelector('select').addEventListener('change',()=>W.updateEstimate())}function generateStructures(){const rs=rooms(),main=mainArea(rs),porch=porchArea(rs);if(main+porch<=0)return[];const a=[];a.push(item('prelim-1','project','Project','preliminaries',DESC.prelim1,1,'ls',W.RATES.permit,'preliminaries','PRELIMINARIES'),item('prelim-2','project','Project','preliminaries',DESC.prelim2,1,'ls',W.RATES.prelim,'preliminaries','PRELIMINARIES'));const groups=[['footing','Footing'],['ground-slab','Ground Slab'],['ground-beam','Ground Beam'],['roof-beam','Roof Beam'],['column','Column']];for(const[key,title]of groups)if(main>0)a.push(...structGroup(main,'main',key,title));if(main>0)a.push(...roofGroup(main,'main'));for(const[key,title]of groups)if(porch>0)a.push(...structGroup(porch,'porch',key,title));if(porch>0)a.push(...roofGroup(porch,'porch'));if(main+porch>0){const footprint=sqf2m2(main+porch),outerPerimeter=Math.sqrt(Math.max(0,footprint))*4,apronArea=Math.max(0,(Math.sqrt(footprint)+1.8288)**2-footprint);a.push(item('str-apron-c','project','Project','structures','Apron – Concrete G15',apronArea*LOCKED.structures.apronThickness,'m3',W.RATES.apronConc,'external','EXTERNAL WORK'),item('str-apron-f','project','Project','structures','Apron – Formwork',outerPerimeter*.05,'m2',W.RATES.apronFw,'external','EXTERNAL WORK'),item('str-apron-b','project','Project','structures','Apron – BRC A7 single layer',apronArea,'m2',W.RATES.apronBrc,'external','EXTERNAL WORK'),item('str-drain','project','Project','external','External Drainage',outerPerimeter,'m',W.RATES.drainage,'external','EXTERNAL WORK'))}return a}function structGroup(area,zone,key,title){const q=[],p=zone==='main'?'MAIN BUILDING':'PORCH',r=W.RATES,C=LOCKED.structures,id=s=>`str-${zone}-${s}`,add=(suffix,desc,qty,unit,rate)=>q.push(item(id(suffix),'project',p,'structures',desc,qty,unit,rate,`${zone}-${key}`,`${p} → ${title}`));if(key==='footing'){add('footing-conc',`Footing Concrete G15 — ${p}`,area*C.footingConcrete,'m3',r.footingConc);add('footing-fw',`Footing Formwork — ${p}`,area*C.footingFormwork,'m2',r.footingFw);add('footing-rebar',`Footing Rebar — ${p}`,area*C.footingConcrete*C.footingRebar,'kg',r.footingRebar)}if(key==='ground-slab'){const m2=sqf2m2(area);add('slab-conc',`Ground Slab Concrete G25, 150mm thick — ${p}`,m2*C.groundSlabThickness,'m3',r.slabConc);add('slab-brc',`Ground Slab BRC A7 double layer — ${p}`,m2*C.groundSlabBrc,'m2',r.slabBrc)}if(key==='ground-beam'){add('gb-conc',`Ground Beam Concrete G25 — ${p}`,area*C.groundBeamConcrete,'m3',r.beamConc);add('gb-fw',`Ground Beam Formwork — ${p}`,area*C.groundBeamFormwork,'m2',r.beamFw);add('gb-rebar',`Ground Beam Rebar — ${p}`,area*C.groundBeamConcrete*C.beamRebar,'kg',r.beamRebar)}if(key==='roof-beam'){add('rb-conc',`Roof Beam Concrete G25 — ${p}`,area*C.roofBeamConcrete,'m3',r.beamConc);add('rb-fw',`Roof Beam Formwork — ${p}`,area*C.roofBeamFormwork,'m2',r.beamFw);add('rb-rebar',`Roof Beam Rebar — ${p}`,area*C.roofBeamConcrete*C.beamRebar,'kg',r.beamRebar)}if(key==='column'){add('col-conc',`Column Concrete G25 — ${p}`,area*C.columnConcrete,'m3',r.colConc);add('col-fw',`Column Formwork — ${p}`,area*C.columnFormwork,'m2',r.colFw);add('col-rebar',`Column Rebar — ${p}`,area*C.columnConcrete*C.columnRebar,'kg',r.colRebar)}return q}function roofGroup(area,zone){const p=zone==='main'?'MAIN BUILDING':'PORCH',r=W.RATES,C=LOCKED.structures,choice=roofChoice(),q=[],add=(suffix,desc,qty,unit,rate)=>q.push(item(`str-${zone}-${suffix}`,'project',p,'structures',desc,qty,unit,rate,`${zone}-roof`,` ${p} → Roof`));if(choice==='Flat Roof'){const m2=sqf2m2(area);add('flat-conc',`Flat Roof Concrete G25, 100mm thick c/w waterproofing — ${p}`,m2*C.flatRoofThickness,'m3',r.flatRoofConc);add('flat-fw',`Flat Roof Formwork — ${p}`,m2,'m2',r.flatRoofFw);add('flat-brc',`Flat Roof BRC A7 double layer — ${p}`,m2*C.flatRoofBrc,'m2',r.flatRoofBrc)}if(choice==='Metal Roofing Sheet'){add('roof-c',`C-Channel for roof structures — ${p}`,area*C.cChannel,'ft',r.cChannel);add('roof-m',`Metal Roofing Sheet, 25° pitch, 3ft overhang — ${p}`,area*C.metalRoof,'m2',r.metalSheet)}if(choice==='Roof Tiles'){add('roof-tiles',`Roof Tiles — ${p}`,area*C.metalRoof,'m2',n(r.roofTiles))}return q}function arch(rs){const out=[],main=mainArea(rs),bath=bathrooms(rs),bathArea=bath.reduce((s,r)=>s+n(r.area),0),total=main+porchArea(rs),foot=sqf2m2(total),apron=Math.max(0,(Math.sqrt(foot)+1.8288)**2-foot);if(main<=0)return out;const m2=sqf2m2(main),wi=main*LOCKED.arch.brickInternal,we=main*LOCKED.arch.brickExternal;out.push(item('arch-brick-int','project','MAIN BUILDING','architecture','Brickwall Internal Wall c/w cement screed & plaster',wi,'m2',W.RATES.brickInternal||W.RATES.paintInt,'main','MAIN BUILDING'),item('arch-brick-ext','project','MAIN BUILDING','architecture','Brickwall External Wall c/w cement screed & plaster',we,'m2',W.RATES.brickExternal||W.RATES.paintExt,'main','MAIN BUILDING'),item('arch-floor-int','project','MAIN BUILDING','architecture','Floor Tiles Internal',Math.max(0,m2-bathArea),'m2',W.RATES.floorTileInt,'main','MAIN BUILDING'),item('arch-floor-ext','project','MAIN BUILDING','architecture','Floor Tiles External — Apron Area',apron,'m2',W.RATES.floorTileExt,'main','MAIN BUILDING'),item('arch-paint-int','project','MAIN BUILDING','architecture','Painting Internal',wi,'m2',W.RATES.paintInt,'main','MAIN BUILDING'),item('arch-paint-ext','project','MAIN BUILDING','architecture','Painting External',we,'m2',W.RATES.paintExt,'main','MAIN BUILDING'),item('arch-ceiling-int','project','MAIN BUILDING','architecture','Ceiling Internal',Math.max(0,m2-bathArea),'m2',W.RATES.ceilingInt,'main','MAIN BUILDING'),item('arch-ceiling-ext','project','MAIN BUILDING','architecture','Ceiling External — Apron Area',apron,'m2',W.RATES.ceilingExt,'main','MAIN BUILDING'));for(const b of bath){const per=4*Math.sqrt(sqf2m2(b.area))/UNIT.FT_TO_M,wall=per*UNIT.FT_TO_M*LOCKED.arch.bathHeightFt*UNIT.FT_TO_M,room=b.roomId,label=b.label,add=(s,d,q,u,r)=>out.push(item(`arch-${room}-${s}`,room,label,'architecture',d,q,u,r,'bathroom','BATHROOM'));add('walltile',`Bathroom Wall Tiles — ${label}`,wall,'m2',W.RATES.bathWallTile);add('floortile',`Bathroom Floor Tiles — ${label}`,sqf2m2(b.area),'m2',W.RATES.bathFloorTile);add('ceiling',`Bathroom Ceiling — ${label}`,sqf2m2(b.area),'m2',W.RATES.ceilingInt);add('piping',`Bathroom Piping — ${label}`,1,'ls',W.RATES.bathPiping);add('wc','Supply and install WC complete with necessary fittings, connections and accessories, complete.',1,'no',W.RATES.bathWc);add('basin','Supply and install basin complete with necessary fittings, connections and accessories, complete.',1,'no',W.RATES.bathBasin);add('shower','Supply and install shower set complete with necessary fittings, connections and accessories, complete.',1,'no',W.RATES.bathShower);add('tap','Supply and install tap complete with necessary fittings, connections and accessories, complete.',1,'no',W.RATES.bathTap)}for(const r of rs.filter(x=>x.roomType!=='bathroom'&&x.roomType!=='porch')){if(!['dining','other'].includes(r.roomType))out.push(item(`arch-${r.roomId}-door`,r.roomId,r.label,'architecture','Supply and install door complete with frame, ironmongery, hinges, lockset and necessary accessories, complete.',1,'no',W.RATES.door,'doors','DOORS & WINDOWS'));if(!['store','other'].includes(r.roomType))out.push(item(`arch-${r.roomId}-window`,r.roomId,r.label,'architecture','Supply and install window complete with frame, glass, ironmongery, sealant and necessary accessories, complete.',1,'no',W.RATES.window,'windows','DOORS & WINDOWS'))}out.push(item('arch-water-tank','project','Project','architecture','Supply and install water tank complete with necessary fittings, connections and accessories, complete.',1,'no',W.RATES.waterTank,'project','MAIN BUILDING'),item('arch-septic-tank','project','Project','architecture','Supply and install septic tank complete with manhole, inlet and outlet piping, necessary fittings, connections and accessories, complete.',1,'no',W.RATES.septicTank,'project','MAIN BUILDING'));for(const p of rs.filter(x=>x.roomType==='porch'))out.push(item(`arch-${p.roomId}-floor`,p.roomId,p.label,'architecture','Supply and install floor tiles to porch area, including tile adhesive, cement screed, grout and necessary accessories, complete.',sqf2m2(p.area),'m2',W.RATES.floorTileExt,'porch','PORCH'));return out}function electrical(rs){const out=[],main=rs.filter(r=>r.roomType!=='porch'),fan=main.filter(r=>r.roomType!=='bathroom'),ac=main.filter(r=>!['bathroom','dining','kitchen'].includes(r.roomType)),add=(id,room,label,d,q,u,r,g,t)=>out.push(item(id,room,label,'electrical',d,q,u,r,g,t));for(const r of main){add(`elec-${r.roomId}-pp`,r.roomId,r.label,'Supply and install power point complete with wiring, socket outlet, connections and necessary accessories, complete.',2,'no',W.RATES.powerPoint,'main','MAIN BUILDING');add(`elec-${r.roomId}-switch`,r.roomId,r.label,'Supply and install electrical switch complete with wiring, accessories and necessary connections, complete.',2,'no',W.RATES.switch,'main','MAIN BUILDING');add(`elec-${r.roomId}-light`,r.roomId,r.label,'Supply and install lighting point complete with wiring, switch, light fitting, connections and necessary accessories, complete.',r.area<=50?1:Math.ceil(r.area*LOCKED.electrical.lighting),'no',W.RATES.lighting,'main','MAIN BUILDING');if(fan.includes(r))add(`elec-${r.roomId}-fan`,r.roomId,r.label,'Supply and install ceiling fan complete with wiring, switch, connections and necessary accessories, complete.',1,'no',W.RATES.fan,'main','MAIN BUILDING');if(ac.includes(r))add(`elec-${r.roomId}-ac`,r.roomId,r.label,'Supply and install air conditioning point complete with wiring, isolator, connections and necessary accessories, complete.',1,'no',W.RATES.aircond,'main','MAIN BUILDING')}for(const p of rs.filter(r=>r.roomType==='porch')){const l=p.area<=50?1:Math.ceil(p.area*LOCKED.electrical.lighting);add(`elec-${p.roomId}-light`,p.roomId,p.label,'Supply and install lighting point complete with wiring, switch, light fitting, connections and necessary accessories, complete.',l,'no',W.RATES.lighting,'porch','PORCH');add(`elec-${p.roomId}-fan`,p.roomId,p.label,'Supply and install ceiling fan complete with wiring, switch, connections and necessary accessories, complete.',1,'no',W.RATES.fan,'porch','PORCH');add(`elec-${p.roomId}-pp`,p.roomId,p.label,'Supply and install power point complete with wiring, socket outlet, connections and necessary accessories, complete.',1,'no',W.RATES.powerPoint,'porch','PORCH')}add('elec-earthing','project','Project','electrical','Supply and install complete earthing system including earth rod, earth cable, earth clamp, inspection chamber and necessary connections and accessories, complete.',1,'no',W.RATES.earthing,'earthing','EARTHING');add('elec-db','project','Project','electrical','Supply and install distribution board complete with necessary breakers, busbar, enclosure, connections and accessories, complete.',1,'no',W.RATES.dbBox,'db','DB BOX');add('elec-wiring','project','Project','electrical','Supply and install electrical wiring complete with cables, conduits, connections and necessary accessories, complete.',Math.ceil(mainArea(rs)*LOCKED.electrical.wiring),'m',W.RATES.wiring,'wiring','WIRING');return out}function external(rs){return[{id:'ext-boundary',roomId:'project',room:'Project',category:'external',description:'Provide and construct boundary fencing complete with posts, foundations, fencing materials, gates/necessary fittings and all associated works, complete.',qty:1,unit:'ls',rate:n(W.RATES.boundaryFencing),amount:n(W.RATES.boundaryFencing),groupKey:'boundary',groupTitle:'BOUNDARY FENCING'},{id:'ext-gate',roomId:'project',room:'Project',category:'external',description:'Gate — fixed project allowance.',qty:1,unit:'ls',rate:n(W.RATES.gate),amount:n(W.RATES.gate),groupKey:'gate',groupTitle:'GATE'}]}function all(){const rs=rooms();return[...generateStructures(),...arch(rs),...electrical(rs),...external(rs)]}function install(){W=frame.contentWindow;if(!W||typeof W.getRoomGroups!=='function')throw Error('planner not ready');installRoofControl();W.generateStructureItems=generateStructures;W.generateRoomArchitectureItems=r=>arch([r]);W.generateElectricalItems=electrical;W.getAllItems=all;W.updateEstimate();status.textContent='Calculation engine ACTIVE · hierarchy: Preliminaries → Structures → Architectures → Electrical → Doors & Windows → External Work';window.TEST_ENGINE={all,rooms,roofChoice,RULES}}function smoke(){const rs=[{roomId:'a',roomType:'living',label:'Living',area:600}],old=W.getRoomGroups;W.getRoomGroups=()=>rs;const s=generateStructures(),e=electrical(rs);W.getRoomGroups=old;const checks=[['footing concrete',s.find(x=>x.id==='str-main-footing-footing-conc')?.qty,1],['ground slab concrete',s.find(x=>x.id==='str-main-ground-slab-conc')?.qty,9],['column concrete',s.find(x=>x.id==='str-main-column-col-conc')?.qty,1],['C-channel metal roof',s.find(x=>x.id==='str-main-roof-c')?.qty,781],['wiring',e.find(x=>x.id==='elec-wiring')?.qty,400]];return checks.every(x=>x[1]===x[2])?`PASS ${checks.length}/${checks.length}`:`FAIL ${checks.map(x=>x[0]+':'+x[1]+'≠'+x[2]).join(', ')}`}frame.addEventListener('load',async()=>{try{await parseRules();install()}catch(e){status.textContent='ENGINE ERROR: '+e.message;console.error(e)}});document.getElementById('recalc').onclick=()=>{try{install()}catch(e){status.textContent='ERROR: '+e.message}};document.getElementById('smoke').onclick=()=>alert(smoke())})();</script></body></html>
