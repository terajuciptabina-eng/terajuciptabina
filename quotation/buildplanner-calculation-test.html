<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERAJU WORKS — Build Planner Calculation Test</title>
<style>
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0f172a}#bar{position:fixed;z-index:10;top:10px;left:10px;right:10px;background:rgba(255,255,255,.97);border:1px solid #e5e7eb;border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}#status{font-weight:700}#source{color:#64748b}button{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer}#app{width:100%;height:100%;border:0;display:block;padding-top:62px;box-sizing:border-box}#enginePanel{display:none}
</style>
</head>
<body>
<div id="bar"><span id="status">Loading calculation engine…</span><span id="source">Test copy only · original Build Planner untouched</span><button id="recalc" type="button">Recalculate</button><button id="smoke" type="button">Smoke Test</button></div>
<div id="enginePanel"></div>
<iframe id="app" src="buildplanner-test.html?audience=contractor&contractorId=TEST-CALC-001"></iframe>
<script>
(()=>{
'use strict';
const frame=document.getElementById('app'),status=document.getElementById('status'),panel=document.getElementById('enginePanel');
const UNIT={SQFT_TO_M2:0.09290304,FT_TO_M:0.3048};
const C={footingConcrete:0.0008333,footingFormwork:0.02,groundBeamConcrete:0.00592,groundBeamFormwork:0.0789333,roofBeamConcrete:0.00592,roofBeamFormwork:0.0789333,columnConcrete:0.001575,columnFormwork:0.042,flatRoofThickness:0.10,cChannel:1.30033,metalRoof:0.159883,groundSlabThickness:0.15,groundSlabBrc:2,flatRoofBrc:2,footingRebar:100,beamRebar:200,columnRebar:200,brickInternal:0.1185,brickExternal:0.052333,bathHeightFt:10,powerPoint:2,switch:2,lighting:0.0266667,wiring:0.666667};
let W=null,RULES=[];
const n=v=>Number.isFinite(Number(v))?Number(v):0;
const m2=v=>n(v)*UNIT.SQFT_TO_M2;
const qty=v=>Math.max(0,n(v));
const rate=k=>n(W.eval('RATES['+JSON.stringify(k)+']'));
const rooms=()=>W.eval('getRoomGroups()');
const mainArea=rs=>rs.filter(r=>r.roomType!=='porch').reduce((s,r)=>s+n(r.area),0);
const porchArea=rs=>rs.filter(r=>r.roomType==='porch').reduce((s,r)=>s+n(r.area),0);
const bathrooms=rs=>rs.filter(r=>r.roomType==='bathroom');
function item(id,roomId,room,description,q,unit,r,section,sub){q=qty(q);return{id,roomId,room,description,qty:q,unit,rate:n(r),amount:q*n(r),section,sub};}
function parseRules(){return fetch('calculation-rules.html',{cache:'no-store'}).then(r=>r.text()).then(html=>{const m=html.match(/const rules=([\s\S]*?);\s*const esc=/);if(!m)throw Error('Calculation Rules array not found');RULES=Function('return '+m[1])();return RULES;});}
function roofChoice(){return W.document.getElementById('testRoofType')?.value||'Flat Roof';}
function installRoofControl(){if(W.document.getElementById('testRoofType'))return;const spec=[...W.document.querySelectorAll('main>section')].find(s=>s.textContent.includes('Building Specification'));if(!spec)return;const box=W.document.createElement('div');box.className='mt-5 border rounded-xl bg-gray-50 p-4';box.innerHTML='<label class="block text-sm font-medium mb-2">Test Roof Type — applies to Main Building & Porch</label><select id="testRoofType" class="w-full border rounded-lg px-4 py-3 bg-white"><option>Flat Roof</option><option>Metal Roofing Sheet</option><option>Roof Tiles</option></select><p class="text-xs text-gray-500 mt-2">Only the selected roof item is included. Roof Tiles is currently excluded from quantity output because no confirmed calculation coefficient exists in Calculation Rules.</p>';spec.querySelector('#builtUpArea')?.closest('.grid')?.appendChild(box);box.querySelector('select').addEventListener('change',renderEngine);}
function structures(rs){const out=[],main=mainArea(rs),porch=porchArea(rs);if(main+porch<=0)return out;out.push(item('prelim-1','project','Project','Submission of building plan / permit application and Engineer’s drawings to Local Authority',1,'ls',rate('permit'),'1. PRELIMINARIES','PROJECT'));out.push(item('prelim-2','project','Project','Preliminaries, site mobilisation, temporary facilities, insurance and project management',1,'ls',rate('prelim'),'1. PRELIMINARIES','PROJECT'));
const groups=[['footing','Footing'],['ground-slab','Ground Slab'],['ground-beam','Ground Beam'],['roof-beam','Roof Beam'],['column','Column']];
for(const zone of [{area:main,key:'main',name:'MAIN BUILDING'},{area:porch,key:'porch',name:'PORCH'}]){if(zone.area<=0)continue;for(const [key,title] of groups){const add=(s,d,q,u,r)=>out.push(item('str-'+zone.key+'-'+s,'project',zone.name,d,q,u,r,'2. STRUCTURES',zone.name+' → '+title));if(key==='footing'){add('footing-conc','Footing Concrete G15',zone.area*C.footingConcrete,'m3',rate('footingConc'));add('footing-fw','Footing Formwork',zone.area*C.footingFormwork,'m2',rate('footingFw'));add('footing-rebar','Footing Rebar',zone.area*C.footingConcrete*C.footingRebar,'kg',rate('footingRebar'));}if(key==='ground-slab'){const a=m2(zone.area);add('slab-conc','Ground Slab Concrete G25, 150mm thick',a*C.groundSlabThickness,'m3',rate('slabConc'));add('slab-brc','Ground Slab BRC A7 double layer',a*C.groundSlabBrc,'m2',rate('slabBrc'));}if(key==='ground-beam'){add('gb-conc','Ground Beam Concrete G25',zone.area*C.groundBeamConcrete,'m3',rate('beamConc'));add('gb-fw','Ground Beam Formwork',zone.area*C.groundBeamFormwork,'m2',rate('beamFw'));add('gb-rebar','Ground Beam Rebar',zone.area*C.groundBeamConcrete*C.beamRebar,'kg',rate('beamRebar'));}if(key==='roof-beam'){add('rb-conc','Roof Beam Concrete G25',zone.area*C.roofBeamConcrete,'m3',rate('beamConc'));add('rb-fw','Roof Beam Formwork',zone.area*C.roofBeamFormwork,'m2',rate('beamFw'));add('rb-rebar','Roof Beam Rebar',zone.area*C.roofBeamConcrete*C.beamRebar,'kg',rate('beamRebar'));}if(key==='column'){add('col-conc','Column Concrete G25',zone.area*C.columnConcrete,'m3',rate('colConc'));add('col-fw','Column Formwork',zone.area*C.columnFormwork,'m2',rate('colFw'));add('col-rebar','Column Rebar',zone.area*C.columnConcrete*C.columnRebar,'kg',rate('colRebar'));}}
const roof=roofChoice(),addRoof=(s,d,q,u,r)=>out.push(item('str-'+zone.key+'-'+s,'project',zone.name,d,q,u,r,'2. STRUCTURES',zone.name+' → ROOF'));
if(roof==='Flat Roof'){const a=m2(zone.area);addRoof('flat-conc','Flat Roof Concrete G25, 100mm thick c/w waterproofing',a*C.flatRoofThickness,'m3',rate('flatRoofConc'));addRoof('flat-fw','Flat Roof Formwork',a,'m2',rate('flatRoofFw'));addRoof('flat-brc','Flat Roof BRC A7 double layer',a*C.flatRoofBrc,'m2',rate('flatRoofBrc'));}
if(roof==='Metal Roofing Sheet'){addRoof('roof-c','C-Channel for roof structures',zone.area*C.cChannel,'ft',rate('cChannel'));addRoof('roof-m','Metal Roofing Sheet, 25° pitch, 3ft overhang',zone.area*C.metalRoof,'m2',rate('metalSheet'));}
}
return out;}
function architecture(rs){const out=[],main=mainArea(rs),baths=bathrooms(rs),bathArea=baths.reduce((s,r)=>s+n(r.area),0);if(main<=0)return out;const a=m2(main),wi=main*C.brickInternal,we=main*C.brickExternal;
out.push(item('arch-brick-int','project','MAIN BUILDING','Brickwall Internal Wall c/w cement screed & plaster',wi,'m2',rate('brickInternal'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-brick-ext','project','MAIN BUILDING','Brickwall External Wall c/w cement screed & plaster',we,'m2',rate('brickExternal'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-floor-int','project','MAIN BUILDING','Floor Tiles Internal',Math.max(0,a-m2(bathArea)),'m2',rate('floorTileInt'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-floor-ext','project','MAIN BUILDING','Floor Tiles External — Apron Area','', 'm2',rate('floorTileExt'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-paint-int','project','MAIN BUILDING','Painting Internal',wi,'m2',rate('paintInt'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-paint-ext','project','MAIN BUILDING','Painting External',we,'m2',rate('paintExt'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-ceiling-int','project','MAIN BUILDING','Ceiling Internal',Math.max(0,a-m2(bathArea)),'m2',rate('ceilingInt'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-ceiling-ext','project','MAIN BUILDING','Ceiling External — Apron Area','', 'm2',rate('ceilingExt'),'3. ARCHITECTURES','MAIN BUILDING'));
for(const b of baths){const side=4*Math.sqrt(m2(b.area)),wall=side*UNIT.FT_TO_M*C.bathHeightFt*UNIT.FT_TO_M,add=(s,d,q,u,r)=>out.push(item('arch-'+b.roomId+'-'+s,b.roomId,b.label,d,q,u,r,'3. ARCHITECTURES','BATHROOM → '+b.label));add('walltile','Bathroom Wall Tiles',wall,'m2',rate('bathWallTile'));add('floortile','Bathroom Floor Tiles',m2(b.area),'m2',rate('bathFloorTile'));add('ceiling','Bathroom Ceiling',m2(b.area),'m2',rate('ceilingInt'));add('piping','Bathroom Piping',1,'ls',rate('bathPiping'));add('wc','Supply and install WC complete with necessary fittings, connections and accessories, complete.',1,'no',rate('bathWc'));add('basin','Supply and install basin complete with necessary fittings, connections and accessories, complete.',1,'no',rate('bathBasin'));add('shower','Supply and install shower set complete with necessary fittings, connections and accessories, complete.',1,'no',rate('bathShower'));add('tap','Supply and install tap complete with necessary fittings, connections and accessories, complete.',1,'no',rate('bathTap'));}
for(const p of rs.filter(r=>r.roomType==='porch'))out.push(item('arch-'+p.roomId+'-floor',p.roomId,p.label,'Supply and install floor tiles to porch area, including tile adhesive, cement screed, grout and necessary accessories, complete.',m2(p.area),'m2',rate('floorTileExt'),'3. ARCHITECTURES','PORCH'));
out.push(item('arch-water-tank','project','Project','Supply and install water tank complete with necessary fittings, connections and accessories, complete.',1,'no',rate('waterTank'),'3. ARCHITECTURES','MAIN BUILDING'));out.push(item('arch-septic-tank','project','Project','Supply and install septic tank complete with manhole, inlet and outlet piping, necessary fittings, connections and accessories, complete.',1,'no',rate('septicTank'),'3. ARCHITECTURES','MAIN BUILDING'));return out;}
function doorsWindows(rs){const out=[];for(const r of rs.filter(x=>x.roomType!=='porch'&&x.roomType!=='other')){if(r.roomType!=='dining')out.push(item('dw-'+r.roomId+'-door',r.roomId,r.label,'Supply and install door complete with frame, ironmongery, hinges, lockset and necessary accessories, complete.',1,'no',rate('door'),'5. DOORS & WINDOWS','MAIN BUILDING → DOORS'));if(r.roomType!=='store')out.push(item('dw-'+r.roomId+'-window',r.roomId,r.label,'Supply and install window complete with frame, glass, ironmongery, sealant and necessary accessories, complete.',1,'no',rate('window'),'5. DOORS & WINDOWS','MAIN BUILDING → WINDOWS'));}return out;}
function electrical(rs){const out=[],main=rs.filter(r=>r.roomType!=='porch'),add=(id,room,label,d,q,u,r,sub)=>out.push(item(id,room,label,d,q,u,r,'4. ELECTRICAL',sub));for(const r of main){add('elec-'+r.roomId+'-pp',r.roomId,r.label,'Supply and install power point complete with wiring, socket outlet, connections and necessary accessories, complete.',C.powerPoint,'no',rate('powerPoint'),'MAIN BUILDING');add('elec-'+r.roomId+'-switch',r.roomId,r.label,'Supply and install electrical switch complete with wiring, accessories and necessary connections, complete.',C.switch,'no',rate('switch'),'MAIN BUILDING');add('elec-'+r.roomId+'-light',r.roomId,r.label,'Supply and install lighting point complete with wiring, switch, light fitting, connections and necessary accessories, complete.',r.area<=50?1:Math.ceil(r.area*C.lighting),'no',rate('lighting'),'MAIN BUILDING');if(r.roomType!=='bathroom')add('elec-'+r.roomId+'-fan',r.roomId,r.label,'Supply and install ceiling fan complete with wiring, switch, connections and necessary accessories, complete.',1,'no',rate('fan'),'MAIN BUILDING');if(!['bathroom','dining','kitchen'].includes(r.roomType))add('elec-'+r.roomId+'-ac',r.roomId,r.label,'Supply and install air conditioning point complete with wiring, isolator, connections and necessary accessories, complete.',1,'no',rate('aircond'),'MAIN BUILDING');}for(const p of rs.filter(r=>r.roomType==='porch')){add('elec-'+p.roomId+'-light',p.roomId,p.label,'Supply and install lighting point complete with wiring, switch, light fitting, connections and necessary accessories, complete.',p.area<=50?1:Math.ceil(p.area*C.lighting),'no',rate('lighting'),'PORCH');add('elec-'+p.roomId+'-fan',p.roomId,p.label,'Supply and install ceiling fan complete with wiring, switch, connections and necessary accessories, complete.',1,'no',rate('fan'),'PORCH');add('elec-'+p.roomId+'-pp',p.roomId,p.label,'Supply and install power point complete with wiring, socket outlet, connections and necessary accessories, complete.',1,'no',rate('powerPoint'),'PORCH');}add('elec-earthing','project','Project','Supply and install complete earthing system including earth rod, earth cable, earth clamp, inspection chamber and necessary connections and accessories, complete.',1,'no',rate('earthing'),'EARTHING');add('elec-db','project','Project','Supply and install distribution board complete with necessary breakers, busbar, enclosure, connections and accessories, complete.',1,'no',rate('dbBox'),'DB BOX');add('elec-wiring','project','Project','Supply and install electrical wiring complete with cables, conduits, connections and necessary accessories, complete.',Math.ceil(mainArea(rs)*C.wiring),'m',rate('wiring'),'WIRING');return out;}
function external(rs){const out=[];if(mainArea(rs)+porchArea(rs)>0)out.push(item('ext-boundary','project','Project','Provide and construct boundary fencing complete with posts, foundations, fencing materials, gates/necessary fittings and all associated works, complete.',1,'ls',rate('boundaryFencing'),'6. EXTERNAL WORK','BOUNDARY FENCING'));return out;}
function all(){const rs=rooms();return[...structures(rs),...architecture(rs),...electrical(rs),...doorsWindows(rs),...external(rs)];}
function fmtQ(v,u){if(['no','ls','set','unit'].includes(String(u).toLowerCase()))return String(Math.ceil(v));return Number(v).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');}
function money(v){return 'RM '+n(v).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function renderEngine(){if(!W)return;try{const items=all();const bySec={};items.forEach(i=>(bySec[i.section]??=[]).push(i));let h='<div class="mb-4"><p class="text-xs uppercase tracking-wider text-gray-500">Calculation Engine</p><h3 class="text-2xl font-bold mt-1">Generated Item List</h3><p class="text-sm text-gray-500 mt-1">Test copy only. Hierarchy follows the calculation groups. Original buildplanner.html remains untouched.</p></div>';
for(const sec of ['1. PRELIMINARIES','2. STRUCTURES','3. ARCHITECTURES','4. ELECTRICAL','5. DOORS & WINDOWS','6. EXTERNAL WORK','7. OTHERS']){const arr=bySec[sec]||[];h+='<section class="border rounded-xl overflow-hidden mb-5"><div class="px-4 py-3 bg-gray-100 font-bold">'+sec+' <span class="text-xs font-normal text-gray-500">('+arr.length+' items)</span></div>';if(!arr.length){h+='<div class="p-4 text-sm text-gray-500">No generated items in this group yet.</div></section>';continue;}const subs=[...new Set(arr.map(x=>x.sub||'GENERAL'))];for(const sub of subs){h+='<div class="border-t"><div class="px-4 py-2 bg-gray-50 text-sm font-semibold">'+sub+'</div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-t border-b text-left"><th class="px-3 py-2">Description</th><th class="px-3 py-2">Unit</th><th class="px-3 py-2">Qty</th><th class="px-3 py-2 text-right">Rate (RM)</th><th class="px-3 py-2 text-right">Amount (RM)</th></tr></thead><tbody>';for(const i of arr.filter(x=>(x.sub||'GENERAL')===sub))h+='<tr class="border-b last:border-b-0 align-top"><td class="px-3 py-3">'+i.description+'<div class="text-xs text-gray-500 mt-1">'+i.room+'</div></td><td class="px-3 py-3">'+i.unit+'</td><td class="px-3 py-3">'+fmtQ(i.qty,i.unit)+'</td><td class="px-3 py-3 text-right">'+money(i.rate)+'</td><td class="px-3 py-3 text-right font-semibold">'+money(i.amount)+'</td></tr>';h+='</tbody></table></div></div>';}h+='</section>';}
const target=W.document.getElementById('estimateContent');if(!target)throw Error('estimateContent not found');target.innerHTML=h;status.textContent='Calculation engine ACTIVE · '+items.length+' items generated · hierarchy applied';panel.innerHTML='';}catch(e){status.textContent='ENGINE ERROR: '+e.message;console.error(e);}}
function smoke(){try{const rs=[{roomId:'test',roomType:'living',label:'Living',area:600},{roomId:'bath',roomType:'bathroom',label:'Bathroom',area:50},{roomId:'porch',roomType:'porch',label:'Porch',area:200}],s=structures(rs),a=architecture(rs),e=electrical(rs),d=doorsWindows(rs);const has=id=>[...s,...a,...e,...d].some(x=>x.id===id);const checks=[['Footing',has('str-main-footing-footing-conc')],['Ground slab',has('str-main-slab-conc')],['Bathroom WC',has('arch-bath-wc')],['Door',has('dw-test-door')],['Window',has('dw-test-window')],['Wiring',has('elec-wiring')]];return checks.every(x=>x[1])?'PASS '+checks.length+'/'+checks.length:'FAIL '+checks.filter(x=>!x[1]).map(x=>x[0]).join(', ');}catch(e){return 'FAIL '+e.message;}}
frame.addEventListener('load',async()=>{try{W=frame.contentWindow;if(!W||typeof W.eval!=='function')throw Error('planner not ready');await parseRules();installRoofControl();renderEngine();}catch(e){status.textContent='ENGINE ERROR: '+e.message;console.error(e);}});
document.getElementById('recalc').onclick=()=>renderEngine();document.getElementById('smoke').onclick=()=>alert(smoke());
})();
</script>
</body></html>
