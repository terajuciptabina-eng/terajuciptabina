<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERAJU WORKS — Build Planner Calculation Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#111827}
#bar{position:sticky;top:0;z-index:20;margin:10px;background:#fff;border:1px solid #d1d5db;border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;box-shadow:0 8px 25px rgba(0,0,0,.15)}#status{font-weight:800}#source{color:#64748b}button,select{font:inherit;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 10px;font-weight:700}
#app{position:absolute;width:1px;height:1px;left:-9999px;border:0;visibility:hidden}#report{max-width:980px;margin:0 auto 40px;background:#fff;min-height:100vh;padding:22px 14px 50px}.title{margin-bottom:14px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}.title h1{font-size:20px;margin:3px 0}.title p{font-size:11px;color:#6b7280;margin:0}
.estimate{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}.estimate col.desc{width:56%}.estimate col.unit{width:7%}.estimate col.qty{width:8%}.estimate col.rate{width:14%}.estimate col.amount{width:15%}.estimate th,.estimate td{padding:7px 8px;vertical-align:top}.estimate thead th{border-top:1px solid #111827;border-bottom:1px solid #111827;font-weight:800;text-align:left;white-space:nowrap}.estimate thead th:nth-child(4),.estimate thead th:nth-child(5){text-align:right}.estimate tbody td{border-bottom:1px solid #e5e7eb}
.estimate .main-group td{padding:10px 8px 7px;background:#e5e7eb;border-top:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;font-size:12px;font-weight:900}.estimate .sub-group td{padding:7px 8px 5px;background:#f3f4f6;font-weight:800}.estimate .subsub-group td{padding:6px 8px 4px;background:#fafafa;font-weight:800;text-transform:uppercase}.estimate .subsubsub-group td{padding:5px 8px 4px;background:#fff;font-weight:700;color:#374151}.estimate .level-1{padding-left:8px!important}.estimate .level-2{padding-left:22px!important}.estimate .level-3{padding-left:38px!important}.estimate .level-4{padding-left:54px!important}.estimate .item td:first-child{padding-left:70px}.estimate .num{text-align:right;white-space:nowrap}.estimate .empty td{padding:14px 8px;color:#6b7280;font-style:italic}.badge{font-size:10px;color:#6b7280;font-weight:600;margin-left:5px}
@media(max-width:700px){#report{padding:14px 6px}.estimate{font-size:10px}.estimate th,.estimate td{padding:6px 5px}.estimate col.desc{width:51%}.estimate col.unit{width:8%}.estimate col.qty{width:9%}.estimate col.rate{width:15%}.estimate col.amount{width:17%}.estimate .item td:first-child{padding-left:35px}.estimate .level-2{padding-left:14px!important}.estimate .level-3{padding-left:24px!important}.estimate .level-4{padding-left:34px!important}}
</style>
</head>
<body>
<div id="bar"><span id="status">RESET TEST — loading…</span><span id="source">Fresh renderer · original Build Planner untouched</span><select id="roof"><option>Flat Roof</option><option>Metal Roofing Sheet</option><option>Roof Tiles</option></select><button id="recalc">Recalculate</button><button id="smoke">Smoke Test</button></div>
<iframe id="app" src="buildplanner-test.html?audience=contractor&contractorId=TEST-CALC-001"></iframe><main id="report"></main>
<script>
(()=>{
'use strict';
const frame=document.getElementById('app'),report=document.getElementById('report'),status=document.getElementById('status'),roof=document.getElementById('roof');
const U={SQFT_TO_M2:.09290304};
const C={footingConcrete:.0008333,footingFormwork:.02,groundBeamConcrete:.00592,groundBeamFormwork:.0789333,roofBeamConcrete:.00592,roofBeamFormwork:.0789333,columnConcrete:.001575,columnFormwork:.042,groundSlabThickness:.15,groundSlabBrc:2,flatRoofThickness:.10,flatRoofBrc:2,cChannel:1.30033,metalRoof:.159883,footingRebar:100,beamRebar:200,columnRebar:200,brickInternal:.1185,brickExternal:.052333,lighting:.0266667,wiring:.666667};
let W=null;
const n=v=>Number.isFinite(Number(v))?Number(v):0;const m2=v=>n(v)*U.SQFT_TO_M2;const money=v=>'RM '+n(v).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});const fmtQ=(v,u)=>['no','ls','set','unit'].includes(String(u).toLowerCase())?String(Math.ceil(v)):Number(v).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');const rooms=()=>W.eval('getRoomGroups()');const rate=k=>n(W.eval('RATES['+JSON.stringify(k)+']'));const mainArea=rs=>rs.filter(r=>r.roomType!=='porch').reduce((s,r)=>s+n(r.area),0);const porchArea=rs=>rs.filter(r=>r.roomType==='porch').reduce((s,r)=>s+n(r.area),0);const bathrooms=rs=>rs.filter(r=>r.roomType==='bathroom');
function item(id,roomId,room,description,q,unit,r,section,path){q=Math.max(0,n(q));return{id,roomId,room,description,qty:q,unit,rate:n(r),amount:q*n(r),section,path};}
function structures(rs){const out=[],main=mainArea(rs),porch=porchArea(rs);if(main+porch<=0)return out;out.push(item('prelim-1','project','Project','Submission of building plan / permit application and Engineer’s drawings to Local Authority',1,'ls',rate('permit'),'1. PRELIMINARIES','PROJECT → GENERAL'));out.push(item('prelim-2','project','Project','Preliminaries, site mobilisation, temporary facilities, insurance and project management',1,'ls',rate('prelim'),'1. PRELIMINARIES','PROJECT → GENERAL'));
const groups=[['Footing',a=>[['Footing Concrete G15',a*C.footingConcrete,'m3','footingConc'],['Footing Formwork',a*C.footingFormwork,'m2','footingFw'],['Footing Rebar',a*C.footingConcrete*C.footingRebar,'kg','footingRebar']]],['Ground Slab',a=>{const x=m2(a);return [['Ground Slab Concrete G25, 150mm thick',x*C.groundSlabThickness,'m3','slabConc'],['Ground Slab BRC A7 double layer',x*C.groundSlabBrc,'m2','slabBrc']]}],['Ground Beam',a=>[['Ground Beam Concrete G25',a*C.groundBeamConcrete,'m3','beamConc'],['Ground Beam Formwork',a*C.groundBeamFormwork,'m2','beamFw'],['Ground Beam Rebar',a*C.groundBeamConcrete*C.beamRebar,'kg','beamRebar']]],['Roof Beam',a=>[['Roof Beam Concrete G25',a*C.roofBeamConcrete,'m3','beamConc'],['Roof Beam Formwork',a*C.roofBeamFormwork,'m2','beamFw'],['Roof Beam Rebar',a*C.roofBeamConcrete*C.beamRebar,'kg','beamRebar']]],['Column',a=>[['Column Concrete G25',a*C.columnConcrete,'m3','colConc'],['Column Formwork',a*C.columnFormwork,'m2','colFw'],['Column Rebar',a*C.columnConcrete*C.columnRebar,'kg','colRebar']]]];
for(const z of [{name:'MAIN BUILDING',key:'main',area:main},{name:'PORCH',key:'porch',area:porch}]){if(z.area<=0)continue;for(const [g,fn] of groups)for(const [d,q,u,r] of fn(z.area))out.push(item('str-'+z.key+'-'+g.toLowerCase().replace(/ /g,'-')+'-'+r,'project',z.name,d,q,u,rate(r),'2. STRUCTURES',z.name+' → '+g));if(roof.value==='Flat Roof'){const a=m2(z.area);out.push(item('str-'+z.key+'-flat-conc','project',z.name,'Flat Roof Concrete G25, 100mm thick c/w waterproofing',a*C.flatRoofThickness,'m3',rate('flatRoofConc'),'2. STRUCTURES',z.name+' → ROOF'));out.push(item('str-'+z.key+'-flat-fw','project',z.name,'Flat Roof Formwork',a,'m2',rate('flatRoofFw'),'2. STRUCTURES',z.name+' → ROOF'));out.push(item('str-'+z.key+'-flat-brc','project',z.name,'Flat Roof BRC A7 double layer',a*C.flatRoofBrc,'m2',rate('flatRoofBrc'),'2. STRUCTURES',z.name+' → ROOF'));}if(roof.value==='Metal Roofing Sheet'){out.push(item('str-'+z.key+'-c-channel','project',z.name,'C-Channel for roof structures',z.area*C.cChannel,'ft',rate('cChannel'),'2. STRUCTURES',z.name+' → ROOF'));out.push(item('str-'+z.key+'-metal-sheet','project',z.name,'Metal Roofing Sheet, 25° pitch, 3ft overhang',z.area*C.metalRoof,'m2',rate('metalSheet'),'2. STRUCTURES',z.name+' → ROOF'));}}
return out;}
function architecture(rs){const out=[],main=mainArea(rs),bs=bathrooms(rs),ba=bs.reduce((s,r)=>s+n(r.area),0);if(main<=0)return out;const a=m2(main),wi=main*C.brickInternal,we=main*C.brickExternal;out.push(item('arch-brick-int','project','MAIN BUILDING','Brickwall Internal Wall c/w cement screed & plaster',wi,'m2',rate('brickInternal'),'3. ARCHITECTURES','MAIN BUILDING → WALL'));out.push(item('arch-brick-ext','project','MAIN BUILDING','Brickwall External Wall c/w cement screed & plaster',we,'m2',rate('brickExternal'),'3. ARCHITECTURES','MAIN BUILDING → WALL'));out.push(item('arch-floor-int','project','MAIN BUILDING','Floor Tiles Internal',Math.max(0,a-m2(ba)),'m2',rate('floorTileInt'),'3. ARCHITECTURES','MAIN BUILDING → FLOOR TILES'));out.push(item('arch-paint-int','project','MAIN BUILDING','Painting Internal',wi,'m2',rate('paintInt'),'3. ARCHITECTURES','MAIN BUILDING → PAINTING'));out.push(item('arch-paint-ext','project','MAIN BUILDING','Painting External',we,'m2',rate('paintExt'),'3. ARCHITECTURES','MAIN BUILDING → PAINTING'));out.push(item('arch-ceiling-int','project','MAIN BUILDING','Ceiling Internal',Math.max(0,a-m2(ba)),'m2',rate('ceilingInt'),'3. ARCHITECTURES','MAIN BUILDING → CEILING'));for(const b of bs){const wall=4*Math.sqrt(m2(b.area))*.3048*10*.3048;const add=(s,d,q,u,r)=>out.push(item('arch-'+b.roomId+'-'+s,b.roomId,b.label,d,q,u,rate(r),'3. ARCHITECTURES','MAIN BUILDING → BATHROOM → '+b.label));add('walltile','Bathroom Wall Tiles',wall,'m2','bathWallTile');add('floortile','Bathroom Floor Tiles',m2(b.area),'m2','bathFloorTile');add('ceiling','Bathroom Ceiling',m2(b.area),'m2','ceilingInt');add('piping','Bathroom Piping',1,'ls','bathPiping');add('wc','Supply and install WC complete with necessary fittings, connections and accessories, complete.',1,'no','bathWc');add('basin','Supply and install basin complete with necessary fittings, connections and accessories, complete.',1,'no','bathBasin');add('shower','Supply and install shower set complete with necessary fittings, connections and accessories, complete.',1,'no','bathShower');add('tap','Supply and install tap complete with necessary fittings, connections and accessories, complete.',1,'no','bathTap'));}for(const p of rs.filter(r=>r.roomType==='porch'))out.push(item('arch-'+p.roomId+'-floor',p.roomId,p.label,'Supply and install floor tiles to porch area, including tile adhesive, cement screed, grout and necessary accessories, complete.',m2(p.area),'m2',rate('floorTileExt'),'3. ARCHITECTURES','PORCH → FLOOR TILES'));out.push(item('arch-water-tank','project','Project','Supply and install water tank complete with necessary fittings, connections and accessories, complete.',1,'no',rate('waterTank'),'3. ARCHITECTURES','MAIN BUILDING → GENERAL'));out.push(item('arch-septic-tank','project','Project','Supply and install septic tank complete with manhole, inlet and outlet piping, necessary fittings, connections and accessories, complete.',1,'no',rate('septicTank'),'3. ARCHITECTURES','MAIN BUILDING → GENERAL'));return out;}
function electrical(rs){const out=[],main=rs.filter(r=>r.roomType!=='porch'),add=(id,r,d,q,u,rt,path)=>out.push(item(id,r.roomId,r.label,d,q,u,rate(rt),'4. ELECTRICAL',path));for(const r of main){add('elec-'+r.roomId+'-pp',r,'Supply and install power point complete with wiring, socket outlet, connections and necessary accessories, complete.',2,'no','powerPoint','MAIN BUILDING');add('elec-'+r.roomId+'-switch',r,'Supply and install electrical switch complete with wiring, accessories and necessary connections, complete.',2,'no','switch','MAIN BUILDING');add('elec-'+r.roomId+'-light',r,'Supply and install lighting point complete with wiring, switch, light fitting, connections and necessary accessories, complete.',r.area<=50?1:Math.ceil(r.area*C.lighting),'no','lighting','MAIN BUILDING');if(r.roomType!=='bathroom')add('elec-'+r.roomId+'-fan',r,'Supply and install ceiling fan complete with wiring, switch, connections and necessary accessories, complete.',1,'no','fan','MAIN BUILDING');if(!['bathroom','dining','kitchen'].includes(r.roomType))add('elec-'+r.roomId+'-ac',r,'Supply and install air conditioning point complete with wiring, isolator, connections and necessary accessories, complete.',1,'no','aircond','MAIN BUILDING');}for(const p of rs.filter(r=>r.roomType==='porch')){add('elec-'+p.roomId+'-light',p,'Supply and install lighting point complete with wiring, switch, light fitting, connections and necessary accessories, complete.',p.area<=50?1:Math.ceil(p.area*C.lighting),'no','lighting','PORCH');add('elec-'+p.roomId+'-fan',p,'Supply and install ceiling fan complete with wiring, switch, connections and necessary accessories, complete.',1,'no','fan','PORCH');add('elec-'+p.roomId+'-pp',p,'Supply and install power point complete with wiring, socket outlet, connections and necessary accessories, complete.',1,'no','powerPoint','PORCH');}out.push(item('elec-earthing','project','Project','Supply and install complete earthing system including earth rod, earth cable, earth clamp, inspection chamber and necessary connections and accessories, complete.',1,'no',rate('earthing'),'4. ELECTRICAL','EARTHING'));out.push(item('elec-db','project','Project','Supply and install distribution board complete with necessary breakers, busbar, enclosure, connections and accessories, complete.',1,'no',rate('dbBox'),'4. ELECTRICAL','DB BOX'));out.push(item('elec-wiring','project','Project','Supply and install electrical wiring complete with cables, conduits, connections and necessary accessories, complete.',Math.ceil(mainArea(rs)*C.wiring),'m',rate('wiring'),'4. ELECTRICAL','WIRING'));return out;}
function doorsWindows(rs){const out=[];for(const r of rs.filter(x=>x.roomType!=='porch'&&x.roomType!=='other')){if(r.roomType!=='dining')out.push(item('dw-'+r.roomId+'-door',r.roomId,r.label,'Supply and install door complete with frame, ironmongery, hinges, lockset and necessary accessories, complete.',1,'no',rate('door'),'5. DOORS & WINDOWS','MAIN BUILDING → DOORS'));if(r.roomType!=='store')out.push(item('dw-'+r.roomId+'-window',r.roomId,r.label,'Supply and install window complete with frame, glass, ironmongery, sealant and necessary accessories, complete.',1,'no',rate('window'),'5. DOORS & WINDOWS','MAIN BUILDING → WINDOWS'));}return out;}
function external(rs){return mainArea(rs)+porchArea(rs)>0?[item('ext-boundary','project','Project','Provide and construct boundary fencing complete with posts, foundations, fencing materials, gates/necessary fittings and all associated works, complete.',1,'ls',rate('boundaryFencing'),'6. EXTERNAL WORK','BOUNDARY FENCING')]:[];}
function all(){const rs=rooms();return[...structures(rs),...architecture(rs),...electrical(rs),...doorsWindows(rs),...external(rs)];}
function render(){if(!W)return;try{const items=all(),sections=['1. PRELIMINARIES','2. STRUCTURES','3. ARCHITECTURES','4. ELECTRICAL','5. DOORS & WINDOWS','6. EXTERNAL WORK','7. OTHERS'];let h='<div class="title"><div class="eyebrow">TERAJU WORKS · CALCULATION ENGINE TEST</div><h1>Generated Item List</h1><p>Fresh test renderer. One shared table and one column header for the entire estimate.</p></div><table class="estimate"><colgroup><col class="desc"><col class="unit"><col class="qty"><col class="rate"><col class="amount"></colgroup><thead><tr><th>Description</th><th>Unit</th><th>Qty</th><th>Rate (RM)</th><th>Amount (RM)</th></tr></thead><tbody>';
for(const sec of sections){const arr=items.filter(i=>i.section===sec);h+='<tr class="main-group"><td colspan="5">'+sec+' <span class="badge">('+arr.length+' items)</span></td></tr>';if(!arr.length){h+='<tr class="empty"><td colspan="5">No generated items in this group yet.</td></tr>';continue;}const tree={};for(const i of arr){const p=String(i.path||'GENERAL').split('→').map(x=>x.trim()).filter(Boolean);const l2=p[0]||'GENERAL',l3=p[1]||'',l4=p[2]||'',l5=p[3]||'';tree[l2]??={};tree[l2][l3]??={};tree[l2][l3][l4]??={};tree[l2][l3][l4][l5]??=[];tree[l2][l3][l4][l5].push(i);}for(const [l2,g3] of Object.entries(tree)){if(l2!=='GENERAL')h+='<tr class="sub-group"><td colspan="5" class="level-1">'+l2+'</td></tr>';for(const [l3,g4] of Object.entries(g3)){if(l3)h+='<tr class="subsub-group"><td colspan="5" class="level-2">'+l3+'</td></tr>';for(const [l4,g5] of Object.entries(g4)){if(l4)h+='<tr class="subsubsub-group"><td colspan="5" class="level-3">'+l4+'</td></tr>';for(const [l5,rows] of Object.entries(g5)){if(l5)h+='<tr class="subsubsub-group"><td colspan="5" class="level-4">'+l5+'</td></tr>';for(const i of rows)h+='<tr class="item"><td>'+i.description+'</td><td>'+i.unit+'</td><td>'+fmtQ(i.qty,i.unit)+'</td><td class="num">'+money(i.rate)+'</td><td class="num"><b>'+money(i.amount)+'</b></td></tr>';}}}}}h+='</tbody></table>';report.innerHTML=h;status.textContent='RESET TEST ACTIVE · '+items.length+' items · ONE global header';}catch(e){status.textContent='TEST ERROR · '+e.message;console.error(e);}}
function smoke(){try{const rs=[{roomId:'test',roomType:'living',label:'Living / Family',area:600},{roomId:'bath',roomType:'bathroom',label:'Bathroom',area:50},{roomId:'porch',roomType:'porch',label:'Porch',area:200}],out=[...structures(rs),...architecture(rs),...electrical(rs),...doorsWindows(rs)];const ok=['arch-bath-wc','dw-test-door','dw-test-window','elec-wiring'].every(id=>out.some(x=>x.id===id));return ok?'PASS 4/4 core checks':'FAIL core checks';}catch(e){return 'FAIL '+e.message;}}
frame.addEventListener('load',()=>{W=frame.contentWindow;setTimeout(render,500)});roof.addEventListener('change',render);document.getElementById('recalc').onclick=render;document.getElementById('smoke').onclick=()=>alert(smoke());
})();
</script>
</body>
</html>
