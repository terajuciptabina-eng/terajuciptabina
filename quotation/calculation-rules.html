<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TERAJU WORKS — Calculation Rules</title><style>body{margin:0;background:#f5f7fb;color:#18212f;font-family:Inter,system-ui,sans-serif}header{padding:24px 4vw;background:#fff;border-bottom:1px solid #e5e9f0}main{padding:28px 4vw 48px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:16px;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:60px auto}.login h1{margin:0 0 8px}.muted{color:#687386;font-size:13px;line-height:1.5}input,select,button{box-sizing:border-box;padding:11px 13px;border:1px solid #d7dce4;border-radius:10px;font:inherit}input{width:100%;margin:10px 0}button{cursor:pointer;font-weight:800;background:#18212f;color:#fff;border-color:#18212f}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px;margin:0}.toolbar select{min-width:180px}.logout{background:#fff;color:#18212f}.summary{font-size:12px;color:#687386;margin:12px 0}.status{font-size:12px;margin-top:10px}.error{color:#991b1b}.section{background:#fff;border:1px solid #e5e9f0;border-radius:16px;margin-bottom:18px;overflow:hidden}.head{padding:15px 18px;background:#eef2f7;display:flex;justify-content:space-between}.wrap{overflow:auto}.rule-table{width:100%;border-collapse:collapse;min-width:1500px}.rule-table th,.rule-table td{padding:11px 13px;border-bottom:1px solid #e5e9f0;text-align:left;vertical-align:top;font-size:13px}.rule-table th{font-size:11px;text-transform:uppercase;color:#687386}.rule-table td:first-child,.rule-table th:first-child{width:34px}.desc{line-height:1.45}.note{color:#687386;line-height:1.45}.formula{font-family:ui-monospace,monospace;font-size:12px}.path{font-weight:700}.delete-btn{width:28px;height:28px;padding:0;border:0;border-radius:8px;background:#fff;color:#b91c1c;font-size:18px}.delete-btn:hover{background:#fef2f2}.delete-btn:disabled{opacity:.45}@media(max-width:700px){.toolbar{flex-direction:column}.toolbar input{min-width:0}.rule-table{min-width:0}.rule-table thead{display:none}.rule-table,.rule-table tbody,.rule-table tr,.rule-table td{display:block;width:100%}.rule-table td{border:0;padding:5px 0}.rule-table td:before{content:attr(data-label);display:block;font-size:10px;text-transform:uppercase;color:#687386;font-weight:800;margin-bottom:2px}}</style></head><body><header><b>TERAJU WORKS</b></header><main><section id="loginCard" class="card login"><h1>Admin Login</h1><div class="muted">Calculation Rules is restricted to ADMIN only. Use the same Admin password/key as the Admin Database.</div><form id="loginForm"><input id="adminKey" type="password" placeholder="Admin password" autocomplete="current-password" required><button id="loginBtn" type="submit">Log In</button></form><div id="loginStatus" class="status"></div></section><section id="app" hidden><div class="card"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><h1 style="margin:0 0 5px">Calculation Rules</h1><div class="muted">GLOBAL MASTER SOURCE OF TRUTH — ADMIN ONLY</div></div><button id="logout" class="logout">Log Out</button></div></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search item, description, formula, unit..."><select id="group"><option value="all">All groups</option><option>PRELIMINARIES</option><option>STRUCTURES</option><option>ARCHITECTURES</option><option>ELECTRICAL</option><option>DOORS & WINDOWS</option><option>EXTERNAL WORK</option></select></div><div id="status" class="status"></div><div id="summary" class="summary"></div></div><div id="sections"></div></section></main><script>const API='https://terajuciptabina.vercel.app/api/calculation-rules',KEY='teraju.admin.key';const $=id=>document.getElementById(id);let rules=[];const order=['PRELIMINARIES','STRUCTURES','ARCHITECTURES','ELECTRICAL','DOORS & WINDOWS','EXTERNAL WORK'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setStatus(msg,error=false){$('status').textContent=msg;$('status').className='status'+(error?' error':'')}function loginStatus(msg,error=false){$('loginStatus').textContent=msg;$('loginStatus').className='status'+(error?' error':'')}async function authenticate(key){const r=await fetch(API+'?admin=1',{headers:{'X-Admin-Key':key},cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.message||'Admin authentication failed.');if(!Array.isArray(data.rules))throw new Error('Invalid Calculation Rules response.');rules=data.rules;sessionStorage.setItem(KEY,key);$('loginCard').hidden=true;$('app').hidden=false;render();setStatus('Admin authenticated. Global Calculation Rules loaded.')}function render(){const q=$('search').value.toLowerCase(),g=$('group').value,rows=rules.filter(r=>(g==='all'||r.group===g)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));$('summary').textContent=`Showing ${rows.length} of ${rules.length} global calculation rules`;$('sections').innerHTML='';for(const gn of order){const rs=rows.filter(r=>r.group===gn);if(!rs.length)continue;const sec=document.createElement('section');sec.className='section';sec.innerHTML=`<div class="head"><b>${esc(gn)}</b><span>${rs.length} rules</span></div><div class="wrap"><table class="rule-table"><thead><tr><th>×</th><th>Item / Hierarchy</th><th>Full Contractor Description</th><th>Method</th><th>Coefficient / Factor</th><th>Formula</th><th>Output</th><th>Basis / Reference</th></tr></thead><tbody>${rs.map(r=>`<tr><td data-label="Permanent Delete"><button class="delete-btn" data-path="${esc(r.path)}" title="Permanently delete">×</button></td><td class="path" data-label="Item / Hierarchy">${esc(r.path)}</td><td class="desc" data-label="Full Contractor Description">${esc(r.description)}</td><td data-label="Method">${esc(r.method)}</td><td data-label="Coefficient / Factor"><b>${esc(r.coefficient)}</b></td><td class="formula" data-label="Formula">${esc(r.formula)}</td><td data-label="Output"><b>${esc(r.output)}</b></td><td class="note" data-label="Basis / Reference"><b>${esc(r.basis)}</b><br>${esc(r.note)}</td></tr>`).join('')}</tbody></table></div>`;$('sections').appendChild(sec)}document.querySelectorAll('.delete-btn').forEach(b=>b.onclick=()=>deleteRule(b))}async function deleteRule(btn){const key=sessionStorage.getItem(KEY)||'';const path=btn.dataset.path;if(!key){location.reload();return}if(!confirm(`PERMANENT DELETE\n\n${path}\n\nThis removes the rule from the GLOBAL master source for all planner users/modules. Continue?`))return;btn.disabled=true;setStatus('Deleting permanently…');try{const r=await fetch(API,{method:'DELETE',headers:{'X-Admin-Key':key,'Content-Type':'application/json'},body:JSON.stringify({path})});const data=await r.json();if(!r.ok)throw new Error(data.message||'Permanent delete failed.');rules=rules.filter(x=>x.path!==path);render();setStatus(`Permanently deleted: ${path}`)}catch(e){btn.disabled=false;setStatus(e.message,true)}}$('loginForm').onsubmit=async e=>{e.preventDefault();const key=$('adminKey').value.trim();if(!key)return;const btn=$('loginBtn');btn.disabled=true;btn.textContent='Logging in…';loginStatus('Authenticating…');try{await authenticate(key)}catch(e){loginStatus(e.message,true);try{sessionStorage.removeItem(KEY)}catch{}}finally{btn.disabled=false;btn.textContent='Log In'}};$('logout').onclick=()=>{try{sessionStorage.removeItem(KEY)}catch{};location.reload()};$('search').oninput=render;$('group').onchange=render;(async()=>{let key='';try{key=sessionStorage.getItem(KEY)||''}catch{}if(!key)return;$('adminKey').value='';try{await authenticate(key)}catch{try{sessionStorage.removeItem(KEY)}catch{}}})();</script></body></html>
