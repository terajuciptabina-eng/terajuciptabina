<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Database | TERAJU WORKS</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}.title{font-size:30px;font-weight:850;margin:5px 0}.sub{color:#6b7280;font-size:14px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.05);margin-bottom:18px}.controls{display:grid;grid-template-columns:1.2fr .8fr auto auto;gap:10px}input,select,button{min-height:44px;border:1px solid #d1d5db;border-radius:11px;padding:0 13px;font:inherit}button{cursor:pointer;font-weight:800;background:#111827;color:#fff;border-color:#111827}button.secondary{background:#fff;color:#111827}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border:1px solid #e5e7eb;border-radius:14px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#6b7280}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eef0f2;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#6b7280}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:800;margin:2px}.ok{color:#166534}.err{color:#991b1b}.muted{color:#6b7280;font-size:12px}.details{white-space:pre-wrap;background:#111827;color:#f9fafb;border-radius:12px;padding:14px;max-height:420px;overflow:auto;font-size:11px;margin-top:12px}.hidden{display:none}@media(max-width:760px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="eyebrow">TERAJU WORKS</div><div class="title">Admin Database</div><div class="sub">Private inspection dashboard for accounts and quotation records.</div></div><div id="status" class="muted"></div></div>
  <div class="panel">
    <div class="controls"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><select id="role"><option value="">All accounts</option><option value="homeowner">Homeowner</option><option value="contractor">Contractor</option></select><input id="q" placeholder="Search ID, name, email or phone"><button id="load">Load database</button></div>
  </div>
  <div id="stats" class="stats panel hidden"></div>
  <div id="result" class="panel hidden"></div>
</div>
<script>
const API='https://terajuciptabina.vercel.app/api/admin';
const $=id=>document.getElementById(id);
async function load(){
  const key=$('key').value.trim(); if(!key){$('status').textContent='Enter admin key.';return;}
  $('status').textContent='Loading…';$('load').disabled=true;
  try{
    const params=new URLSearchParams({role:$('role').value,q:$('q').value,records:'1'});
    const r=await fetch(`${API}?${params}`,{headers:{'X-Admin-Key':key}}); const data=await r.json(); if(!r.ok)throw new Error(data.message||'Request failed');
    $('stats').classList.remove('hidden');$('stats').innerHTML=`<div class="stat"><b>${data.counts.accounts}</b><span>Accounts</span></div><div class="stat"><b>${data.counts.quotations}</b><span>Quotation documents</span></div><div class="stat"><b>${new Date(data.generatedAt).toLocaleString('en-MY')}</b><span>Last loaded</span></div>`;
    const rows=data.accounts.map((a,i)=>{const records=[...(a.plannerRecords?.build||[]),...(a.plannerRecords?.renovation||[])];const q=records.map(x=>`<span class="badge">${x.quotationNumber||'-'} · ${x.quotationType||'simple'} · ${x.plannerType||'-'}</span>`).join('');return `<tr><td>${i+1}</td><td><b>${a.id||'-'}</b><br><span class="muted">${a.role||'-'}</span></td><td>${escapeHtml(a.name||'-')}<br>${escapeHtml(a.email||'-')}<br>${escapeHtml(a.phone||'-')}</td><td>${q||'<span class="muted">No quotations</span>'}</td><td>${a.quotationRunningNumber||0}</td><td>${escapeHtml(a.updatedAt||'-')}</td></tr>`}).join('');
    $('result').classList.remove('hidden');$('result').innerHTML=`<div class="eyebrow">Records</div><div style="margin:5px 0 14px;font-size:18px;font-weight:800">${data.accounts.length} account(s)</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Account</th><th>Profile</th><th>Quotations</th><th>Running #</th><th>Updated</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No records found.</td></tr>'}</tbody></table></div><details style="margin-top:16px"><summary style="cursor:pointer;font-weight:800">Show raw database JSON</summary><div class="details">${escapeHtml(JSON.stringify(data.accounts,null,2))}</div></details>`;
    $('status').textContent='Database loaded.';
  }catch(e){$('status').textContent=e.message;$('status').className='err'}finally{$('load').disabled=false}
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('load').addEventListener('click',load);$('key').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
</script>
</body>
</html>
