<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}.title{font-size:30px;font-weight:850;margin:5px 0}.sub{color:#6b7280;font-size:14px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.05);margin-bottom:18px}.controls{display:grid;grid-template-columns:1.2fr .8fr auto auto auto;gap:10px}input,select,button{min-height:44px;border:1px solid #d1d5db;border-radius:11px;padding:0 13px;font:inherit}button{cursor:pointer;font-weight:800;background:#111827;color:#fff;border-color:#111827}button.secondary{background:#fff;color:#111827}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border:1px solid #e5e7eb;border-radius:14px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#6b7280}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eef0f2;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#6b7280}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:800;margin:2px}.muted{color:#6b7280;font-size:12px}.details{white-space:pre-wrap;background:#111827;color:#f9fafb;border-radius:12px;padding:14px;max-height:420px;overflow:auto;font-size:11px;margin-top:12px}.hidden{display:none}.notice{padding:10px 12px;border-radius:11px;background:#fff7ed;color:#9a3412;font-size:12px;margin-top:10px}.account-link{color:#111827;text-decoration:none;font-weight:800;border-bottom:1px dotted #9ca3af}.account-link:hover{text-decoration:underline}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.action-link{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border:1px solid rgba(15,23,42,.1);border-radius:11px;background:#fff;text-decoration:none;color:#111827;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(15,23,42,.04)}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls button{width:100%}}@media(max-width:760px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top{display:block}.top-actions{margin-top:12px}}

<div class="wrap">
  <div class="top"><div><div class="eyebrow">TERAJU WORKS</div><div class="title">Admin Database</div><div class="sub">Read-only inspection dashboard for accounts and quotation records.</div></div><div class="top-actions"><a class="action-link" href="admin-rate-comparison.html">Overall Rate Comparison</a><div id="status" class="muted"></div></div></div>
  <div class="panel">

  </div>
  <div id="stats" class="stats panel hidden"></div>
  <div id="result" class="panel hidden"></div>
</div>

const API='https://terajucipina.vercel.app/api/admin';
