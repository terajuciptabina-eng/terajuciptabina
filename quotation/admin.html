<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Database | TERAJU WORKS</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}.title{font-size:30px;font-weight:850;margin:5px 0}.sub{color:#6b7280;font-size:14px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.05);margin-bottom:18px}.controls{display:grid;grid-template-columns:1.2fr .8fr auto auto auto;gap:10px}input,select,button{min-height:44px;border:1px solid #d1d5db;border-radius:11px;padding:0 13px;font:inherit}button{cursor:pointer;font-weight:800;background:#111827;color:#fff;border-color:#111827}button.secondary{background:#fff;color:#111827}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border:1px solid #e5e7eb;border-radius:14px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#6b7280}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eef0f2;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#6b7280}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:11px;font-weight:800;margin:2px}.muted{color:#6b7280;font-size:12px}.details{white-space:pre-wrap;background:#111827;color:#f9fafb;border-radius:12px;padding:14px;max-height:420px;overflow:auto;font-size:11px;margin-top:12px}.hidden{display:none}.notice{padding:10px 12px;border-radius:11px;background:#fff7ed;color:#9a3412;font-size:12px;margin-top:10px}.account-link{color:#111827;text-decoration:none;font-weight:800;border-bottom:1px dotted #9ca3af}.account-link:hover{text-decoration:underline}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.action-link{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border:1px solid rgba(15,23,42,.1);border-radius:11px;background:#fff;text-decoration:none;color:#111827;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(15,23,42,.04)}.delete-btn{width:30px;min-height:30px;height:30px;padding:0;border:0;border-radius:8px;background:transparent;color:#b91c1c;font-size:20px;line-height:30px;font-weight:700}.delete-btn:hover{background:#fef2f2}.delete-btn:disabled{opacity:.45;cursor:wait}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls button{width:100%}}@media(max-width:760px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top{display:block}.top-actions{margin-top:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="eyebrow">TERAJU WORKS</div><div class="title">Admin Database</div><div class="sub">Read-only inspection dashboard for accounts and quotation records.</div></div><div class="top-actions"><a class="action-link" href="admin-rate-management.html">Rate Management</a><a class="action-link" href="admin-rate-comparison.html">Overall Rate Comparison</a><div id="status" class="muted"></div></div></div>
  <div class="panel">
    <div class="controls"><input id="key" type="password" placeholder="Admin key (Vercel mode)" autocomplete="off"><select id="role"><option value="">All accounts</option><option value="homeowner">Homeowner</option><option value="contractor">Contractor</option></select><input id="q" placeholder="Search ID, name, email or phone"><button id="load">Load database</button><button id="temporary" class="secondary" type="button">Temporary GitHub mode</button></div>
    <div class="notice">Temporary GitHub mode is read-only and reads the public database files directly from this GitHub repository. No GitHub token or admin key is exposed.</div>
  </div>
  <div id="stats" class="stats panel hidden"></div>
  <div id="result" class="panel hidden"></div>
</div>
<script>
const API='https://terajuciptabina.vercel.app/api/admin';const GH='https://api.github.com/repos/terajuciptabina-eng/terajuciptabina/contents/data/users';const $=id=>document.getElementById(id);
function filterAccounts(accounts){const role=$('role').value,q=$('q').value.trim().toLowerCase();return accounts.filter(a=>(!role||a.role===role)&&(!q||[a.id,a.name,a.email,a.phone].some(v=>String(v||'').toLowerCase().includes(q))));}
function sortByLatestDate(accounts){return accounts.slice().sort((a,b)=>{const ad=Date.parse(a.updatedAt||a.createdAt||'')||0;const bd=Date.parse(b.updatedAt||b.createdAt||'')||0;return bd-ad;});}
function render(data,mode){const accounts=sortByLatestDate(filterAccounts(data.accounts||[]));const quotationCount=accounts.reduce((sum,a)=>sum+(Number(a.buildCount)||0)+(Number(a.renovationCount)||0),0);$('stats').classList.remove('hidden');$('stats').innerHTML=`<div class="stat"><b>${accounts.length}</b><span>Accounts</span></div><div class="stat"><b>${quotationCount}</b><span>Quotation documents</span></div><div class="stat"><b>${new Date(data.generatedAt||Date.now()).toLocaleString('en-MY')}</b><span>Last loaded · ${mode}</span></div>`;const rows=accounts.map((a,i)=>{const records=[...(a.plannerRecords?.build||[]),...(a.plannerRecords?.renovation||[])];const q=records.map(x=>`<span class="badge">${escapeHtml(x.quotationNumber||'-')} · ${escapeHtml(x.quotationType||'simple')} · ${escapeHtml(x.plannerType||'-')}</span>`).join('');const deleteCell=mode==='Vercel API'?`<button class="delete-btn" title="Delete user" aria-label="Delete user" data-delete-id="${escapeHtml(a.id||'')}" data-delete-role="${escapeHtml(a.role||'')}">×</button>`:'<span class="muted">—</span>';return `<tr data-account-id="${escapeHtml(a.id||'')}"><td>${i+1}</td><td><a class="account-link" href="admin-quotation.html?id=${encodeURIComponent(a.id||'')}">${escapeHtml(a.id||'-')}</a><br><span class="muted">${escapeHtml(a.role||'-')}</span></td><td>${escapeHtml(a.name||'-')}<br>${escapeHtml(a.email||'-')}<br>${escapeHtml(a.phone||'-')}</td><td>${q||'<span class="muted">No quotations</span>'}</td><td>${a.quotationRunningNumber||0}</td><td>${escapeHtml(a.updatedAt||a.createdAt||'-')}</td><td style="text-align:center">${deleteCell}</td></tr>`}).join('');$('result').classList.remove('hidden');$('result').innerHTML=`<div class="eyebrow">Records</div><div style="margin:5px 0 14px;font-size:18px;font-weight:800">${accounts.length} account(s) · sorted by latest date</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Account</th><th>Profile</th><th>Quotations</th><th>Running #</th><th>Updated</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7">No records found.</td></tr>'}</tbody></table></div><details style="margin-top:16px"><summary style="cursor:pointer;font-weight:800">Show raw database JSON</summary><div class="details">${escapeHtml(JSON.stringify(accounts,null,2))}</div></details>`;document.querySelectorAll('[data-delete-id]').forEach(btn=>btn.addEventListener('click',()=>deleteUser(btn)));}
async function deleteUser(btn){const id=btn.dataset.deleteId,role=btn.dataset.deleteRole,key=$('key').value.trim();if(!key){$('status').textContent='Admin key required to delete a user.';return}if(!confirm(`Delete ${role} account ${id}? This permanently removes the user database file from GitHub.`))return;btn.disabled=true;$('status').textContent='Deleting…';try{const r=await fetch(API,{method:'DELETE',headers:{'X-Admin-Key':key,'Content-Type':'application/json'},body:JSON.stringify({id,role})});const data=await r.json();if(!r.ok)throw new Error(data.message||'Delete failed.');$('status').textContent=`Deleted ${id}.`;await loadApi()}catch(e){btn.disabled=false;$('status').textContent=e.message}}
async function loadApi(){const key=$('key').value.trim();if(!key){$('status').textContent='Enter admin key or use Temporary GitHub mode.';return}try{sessionStorage.setItem('teraju.admin.key',key)}catch{}$('status').textContent='Loading…';$('load').disabled=true;try{const params=new URLSearchParams({role:$('role').value,q:$('q').value,records:'1'});const r=await fetch(`${API}?${params}`,{headers:{'X-Admin-Key':key}});const data=await r.json();if(!r.ok)throw new Error(data.message||'Request failed');render(data,'Vercel API');$('status').textContent='Database loaded via Vercel.'}catch(e){$('status').textContent=e.message}finally{$('load').disabled=false}}
async function loadGitHub(){$('status').textContent='Loading public database…';$('temporary').disabled=true;try{const accounts=[];for(const role of ['homeowners','contractors']){const listingResponse=await fetch(GH+'/'+role);if(!listingResponse.ok)throw new Error('Unable to read GitHub database folder.');const listing=await listingResponse.json();for(const item of listing.filter(x=>x.type==='file'&&x.name.endsWith('.json'))){const r=await fetch(item.download_url);if(!r.ok)continue;const record=await r.json();const planner=record.plannerRecords||{};accounts.push({role:role==='homeowners'?'homeowner':'contractor',id:record.homeownerId||record.contractorId||'',name:record.profile?.name||'',email:record.profile?.email||'',phone:record.profile?.phone||'',state:record.state||'',quotationRunningNumber:record.quotationRunningNumber||0,buildCount:Array.isArray(planner.build)?planner.build.length:0,renovationCount:Array.isArray(planner.renovation)?planner.renovation.length:0,updatedAt:record.updatedAt||'',createdAt:record.createdAt||'',plannerRecords:planner})}}render({accounts,generatedAt:new Date().toISOString()},'temporary GitHub');$('status').textContent='Temporary GitHub read-only mode loaded.'}catch(e){$('status').textContent=e.message}finally{$('temporary').disabled=false}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('load').addEventListener('click',loadApi);$('temporary').addEventListener('click',loadGitHub);$('key').addEventListener('keydown',e=>{if(e.key==='Enter')loadApi()});$('role').addEventListener('change',()=>{if(!$('result').classList.contains('hidden'))$('status').textContent='Filter changed — load again.'});
</script>
</body>
</html>
