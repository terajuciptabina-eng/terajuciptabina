<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Quotation | TERAJU WORKS</title>
<link rel="stylesheet" href="shared/teraju-workspace-theme.css">
<style>
body{margin:0}.wrap{width:100%;min-height:100vh;padding:18px 24px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.13em;color:#059669;text-transform:uppercase}.title{font-size:25px;font-weight:850;color:#172033;margin:4px 0}.sub{font-size:12px;color:#64748b}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{display:inline-flex;align-items:center;min-height:36px;padding:0 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;text-decoration:none;color:#172033;font-size:11px;font-weight:800}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;box-shadow:0 7px 22px rgba(15,23,42,.055);margin-bottom:12px}.toolbar{display:flex;gap:8px;align-items:center}.toolbar input,.toolbar select{flex:1;min-height:38px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;font:inherit}.table-wrap{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0}th,td{text-align:left;padding:9px;border-bottom:1px solid #eef0f2;font-size:11px;overflow-wrap:anywhere}th{font-size:9px;text-transform:uppercase;color:#64748b;background:#f8fafc}td.num{text-align:right;white-space:nowrap}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#d1fae5;color:#047857;font-size:9px;font-weight:800}.open{display:inline-flex;padding:6px 9px;border-radius:8px;background:#172033;color:#fff;text-decoration:none;font-size:10px;font-weight:800}.empty{text-align:center;padding:35px;color:#64748b}@media(max-width:700px){.wrap{padding:14px 12px}.top{display:block}.nav{margin-top:10px}.toolbar{display:grid;grid-template-columns:1fr}}
</style></head>
<body class="tw-theme"><main class="wrap">
<header class="top"><div><div class="eyebrow">TERAJU WORKS · ADMIN</div><div class="title">Cost Estimate Records</div><div class="sub">Admin read-only view of stored BuildPlanner and RenovationPlanner estimates.</div></div><nav class="nav"><a href="admin.html">Home</a><a href="admin-database.html">Admin Database</a><a href="admin-rate-management.html">Rate Management</a><a href="admin-rate-comparison.html">Rate Comparison</a></nav></header>
<section class="panel"><div class="toolbar"><input id="q" placeholder="Search account, customer, project or estimate ID"><select id="planner"><option value="all">All planners</option><option value="build">BuildPlanner</option><option value="renovation">RenovationPlanner</option></select></div><div id="status" class="sub" style="margin-top:8px">Loading…</div></section>
<section class="panel table-wrap"><table><thead><tr><th>Account</th><th>Planner</th><th>Estimate</th><th>Customer / Project</th><th>Location</th><th>Total</th><th>Updated</th><th></th></tr></thead><tbody id="tbody"></tbody></table></section>
</main>
<script>
const API='https://terajuciptabina.vercel.app/api/admin',key=()=>sessionStorage.getItem('teraju.admin.key')||localStorage.getItem('teraju.admin.key')||'';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v){const n=Number(v);return Number.isFinite(n)?'RM '+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}):'-'}
let rows=[];
function render(){const q=$('q').value.trim().toLowerCase(),pl=$('planner').value;const x=rows.filter(r=>(pl==='all'||r.plannerType===pl)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));$('status').textContent=x.length+' estimate record(s)';$('tbody').innerHTML=x.length?x.map(r=>`<tr><td><strong>${esc(r.accountName||r.accountId||'-')}</strong><br><span class="sub">${esc(r.accountId||'')}</span></td><td><span class="badge">${esc(r.plannerType)}</span></td><td><strong>${esc(r.quotationNumber||r.quotationId||'Estimate')}</strong></td><td>${esc(r.customer||r.project?.customer||r.project?.name||'-')}</td><td>${esc(r.location||r.project?.location||'-')}</td><td class="num">${money(r.total??r.grandTotal)}</td><td>${esc(r.updatedAt||r.createdAt||'-')}</td><td><a class="open" href="admin-quotation-app.html?id=${encodeURIComponent(r.accountId)}&quotationId=${encodeURIComponent(r.quotationId||'')}&plannerType=${encodeURIComponent(r.plannerType||'')}">Open</a></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty">No estimate records found.</div></td></tr>'}
async function load(){try{const k=key();if(!k)throw new Error('Admin session not found. Please open Admin Control Panel first.');const res=await fetch(API+'?records=1',{headers:{'X-Admin-Key':k},cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.message||'Unable to load admin data.');rows=[];for(const a of data.accounts||[]){for(const type of ['build','renovation'])for(const r of a.plannerRecords?.[type]||[])rows.push({...r,accountId:a.id,accountName:a.name||a.profile?.name||a.id,plannerType:type});}rows.sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));render()}catch(e){$('status').textContent=e.message;$('tbody').innerHTML='<tr><td colspan="8"><div class="empty">'+esc(e.message)+'</div></td></tr>'}}
$('q').addEventListener('input',render);$('planner').addEventListener('change',render);load();
</script></body></html>
