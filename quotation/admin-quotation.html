<!doctype html><html><body style="margin:0;background:#f3f4f6;font-family:system-ui"><div id="gate" style="min-height:100vh;display:grid;place-items:center"><div style="background:#fff;padding:28px;border-radius:18px;max-width:430px"><b>TERAJU WORKS</b><h2>Admin Authentication</h2><p>Admin Quotation is controlled by the Admin Control Panel.</p><button onclick="location.href='../admin.html'">Open Admin Control</button></div></div><iframe id="app" src="admin-quotation-app.html" style="display:none;position:fixed;inset:0;width:100%;height:100%;border:0"></iframe><script>const k=sessionStorage.getItem('teraju.admin.key')||'',API='https://terajuciptabina.vercel.app/api/admin',g=document.getElementById('gate'),f=document.getElementById('app');if(!k)location.href='../admin.html';else fetch(API+'?records=0',{headers:{'X-Admin-Key':k},cache:'no-store'}).then(r=>{if(!r.ok)throw 0;g.style.display='none';f.style.display='block'}).catch(()=>{sessionStorage.removeItem('teraju.admin.key');location.href='../admin.html'});</script></body></html>
