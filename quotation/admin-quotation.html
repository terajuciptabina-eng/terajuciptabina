<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quotation Detail | TERAJU WORKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.planner-header{background:rgba(255,255,255,.05);border-bottom:1px solid rgba(15,23,42,.08);box-shadow:0 4px 18px rgba(15,23,42,.06);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}.header-inner{max-width:1180px;margin:auto;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em}.brand p{margin:3px 0 0;font-size:12px;color:#6b7280}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#374151;text-decoration:none;font-size:12px;font-weight:700;padding:8px 11px;border:1px solid rgba(15,23,42,.09);border-radius:10px;background:rgba(255,255,255,.45)}.wrap{max-width:1180px;margin:auto;padding:24px 18px}.top{margin-bottom:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}.title{font-size:26px;font-weight:800;margin:5px 0}.sub{font-size:13px;color:#6b7280}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 6px 24px rgba(15,23,42,.05);margin-bottom:16px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.meta div{padding:11px 12px;border:1px solid #eef0f2;border-radius:11px}.meta span{display:block;font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:700}.meta b{display:block;margin-top:4px;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #eef0f2;font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:#6b7280}td.rate,td.amount{text-align:right;white-space:nowrap}.desc{font-weight:600}.muted{color:#6b7280;font-size:12px}.error{color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:11px;padding:12px}.empty{text-align:center;padding:28px;color:#6b7280}.total{text-align:right;font-size:16px;font-weight:800;padding-top:12px}.hidden{display:none}@media(max-width:760px){.header-inner{display:block}.nav{margin-top:12px}.meta{grid-template-columns:1fr 1fr}.wrap{padding:18px 12px}}@media(max-width:430px){.meta{grid-template-columns:1fr}.title{font-size:22px}}
</style>
</head>
<body>
<header class="planner-header"><div class="header-inner"><div class="brand"><h1>TERAJU CIPTABINA</h1><p>Admin Workspace · Quotation Detail</p></div><nav class="nav"><a href="admin.html">Admin Database</a><a href="index.html">Home</a></nav></div></header>
<main class="wrap"><div class="top"><div class="eyebrow">Quotation Record</div><div id="title" class="title">Loading…</div><div class="sub">Admin read-only view · focus on item description and rate.</div></div><div id="error" class="error hidden"></div><div id="content" class="hidden"><section class="panel"><div id="meta" class="meta"></div></section><section class="panel"><div class="eyebrow">Quotation Items</div><div style="margin:5px 0 12px;font-size:17px;font-weight:800">Description &amp; Rate</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Description</th><th>Unit</th><th style="text-align:right">Quantity</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead><tbody id="items"></tbody></table></div><div id="total" class="total"></div></section></div></main>
<script>
const API='https://terajuciptabina.vercel.app/api/admin';const GH='https://api.github.com/repos/terajuciptabina-eng/terajuciptabina/contents/data/users';const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}):'-'}
function findRecord(data){const id=p.get('id')||'';const quotationId=p.get('quotationId')||'';const plannerType=p.get('plannerType')||'';const all=[];for(const a of data.accounts||[]){if(id&&a.id!==id)continue;for(const type of ['build','renovation'])for(const r of a.plannerRecords?.[type]||[])if(!quotationId||r.quotationId===quotationId)if(!plannerType||type===plannerType)all.push({...r,_account:a,_plannerType:type})}return all[0]}
function render(r){const a=r._account||{};$('title').textContent=r.quotationNumber||r.quotationId||'Quotation';$('meta').innerHTML=[['Account',a.name||a.id||'-'],['Account ID',a.id||'-'],['Planner',r._plannerType||r.plannerType||'-'],['Quotation Type',r.quotationType||'simple'],['Customer',r.customer||r.project?.customer||'-'],['Location',r.location||r.project?.location||'-'],['Quotation ID',r.quotationId||'-'],['Updated',r.updatedAt||'-']].map(x=>`<div><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');const rooms=Array.isArray(r.snapshot?.rooms)?r.snapshot.rooms:[];const raw=Array.isArray(r.items)?r.items:Array.isArray(r.estimateItems)?r.estimateItems:[];const items=raw.length?raw:rooms.map(x=>({description:x.name||x.type||'Room',unit:'-',quantity:x.area||'',rate:'',amount:''}));$('items').innerHTML=items.map((x,i)=>`<tr><td>${i+1}</td><td class="desc">${esc(x.description||x.name||'-')}</td><td>${esc(x.unit||'-')}</td><td style="text-align:right">${esc(x.quantity??'-')}</td><td class="rate">${x.rate===''||x.rate==null?'-':'RM '+money(x.rate)}</td><td class="amount">${x.amount===''||x.amount==null?'-':'RM '+money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No quotation items found.</td></tr>';const total=Number(r.total??r.grandTotal??r.summary?.grandTotal);$('total').textContent=Number.isFinite(total)?'Total · RM '+money(total):'';$('content').classList.remove('hidden')}
async function load(){try{const key=sessionStorage.getItem('teraju.admin.key')||localStorage.getItem('teraju.admin.key');const id=p.get('id')||'';if(!id)throw new Error('Account ID is missing.');if(key){const qs=new URLSearchParams({role:'',q:'',records:'1'});const res=await fetch(`${API}?${qs}`,{headers:{'X-Admin-Key':key}});const data=await res.json();if(!res.ok)throw new Error(data.message||'Unable to load admin data.');const r=findRecord(data);if(!r)throw new Error('Quotation record not found.');return render(r)}const accounts=[];for(const role of ['homeowners','contractors']){const lr=await fetch(GH+'/'+role);if(!lr.ok)throw new Error('Unable to read GitHub database.');const list=await lr.json();for(const item of list.filter(x=>x.type==='file'&&x.name.endsWith('.json'))){const rr=await fetch(item.download_url);if(!rr.ok)continue;const rec=await rr.json();accounts.push({id:rec.homeownerId||rec.contractorId||'',name:rec.profile?.name||'',plannerRecords:rec.plannerRecords||{}})}}const r=findRecord({accounts});if(!r)throw new Error('Quotation record not found.');render(r)}catch(e){$('title').textContent='Unable to load quotation';$('error').textContent=e.message;$('error').classList.remove('hidden')}}load();
</script>
</body>
</html>
