<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>My Quotations | TERAJU WORKS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background-image:linear-gradient(135deg,rgba(248,250,252,.62),rgba(255,255,255,.48) 48%,rgba(241,245,249,.64)),url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=88');background-size:cover;background-position:center;background-attachment:fixed}.site-shell{min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(148,163,184,.10),transparent 30%),radial-gradient(circle at 85% 20%,rgba(203,213,225,.12),transparent 28%),linear-gradient(135deg,rgba(248,250,252,.28),rgba(255,255,255,.18) 48%,rgba(241,245,249,.30))}.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 70px rgba(15,23,42,.09)}.gold-line{background:linear-gradient(90deg,transparent,#b8a47a,transparent)}.history-card{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.96);box-shadow:0 12px 38px rgba(15,23,42,.06);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.history-card:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(15,23,42,.10);border-color:#cbd5e1}.history-action,.primary-action{background:#0f172a;color:#fff;box-shadow:0 8px 22px rgba(15,23,42,.12);transition:.18s ease}.history-action:hover,.primary-action:hover{background:#020617;transform:translateY(-1px)}.secondary-action{background:rgba(255,255,255,.9);border:1px solid #e2e8f0;color:#475569}.secondary-action:hover{background:#f8fafc;color:#0f172a}.empty-card{background:rgba(255,255,255,.58);border:1px dashed #cbd5e1}.history-head,.history-panel{animation:fadeUp .65s cubic-bezier(.22,1,.36,1) both}.history-panel{animation-delay:.08s}@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media(max-width:767px){header .inner{padding:14px 16px!important}main{padding:28px 14px!important}.glass{padding:20px!important;border-radius:24px!important}.history-card{padding:17px!important}.history-action,.primary-action,.secondary-action{min-height:48px}.history-card:hover{transform:none}.history-title{font-size:34px!important;line-height:1.05}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.history-head,.history-panel,.history-card{animation:none!important}.history-card,.history-action{transition:none!important}}
</style>
</head>
<body class="min-h-screen">
<div class="site-shell min-h-screen">
<header class="border-b border-slate-200/80 bg-white/80 backdrop-blur-xl"><div class="inner mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-4 sm:px-6"><a href="index.html" class="flex items-center gap-3"><img src="../images/logo.png" alt="Teraju Ciptabina Logo" class="h-10 w-auto"><div class="hidden sm:block leading-tight"><div class="text-sm font-bold tracking-wide text-slate-900">TERAJU WORKS</div><div class="text-[10px] font-medium tracking-[.16em] text-slate-500">CONSTRUCTION COSTING &amp; QUOTATION</div></div></a><a id="backLink" href="contractor.html" class="secondary-action rounded-xl px-4 py-2.5 text-sm font-semibold transition">← Back</a></div></header>
<main class="mx-auto max-w-6xl px-5 py-12 sm:px-6 sm:py-16">
<section class="history-panel glass rounded-[30px] border border-white/90 p-6 sm:p-9">
<div class="history-head flex flex-col justify-between gap-6 sm:flex-row sm:items-end"><div><div class="mb-4 flex items-center gap-3"><span class="gold-line h-px w-10"></span><p id="roleLabel" class="text-[10px] font-black tracking-[.22em] text-slate-500">MY QUOTATIONS</p><span class="gold-line h-px w-10"></span></div><h1 class="history-title text-4xl font-black tracking-[-.05em] text-slate-950 sm:text-5xl">Quotation History</h1><p class="mt-3 max-w-2xl text-sm leading-6 text-slate-500">Continue an existing quotation or start a completely new project. Build and Renovation quotations remain separate.</p></div><div class="flex flex-wrap gap-2"><button id="refreshButton" class="secondary-action rounded-xl px-4 py-2.5 text-sm font-semibold transition">Refresh</button><a id="newQuotationLink" href="buildplanner.html" class="primary-action rounded-xl px-4 py-2.5 text-sm font-semibold transition">Create New</a></div></div>
<div id="status" class="mt-8 rounded-2xl border border-slate-200 bg-white/65 px-4 py-3 text-sm text-slate-500 backdrop-blur">Loading quotations…</div>
<div id="list" class="mt-5 grid gap-4"></div>
</section>
</main>
<footer class="border-t border-slate-200/80 bg-white/70 backdrop-blur-xl"><div class="mx-auto max-w-6xl px-5 py-6 text-center text-[10px] font-medium tracking-[.12em] text-slate-400 sm:px-6">TERAJU CIPTABINA RESOURCES · CONSTRUCTION COSTING &amp; QUOTATION</div></footer>
</div>
<script>
(() => {
 const API='https://terajuciptabina.vercel.app/api/quotations';
 const p=new URLSearchParams(location.search);const role=(p.get('role')||'homeowner').toLowerCase()==='contractor'?'contractor':'homeowner';const idKey=role==='contractor'?'contractorId':'homeownerId';const id=(p.get('id')||'').trim().toUpperCase();const type=(p.get('plannerType')||'build').toLowerCase()==='renovation'?'renovation':'build';
 const list=document.getElementById('list'),status=document.getElementById('status'),back=document.getElementById('backLink'),newLink=document.getElementById('newQuotationLink');
 const plannerFile=type==='renovation'?'renovationplanner.html':'buildplanner.html';
 back.href=role==='contractor'?`contractor.html`:`homeowner.html`;
 newLink.href=`${plannerFile}?audience=${role}&${idKey}=${encodeURIComponent(id)}`;
 newLink.textContent=type==='renovation'?'Create New Renovation':'Create New Build';
 document.getElementById('roleLabel').textContent=`${role.toUpperCase()} · ${type==='renovation'?'RENOVATION':'BUILD'} QUOTATIONS`;
 function money(v){return new Intl.NumberFormat('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)}
 function date(v){try{return new Intl.DateTimeFormat('en-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return '-'}}
 function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
 function render(items){
   if(!items.length){list.innerHTML='<div class="empty-card rounded-2xl p-10 text-center"><div class="text-4xl">📄</div><p class="mt-3 font-bold text-slate-900">No saved quotations yet.</p><p class="mt-1 text-sm text-slate-500">Create a new project to start your first quotation.</p></div>';return}
   list.innerHTML=items.map(q=>{const edit=`${plannerFile}?audience=${role}&${idKey}=${encodeURIComponent(id)}&quotationId=${encodeURIComponent(q.quotationId)}`;return `<article class="history-card rounded-2xl p-5"><div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center"><div><div class="flex flex-wrap items-center gap-2"><span class="rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-bold tracking-wide text-slate-600">${esc(q.state||'final').toUpperCase()}</span><span class="text-xs font-medium text-slate-400">${esc(q.quotationType||'simple')} quotation</span></div><h2 class="mt-3 text-xl font-bold text-slate-950">${esc(q.quotationNumber||q.quotationId)}</h2><p class="mt-1 text-sm text-slate-600">${esc(q.client?.name||'Not specified')} · ${esc(q.project?.location||'Location not specified')}</p><p class="mt-2 text-xs text-slate-400">Updated ${date(q.updatedAt)}</p></div><div class="flex items-center justify-between gap-5 sm:justify-end"><div class="text-right"><p class="text-xs text-slate-400">Total</p><p class="text-2xl font-black text-slate-950">RM ${money(q.total)}</p></div><a href="${edit}" class="history-action rounded-xl px-4 py-3 text-sm font-semibold">Open / Edit</a></div></div></article>`}).join('');
 }
 async function load(){
   if(!id){status.textContent='No user ID was supplied. Open this page from the workspace.';return}
   status.textContent='Loading quotations…';
   try{const r=await fetch(`${API}?role=${encodeURIComponent(role)}&id=${encodeURIComponent(id)}&plannerType=${encodeURIComponent(type)}`);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Unable to load quotations.');const items=Array.isArray(data.quotations)?data.quotations:[];items.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));render(items);status.textContent=`${items.length} saved quotation${items.length===1?'':'s'} · ${type==='build'?'Build':'Renovation'}`;}catch(e){status.textContent=e.message||'Unable to load quotations.';list.innerHTML=''}
 }
 document.getElementById('refreshButton').addEventListener('click',load);load();
})();
</script>
</body>
</html>
