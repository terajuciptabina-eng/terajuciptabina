<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>My Quotations | TERAJU WORKS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#f8fafc,#eef2f7);color:#111827}.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(15,23,42,.09)}.quote-card{transition:.2s ease}.quote-card:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(15,23,42,.10)}@media(max-width:767px){main{padding:16px!important}.quote-card{border-radius:18px!important}}
</style>
</head>
<body class="min-h-screen">
<header class="border-b border-slate-200/80 bg-white/90 backdrop-blur-xl"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-4 sm:px-6"><a href="index.html" class="flex items-center gap-3"><img src="../images/logo.png" alt="Teraju Ciptabina Logo" class="h-10 w-auto"><div class="hidden sm:block leading-tight"><div class="text-sm font-bold tracking-wide">TERAJU WORKS</div><div class="text-[10px] font-medium tracking-[.16em] text-slate-500">CONSTRUCTION COSTING &amp; QUOTATION</div></div></a><a id="backLink" href="contractor.html" class="text-sm font-semibold text-slate-500 hover:text-slate-900">← Back</a></div></header>
<main class="mx-auto max-w-6xl px-5 py-10 sm:px-6 sm:py-14">
<section class="glass rounded-[28px] border border-white p-6 sm:p-9">
<div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end"><div><p id="roleLabel" class="text-xs font-bold tracking-[.18em] text-slate-500">MY QUOTATIONS</p><h1 class="mt-2 text-3xl font-bold tracking-tight sm:text-5xl">Quotation History</h1><p class="mt-3 max-w-2xl text-sm leading-6 text-slate-500">Open a saved quotation to continue adjusting the planner. Your Build and Renovation quotations remain separate.</p></div><div class="flex gap-2"><button id="refreshButton" class="rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold">Refresh</button><a id="newQuotationLink" href="buildplanner.html" class="rounded-xl bg-slate-950 px-4 py-2.5 text-sm font-semibold text-white">Create New</a></div></div>
<div id="status" class="mt-7 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Loading quotations…</div>
<div id="list" class="mt-5 grid gap-4"></div>
</section>
</main>
<script>
(() => {
 const API='https://terajuciptabina.vercel.app/api/quotations';
 const p=new URLSearchParams(location.search);const role=(p.get('role')||'homeowner').toLowerCase()==='contractor'?'contractor':'homeowner';const idKey=role==='contractor'?'contractorId':'homeownerId';const id=(p.get('id')||'').trim().toUpperCase();const type=(p.get('plannerType')||'build').toLowerCase()==='renovation'?'renovation':'build';
 const list=document.getElementById('list'),status=document.getElementById('status'),back=document.getElementById('backLink'),newLink=document.getElementById('newQuotationLink');
 const plannerFile=type==='renovation'?'renovationplanner.html':'buildplanner.html';
 back.href=role==='contractor'?`contractor.html`: `homeowner.html`;
 newLink.href=`${plannerFile}?audience=${role}&${idKey}=${encodeURIComponent(id)}`;
 newLink.textContent=type==='renovation'?'Create New Renovation':'Create New Build';
 document.getElementById('roleLabel').textContent=`${role.toUpperCase()} · ${type==='renovation'?'RENOVATION':'BUILD'} QUOTATIONS`;
 function money(v){return new Intl.NumberFormat('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)}
 function date(v){try{return new Intl.DateTimeFormat('en-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return '-'}}
 function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
 function render(items){
   if(!items.length){list.innerHTML='<div class="rounded-2xl border border-dashed border-slate-300 bg-white/70 p-10 text-center"><div class="text-4xl">📄</div><p class="mt-3 font-bold">No saved quotations yet.</p><p class="mt-1 text-sm text-slate-500">Create a new quotation to get started.</p></div>';return}
   list.innerHTML=items.map(q=>{const edit=`${plannerFile}?audience=${role}&${idKey}=${encodeURIComponent(id)}&quotationId=${encodeURIComponent(q.quotationId)}`;return `<article class="quote-card rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"><div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center"><div><div class="flex flex-wrap items-center gap-2"><span class="rounded-full bg-slate-100 px-2.5 py-1 text-[10px] font-bold tracking-wide text-slate-600">${esc(q.state||'final').toUpperCase()}</span><span class="text-xs text-slate-400">${esc(q.quotationType||'simple')} quotation</span></div><h2 class="mt-3 text-xl font-bold">${esc(q.quotationNumber||q.quotationId)}</h2><p class="mt-1 text-sm text-slate-600">${esc(q.client?.name||'Not specified')} · ${esc(q.project?.location||'Location not specified')}</p><p class="mt-2 text-xs text-slate-400">Updated ${date(q.updatedAt)}</p></div><div class="flex items-center justify-between gap-5 sm:justify-end"><div class="text-right"><p class="text-xs text-slate-400">Total</p><p class="text-2xl font-bold">RM ${money(q.total)}</p></div><a href="${edit}" class="rounded-xl bg-slate-950 px-4 py-3 text-sm font-semibold text-white">Open / Edit</a></div></div></article>`}).join('');
 }
 async function load(){
   if(!id){status.textContent='No user ID was supplied. Open this page from the Contractor/Homeowner workspace.';return}
   status.textContent='Loading quotations…';
   try{const r=await fetch(`${API}?role=${encodeURIComponent(role)}&id=${encodeURIComponent(id)}&plannerType=${encodeURIComponent(type)}`);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Unable to load quotations.');const items=Array.isArray(data.quotations)?data.quotations:[];items.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));render(items);status.textContent=`${items.length} saved quotation${items.length===1?'':'s'} · ${type==='build'?'Build':'Renovation'}`;}catch(e){status.textContent=e.message||'Unable to load quotations.';list.innerHTML=''}
 }
 document.getElementById('refreshButton').addEventListener('click',load);load();
})();
</script>
</body>
</html>
