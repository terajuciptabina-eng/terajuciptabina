<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contractor Market Database | TERAJU WORKS</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f3f4f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
#gate{position:fixed;inset:0;width:100vw;height:100vh;display:grid;place-items:center;background:#f3f4f6}
#gate-card{width:min(430px,calc(100vw - 32px));background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
</style>
</head>
<body>
<div id="gate">
  <div id="gate-card">
    <b>TERAJU WORKS</b>
    <h2>Admin Authentication</h2>
    <p>Contractor Market is controlled by the Admin Control Panel.</p>
    <button onclick="location.href='../admin.html'">Open Admin Control</button>
  </div>
</div>
<script>
const k=sessionStorage.getItem('teraju.admin.key')||'';
const API='https://terajuciptabina.vercel.app/api/admin';
const gate=document.getElementById('gate');
if(!k){
  location.href='../admin.html';
}else{
  fetch(API+'?records=0',{headers:{'X-Admin-Key':k},cache:'no-store'})
    .then(r=>{
      if(!r.ok)throw new Error('Unauthorized');
      location.replace('admin-contractor-market-app.html');
    })
    .catch(()=>{
      sessionStorage.removeItem('teraju.admin.key');
      location.href='../admin.html';
    });
}
</script>
</body>
</html>
